<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Account Scoring — DemandAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#7D52A2;--brand-dk:#5E3A80;--brand-lt:#F0EBF8;--brand-mid:#C9B3E8;
  --sec:#0094DA;--sec-lt:#E6F4FC;--sec-dk:#005E8E;
  --ter:#FF8820;--ter-lt:#FFF0E0;--ter-dk:#B85800;
  --pos:#2E7D5A;--pos-lt:#EAF5F0;
  --warn:#C4751A;--warn-lt:#FDF6E8;
  --neg:#B23F3F;--neg-lt:#FBECEC;
  --rail:#130D1C;--rb:rgba(255,255,255,.07);
  --r1:#fff;--r2:rgba(255,255,255,.76);--r3:rgba(255,255,255,.43);--r4:rgba(255,255,255,.21);
  --rhov:rgba(255,255,255,.05);--ract:rgba(125,82,162,.22);
  --bg:#F5F6F9;--surf:#fff;--border:#E5E9EE;--bdk:#D1D7DE;
  --i1:#141A21;--i2:#4A5664;--i3:#9DA8B5;--i4:#C9D1DA;
  --s50:#F4F6F8;--s75:#ECEFF3;--s100:#E1E6EC;--s200:#C9D1DA;--s300:#9DA8B5;
  --fd:"Sora",system-ui,sans-serif;
  --fb:"Plus Jakarta Sans",-apple-system,sans-serif;
  --fm:"JetBrains Mono",monospace;
  --rsm:8px;--rmd:12px;--rlg:16px;
  --ease:cubic-bezier(.4,0,.2,1);--fast:120ms;--base:200ms;
  --sh:0 2px 8px rgba(20,26,33,.07),0 1px 3px rgba(20,26,33,.05);
  --sh-lg:0 8px 40px rgba(20,26,33,.14),0 2px 8px rgba(20,26,33,.08);
  --nav-w:224px;--chat-w:400px;--hh:54px;--tabs-h:42px;
}
*,*::before,*::after{box-sizing:border-box;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{margin:0;font-family:var(--fb);font-size:14px;background:var(--bg);color:var(--i1);overflow:hidden;height:100vh;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font:inherit;}
:root{color-scheme:light;}
input,textarea,select{background-color:#fff;color:var(--i1);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--s200);border-radius:2px;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(1.3);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideLeft{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}
@keyframes msgIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{width:0}to{width:var(--bw)}}

/* ─── SHELL ─────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;height:100vh;width:100vw;}

/* ─── NAV ─────────────────────────────── */
.nav{background:var(--rail);display:flex;flex-direction:column;height:100vh;overflow:hidden;border-right:1px solid var(--rb);}
.nav-brand{display:flex;align-items:center;gap:9px;padding:13px 13px 11px;border-bottom:1px solid var(--rb);flex-shrink:0;}
.nav-nm{font-family:var(--fd);font-size:14px;font-weight:600;color:var(--r1);letter-spacing:-.01em;}
.nav-org{font-size:10px;color:var(--r3);margin-top:1px;}
.nav-body{flex:1;overflow-y:auto;padding:6px 0;}
.nav-body::-webkit-scrollbar{width:3px;}
.nav-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);}
.nav-sec{padding:8px 14px 3px;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--r4);font-weight:600;}
.nav-item{display:flex;text-decoration:none;align-items:center;gap:9px;height:32px;padding:0 10px;margin:1px 6px;border-radius:7px;color:var(--r3);font-size:12.5px;font-weight:500;cursor:pointer;position:relative;transition:background var(--fast) var(--ease),color var(--fast) var(--ease);}
.nav-item:hover{background:var(--rhov);color:var(--r2);}
.nav-item.active{background:var(--ract);color:var(--r1);}
.nav-item.active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2.5px;background:var(--brand-mid);border-radius:0 2px 2px 0;}
.nav-ic{width:15px;height:15px;flex-shrink:0;opacity:.7;}
.nav-item.active .nav-ic{opacity:1;color:var(--brand-mid);}
.nav-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-div{height:1px;background:var(--rb);margin:6px 10px;}
.nav-foot{padding:10px;border-top:1px solid var(--rb);flex-shrink:0;}
.nav-user{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--rsm);cursor:pointer;transition:background var(--fast) var(--ease);}
.nav-user:hover{background:var(--rhov);}
.nav-av{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.nav-un{font-size:12px;color:var(--r2);font-weight:500;}
.nav-ur{font-size:10px;color:var(--r4);margin-top:1px;}

/* ─── MAIN ─────────────────────────────── */
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0;}

/* Topbar */
.topbar{height:var(--hh);padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0;gap:10px;}
.topbar-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.tb-title{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--i1);}
.tb-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;}
.badge-live{background:var(--pos-lt);color:var(--pos);}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite;}
.badge-neutral{background:var(--s100);color:var(--i3);}
.topbar-r{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--fb);font-size:12.5px;font-weight:600;height:30px;padding:0 12px;border-radius:var(--rsm);border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:all var(--fast) var(--ease);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dk);}
.btn-sec{background:var(--surf);border-color:var(--bdk);color:var(--i1);}
.btn-sec:hover{background:var(--s75);}
.btn-copilot{background:var(--brand-lt);border-color:var(--brand-mid);color:var(--brand-dk);}
.btn-copilot:hover{background:var(--brand-mid);}
.btn-copilot.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.btn-ghost{color:var(--i2);}
.btn-ghost:hover{background:var(--s75);}
.btn-sm{height:27px;font-size:11.5px;padding:0 10px;border-radius:6px;}

/* Tabs */
.ftabs{height:var(--tabs-h);padding:0 20px;display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--border);background:var(--surf);flex-shrink:0;}
.ftab{display:flex;align-items:center;gap:6px;padding:0 16px;font-size:13px;font-weight:500;color:var(--i3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color var(--fast) var(--ease);}
.ftab:hover{color:var(--i2);}
.ftab.active{color:var(--i1);border-bottom-color:var(--brand);}
.ftab-cnt{font-family:var(--fm);font-size:10.5px;color:var(--i4);}
.ftab.active .ftab-cnt{color:var(--brand);}

/* Canvas */
.canvas{flex:1;overflow-y:auto;padding:16px 20px 40px;}
.canvas::-webkit-scrollbar{width:5px;}

/* ─── STATS STRIP ─────────────────────── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;margin-bottom:16px;}
.stat{padding:13px 16px;border-right:1px solid var(--border);}
.stat:last-child{border-right:none;}
.stat-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--i3);font-weight:600;margin-bottom:4px;}
.stat-val{font-family:var(--fd);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:3px;}
.stat-sub{font-size:11px;color:var(--i3);}
.sv1{color:var(--brand);}
.sv2{color:var(--sec);}
.sv3{color:var(--ter-dk);}
.sv4{color:var(--pos);}
.sv5{color:var(--i1);}

/* ─── MAIN LAYOUT: full-width list, detail as fixed right drawer ─── */
.score-layout{display:block;}
/* dim-overview handled inline */

/* Detail drawer — slides in from the right over the content */
.detail-drawer{
  position:fixed;top:0;right:0;bottom:0;
  width:360px;
  background:var(--surf);
  border-left:1px solid var(--border);
  box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;
  z-index:300;
  transform:translateX(100%);
  transition:transform var(--base) var(--ease);
  overflow-y:auto;
}
.detail-drawer.open{transform:translateX(0);}
.detail-drawer::-webkit-scrollbar{width:4px;}
.drawer-hdr{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:var(--surf);
  border-bottom:1px solid var(--border);
}
.drawer-title{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--i1);}
.drawer-sub{font-size:10.5px;color:var(--i3);margin-top:1px;}
.drawer-close{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--i3);cursor:pointer;flex-shrink:0;transition:all var(--fast);}
.drawer-close:hover{background:var(--s75);color:var(--i1);}
.drawer-body{padding:14px 16px 24px;flex:1;}

/* Score list */
.score-list{background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;}
.sl-toolbar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.sl-srch{display:flex;align-items:center;gap:6px;background:var(--s50);border:1px solid var(--border);border-radius:var(--rsm);padding:0 10px;height:29px;min-width:160px;flex:1;max-width:220px;transition:border-color var(--fast);}
.sl-srch:focus-within{border-color:var(--brand-mid);}
.sl-srch input{border:none;background:transparent;font-size:12.5px;color:var(--i1);outline:none;width:100%;}
.sl-srch input::placeholder{color:var(--i3);}
.sl-seg-filter{display:flex;gap:4px;margin-left:auto;}
.seg-pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;cursor:pointer;border:1px solid var(--border);color:var(--i3);background:var(--surf);white-space:nowrap;transition:all var(--fast);}
.seg-pill:hover{border-color:var(--brand-mid);color:var(--brand);}
.seg-pill.active{background:var(--brand);border-color:var(--brand);color:#fff;}

.sl-head{display:grid;grid-template-columns:minmax(160px,2.5fr) 72px 72px 72px 110px 180px;padding:0 14px;height:32px;background:var(--s50);border-bottom:1px solid var(--border);align-items:center;gap:6px;}
.sl-th{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);font-weight:600;white-space:nowrap;}

.sl-row{display:grid;grid-template-columns:minmax(160px,2.5fr) 72px 72px 72px 110px 180px;padding:6px 14px;min-height:60px;border-bottom:1px solid var(--border);align-items:center;gap:6px;cursor:pointer;transition:background var(--fast);}
.sl-row:last-child{border-bottom:none;}
.sl-row:hover{background:var(--s50);}
.sl-row.selected{background:var(--brand-lt);}

.co-cell{display:flex;align-items:center;gap:9px;min-width:0;}
.co-av{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.co-nm{font-size:12.5px;font-weight:600;color:var(--i1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.co-ind{font-size:10.5px;color:var(--i3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Score badges */
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:20px;padding:0 5px;border-radius:4px;font-family:var(--fm);font-size:11px;font-weight:700;}
.sc-h{background:var(--pos-lt);color:var(--pos);}
.sc-m{background:var(--warn-lt);color:var(--warn);}
.sc-l{background:var(--neg-lt);color:var(--neg);}

/* Composite bar */
.comp-bar{display:flex;align-items:center;gap:5px;}
.comp-track{flex:1;height:4px;background:var(--s100);border-radius:2px;overflow:hidden;}
.comp-fill{height:4px;border-radius:2px;animation:barGrow .5s var(--ease) forwards;}
.comp-val{font-family:var(--fm);font-size:11px;color:var(--i2);min-width:20px;text-align:right;flex-shrink:0;}

/* Delta */
.delta{font-family:var(--fm);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:3px;white-space:nowrap;}
.delta-up{background:var(--pos-lt);color:var(--pos);}
.delta-dn{background:var(--neg-lt);color:var(--neg);}
.delta-flat{background:var(--s100);color:var(--i3);}

/* ─── PANEL (used in tabs) ─────────── */
.panel{background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);}
.panel-ttl{font-size:11px;font-weight:600;color:var(--i2);letter-spacing:.04em;text-transform:uppercase;}
.panel-body{padding:12px 14px;}

/* Score breakdown in detail */
.dim-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--s75);}
.dim-row:last-child{border-bottom:none;}
.dim-lbl{font-size:11.5px;color:var(--i2);width:74px;flex-shrink:0;}
.dim-track{flex:1;height:5px;background:var(--s100);border-radius:3px;overflow:hidden;}
.dim-fill{height:5px;border-radius:3px;transition:width .5s var(--ease);}
.dim-val{font-family:var(--fm);font-size:12px;font-weight:700;min-width:26px;text-align:right;flex-shrink:0;}

/* Signal log */
.sig-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--s75);}
.sig-row:last-child{border-bottom:none;}
.sig-ic{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:1px;}
.sig-lbl{font-size:11.5px;color:var(--i1);font-weight:500;line-height:1.4;}
.sig-meta{font-size:10px;color:var(--i3);margin-top:2px;}
.sig-impact{margin-left:auto;font-family:var(--fm);font-size:11px;font-weight:700;flex-shrink:0;}
.sig-up{color:var(--pos);}
.sig-dn{color:var(--neg);}

/* Sparkline */
.spark{display:flex;align-items:flex-end;gap:2px;height:28px;}
.spark-bar{flex:1;border-radius:2px 2px 0 0;min-width:3px;}

/* Lookalikes */
.like-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--s75);cursor:pointer;}
.like-row:last-child{border-bottom:none;}
.like-row:hover .like-nm{color:var(--brand);}
.like-av{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:9.5px;font-weight:700;color:#fff;flex-shrink:0;}
.like-nm{font-size:12px;font-weight:600;color:var(--i1);transition:color var(--fast);}
.like-meta{font-size:10.5px;color:var(--i3);margin-top:1px;}
.like-match{margin-left:auto;font-family:var(--fm);font-size:11px;font-weight:700;color:var(--brand);flex-shrink:0;}

/* Empty detail state */
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;gap:8px;text-align:center;}

/* ─── DIMENSION OVERVIEW (below list on Scores tab) */
/* dim-overview now defined in score-layout block above */
/* dov-num used by the inline dimension strip */
.dov-num{font-family:var(--fd);font-weight:700;letter-spacing:-.03em;line-height:1;}
.dov-dist{display:flex;gap:2px;height:5px;border-radius:3px;overflow:hidden;}
.dov-seg{height:100%;}

/* ─── SEGMENT MAP TAB ─── */
.seg-map-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
.seg-map-ttl{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--i1);}
.seg-grid{display:grid;grid-template-columns:repeat(4,1fr);}
.seg-cell{padding:14px 16px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--fast);}
.seg-cell:hover{background:var(--s50);}
.seg-cell:nth-child(4n){border-right:none;}
.seg-cell:nth-last-child(-n+4){border-bottom:none;}
.seg-nm{font-size:12.5px;font-weight:600;color:var(--i1);margin-bottom:3px;}
.seg-desc{font-size:10.5px;color:var(--i3);margin-bottom:8px;line-height:1.5;}
.seg-count{font-family:var(--fd);font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:2px;}
.seg-sub{font-size:10.5px;color:var(--i3);}
.seg-bar-wrap{height:3px;background:var(--s100);border-radius:2px;margin-top:8px;overflow:hidden;}
.seg-bar-fill{height:3px;border-radius:2px;}

/* ─── HISTORY TAB ─── */
.hist-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--s75);}
.hist-row:last-child{border-bottom:none;}
.hist-dir{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ─── THRESHOLD TAB ─── */
.thresh-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.thresh-dim{display:flex;flex-direction:column;gap:10px;}
.thresh-dim-ttl{font-size:10.5px;font-weight:600;color:var(--i2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.thresh-row{display:flex;align-items:center;gap:10px;}
.thresh-lbl{font-size:11.5px;color:var(--i2);min-width:90px;}
.thresh-slider{flex:1;accent-color:var(--brand);cursor:pointer;height:4px;}
.thresh-val{font-family:var(--fm);font-size:12px;font-weight:600;color:var(--i1);min-width:26px;text-align:right;}
.thresh-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--border);background:var(--s50);}
.thresh-hint{font-size:12px;color:var(--i3);}
.thresh-hint strong{color:var(--warn);font-weight:600;}

/* ─── CHAT PANEL ─────────────────────── */
.chat-panel{position:fixed;top:0;right:0;bottom:0;width:var(--chat-w);background:var(--surf);border-left:1px solid var(--border);box-shadow:var(--sh-lg);display:flex;flex-direction:column;z-index:400;transform:translateX(100%);transition:transform var(--base) var(--ease);}
.chat-panel.open{transform:translateX(0);}
.chat-panel.expanded{position:fixed;inset:0;width:100vw;height:100vh;border-left:none;z-index:450;}
.chat-panel.expanded .hist-section{display:none;}
.chat-panel.expanded .chat-msgs,.chat-panel.expanded .sugg-wrap,.chat-panel.expanded .composer-wrap{padding-left:24px;padding-right:24px;}

.chat-top{height:var(--hh);padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;}
.chat-top-l{display:flex;align-items:center;gap:9px;min-width:0;flex:1;}
.chat-ttl{font-size:13px;font-weight:600;color:var(--i1);}
.chat-scope{font-size:10.5px;color:var(--i3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-top-acts{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.ct-ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--i3);cursor:pointer;transition:all var(--fast);}
.ct-ic:hover{background:var(--s75);color:var(--i1);}
.ct-ic.active{background:var(--brand-lt);color:var(--brand);}

@keyframes ckspin{to{transform:rotate(360deg);}}
@keyframes ckpop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.ck{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}

.ck-ok{background:var(--pos);color:#fff;animation:ckpop .2s var(--ease);}
.ck-warn{background:var(--warn);color:#fff;animation:ckpop .2s var(--ease);}
.ck-stop{background:var(--neg);color:#fff;animation:ckpop .2s var(--ease);}

<script>
function showToast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function initials(n){return String(n).split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function avColor(id){const c=['#7D52A2','#0094DA','#FF8820','#2E7D5A','#B23F3F'];let h=0;for(const ch of String(id))h+=ch.charCodeAt(0);return c[h%c.length];}
function closeDrawer(){ document.getElementById('detailDrawer').classList.remove('open'); }
function esc(s){return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fallbackDownload(name, text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);}
// On claude.ai the page can't start a download itself: the viewer confirms a save. Opened as a plain file, it downloads directly.
async function download(name, text){
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ dl = null; }
  if(!dl){ fallbackDownload(name, text); return; }
  try{ await dl.save({filename:name, data:text}); showToast(name+' saved'); }
  catch(e){ if(e && e.code==='declined') return; showToast(e && e.code==='rate_limited' ? 'A save is already open' : "This view can't save files"); }
}
function todayIso(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const fmt1 = n => n===undefined||n===null ? '—' : (Math.round(n*10)/10).toLocaleString('en-US',{minimumFractionDigits:n%1?1:0,maximumFractionDigits:1});
const fmtDate = t => new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});

function readFileToGrids(file){
  return new Promise((resolve,reject)=>{
    const isCsv = /\.csv$/i.test(file.name), isXlsx = /\.(xlsx|xls)$/i.test(file.name);
    if(!isCsv && !isXlsx){ reject(new Error('Use a .csv or .xlsx file')); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read the file'));
    reader.onload = ev=>{
      try{
        if(isCsv){ resolve([{sheet:'(CSV)', grid:DemandAI.parseCSV(ev.target.result)}]); return; }
        if(typeof XLSX==='undefined'){ reject(new Error('The Excel reader did not load. Save the sheet as CSV and upload that instead')); return; }
        const wb = XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
        resolve(wb.SheetNames.map(n=>({sheet:n, grid:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})})));
      }catch(e){ reject(e); }
    };
    if(isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
  });
}
function pickSheet(grids){
  const has = g => g.grid.slice(0,10).some(r=>(r||[]).some(c=>String(c).trim().toLowerCase().replace(/\*/g,'').replace(/\s+/g,'_')==='signal_type'));
  return grids.find(g=>/signal template/i.test(g.sheet) && has(g)) || grids.find(has) || grids[0];
}

/* ═══════════════ SIGNAL MONITORING: what has come in, per signal type ═══════════════
   In the POC signals arrive as files, so this counts the rows in every signal file uploaded here and in Micro-segments. */
function signalFeed(){
  const files = [], seen = new Set();
  const add = (grid, file, at, where) => { if(!grid || !grid.length) return; const key = file + '|' + at; if(seen.has(key)) return; seen.add(key);
    const hi = grid.findIndex(r=>(r||[]).some(c=>String(c).trim().toLowerCase().replace(/\*/g,'')==='signal_type')); if(hi<0) return;
    const h = grid[hi].map(c=>String(c).trim().toLowerCase().replace(/\*/g,'')), ti = h.indexOf('signal_type'), di = h.indexOf('event_date');
    files.push({ file, at, where, rows: grid.slice(hi+1).filter(r=>r && String(r[ti]||'').trim()).map(r=>({ type:String(r[ti]).trim(), date:String(r[di]||'').trim(), bytes: r.map(c=>String(c??'')).join(',').length + 1 })) }); };
  DemandAI.loadScorings().forEach(r=>add(r.grid, r.fileName, r.createdAt, 'Account Scoring'));
  DemandAI.loadSegmentations().forEach(r=>{ if(r.src && r.src.csv) add(r.src.grid, r.src.fileName, r.createdAt, 'Micro-segments'); });
  return files;
}
function monitorView(){
  const files = signalFeed(), types = DemandAI.CONFIG.signalTypes, off = new Set(DemandAI.signalsOff()), by = {};

async function onLeadFile(file){
  if(!file) return;
  try{
    const grids = await readFileToGrids(file);
    const has = g => g.grid.slice(0,10).some(r=>(r||[]).some(c=>String(c).trim().toLowerCase().replace(/\*/g,'')==='company_name'));
    const g = grids.find(x=>/lead template/i.test(x.sheet)&&has(x)) || grids.find(has) || grids[0];
    const r = DemandAI.processLeads(g.grid, {file:file.name, sheet:g.sheet});
    if(!r.stats.accountsPass){ showToast(`${file.name}: no accounts pass the checks. Open it in Prospecting to see why`); return; }
    const list = { id:'list-'+Date.now().toString(36), name:file.name.replace(/\.[^.]+$/,'')+' · '+todayIso(), createdAt:Date.now(), sourceFile:file.name, sheet:g.sheet,
      sandbox:false, stats:r.stats, accounts:r.accounts, contacts:r.contacts };
    if(!DemandAI.saveList(list)){ showToast("This browser blocks storage, so the list can't be saved"); return; }
    selListId = list.id; srcMode = 'saved';
    renderStart('new');
    showToast(`${r.stats.rowsRead} rows checked · ${r.stats.accountsPass} accounts and ${r.stats.inFinalList} contacts in the list · ${r.stats.issues} issue${r.stats.issues===1?'':'s'}. Saved as a list`);
  }catch(e){ showToast(e.message || 'Could not read that file'); }
}

/* ═══════════════ SCORE: run the rules, show the checks running ═══════════════ */
function score(listId, fileName, sheet, grid, asOf, sandbox, saved){
  const L = DemandAI.getList(listId);
  if(!L){ showToast("That prospect list isn't saved any more"); renderStart('new'); return false; }
  if(sandbox !== !!L.sandbox){ showToast('Sample signals only go with a list built from sample data'); return false; }
  const list = JSON.parse(JSON.stringify({accounts:L.accounts, contacts:L.contacts}));
  const off = saved ? (saved.signalsOff || []) : DemandAI.signalsOff();     // signals switched off in Setup stop here
  const custom = saved ? (saved.signalsCustom || []) : DemandAI.customSignals().map(c=>c.name);     // and ones added there count
  const sig = DemandAI.processSignals(grid, list, {file:fileName, sheet, asOf, off, custom});
  const scored = DemandAI.scoreList(list, sig);
  RUN = {listId, list:L, fileName, sheet, grid, asOf, sandbox, off, custom, sig, scored, prospects:null, savedId: saved?saved.id:null, name: saved?saved.name:null};
  view='ranked'; filt='all'; q=''; NSEL.clear();
  return true;
}
const SIG_STEPS = [
  ['columns', 'Columns match the template',   'company_name, contact, signal_type, event_date, detail'],
  ['company', 'Company is on the list',        'Every row names an account from the prospect list'],
  ['person',  'Person is in the lead file',    'Matched by email or LinkedIn URL; blank goes to the primary persona'],
  ['date',    'Event date present and valid',  'YYYY-MM-DD, not after the scoring date'],
  ['type',    'Signal type is a known tag',    'From the template list; newsletter sign-ups are not scored'],
  ['dupes',   'Duplicates',                    'The same event recorded twice'],
  ['window',  'Within its time window',        'Older than the tag counts for: stale'],
  ['knockout','Installed base',                'Pilot product already installed excludes the account'],
  ['fit',     'Fit',                           `Rubric score; below ${DemandAI.CONFIG.fitFloor} the account is dropped`],
  ['score',   'Timing and score',              'Each prospect\'s signals weighted and stacked; score 0–100 and tier'],
];
function stepResult(k){
  const sig = RUN.sig, sc = RUN.scored, is = sig.issues;
  const rowsLabel = rows => { rows=[...new Set(rows)]; return rows.length ? (rows.length===1&&rows[0]==='—'?'Whole file':'Row'+(rows.length>1?'s ':' ')+rows.slice(0,5).join(', ')+(rows.length>5?'…':'')) : ''; };
  const rej = test => sig.signals.filter(s=>s.status==='Rejected' && test(s));
  const out = (list, sev, label) => list.length ? {sev, label: label||`${list.length} found`, rows: rowsLabel(list.map(x=>x.row))} : {sev:'', label:'Passed'};
  switch(k){
    case 'columns': return out(is.filter(i=>/Required column|isn't in the template|header row|format hints/.test(i.issue)), 'warn');
    case 'company': return out(rej(s=>s.code==='D4' && !/^Person/.test(s.reason) || (s.code==='D3' && /company/i.test(s.reason))), 'warn', null);
    case 'person': {
      const r = rej(s=>s.code==='D4' && /^Person/.test(s.reason)), auto = sig.signals.filter(s=>s.assigned && s.assigned!=='Named in the file');
      if(r.length) return {sev:'warn', label:`${r.length} not found`, rows: rowsLabel(r.map(x=>x.row))+(auto.length?` · ${auto.length} auto-assigned`:'')};
      return auto.length ? {sev:'info', label:`${auto.length} auto-assigned`, rows: rowsLabel(auto.map(x=>x.row))} : {sev:'', label:'Passed'};
    }
    case 'date': return out(rej(s=>s.code==='D3' && /date/i.test(s.reason)), 'warn');
    case 'type': return out(rej(s=>s.code==='D1' || (s.code==='D3' && /signal type/i.test(s.reason))), 'warn');
    case 'dupes': return out(rej(s=>s.code==='D5'), 'warn');
    case 'window': return out(rej(s=>s.code==='D2'), 'info', null);
    case 'knockout': { const k2 = sig.signals.filter(s=>s.status==='Used for a knock-out'); return k2.length ? {sev:'info', label:`${k2.length} excluded`, rows: rowsLabel(k2.map(x=>x.row))} : {sev:'', label:'None installed'}; }
    case 'fit': { const n = sc.filter(r=>r.belowFloor).length; return n ? {sev:'info', label:`${n} below the floor`} : {sev:'', label:'All above the floor'}; }
    case 'score': { RUN.prospects = null; const ps = prospects(), n = ps.filter(x=>x.score!==undefined).length, a = ps.filter(x=>x.tier==='A').length; return {sev:'', label:`${n} prospects scored · ${a} in tier A`}; }
  }
}
function runChecks(){

  ov.innerHTML = `<div style="background:var(--surf);border-radius:var(--rlg);box-shadow:var(--sh-lg);width:540px;max-width:100%;max-height:90vh;display:flex;flex-direction:column">
    <div style="padding:20px 22px 12px">

      <div style="font-size:12px;color:var(--i3);margin-top:3px">${sig.rowsRead} signal rows from ${esc(RUN.fileName)} · as of ${RUN.asOf} · fixed rules</div>
      <div style="height:4px;background:var(--s75);border-radius:2px;margin-top:12px;overflow:hidden"><div id="ckBar" style="height:100%;width:0;background:var(--brand);transition:width .3s var(--ease)"></div></div>
    </div>
    <div style="padding:0 22px;overflow-y:auto">
      ${SIG_STEPS.map(([k,name,what],i)=>`<div class="ck-row pending" id="ck-${i}">
        <div class="ck ck-wait" id="ckc-${i}"></div>
        <div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:600;color:var(--i1)">${name}</div><div style="font-size:11px;color:var(--i3)">${what}</div></div>
        <div id="ckr-${i}" style="text-align:right;flex-shrink:0"></div>
      </div>`).join('')}
    </div>

  </div>`;
  let i = 0;

    if(i>0){
      const res = stepResult(SIG_STEPS[i-1][0]), c = document.getElementById('ckc-'+(i-1));
      c.className = 'ck ' + (res.sev==='stop'?'ck-stop':res.sev==='warn'?'ck-warn':res.sev==='info'?'ck-info':'ck-ok');
      c.textContent = res.sev ? '!' : '✓';
      const tone = res.sev==='stop'?'tag-red':res.sev==='warn'?'tag-amber':res.sev==='info'?'tag-grey':'tag-green';
      document.getElementById('ckr-'+(i-1)).innerHTML = `<span class="tag ${tone}">${res.label}</span>${res.rows?`<div style="font-size:10.5px;color:var(--i3);margin-top:3px">${res.rows}</div>`:''}`;
    }
    document.getElementById('ckBar').style.width = (i/SIG_STEPS.length*100)+'%';
    if(i<SIG_STEPS.length){
      const row = document.getElementById('ck-'+i); row.classList.remove('pending');
      document.getElementById('ckc-'+i).className = 'ck ck-run';
      row.scrollIntoView({block:'nearest'});
      i++; setTimeout(tick, 380);
    } else {
      const qn = sig.signals.filter(s=>s.status==='Qualified').length, rj = sig.signals.filter(s=>s.status==='Rejected').length;
      document.getElementById('ckFoot').innerHTML = `
        <span style="flex:1;font-size:12px;color:var(--i2)"><b>${qn}</b> signals qualified · <b>${rj}</b> rejected · <b>${prospects().filter(x=>x.tier==='A').length}</b> prospects in tier A</span>
        <button class="btn btn-ghost btn-sm" onclick="hide('checksOverlay');RUN=null;renderStart('new')">Use a different file</button>
        <button class="btn btn-primary btn-sm" onclick="hide('checksOverlay');renderResults()">View the scores →</button>`;
    }
  };
  tick();
}

const plS = (n, w) => `${n} ${w}${n===1?'':'s'}`;
const rowOf = x => `<li><b>${esc(x.c.name)}</b> · ${esc(x.r.account.name)} · tier ${esc(x.tier)}${x.score!==undefined?`, score ${fmt1(x.score)}`:''}</li>`;
function listAnswer(q){
  const t = String(q).toLowerCase(), ps = prospects(), T = DemandAI.CONFIG.tierThresholds;
  const named = ps.find(x=>t.includes(x.c.name.toLowerCase().split(' ')[0]) || t.includes(x.r.account.name.toLowerCase().split(' ')[0]));
  if(named && !/tier a accounts|closest/.test(t)) return prospectAnswer('what feeds this score', named);
  if(/closest|almost|nearly|next tier|move up|could reach/.test(t)){ const b = ps.filter(x=>(x.tier==='B'||x.tier==='C') && x.score!==undefined).sort((p,q)=>q.score-p.score).slice(0,5);
    return b.length ? `<p>Closest to the next tier:</p><ul>${b.map(x=>`<li><b>${esc(x.c.name)}</b> · ${esc(x.r.account.name)}: ${fmt1((x.tier==='B'?T.A:T.B)-x.score)} points short of tier ${x.tier==='B'?'A':'B'}</li>`).join('')}</ul>` : '<p>No tier B or C prospects in this list.</p>'; }
  if(/tier a|top|first|why .*(on top|ranked)/.test(t)){ const a = ps.filter(x=>x.tier==='A');
    return a.length ? `<p>${plS(a.length,'prospect')} in tier A (score ${T.A}+): a good company fit and strong, recent signals.</p><ul>${a.map(x=>`<li><b>${esc(x.c.name)}</b> · ${esc(x.r.account.name)} · ${fmt1(x.score)}: ${esc((x.p&&x.p.whyNow)||'')}</li>`).join('')}</ul>` : '<p>No prospect reached tier A in this list.</p>'; }
  if(/not used|weren.t used|unused|reject|didn.t count|ignored/.test(t)){ const u = unusedRows(), g = {}; u.forEach(s=>{ const k = s.status==='Rejected' ? `${s.code} ${DemandAI.CODES[s.code]}` : s.status; (g[k] = g[k] || []).push(s); });
    return u.length ? `<p>${plS(u.length,'row')} of the signal file didn't count:</p><ul>${Object.entries(g).map(([k,v])=>`<li><b>${esc(k)}</b> (${v.length}): ${esc(v[0].reason)}</li>`).join('')}</ul><p class="cpp-muted">The link under the table lists every row.</p>` : '<p>Every row of the signal file counted.</p>'; }
  if(/how .*tier|tiers work|score work|how .*scored|formula/.test(t)) return `<p>Score = <b>Fit × Timing ÷ 100</b>, both on 0–100. Fit is how well the company matches the ideal customer; timing is how strong and how recent the person's signals are.</p><ul><li><b>A</b>: ${T.A} and above, acted on first</li><li><b>B</b>: ${T.B}–${T.A-1}</li><li><b>C</b>: below ${T.B}</li><li><b>Watch list</b>: a good fit with no live signal</li></ul>`;
  if(/watch/.test(t)){ const w = ps.filter(x=>x.tier==='Watch list'); return w.length ? `<p>On the watch list (good fit, no live signal):</p><ul>${w.map(rowOf).join('')}</ul>` : '<p>Nobody is on the watch list.</p>'; }
  if(/exclud|below|floor|not scored/.test(t)){ const o = ps.filter(x=>x.tier==='Below fit floor'||x.tier==='Excluded'); return o.length ? `<ul>${o.map(x=>`<li><b>${esc(x.r.account.name)}</b>: ${esc(x.r.excluded ? x.r.excludedReason : `fit ${fmt1(x.fit)} is below the floor of ${DemandAI.CONFIG.fitFloor}`)}</li>`).join('')}</ul>` : '<p>Every account was scored.</p>'; }
  if(/how many|summary|overview|count/.test(t)){ const c = k => ps.filter(x=>x.tier===k).length; return `<p>${ps.length} prospects: <b>${c('A')}</b> in tier A, ${c('B')} in B, ${c('C')} in C, ${c('Watch list')} on the watch list, ${c('Below fit floor')+c('Excluded')} not scored.</p>`; }
  return null;
}
function prospectAnswer(q, x){
  const t = String(q).toLowerCase(), T = DemandAI.CONFIG.tierThresholds, a = x.r.account;
  if(/move|tier a|up a tier|higher|improve/.test(t)){ if(x.score===undefined) return `<p>${esc(a.name)} isn't scored: ${esc(x.r.excluded ? x.r.excludedReason : 'its fit is below the floor')}.</p>`;
    if(x.tier==='A') return '<p>It is already in tier A.</p>';
    const next = x.tier==='B' ? ['A', T.A] : ['B', T.B]; return `<p>It needs <b>${fmt1(next[1]-x.score)}</b> more points for tier ${next[0]}. A strong, recent signal from ${esc(x.c.firstName||x.c.name)}, such as a question or a request for a quote, would do it; so would news of a project or a system nearing end of support.</p>`; }
  if(/didn.t count|not count|unused|rejected|ignored/.test(t)){ const u = RUN.sig.signals.filter(s=>s.accountId===a.id && s.contactRow===x.c.row && s.status!=='Qualified');
    return u.length ? `<ul>${u.map(s=>`<li><b>${esc(s.type)}</b> (row ${s.row}): ${esc(s.reason)}</li>`).join('')}</ul>` : '<p>Every signal about this person counted.</p>'; }
  if(/who else|other|colleague|contacts/.test(t)){ const o = (x.r.people||[]).filter(p=>p.contact.row!==x.c.row);
    return o.length ? `<ul>${o.map(p=>`<li><b>${esc(p.contact.name)}</b>, ${esc(p.contact.jobTitle||'')} · ${p.signals.length ? `tier ${esc(p.tier)}` : 'no signals'}</li>`).join('')}</ul>` : `<p>No one else at ${esc(a.name)} is in the list.</p>`; }
  if(/fit/.test(t) && x.r.breakdown) return `<p>Fit <b>${fmt1(x.fit)}</b> out of 100:</p><ul>${x.r.breakdown.map(b=>`<li>${esc(b.label)}: ${esc(b.levelLabel)} · ${fmt1(b.points)} of ${b.weight}</li>`).join('')}</ul>`;
  if(/signal|timing|why now/.test(t) && x.p) return `<ul>${x.p.signals.map(s=>`<li><b>${esc(s.type)}</b>, ${sigStrength(s)[0].toLowerCase()} and ${sigFresh(s)}: ${esc(s.detail||'')}</li>`).join('')}</ul>`;
  if(/feed|why|score|explain/.test(t)) return x.score===undefined ? `<p>Not scored: ${esc(x.r.excluded ? x.r.excludedReason : 'the company fit is below the floor')}.</p>`
    : `<p>Score <b>${fmt1(x.score)}</b> = fit ${fmt1(x.fit)} × timing ${fmt1(x.timing)} ÷ 100, so tier ${esc(x.tier)}.</p><p>${esc((x.p&&x.p.whyNow||'').replace(/^./,m=>m.toUpperCase()))}</p>`;
  return null;
}

const TIER_ORDER = {A:0,B:1,C:2,'Watch list':3,'Below fit floor':4,Excluded:5};
function prospects(){
  if(RUN.prospects) return RUN.prospects;
  const out = [];
  for(const r of RUN.scored){
    if(r.people) r.people.forEach(p=>{ const live = p.signals.length>0; out.push({key:r.account.id+'|'+p.contact.row, c:p.contact, r, p, tier:p.tier, score:live?p.final:undefined, fit:r.fit, timing:live?p.timing:undefined}); });
    else r.contacts.filter(c=>!c.optOut).forEach(c=>out.push({key:r.account.id+'|'+c.row, c, r, p:null, tier:r.tier, fit:r.fit}));
  }
  out.sort((x,y)=>TIER_ORDER[x.tier]-TIER_ORDER[y.tier] || (y.score||0)-(x.score||0) || (y.fit||0)-(x.fit||0));
  return RUN.prospects = out;
}

/* Hand-off to Micro-segments & NBA: the scoring context and the chosen prospects. NBA re-scores with the same
   rules, groups the accounts into micro-segments and drafts the actions for approval. */
function sendToNBA(){
  let pick = NSEL.size ? prospects().filter(x=>NSEL.has(x.key)) : prospects().filter(x=>x.tier==='A'||x.tier==='B');
  pick = pick.filter(x=>x.p && x.p.signals.length);
  if(!pick.length){ showToast('Select prospects with a live signal first'); return; }
  const h = { name: RUN.name || RUN.list.name, listId:RUN.listId, listName:RUN.list.name, fileName:RUN.fileName, sheet:RUN.sheet, grid:RUN.grid,
    asOf:RUN.asOf, sandbox:RUN.sandbox, keys: pick.map(x=>x.key), sentAt: Date.now() };
  try{ localStorage.setItem('demandai_nba_handoff_v1', JSON.stringify(h)); }
  catch(e){ showToast("This browser blocks storage, so the hand-off can't be made"); return; }
  showToast(`${pick.length} prospect${pick.length===1?'':'s'} sent to Micro-segments & NBA`);
  setTimeout(()=>{ location.href = '12-nba.html?from=scoring'; }, 500);
}

function saveRun(){
  const name = document.getElementById('runName').value.trim() || RUN.list.name;
  const sc = RUN.scored;
  const prev = RUN.savedId && DemandAI.getScoring(RUN.savedId);
  const run = prev ? Object.assign(prev, {name}) : { id:'run-'+Date.now().toString(36), name, listId:RUN.listId, listName:RUN.list.name,
    fileName:RUN.fileName, sheet:RUN.sheet, grid:RUN.grid, asOf:RUN.asOf, sandbox:RUN.sandbox, signalsOff:RUN.off||[], signalsCustom:RUN.custom||[], createdAt:Date.now(),
    stats:{ scored: prospects().filter(x=>x.score!==undefined).length, A: prospects().filter(x=>x.tier==='A').length, B: prospects().filter(x=>x.tier==='B').length, C: prospects().filter(x=>x.tier==='C').length, watch: prospects().filter(x=>x.tier==='Watch list').length } };
  if(!DemandAI.saveScoring(run)){ showToast("This browser blocks storage, so it can't be saved"); return; }
  RUN.savedId = run.id; RUN.name = name;

function openRun(id){
  const r = DemandAI.getScoring(id);
  if(!r) return;
  const ok = _score(r.listId, r.fileName, r.sheet, r.grid, r.asOf, r.sandbox, r);
  if(ok) renderResults();
}
/* What a scored list led to: the micro-segments built from it, their recommendations, releases and meetings. */
function ledToRun(r){
  const segs = DemandAI.loadSegmentations().filter(s=>s.src && (s.src.scoringId===r.id || (s.src.name===r.name && s.src.listId===r.listId)));
  const dec = segs.flatMap(s=>Object.values(s.decisions||{}));
  return { segs: segs.length, segId: segs[0] && segs[0].id, recs: segs.reduce((t,s)=>t+((s.stats&&s.stats.prospects)||0),0),
    released: dec.filter(d=>d && d.status==='Released').length, meetings: dec.filter(d=>d && d.outcome==='Meeting booked').length };
}
function scoredStrip(runs){
  if(!runs.length) return '';
  const t = runs.map(ledToRun).reduce((a,b)=>({recs:a.recs+b.recs, released:a.released+b.released, meetings:a.meetings+b.meetings, segs:a.segs+b.segs}), {recs:0,released:0,meetings:0,segs:0});
  const scored = runs.reduce((n,r)=>n+((r.stats&&r.stats.scored)||0),0), A = runs.reduce((n,r)=>n+((r.stats&&r.stats.A)||0),0);
  const step = (lbl, v, sub, href, tone) => `<a class="stat stat-link" href="${href}"><div class="stat-lbl">${lbl}</div><div class="stat-val" style="color:${tone||'var(--i1)'}">${v}</div><div class="stat-sub">${sub}</div></a>`;
  return `<div style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);margin-bottom:6px">What your scored lists led to</div>
    <div class="stats" style="grid-template-columns:repeat(5,1fr);margin-bottom:18px">
      ${step('Prospects scored', scored, `${runs.length} scored list${runs.length===1?'':'s'}`, '#" onclick="renderStart(\'saved\');return false')}
      ${step('Tier A', A, 'act on these now', '#" onclick="runs0A();return false', 'var(--pos)')}
      ${step('Recommendations', t.recs, `${t.segs} micro-segment run${t.segs===1?'':'s'} in NBA`, '12-nba.html')}
      ${step('Released', t.released, 'ready to use', '12-nba.html')}
      ${step('Meetings booked', t.meetings, 'marked by the reps', '13-analytics.html?tab=loop')}
    </div>`;
}
function runs0A(){ const r = DemandAI.loadScorings()[0]; if(!r) return; openRun(r.id); setTimeout(()=>{ filt = 'A'; renderResults(); }, 0); }
function removeRun(id){ DemandAI.deleteScoring(id); showToast('Scored list deleted'); renderStart('saved'); }
function startRename(id){ renamingId = id; renderStart('saved'); const el=document.getElementById('renameInput'); if(el){ el.focus(); el.select(); } }
function finishRename(id){
  const el = document.getElementById('renameInput'); const name = el ? el.value.trim() : '';
  const r = DemandAI.getScoring(id);
  if(r && name && name!==r.name){ r.name = name; DemandAI.saveScoring(r); showToast('Renamed'); }
  renamingId = null; renderStart('saved');
}

/* ═══════════════ ACCOUNT DRAWER ═══════════════ */
function ago(d){ return d===0?'today':d<14?d+'d ago':d<60?Math.round(d/7)+'w ago':Math.round(d/30)+'mo ago'; }
function miniStat(label, val, sub){ return `<div style="flex:1;padding:10px 12px;border-right:1px solid var(--border)"><div style="font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--i3)">${label}</div><div style="font-family:var(--fd);font-size:20px;font-weight:700;color:var(--i1);margin-top:2px">${val}</div>${sub?`<div style="font-size:10px;color:var(--i3)">${sub}</div>`:''}</div>`; }
function openProspect(key){
  CP_KEY = key;
  const x = prospects().find(p=>p.key===key); if(!x) return;
  const c = x.c, r = x.r, a = r.account;
  const unused = RUN.sig.signals.filter(s=>s.accountId===a.id && s.contactRow===c.row && s.status!=='Qualified');
  document.getElementById('detTitle').textContent = c.name;
  document.getElementById('detSub').textContent = [c.jobTitle, a.name].filter(Boolean).join(' · ');
  const T = DemandAI.CONFIG.tierThresholds;
  let html = '';
  if(r.excluded) html += `<div class="panel" style="margin-bottom:12px"><div class="panel-hdr"><span class="panel-ttl">Not scored</span>${tierPill(x.tier)}</div><div class="panel-body" style="font-size:12px;color:var(--neg);background:var(--neg-lt)">${esc(r.excludedReason)}.</div></div>`;
  else if(r.belowFloor) html += `<div class="panel" style="margin-bottom:12px"><div class="panel-hdr"><span class="panel-ttl">Not scored</span>${tierPill(x.tier)}</div><div class="panel-body" style="font-size:12px;color:var(--warn);background:var(--warn-lt)">${esc(a.name)}'s fit of ${fmt1(r.fit)} is below the floor of ${DemandAI.CONFIG.fitFloor}.</div></div>`;
  else {
    // 1 · What feeds the score: fit times timing, and how far it is from the next tier
    const next = x.score===undefined ? null : x.score < T.B ? ['B', T.B] : x.score < T.A ? ['A', T.A] : null;
    html += `<div class="panel" style="margin-bottom:12px"><div class="panel-hdr"><span class="panel-ttl">What feeds the score</span>${tierPill(x.tier)}</div><div class="panel-body">
      <div class="fs"><div class="fs-p"><span>Fit</span><b>${fmt1(x.fit)}</b><i><em style="width:${x.fit}%;background:var(--sec)"></em></i><small>the company</small></div><span class="fs-op">×</span>
        <div class="fs-p"><span>Timing</span><b>${x.timing!==undefined?fmt1(x.timing):'—'}</b><i><em style="width:${x.timing||0}%;background:var(--brand)"></em></i><small>${x.p?x.p.signals.length:0} signal${x.p&&x.p.signals.length===1?'':'s'}</small></div><span class="fs-op">÷ 100 =</span>
        <div class="fs-p fs-r"><span>Score</span><b>${x.score!==undefined?fmt1(x.score):'—'}</b><small>tier ${esc(x.tier)}</small></div></div>
      ${next ? `<div class="fs-next">${fmt1(next[1]-x.score)} points short of tier ${next[0]} (${next[1]}).</div>` : x.score!==undefined ? '<div class="fs-next" style="color:var(--pos)">In the top tier: acted on first.</div>' : ''}
    </div></div>`;
  }
  if(x.p && x.p.signals.length){
    // 2 · Timing: each signal in words (how strong, how fresh), its share of the timing; the numbers on request
    const max = Math.max(...x.p.signals.map(s=>s.weight||0), 1), sorted = x.p.signals.slice().sort((p,q)=>q.weight-p.weight);
    html += `<div class="panel" style="margin-bottom:12px"><div class="panel-hdr"><span class="panel-ttl">Timing · the signals behind it</span><span style="font-size:10.5px;color:var(--i3)">${x.p.signals.length}</span></div><div class="panel-body" style="display:flex;flex-direction:column;gap:8px">
      ${x.p.whyNow ? `<div style="font-size:12.5px;color:var(--i1);line-height:1.55;margin-bottom:2px">${esc(x.p.whyNow.replace(/^./,m=>m.toUpperCase()))}</div>` : ''}
      ${sorted.map((s,k)=>{ const [st, n] = sigStrength(s); return `<div class="sg-c">
        <div class="sg-h">${tagChip(s.type)}<span class="sg-st">${strengthBars(n)}${st} · ${sigFresh(s)}</span></div>
        <div style="font-size:12px;color:var(--i1);line-height:1.45">${esc(s.detail||s.type)}</div>
        <div class="sg-m">${esc(s.source||'No source')} · ${s.date} · ${ago(s.age)}${s.assigned&&s.assigned!=='Named in the file'?' · <span style="color:var(--warn)">auto-assigned</span>':''}</div>
        <div class="sg-share" title="Share of the timing"><i style="width:${(s.weight/max*100).toFixed(0)}%"></i></div>
        <div class="sg-m">${k===0 ? 'Counts in full' : k===1 ? 'Counts half: the second-strongest signal' : `Counts ${['a quarter','an eighth'][k-2]||'a little'}: signal ${k+1}`}</div></div>`; }).join('')}
      <details class="hw"><summary>How the numbers are worked out</summary><div>
        Each signal's weight = how much its type counts × how strongly it shows interest × how fresh it is. The strongest counts in full, the next half, the next a quarter, and so on; the total is scaled to 0–100 as the timing.
        ${sorted.map(s=>`<div class="hw-r"><span>${esc(s.type)}</span><code>${s.tier} × ${s.strength} × ${s.decay.toFixed(2)} = ${fmt1(s.weight)}</code></div>`).join('')}</div></details>
    </div></div>`;
  }
  // Greyed: what the marketer can do on their own, after the pilot
  if(!r.excluded && !r.belowFloor) html += `<div class="panel later-p" style="margin-bottom:12px"><div class="panel-hdr"><span class="panel-ttl">Your own knowledge ${soonTag}</span></div><div class="panel-body">
      <div class="lt-row"><b>Add a signal you know</b><span>Something heard offline, as a comment, and move the account up a tier.</span><button class="btn btn-sec btn-sm" disabled>Add a signal</button></div>
      <div class="lt-row"><b>Follow up</b><span>Bookmark a promising account that isn't ready for outreach yet.</span><button class="btn btn-sec btn-sm" disabled>Bookmark</button></div>
      ${x.tier==='B'||x.tier==='C'||x.tier==='Watch list' ? `<details class="lt-more"><summary>What would move ${esc(a.name)} to tier A</summary><div>
        ${x.tier==='Watch list' ? `<p>It has no recent signal yet. The first strong one, such as a question or a request for a quote, puts it in a tier straight away.</p>`
          : `<p>It is ${fmt1(T.A - x.score)} points short. Any one of these would get it there:</p><ul>
            ${(()=>{ const has = new Set(((x.p||{}).signals||[]).map(z=>z.type)); return [['Inquiry or RFQ', `${esc(c.firstName||c.name)} asks a question or for a quote`], ['Installed system near end of support', 'News that their control system is nearing end of support'], ['Capital project', 'A new project or expansion announced at the site']].filter(([k])=>!has.has(k)).map(([,l])=>`<li>${l}</li>`).join(''); })()}
            ${(x.p&&x.p.signals.length) ? `<li>Another signal from ${esc(c.firstName||c.name)}: the second one counts half</li>` : ''}
            ${c.persona!=='Primary' ? '<li>A contact in an instrumentation, automation or control systems role (a better fit)</li>' : ''}</ul>
            <p>Signals fade with time, so it can also drop a tier if nothing new comes in.</p>`}
        <p class="lt-note">Suggested actions to help get it there come after the pilot.</p></div></details>` : ''}
    </div></div>`;
  const kv = (k,v) => `<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--s75);font-size:12px"><span style="color:var(--i3);width:96px;flex-shrink:0">${k}</span><span style="color:var(--i1);min-width:0;overflow:hidden;text-overflow:ellipsis" title="${esc(String(v).replace(/<[^>]+>/g,''))}">${v}</span></div>`;
  html += `<div class="panel" style="margin-bottom:12px"><div class="panel-hdr"><span class="panel-ttl">Contact</span></div><div class="panel-body" style="padding-top:4px;padding-bottom:4px">
    ${kv('Persona', c.persona)}${kv('Reachable by', c.reachableBy==='none'?'No channel':c.reachableBy)}
    ${kv('Email', c.emailRaw?esc(c.emailRaw)+(c.email&&c.emailVerified?'':' <span style="color:var(--warn)">(not used)</span>'):'—')}
    ${kv('LinkedIn', c.linkedinRaw?esc(c.linkedinRaw.replace(/^https?:\/\/(www\.)?/,'')):'—')}
    ${kv('Location', esc([c.city,c.country].filter(Boolean).join(', ')||'—'))}${kv('Owner', esc(c.owner||'—'))}
  </div></div>`;
  if(r.breakdown){
    html += `<div class="panel" style="margin-bottom:12px"><div class="panel-hdr"><span class="panel-ttl">Company fit · ${esc(a.name)}</span><span style="font-family:var(--fm);font-size:12px;font-weight:600;color:var(--i1)">${fmt1(r.fit)} / 100</span></div><div class="panel-body">
      ${r.breakdown.map(b=>`<div style="padding:6px 0">
        <div style="display:flex;align-items:baseline;gap:8px;font-size:11.5px"><span style="flex:1;color:var(--i1)">${b.label} <span style="color:var(--i3)">· ${esc(b.levelLabel)}</span></span><span style="font-family:var(--fm);color:var(--i1)">${fmt1(b.points)}<span style="color:var(--i3)">/${b.weight}</span></span></div>
        <div class="dim-track" style="margin-top:4px"><div class="dim-fill" style="width:${b.level}%;background:var(--sec)"></div></div>
      </div>`).join('')}
    </div></div>`;
  }
  // Signal evidence: every row of the signal file about this person, counted or not, in file order.
  const ev = RUN.sig.signals.filter(s=>s.accountId===a.id && (s.contactRow===c.row || (!s.contactRow && s.status!=='Qualified')));
  if(ev.length){
    const stTag = s => s.status==='Qualified' ? '<span class="tag tag-green">Counted</span>' : s.status==='Used for a knock-out' ? '<span class="tag tag-amber">Knock-out</span>' : s.status==='Rejected' ? '<span class="tag tag-red">Not counted</span>' : '<span class="tag tag-grey">Not used</span>';
    html += `<div class="panel" style="margin-bottom:12px"><div class="panel-hdr"><span class="panel-ttl">Signal evidence</span><span style="font-size:10.5px;color:var(--i3)">${ev.length} row${ev.length===1?'':'s'} in ${esc(RUN.fileName)}</span></div><div class="panel-body" style="padding:0">
      ${ev.map(s=>`<div class="ev"><div class="ev-h"><span class="ev-r">Row ${s.row}</span>${tagChip(s.type)}<span style="flex:1"></span>${stTag(s)}</div>
        <div class="ev-d">${esc(s.detail||'—')}</div>
        <div class="ev-m">${s.date?esc(s.date):'No date'}${s.source?` · ${esc(s.source)}`:''}${s.status==='Qualified' ? ` · ${sigStrength(s)[0].toLowerCase()}, ${sigFresh(s)}` : ` · ${s.code?esc(s.code+' '+DemandAI.CODES[s.code])+': ':''}${esc(s.reason)}`}</div></div>`).join('')}
    </div></div>`;
  }
  document.getElementById('detBody').innerHTML = html;
  const dr = document.getElementById('detailDrawer'); dr.style.width = '440px'; dr.classList.add('open');
  if(typeof Copilot!=='undefined') Copilot.footBar(`Ask Copilot about ${x.c.name}…`, `scoreAskKey`);
}

/* ═══════════════ BOOT ═══════════════ */
(function boot(){
  const p = new URLSearchParams(location.search), id = p.get('list');
  if(p.get('run') && DemandAI.getScoring(p.get('run'))){ openRun(p.get('run')); return; }
  if(id && DemandAI.getList(id)) selListId = id;
  renderStart(p.get('tab')==='monitor' ? 'monitor' : 'new');
})();

setTimeout(()=>{ try{ DemandAI.reviewBadge(); }catch(e){} }, 0);
const PAGE_ID = '11-scoring.html';

/* ═══════════════ ROLE ENGINE — shared across every screen ═══════════════ */
const ALL_ROLES = ['Admin','Sales manager','Sales rep','Viewer','Platform admin'];
const ROLE_PERSON = {
  'Admin':'Rajiv Nair', 'Sales manager':'Pavan Kumar', 'Sales rep':'Sofia Ahlgren',
  'Viewer':'Elena Vogel', 'Platform admin':'Shantanu Rao'
};
const ROLE_NAV_ALLOWED = {
  'Admin': ['00-today.html','14-review.html','09-setup.html','07-content.html','08-users.html','10-prospecting.html','11-scoring.html','12-nba.html','15-content-studio.html','13-analytics.html'],
  'Sales manager': ['00-today.html','14-review.html','10-prospecting.html','11-scoring.html','12-nba.html','15-content-studio.html','07-content.html','13-analytics.html','09-setup.html','08-users.html'],
  'Sales rep': ['00-today.html','14-review.html','10-prospecting.html','11-scoring.html','12-nba.html','15-content-studio.html','07-content.html','13-analytics.html'],
  'Viewer': ['13-analytics.html'],
  'Platform admin': [],
};
function getThisPageId(){
  if(typeof PAGE_ID !== 'undefined') return PAGE_ID;
  try { return location.pathname.split('/').pop(); } catch(e){ return ''; }
}
function getRole(){
  try { return localStorage.getItem('demandai_role') || 'Sales manager'; }
  catch(e){ return 'Sales manager'; }
}
function setRole(role){
  try { localStorage.setItem('demandai_role', role); } catch(e){}
  const ov = document.getElementById('roleModalOverlay');
  if(ov) ov.style.display = 'none';
  applyRoleToNav();
}
function applyRoleToNav(){
  const role = getRole();
  const allowed = ROLE_NAV_ALLOWED[role] || [];
  document.querySelectorAll('.nav-item').forEach(a=>{
    const href = (a.getAttribute('href')||'').split('?')[0];
    a.style.display = allowed.includes(href) ? '' : 'none';
  });
  const unEl = document.querySelector('.nav-un');
  const urEl = document.querySelector('.nav-ur');
  const avEl = document.querySelector('.nav-av');
  if(unEl) unEl.textContent = ROLE_PERSON[role];
  if(urEl) urEl.textContent = role;
  if(avEl) avEl.textContent = ROLE_PERSON[role].split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  const thisPage = getThisPageId();
  const pageIsKnown = Object.values(ROLE_NAV_ALLOWED).some(list => list.includes(thisPage));
  if(!pageIsKnown){ return; } // can't verify this page's id reliably here — don't block access on a guess
  if(!allowed.includes(thisPage)){
    const main = document.querySelector('.main') || document.getElementById('mainArea');
    const PAGE_NAMES = {'00-today.html':'Today','09-setup.html':'Setup','07-content.html':'Content library','08-users.html':'Users and roles','10-prospecting.html':'Prospecting','11-scoring.html':'Account Scoring','12-nba.html':'Next Best Action','13-analytics.html':'Analytics','14-review.html':'Review','15-content-studio.html':'Content studio'};
    const firstAllowedHref = allowed[0] || '00-today.html';
    if(main) main.innerHTML = `
      <div class="topbar"><div class="topbar-l"><span class="tb-title">No access</span></div></div>
      <div class="canvas" style="display:flex;align-items:center;justify-content:center;min-height:70vh">
        <div style="text-align:center;max-width:360px">
          <div style="font-size:28px;margin-bottom:10px">🔒</div>
          <div style="font-family:var(--fd);font-size:15px;font-weight:700;color:var(--i1);margin-bottom:6px">Not available for this role</div>
          <div style="font-size:12px;color:var(--i3);line-height:1.6">${role} doesn't have access to this screen. Switch role from the sidebar, or use the menu to go to <a href="${firstAllowedHref}" style="color:var(--brand)">${PAGE_NAMES[firstAllowedHref]||firstAllowedHref}</a>.</div>
        </div>
      </div>`;
  }
}
function renderRoleSwitcher(){
  const foot = document.querySelector('.nav-foot');
  if(!foot || document.getElementById('roleSwitchBtn')) return;
  const btn = document.createElement('div');
  btn.id = 'roleSwitchBtn';
  btn.style.cssText = 'padding:8px 10px 0;cursor:pointer;';
  btn.innerHTML = `<div style="font-size:10px;color:var(--r3);text-decoration:underline;text-align:center">Switch role (demo)</div>`;
  btn.onclick = openRoleModal;
  foot.appendChild(btn);
}
function openRoleModal(){
  let ov = document.getElementById('roleModalOverlay');
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'roleModalOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(20,26,33,.45);z-index:700;display:flex;align-items:center;justify-content:center;';
    ov.onclick = (e)=>{ if(e.target===ov) ov.style.display='none'; };
    document.body.appendChild(ov);
  }
  const current = getRole();
  ov.innerHTML = `<div style="background:var(--surf);border-radius:var(--rlg);box-shadow:var(--sh-lg);width:360px;padding:20px;" onclick="event.stopPropagation()">
    <div style="font-family:var(--fd);font-size:14px;font-weight:700;color:var(--i1);margin-bottom:4px">Preview as a role</div>
    <div style="font-size:11px;color:var(--i3);margin-bottom:14px">Changes what you see, matching what that role actually has access to. If this screen isn't available for the new role, use the sidebar to go to one that is.</div>
    ${ALL_ROLES.map(r=>`<div onclick="setRole('${r}')" style="padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;background:${r===current?'var(--brand-lt)':'transparent'};display:flex;align-items:center;justify-content:space-between">
      <div><div style="font-size:12.5px;font-weight:600;color:var(--i1)">${r}</div><div style="font-size:10.5px;color:var(--i3)">${ROLE_PERSON[r]}</div></div>
      ${r===current?'<span style="color:var(--brand)">✓</span>':''}
    </div>`).join('')}
    <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;margin-top:10px" onclick="document.getElementById('roleModalOverlay').style.display='none'">Close</button>
  </div>`;
  ov.style.display = 'flex';
}
document.addEventListener('DOMContentLoaded', function(){ applyRoleToNav(); renderRoleSwitcher(); });
if(document.readyState !== 'loading'){ applyRoleToNav(); renderRoleSwitcher(); }


</script>
