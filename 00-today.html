<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Today — DemandAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#7D52A2;--brand-dk:#5E3A80;--brand-lt:#F0EBF8;--brand-mid:#C9B3E8;
  --sec:#0094DA;--sec-lt:#E6F4FC;--sec-dk:#005E8E;
  --ter:#FF8820;--ter-lt:#FFF0E0;--ter-dk:#B85800;
  --pos:#2E7D5A;--pos-lt:#EAF5F0;
  --warn:#C4751A;--warn-lt:#FDF6E8;
  --neg:#B23F3F;--neg-lt:#FBECEC;
  --rail:#130D1C;--rb:rgba(255,255,255,.07);
  --r1:#fff;--r2:rgba(255,255,255,.76);--r3:rgba(255,255,255,.43);--r4:rgba(255,255,255,.21);
  --rhov:rgba(255,255,255,.05);--ract:rgba(125,82,162,.22);
  --bg:#F5F6F9;--surf:#fff;--border:#E5E9EE;--bdk:#D1D7DE;
  --i1:#141A21;--i2:#4A5664;--i3:#9DA8B5;--i4:#C9D1DA;
  --s50:#F4F6F8;--s75:#ECEFF3;--s100:#E1E6EC;--s200:#C9D1DA;--s300:#9DA8B5;
  --fd:"Sora",system-ui,sans-serif;
  --fb:"Plus Jakarta Sans",-apple-system,sans-serif;
  --fm:"JetBrains Mono",monospace;
  --rsm:8px;--rmd:12px;--rlg:16px;
  --ease:cubic-bezier(.4,0,.2,1);--fast:120ms;--base:200ms;
  --sh:0 2px 8px rgba(20,26,33,.07),0 1px 3px rgba(20,26,33,.05);
  --sh-lg:0 8px 40px rgba(20,26,33,.14),0 2px 8px rgba(20,26,33,.08);
  --nav-w:224px;--chat-w:400px;--hh:54px;--tabs-h:42px;
}
*,*::before,*::after{box-sizing:border-box;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{margin:0;font-family:var(--fb);font-size:14px;background:var(--bg);color:var(--i1);overflow:hidden;height:100vh;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font:inherit;}
:root{color-scheme:light;}
input,textarea,select{background-color:#fff;color:var(--i1);}
textarea[readonly],input[readonly]{background-color:var(--s50);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--s200);border-radius:2px;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(1.3);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideLeft{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}
@keyframes msgIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{width:0}to{width:var(--bw)}}

/* ─── SHELL ─────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;height:100vh;width:100vw;}

/* ─── NAV ─────────────────────────────── */
.nav{background:var(--rail);display:flex;flex-direction:column;height:100vh;overflow:hidden;border-right:1px solid var(--rb);}
.nav-brand{display:flex;align-items:center;gap:9px;padding:13px 13px 11px;border-bottom:1px solid var(--rb);flex-shrink:0;}
.nav-nm{font-family:var(--fd);font-size:14px;font-weight:600;color:var(--r1);letter-spacing:-.01em;}
.nav-org{font-size:10px;color:var(--r3);margin-top:1px;}
.nav-body{flex:1;overflow-y:auto;padding:6px 0;}
.nav-body::-webkit-scrollbar{width:3px;}
.nav-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);}
.nav-sec{padding:8px 14px 3px;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--r4);font-weight:600;}
.nav-item{display:flex;text-decoration:none;align-items:center;gap:9px;height:32px;padding:0 10px;margin:1px 6px;border-radius:7px;color:var(--r3);font-size:12.5px;font-weight:500;cursor:pointer;position:relative;transition:background var(--fast) var(--ease),color var(--fast) var(--ease);}
.nav-item:hover{background:var(--rhov);color:var(--r2);}
.nav-item.active{background:var(--ract);color:var(--r1);}
.nav-item.active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2.5px;background:var(--brand-mid);border-radius:0 2px 2px 0;}
.nav-ic{width:15px;height:15px;flex-shrink:0;opacity:.7;}
.nav-item.active .nav-ic{opacity:1;color:var(--brand-mid);}
.nav-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-div{height:1px;background:var(--rb);margin:6px 10px;}
.nav-foot{padding:10px;border-top:1px solid var(--rb);flex-shrink:0;}
.nav-user{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--rsm);cursor:pointer;transition:background var(--fast) var(--ease);}
.nav-user:hover{background:var(--rhov);}
.nav-av{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.nav-un{font-size:12px;color:var(--r2);font-weight:500;}
.nav-ur{font-size:10px;color:var(--r4);margin-top:1px;}

/* ─── MAIN ─────────────────────────────── */
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0;}

/* Topbar */
.topbar{height:var(--hh);padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0;gap:10px;}
.topbar-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.tb-title{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--i1);}
.tb-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;}
.badge-live{background:var(--pos-lt);color:var(--pos);}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite;}
.badge-neutral{background:var(--s100);color:var(--i3);}
.topbar-r{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--fb);font-size:12.5px;font-weight:600;height:30px;padding:0 12px;border-radius:var(--rsm);border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:all var(--fast) var(--ease);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dk);}
.btn-sec{background:var(--surf);border-color:var(--bdk);color:var(--i1);}
.btn-sec:hover{background:var(--s75);}
.btn-copilot{background:var(--brand-lt);border-color:var(--brand-mid);color:var(--brand-dk);}
.btn-copilot:hover{background:var(--brand-mid);}
.btn-copilot.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.btn-ghost{color:var(--i2);}
.btn-ghost:hover{background:var(--s75);}
.btn-sm{height:27px;font-size:11.5px;padding:0 10px;border-radius:6px;}

/* Tabs */
.ftabs{height:var(--tabs-h);padding:0 20px;display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--border);background:var(--surf);flex-shrink:0;}
.ftab{display:flex;align-items:center;gap:6px;padding:0 16px;font-size:13px;font-weight:500;color:var(--i3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color var(--fast) var(--ease);}
.ftab:hover{color:var(--i2);}
.ftab.active{color:var(--i1);border-bottom-color:var(--brand);}
.ftab-cnt{font-family:var(--fm);font-size:10.5px;color:var(--i4);}
.ftab.active .ftab-cnt{color:var(--brand);}

/* Canvas */
.canvas{flex:1;overflow-y:auto;padding:16px 20px 40px;}
.canvas::-webkit-scrollbar{width:5px;}

/* ─── STATS STRIP ─────────────────────── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;margin-bottom:16px;}
.stat{padding:13px 16px;border-right:1px solid var(--border);}
.stat:last-child{border-right:none;}
.stat-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--i3);font-weight:600;margin-bottom:4px;}
.stat-val{font-family:var(--fd);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:3px;}
.stat-sub{font-size:11px;color:var(--i3);}
.sv1{color:var(--brand);}
.sv2{color:var(--sec);}
.sv3{color:var(--ter-dk);}
.sv4{color:var(--pos);}
.sv5{color:var(--i1);}

/* ─── MAIN LAYOUT: full-width list, detail as fixed right drawer ─── */
.score-layout{display:block;}
/* dim-overview handled inline */

/* Detail drawer — slides in from the right over the content */
.detail-drawer{
  position:fixed;top:0;right:0;bottom:0;
  width:360px;
  background:var(--surf);
  border-left:1px solid var(--border);
  box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;
  z-index:300;
  transform:translateX(100%);
  transition:transform var(--base) var(--ease);
  overflow-y:auto;
}
.detail-drawer.open{transform:translateX(0);}
.detail-drawer::-webkit-scrollbar{width:4px;}
.drawer-hdr{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:var(--surf);
  border-bottom:1px solid var(--border);
}
.drawer-title{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--i1);}
.drawer-sub{font-size:10.5px;color:var(--i3);margin-top:1px;}
.drawer-close{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--i3);cursor:pointer;flex-shrink:0;transition:all var(--fast);}
.drawer-close:hover{background:var(--s75);color:var(--i1);}
.drawer-body{padding:14px 16px 24px;flex:1;}

/* Score list */
.score-list{background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;}
.sl-toolbar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.sl-srch{display:flex;align-items:center;gap:6px;background:var(--s50);border:1px solid var(--border);border-radius:var(--rsm);padding:0 10px;height:29px;min-width:160px;flex:1;max-width:220px;transition:border-color var(--fast);}
.sl-srch:focus-within{border-color:var(--brand-mid);}
.sl-srch input{border:none;background:transparent;font-size:12.5px;color:var(--i1);outline:none;width:100%;}
.sl-srch input::placeholder{color:var(--i3);}
.sl-seg-filter{display:flex;gap:4px;margin-left:auto;}
.seg-pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;cursor:pointer;border:1px solid var(--border);color:var(--i3);background:var(--surf);white-space:nowrap;transition:all var(--fast);}
.seg-pill:hover{border-color:var(--brand-mid);color:var(--brand);}
.seg-pill.active{background:var(--brand);border-color:var(--brand);color:#fff;}

.sl-head{display:grid;grid-template-columns:minmax(160px,2.5fr) 72px 72px 72px 110px 180px;padding:0 14px;height:32px;background:var(--s50);border-bottom:1px solid var(--border);align-items:center;gap:6px;}
.sl-th{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);font-weight:600;white-space:nowrap;}

.sl-row{display:grid;grid-template-columns:minmax(160px,2.5fr) 72px 72px 72px 110px 180px;padding:6px 14px;min-height:60px;border-bottom:1px solid var(--border);align-items:center;gap:6px;cursor:pointer;transition:background var(--fast);}
.sl-row:last-child{border-bottom:none;}
.sl-row:hover{background:var(--s50);}
.sl-row.selected{background:var(--brand-lt);}

.co-cell{display:flex;align-items:center;gap:9px;min-width:0;}
.co-av{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.co-nm{font-size:12.5px;font-weight:600;color:var(--i1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.co-ind{font-size:10.5px;color:var(--i3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Score badges */
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:20px;padding:0 5px;border-radius:4px;font-family:var(--fm);font-size:11px;font-weight:700;}
.sc-h{background:var(--pos-lt);color:var(--pos);}
.sc-m{background:var(--warn-lt);color:var(--warn);}
.sc-l{background:var(--neg-lt);color:var(--neg);}

/* Composite bar */
.comp-bar{display:flex;align-items:center;gap:5px;}
.comp-track{flex:1;height:4px;background:var(--s100);border-radius:2px;overflow:hidden;}
.comp-fill{height:4px;border-radius:2px;animation:barGrow .5s var(--ease) forwards;}
.comp-val{font-family:var(--fm);font-size:11px;color:var(--i2);min-width:20px;text-align:right;flex-shrink:0;}

/* Delta */
.delta{font-family:var(--fm);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:3px;white-space:nowrap;}
.delta-up{background:var(--pos-lt);color:var(--pos);}
.delta-dn{background:var(--neg-lt);color:var(--neg);}
.delta-flat{background:var(--s100);color:var(--i3);}

/* ─── PANEL (used in tabs) ─────────── */
.panel{background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);}
.panel-ttl{font-size:11px;font-weight:600;color:var(--i2);letter-spacing:.04em;text-transform:uppercase;}
.panel-body{padding:12px 14px;}

/* Score breakdown in detail */
.dim-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--s75);}
.dim-row:last-child{border-bottom:none;}
.dim-lbl{font-size:11.5px;color:var(--i2);width:74px;flex-shrink:0;}
.dim-track{flex:1;height:5px;background:var(--s100);border-radius:3px;overflow:hidden;}
.dim-fill{height:5px;border-radius:3px;transition:width .5s var(--ease);}
.dim-val{font-family:var(--fm);font-size:12px;font-weight:700;min-width:26px;text-align:right;flex-shrink:0;}

/* Signal log */
.sig-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--s75);}
.sig-row:last-child{border-bottom:none;}
.sig-ic{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:1px;}
.sig-lbl{font-size:11.5px;color:var(--i1);font-weight:500;line-height:1.4;}
.sig-meta{font-size:10px;color:var(--i3);margin-top:2px;}
.sig-impact{margin-left:auto;font-family:var(--fm);font-size:11px;font-weight:700;flex-shrink:0;}
.sig-up{color:var(--pos);}
.sig-dn{color:var(--neg);}

/* Sparkline */
.spark{display:flex;align-items:flex-end;gap:2px;height:28px;}
.spark-bar{flex:1;border-radius:2px 2px 0 0;min-width:3px;}

/* Lookalikes */
.like-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--s75);cursor:pointer;}
.like-row:last-child{border-bottom:none;}
.like-row:hover .like-nm{color:var(--brand);}
.like-av{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:9.5px;font-weight:700;color:#fff;flex-shrink:0;}
.like-nm{font-size:12px;font-weight:600;color:var(--i1);transition:color var(--fast);}
.like-meta{font-size:10.5px;color:var(--i3);margin-top:1px;}
.like-match{margin-left:auto;font-family:var(--fm);font-size:11px;font-weight:700;color:var(--brand);flex-shrink:0;}

/* Empty detail state */
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;gap:8px;text-align:center;}

/* ─── DIMENSION OVERVIEW (below list on Scores tab) */
/* dim-overview now defined in score-layout block above */
/* dov-num used by the inline dimension strip */
.dov-num{font-family:var(--fd);font-weight:700;letter-spacing:-.03em;line-height:1;}
.dov-dist{display:flex;gap:2px;height:5px;border-radius:3px;overflow:hidden;}
.dov-seg{height:100%;}

/* ─── SEGMENT MAP TAB ─── */
.seg-map-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
.seg-map-ttl{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--i1);}
.seg-grid{display:grid;grid-template-columns:repeat(4,1fr);}
.seg-cell{padding:14px 16px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--fast);}
.seg-cell:hover{background:var(--s50);}
.seg-cell:nth-child(4n){border-right:none;}
.seg-cell:nth-last-child(-n+4){border-bottom:none;}
.seg-nm{font-size:12.5px;font-weight:600;color:var(--i1);margin-bottom:3px;}
.seg-desc{font-size:10.5px;color:var(--i3);margin-bottom:8px;line-height:1.5;}
.seg-count{font-family:var(--fd);font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:2px;}
.seg-sub{font-size:10.5px;color:var(--i3);}
.seg-bar-wrap{height:3px;background:var(--s100);border-radius:2px;margin-top:8px;overflow:hidden;}
.seg-bar-fill{height:3px;border-radius:2px;}

/* ─── HISTORY TAB ─── */
.hist-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--s75);}
.hist-row:last-child{border-bottom:none;}
.hist-dir{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ─── THRESHOLD TAB ─── */
.thresh-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.thresh-dim{display:flex;flex-direction:column;gap:10px;}
.thresh-dim-ttl{font-size:10.5px;font-weight:600;color:var(--i2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.thresh-row{display:flex;align-items:center;gap:10px;}
.thresh-lbl{font-size:11.5px;color:var(--i2);min-width:90px;}
.thresh-slider{flex:1;accent-color:var(--brand);cursor:pointer;height:4px;}
.thresh-val{font-family:var(--fm);font-size:12px;font-weight:600;color:var(--i1);min-width:26px;text-align:right;}
.thresh-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--border);background:var(--s50);}
.thresh-hint{font-size:12px;color:var(--i3);}
.thresh-hint strong{color:var(--warn);font-weight:600;}

/* ─── CHAT PANEL ─────────────────────── */
.chat-panel{position:fixed;top:0;right:0;bottom:0;width:var(--chat-w);background:var(--surf);border-left:1px solid var(--border);box-shadow:var(--sh-lg);display:flex;flex-direction:column;z-index:400;transform:translateX(100%);transition:transform var(--base) var(--ease);}
.chat-panel.open{transform:translateX(0);}
.chat-panel.expanded{position:fixed;inset:0;width:100vw;height:100vh;border-left:none;z-index:450;}
.chat-panel.expanded .hist-section{display:none;}
.chat-panel.expanded .chat-msgs,.chat-panel.expanded .sugg-wrap,.chat-panel.expanded .composer-wrap{padding-left:24px;padding-right:24px;}

.chat-top{height:var(--hh);padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;}
.chat-top-l{display:flex;align-items:center;gap:9px;min-width:0;flex:1;}
.chat-ttl{font-size:13px;font-weight:600;color:var(--i1);}
.chat-scope{font-size:10.5px;color:var(--i3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-top-acts{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.ct-ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--i3);cursor:pointer;transition:all var(--fast);}
.ct-ic:hover{background:var(--s75);color:var(--i1);}
.ct-ic.active{background:var(--brand-lt);color:var(--brand);}

.hist-section{border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden;max-height:220px;transition:max-height var(--base) var(--ease);}
.hist-section.collapsed{max-height:0;border-bottom:none;}
.hist-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;cursor:pointer;user-select:none;}
.hist-lbl{font-size:10.5px;font-weight:600;color:var(--i2);letter-spacing:.03em;}
.hist-chev{color:var(--i3);transition:transform var(--fast);}
.hist-section.collapsed .hist-chev{transform:rotate(-90deg);}
.hist-list{padding:0 10px 8px;overflow-y:auto;max-height:160px;}
.hist-list::-webkit-scrollbar{width:3px;}
.hist-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:background var(--fast);}
.hist-item:hover{background:var(--s50);}
.hist-item.active{background:var(--brand-lt);}
.hist-item-nm{flex:1;font-size:12px;font-weight:500;color:var(--i2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hist-item.active .hist-item-nm{color:var(--brand-dk);}

.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.chat-msgs::-webkit-scrollbar{width:4px;}
.msg{animation:msgIn var(--base) var(--ease);}
.msg-a{display:flex;align-items:flex-start;gap:8px;}
.msg-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.msg-bub{background:var(--s50);border:1px solid var(--border);border-radius:var(--rmd);padding:10px 12px;font-size:12.5px;color:var(--i1);line-height:1.6;max-width:calc(100% - 32px);}
.msg-bub strong{font-weight:600;}
.msg-bub em{font-style:normal;color:var(--i2);background:var(--s100);padding:1px 5px;border-radius:3px;font-size:12px;}
.msg-u{display:flex;justify-content:flex-end;}
.msg-ub{background:var(--brand);color:#fff;border-radius:var(--rmd);padding:10px 12px;font-size:12.5px;line-height:1.6;max-width:86%;}
.msg-time{font-size:9.5px;color:var(--i4);margin-top:3px;padding:0 2px;}

/* Chat action chips */
.chat-acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.ca{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:16px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid;transition:all var(--fast);}
.ca-pri{background:var(--brand);border-color:var(--brand);color:#fff;}
.ca-pri:hover{background:var(--brand-dk);}
.ca-sec{background:var(--surf);border-color:var(--bdk);color:var(--i1);}
.ca-sec:hover{background:var(--s75);}
.ca-ghost{background:transparent;border-color:var(--border);color:var(--i2);}
.ca-ghost:hover{border-color:var(--bdk);color:var(--i1);}

/* Suggestions */
.sugg-wrap{padding:4px 14px 8px;}
.sugg-lbl{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);font-weight:600;margin-bottom:6px;}
.sugg{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--rsm);font-size:12px;color:var(--i2);cursor:pointer;background:var(--surf);margin-bottom:3px;transition:all var(--fast);}
.sugg:hover{border-color:var(--brand-mid);background:var(--brand-lt);color:var(--brand-dk);}
.sugg svg{color:var(--brand);flex-shrink:0;}

/* Typing */
.typing-bub{display:inline-flex;align-items:center;gap:4px;padding:12px 14px;background:var(--s50);border:1px solid var(--border);border-radius:var(--rmd);}
.typing-bub span{width:6px;height:6px;border-radius:50%;background:var(--s300);}
.typing-bub span:nth-child(1){animation:pulse .9s ease-in-out infinite;}
.typing-bub span:nth-child(2){animation:pulse .9s ease-in-out .18s infinite;}
.typing-bub span:nth-child(3){animation:pulse .9s ease-in-out .36s infinite;}

/* Composer */
.composer-wrap{border-top:1px solid var(--border);padding:10px 13px 13px;background:var(--bg);flex-shrink:0;}
.composer{display:flex;align-items:flex-end;gap:7px;background:var(--surf);border:1.5px solid var(--border);border-radius:12px;padding:8px 9px;transition:border-color var(--fast);}
.composer:focus-within{border-color:var(--brand-mid);}
.cta{flex:1;border:none;background:transparent;font-size:13px;color:var(--i1);outline:none;resize:none;min-height:20px;max-height:90px;line-height:1.5;}
.cta::placeholder{color:var(--i3);}
.composer-btns{display:flex;align-items:center;gap:5px;}
.att-btn{width:28px;height:28px;border-radius:7px;color:var(--i3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--fast);}
.att-btn:hover{background:var(--s75);color:var(--i1);}
.send-btn{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background var(--fast),transform var(--fast);}
.send-btn:hover{background:var(--brand-dk);transform:scale(1.04);}
.send-btn.off{background:var(--s200);cursor:default;transform:none;}
.composer-hint{font-size:10px;color:var(--i4);margin-top:5px;text-align:center;}

/* Dropdown */
.dd{position:relative;display:inline-block;}
.ddm{position:absolute;top:calc(100% + 5px);right:0;min-width:200px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);box-shadow:var(--sh-lg);z-index:200;overflow:hidden;display:none;}
.ddm.open{display:block;animation:slideDown 100ms var(--ease);}
.ddi{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:13px;color:var(--i1);cursor:pointer;transition:background var(--fast);}
.ddi:hover{background:var(--s50);}
.ddi svg{color:var(--i3);flex-shrink:0;}
.dd-sep{height:1px;background:var(--border);margin:3px 0;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--i1);color:#fff;font-size:12.5px;font-weight:500;padding:9px 18px;border-radius:999px;z-index:900;pointer-events:none;animation:fadeUp .2s var(--ease);}


/* ─── Data tables and tags (Prospecting, Scoring) ─── */
.dt-wrap{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
.dt-wrap::-webkit-scrollbar{display:none;}
.dt{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12.5px;}
.dt th{padding:11px 16px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3);text-align:left;background:var(--s50);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dt td{padding:13px 16px;color:var(--i2);border-bottom:1px solid var(--s75);vertical-align:middle;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dt tr:last-child td{border-bottom:none;}
.dt tbody tr{transition:background var(--fast);}
.dt tbody tr:hover td{background:#FAFBFC;}
.dt tbody tr.click{cursor:pointer;}
.dt th.num,.dt td.num{text-align:right;}
.dt td.num{font-family:var(--fm);font-variant-numeric:tabular-nums;}
.dt td.wrap{white-space:normal;}
.dt .dt-main{color:var(--i1);font-weight:600;overflow:hidden;text-overflow:ellipsis;}
.dt .val{color:var(--i1);overflow:hidden;text-overflow:ellipsis;}
.dt .sub{display:block;font-size:11px;color:var(--i3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;}
.dt .muted{color:var(--i4);}
.dt .person{display:flex;align-items:center;gap:10px;min-width:0;}
.dt .person > div:last-child{min-width:0;}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;}
.dt-empty{padding:28px;text-align:center;font-size:12.5px;color:var(--i3);}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;font-family:var(--fb);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap;background:var(--s75);color:var(--i2);vertical-align:middle;}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.tag-green{background:#E8F5EE;color:#24704F;}
.tag-amber{background:#FDF2E1;color:#A8620F;}
.tag-red{background:#FBEAEA;color:#A83A3A;}
.tag-blue{background:#E4F2FB;color:#00659A;}
.tag-violet{background:#F0EAF8;color:#6A4290;}
.tag-teal{background:#E3F4F2;color:#1B7369;}
.tag-pink{background:#FBE9F1;color:#A1386A;}
.tag-grey{background:#EEF1F4;color:#5B6774;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}

/* ─── Checks pop-up ─── */
@keyframes ckspin{to{transform:rotate(360deg);}}
@keyframes ckpop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.ck{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.ck-wait{border:2px solid var(--s100);}
.ck-run{border:2.5px solid var(--brand-lt);border-top-color:var(--brand);animation:ckspin .7s linear infinite;}
.ck-ok{background:var(--pos);color:#fff;animation:ckpop .2s var(--ease);}
.ck-warn{background:var(--warn);color:#fff;animation:ckpop .2s var(--ease);}
.ck-stop{background:var(--neg);color:#fff;animation:ckpop .2s var(--ease);}
.ck-info{background:var(--s300);color:#fff;animation:ckpop .2s var(--ease);}
.ck-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--s75);transition:opacity var(--base);}
.ck-row.pending{opacity:.45;}

/* ─── Checkboxes: grey when empty, brand colour when ticked ─── */
.dt input[type=checkbox]{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin:0;border-radius:4px;border:1.5px solid var(--s200);background:var(--s75);cursor:pointer;vertical-align:middle;display:inline-grid;place-content:center;transition:background var(--fast),border-color var(--fast);}
.dt input[type=checkbox]:hover{border-color:var(--s300);}
.dt input[type=checkbox]:checked,.dt input[type=checkbox]:indeterminate{background:var(--brand);border-color:var(--brand);}
.dt input[type=checkbox]:checked::after{content:'';width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg);}
.dt input[type=checkbox]:indeterminate::after{content:'';width:8px;height:2px;background:#fff;border-radius:1px;}
.dt input[type=checkbox]:focus-visible{outline:2px solid var(--brand-mid);outline-offset:2px;}
.stat-link{position:relative;cursor:pointer;display:block;text-decoration:none;transition:background var(--fast) var(--ease);}
.stat-link:hover{background:var(--brand-lt);}
.stat-link::after{content:'›';position:absolute;top:10px;right:14px;font-size:17px;color:var(--i4);transition:color var(--fast) var(--ease),transform var(--fast) var(--ease);}
.stat-link:hover::after{color:var(--brand);transform:translateX(2px);}
.stat-link:hover .stat-lbl{color:var(--brand);}
</style>
</head>

function showToast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function initials(n){return String(n).split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function avColor(id){const c=['#7D52A2','#0094DA','#FF8820','#2E7D5A','#B23F3F'];let h=0;for(const ch of String(id))h+=ch.charCodeAt(0);return c[h%c.length];}
function closeDrawer(){ document.getElementById('detailDrawer').classList.remove('open'); }
function esc(s){return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fallbackDownload(name, text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);}
// On claude.ai the page can't start a download itself: the viewer confirms a save. Opened as a plain file, it downloads directly.
async function download(name, text){
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ dl = null; }
  if(!dl){ fallbackDownload(name, text); return; }
  try{ await dl.save({filename:name, data:text}); showToast(name+' saved'); }
  catch(e){ if(e && e.code==='declined') return; showToast(e && e.code==='rate_limited' ? 'A save is already open' : "This view can't save files"); }
}
function todayIso(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const fmt1 = n => n===undefined||n===null ? '—' : (Math.round(n*10)/10).toLocaleString('en-US',{minimumFractionDigits:n%1?1:0,maximumFractionDigits:1});
const fmtDate = t => new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});

function readFileToGrids(file){
  return new Promise((resolve,reject)=>{
    const isCsv = /\.csv$/i.test(file.name), isXlsx = /\.(xlsx|xls)$/i.test(file.name);
    if(!isCsv && !isXlsx){ reject(new Error('Use a .csv or .xlsx file')); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read the file'));
    reader.onload = ev=>{
      try{
        if(isCsv){ resolve([{sheet:'(CSV)', grid:DemandAI.parseCSV(ev.target.result)}]); return; }
        if(typeof XLSX==='undefined'){ reject(new Error('The Excel reader did not load. Save the sheet as CSV and upload that instead')); return; }
        const wb = XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
        resolve(wb.SheetNames.map(n=>({sheet:n, grid:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})})));
      }catch(e){ reject(e); }
    };
    if(isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
  });
}
function pickSheet(grids){
  const has = g => g.grid.slice(0,10).some(r=>(r||[]).some(c=>String(c).trim().toLowerCase().replace(/\*/g,'').replace(/\s+/g,'_')==='signal_type'));
  return grids.find(g=>/signal template/i.test(g.sheet) && has(g)) || grids.find(has) || grids[0];
}

}

const SEG_TONE = {Inquiry:'tag-blue',Modernisation:'tag-violet','Service renewal':'tag-teal',Project:'tag-amber',Leadership:'tag-pink',Engagement:'tag-green'};
function tagChip(t){ const c = DemandAI.CONFIG.signalTypes[t]; return `<span class="tag ${(c&&SEG_TONE[c.segment])||'tag-grey'}">${esc(t)}</span>`; }
function tierPill(t){

  return `<span class="tag ${m[0]}">${m[1]}</span>`;
}

  ov.style.display='flex'; return ov;

function search(fn, ph){ return `<div class="sl-srch"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--i3);flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" placeholder="${ph}" value="${esc(q)}" oninput="q=this.value.toLowerCase();${fn}()"></div>`; }
const pill = (cur,id,label) => `<div class="seg-pill ${cur===id?'active':''}" onclick="filt='${id}';renderResults()">${label}</div>`;

/* ═══════════════ TODAY: land on your work. Blockers first, then what waits on you and by when, then what the system did ═══════════════ */
let RUNS = [], SPOT = null, MISSING = [];
function loadRuns(){
  RUNS = []; MISSING = [];
  DemandAI.loadSegmentations().forEach(saved=>{ const c = compute(saved.src, saved.id, saved.createdAt, saved.brandVersion); if(c){ sensitiveToApprovals(saved, c.seg.recs); RUNS.push({ saved, ...c }); } else MISSING.push(saved); });
}
function ALL_RUNS(){ return RUNS; }
function withRun(run, fn){ const keep = RUN; RUN = run; try{ return fn(); } finally { RUN = keep; } }
// Every recommendation with its decision, newest list first.
function allItems(){
  return RUNS.slice().sort((a,b)=>b.saved.createdAt-a.saved.createdAt).flatMap(run=>withRun(run, ()=>run.seg.recs.map(r=>{
    const d = dec(r.key), lr = liveRec(r), q = inQueue(d) && !pausedInfo(r);
    return { id: run.saved.id+'::'+r.key, run, r, d, mine: mine(r), paused: !!pausedInfo(r), owner: ownerOf(r), queued: q,
      due: q ? dueOf(r, d) : null, cats: q ? reasonCats(r, d) : [],
      who: lr.contact.name, account: r.account.name, action: chosenAction(r), channel: draftOf(r).channel, segment: r.segment };
  })));
}
const ago = t => { if(!t) return ''; const h = (Date.now()-t)/36e5; return h<1 ? 'just now' : h<24 ? Math.round(h)+'h ago' : Math.round(h/24)+'d ago'; };
const firstName = () => (ROLE_PERSON[getRole()] || getRole()).split(' ')[0];
const greeting = () => { const h = new Date().getHours(); return h<12 ? 'Good morning' : h<18 ? 'Good afternoon' : 'Good evening'; };
const link = (href, text) => `<a href="${href}" style="font-size:11.5px;color:var(--brand);font-weight:600;text-decoration:none;white-space:nowrap">${text}</a>`;
const box = (title, right, body, id) => `<div class="panel" ${id?`id="${id}"`:''} style="margin-bottom:20px"><div class="panel-hdr"><span class="panel-ttl">${title}</span>${right||''}</div><div class="panel-body" style="padding:0">${body}</div></div>`;
const empty = t => `<div style="padding:14px;font-size:12px;color:var(--i3)">${t}</div>`;
const line = (main, sub, right, href) => `<a href="${href}" style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--s75);text-decoration:none;color:inherit">

const nbaLink = (run, show) => run ? `12-nba.html?run=${encodeURIComponent(run.saved.id)}${show?`&show=${show}`:''}` : '12-nba.html';

/* ─── 2 · Blockers: anything stopping work, with what's wrong and where it's fixed ─── */
function blockers(ctx){
  const { mgr, scope, lists, scorings, segs } = ctx, out = [], now = Date.now();
  // Approvals: for a manager they sit at the very top (approvalsCard); a rep sees their own held items here.
  if(!mgr){
    const held = scope.filter(x=>x.d.status==='Awaiting approval');
    if(held.length) out.push({ title:`${pl(held.length,'message')} held for the sales manager's approval`, detail:`Sensitive content: nothing is released until the sales manager approves (${held.map(x=>esc(x.account)).join(', ')}).`, href:nbaLink(held[0].run,'waiting'), cta:'See them', who:'Sales manager' });
  }
  // A run that failed: its prospect list was deleted, so the recommendations can't be opened or decided.
  MISSING.forEach(s=>out.push({ title:`Run failed: "${esc(s.name)}" can't be opened`, detail:'The prospect list behind it was deleted, so its recommendations can\'t be shown or decided.', href:'12-nba.html', cta:'Rebuild from a saved list', who:'Sales manager' }));
  // A scheduled run that didn't run on time.
  DemandAI.CONFIG.schedule.forEach(s=>{
    const last = Math.max(0, ...(s.id==='nba' ? segs : scorings).map(x=>x.createdAt||0));
    if(last && now - last > s.everyDays*864e5 + 4*36e5)
      out.push({ title:`Scheduled run didn't run: ${s.name}`, detail:`Last ran ${ago(last)}; it's expected ${s.everyDays===1?'every day':`every ${s.everyDays} days`}. Until it runs, new signals don't reach the reps.`, href:s.page, cta:'Run it now', who:s.owner });
  });
  if(mgr){
    // An upload where rows failed hard stops and weren't loaded.
    lists.filter(l=>now-(l.createdAt||0) < 14*864e5).forEach(l=>{
      const st = l.stats||{}, n = st.notLoaded || (st.issuesBySeverity||{}).stop || 0;
      if(n) out.push({ title:`Upload partly rejected: ${pl(n,'row')} of "${esc(l.name)}" failed hard stops`, detail:'Those rows weren\'t loaded, so their contacts can\'t be scored or recommended. Fix the file and upload it again.', href:'10-prospecting.html', cta:'See the rejected rows', who:'Sales manager' });
    });
    // Not enough data to measure the pilot.
    const gaps = RUNS.length ? readiness(RUNS).filter(x=>!x.ok && x.k!=='Collateral') : [];
    if(gaps.length) out.push({ title:'Not enough data to measure the pilot yet', detail:gaps.map(x=>`<b>${esc(x.k)}</b>: ${esc(x.show)}, needs ${esc(x.need.replace(/^A /,'a '))}`).join(' · '), href:'13-analytics.html?tab=validation', cta:'See the readiness checks', who:'Sales manager with the client' });
  }
  // An approved claim that has expired while an open action needs it.
  const today = todayIso();
  DemandAI.brandPack().claims.filter(c=>c.status==='approved' && c.expiry && c.expiry < today).forEach(c=>{
    const hit = scope.filter(x=>x.segment && c.segments.includes(x.segment) && !['Closed','Set aside'].includes(x.d.status));
    if(hit.length) out.push({ title:`Proof expired: "${esc(c.title)}" (${esc(c.id)})`, detail:`Expired ${fmtDate(c.expiry)}. ${pl(hit.length,'action')} in ${esc([...new Set(hit.map(x=>x.segment))].join(', '))} can't cite it, so their drafts go out without approved proof.`, href:'07-content.html?tab=claims', cta:'Renew or replace the claim', who:'Admin' });
  });
  return out;
}

    <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;color:var(--i1)">${b.title}</div>

/* ─── 3 · Waiting for my review, grouped by when it's due ─── */
function reviewSection(queue, mgr){
  if(!queue.length) return box('Waiting for your review', '', empty('Nothing is waiting for your review. New items arrive when micro-segments are built.'), 'review');
  const sorted = queue.slice().sort((a,b)=>a.due-b.due), first = sorted[0];
  const groups = DUE_BUCKETS.map(([k,l])=>({ k, l, its: sorted.filter(x=>dueBucket(x.due)===k) })).filter(g=>g.its.length);
  const tone = k => k==='overdue'||k==='today' ? 'var(--neg)' : k==='tomorrow' ? 'var(--warn)' : 'var(--i2)';
  const body = `<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--brand-lt)">
      <div style="flex:1;font-size:12.5px;color:var(--i1)"><b>Recommended:</b> start with ${esc(first.who)} · ${esc(first.account)}, ${esc(dueLabel(first.due).replace(/^./, c=>c.toLowerCase()))}. The queue is in the order things are due; you can filter it any way you like.</div>
      <a class="btn btn-primary btn-sm" href="14-review.html?item=${encodeURIComponent(first.id)}" style="text-decoration:none">Start reviewing →</a></div>
    ${groups.map(g=>{
      const counts = {}; g.its.forEach(x=>x.cats.forEach(c=>{ counts[c] = (counts[c]||0)+1; }));
      return `<div style="padding:12px 14px;border-top:1px solid var(--s75)">
        <div style="display:flex;align-items:baseline;gap:10px">
          <a href="14-review.html?due=${g.k}" style="font-size:13px;font-weight:700;color:${tone(g.k)};text-decoration:none">${g.l} · ${g.its.length}</a>
          <span style="font-size:11.5px;color:var(--i3)">${esc(dueLabel(g.its[0].due))}</span>
          <span style="margin-left:auto">${link(`14-review.html?due=${g.k}`, 'Open these →')}</span></div>
        <div class="tags" style="margin:7px 0 4px">${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<a class="tag ${c==='spot'?'tag-blue':c==='sensitive'?'tag-violet':'tag-amber'}" href="14-review.html?due=${g.k}&reason=${c}" style="text-decoration:none">${esc(REASON_CATS[c])} · ${n}</a>`).join('')}</div>
        ${g.its.slice(0,3).map(x=>`<a href="14-review.html?item=${encodeURIComponent(x.id)}" style="display:flex;gap:10px;align-items:center;padding:5px 0;text-decoration:none;color:inherit">
          <span style="flex:1;min-width:0;font-size:12px;color:var(--i1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b>${esc(x.who)}</b> · ${esc(x.account)} <span style="color:var(--i3)">· ${esc(x.action)}${mgr?` · ${esc(repName(x.owner))}`:''}</span></span>
          <span style="font-size:11px;color:var(--i3);white-space:nowrap">${esc(REASON_CATS[x.cats[0]])}</span><span style="color:var(--i3)">›</span></a>`).join('')}
        ${g.its.length>3 ? `<div style="padding-top:2px">${link(`14-review.html?due=${g.k}`, `+ ${g.its.length-3} more`)}</div>` : ''}
      </div>`; }).join('')}`;
  return box(`Waiting for your review · ${queue.length}`, link('14-review.html','Open the queue →'), body, 'review');
}

/* ─── Manager only: approvals at the very top, and the set-up and data card ─── */
function approvalsCard(approvals){
  if(!approvals.length) return '';
  return `<div class="panel" style="margin-bottom:16px;border-color:var(--brand-mid)"><div class="panel-hdr" style="background:var(--brand-lt)"><span class="panel-ttl" style="color:var(--brand-dk)">Waiting on you: ${pl(approvals.length,'approval')}</span>${link('14-review.html?view=approvals','Review them →')}</div><div class="panel-body" style="padding:0">
    <div style="padding:10px 14px;font-size:12px;color:var(--i2)">Reps accepted these messages, but they contain sensitive content, so nothing is released until you approve or send them back.</div>
    ${approvals.slice(0,5).map(x=>`<a href="14-review.html?item=${encodeURIComponent(x.id)}" style="display:flex;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--s75);text-decoration:none;color:inherit">
      <span style="flex:1;font-size:12.5px;color:var(--i1)"><b>${esc(x.who)}</b> · ${esc(x.account)} <span style="color:var(--i3)">· accepted by ${esc(repName(x.owner))} · ${esc(x.action)}</span></span><span class="tag tag-violet">Approval</span><span style="color:var(--i3)">›</span></a>`).join('')}
  </div></div>`;
}
function setupCard(lists, scorings, segs){
  const rd = RUNS.length ? readiness(RUNS) : [], ok = rd.filter(x=>x.ok).length, pend = DemandAI.brandPending();
  const row = (k, tag, href) => `<a href="${href}" style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--s75);text-decoration:none;color:inherit">
      <span style="flex:1;font-size:12.5px;color:var(--i1)">${k}</span>${tag}<span style="color:var(--i3);font-size:13px">›</span></a>`;
  return box('Set-up and data', link('09-setup.html','Setup →'),
    row('Configuration', `<span class="tag tag-green">${esc(DemandAI.configVersion().split(' · ')[0])}</span>`, '13-analytics.html?tab=validation') +
    row('Brand pack', `<span class="tag ${pend?'tag-amber':'tag-green'}">${esc(DemandAI.brandVersion())}${pend?' · draft waiting':''}</span>`, '07-content.html') +
    row('Data readiness', rd.length ? `<span class="tag ${ok===rd.length?'tag-green':'tag-amber'}">${ok} of ${rd.length} checks pass</span>` : '<span class="tag tag-grey">No data yet</span>', '13-analytics.html?tab=validation') +
    row('Saved lists', `<span class="tag tag-grey">${lists.length + scorings.length + segs.length} list${lists.length + scorings.length + segs.length===1?'':'s'}</span>`, '10-prospecting.html'));
}

/* ─── 4 · What the system did, from the latest run ─── */
function systemDid(scope){
  const latest = RUNS.slice().sort((a,b)=>b.saved.createdAt-a.saved.createdAt)[0];
  if(!latest) return '';
  const its = scope.filter(x=>x.run===latest), went = its.filter(x=>x.d.released==='auto'), need = its.filter(x=>x.d.released!=='auto');
  const accepted = need.filter(x=>x.d.status==='Released').length, rejected = need.filter(x=>['Closed','Set aside'].includes(x.d.status)).length;
  const waiting = need.filter(x=>inQueue(x.d) || x.d.status==='Awaiting approval').length;
  const big = (n, l, href, c) => `<a href="${href}" style="text-decoration:none;display:block;padding:12px 16px;border-right:1px solid var(--s75)"><div style="font-family:var(--fd);font-size:24px;font-weight:700;color:${c}">${n}</div><div style="font-size:11.5px;color:var(--i2)">${l} →</div></a>`;
  return box('What the system did', `<span style="font-size:11px;color:var(--i3)">Latest run: ${esc(latest.saved.name)} · ${ago(latest.saved.createdAt)}</span>`,
    `<div style="display:grid;grid-template-columns:repeat(4,1fr)">
      ${big(went.length, 'went ahead on their own', nbaLink(latest,'proceeded'), 'var(--pos)')}
      ${big(need.length, 'needed a person', nbaLink(latest,'waiting'), 'var(--ter-dk)')}
      ${big(accepted, 'of those accepted', '14-review.html?view=log', 'var(--i1)')}
      ${big(rejected, 'rejected or closed', '14-review.html?view=log', 'var(--i1)')}
    </div>
    <div style="padding:9px 14px;border-top:1px solid var(--s75);font-size:11.5px;color:var(--i3)">Went ahead = passed all four checks (segment size, confidence, sensitive content, claims) and was released to the rep. ${waiting ? `${waiting} of those that needed a person are still waiting.` : 'Everything that needed a person has been decided.'}</div>`);
}

/* ─── 7 · Work done: the funnel strip for the latest run ─── */
function workDone(scope){
  const latest = RUNS.slice().sort((a,b)=>b.saved.createdAt-a.saved.createdAt)[0];
  if(!latest) return '';
  const its = scope.filter(x=>x.run===latest), accts = new Set((latest.keys||[]).map(k=>k.split('|')[0])).size;
  const steps = [
    [ (latest.keys||[]).length, 'prospects read', nbaLink(latest) ],
    [ accts, 'accounts', nbaLink(latest) ],
    [ its.filter(x=>x.segment).length, 'in micro-segments', nbaLink(latest) ],
    [ its.length, 'recommendations', nbaLink(latest) ],
    [ its.filter(x=>x.d.released==='auto').length, 'went ahead', nbaLink(latest,'proceeded') ],
    [ its.filter(x=>x.d.released!=='auto').length, 'needed a person', nbaLink(latest,'waiting') ],
    [ its.filter(x=>x.d.status==='Released').length, 'released', nbaLink(latest) ],
    [ its.filter(x=>x.d.outcome).length, 'outcome marked', '#outcomes' ],
    [ its.filter(x=>x.d.outcome==='Meeting booked').length, 'meetings booked', nbaLink(latest,'meeting') ],
  ];
  return box('Work done', `<span style="font-size:11px;color:var(--i3)">${esc(latest.saved.name)} · ${link('13-analytics.html?tab=funnel','Full funnel →')}</span>`,
    `<div style="display:flex;overflow-x:auto">${steps.map(([n,l,h],i)=>`<a href="${h}" style="flex:1;min-width:92px;text-decoration:none;padding:12px 10px;text-align:center;border-left:${i?'1px solid var(--s75)':'none'}"><div style="font-family:var(--fd);font-size:20px;font-weight:700;color:var(--i1)">${n}</div><div style="font-size:11px;color:var(--i3);line-height:1.3">${l}</div></a>`).join('')}</div>`);
}

function gateStatus(m){
  const C = DemandAI.CONFIG, decided = m.pooled.n;
  const g2 = m.weighted===null ? null : Math.round(m.weighted), g1 = m.saved===null || !decided ? null : Math.round(m.saved);
  const enough = decided >= C.minDecisions;
  const tone = (v, t) => v===null || !enough ? 'var(--i3)' : v>=t ? 'var(--pos)' : 'var(--neg)';
  const word = (v, t) => v===null ? 'No decisions yet' : !enough ? `${decided} of ${C.minDecisions} decisions needed to judge` : v>=t ? `On track · target ${t}%` : `Below the ${t}% target`;
  return { g2, g1, g2Tone: tone(g2, C.g2Threshold), g1Tone: tone(g1, C.g1Threshold), g2Word: word(g2, C.g2Threshold), g1Word: word(g1, C.g1Threshold) };
}

/* ─── Side panel: blockers, and the getting-started guide ─── */

function render(){
  loadRuns(); SPOT = weeklySpotCheck(RUNS);
  const role = getRole(), mgr = isManager(), rep = role==='Sales rep', worker = mgr || rep;
  const items = allItems(), scope = items.filter(x=>x.mine && (mgr || x.owner===myEmail()));
  const queue = scope.filter(x=>x.queued).sort((a,b)=>a.due-b.due);
  const spots = queue.filter(x=>x.d.spot==='pending'), exceptions = queue.filter(x=>x.d.spot!=='pending');
  const approvals = mgr ? items.filter(x=>x.d.status==='Awaiting approval' && !x.paused) : [];
  const waitingMgr = rep ? scope.filter(x=>x.d.status==='Awaiting approval') : [];
  const ready = scope.filter(x=>x.d.status==='Released' && (!x.d.outcome || x.d.outcome==='Sent') && x.d.spot!=='pending').sort((a,b)=>(a.d.at||0)-(b.d.at||0));

  const dateLine = new Date().toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'});

  // 1 · Title first.

    <div class="topbar-r">${worker ? Copilot.button() : ''}<button class="btn btn-ghost btn-sm" title="How Today works" onclick="openGuide()" style="width:28px;height:28px;padding:0;justify-content:center;border-radius:50%;border:1px solid var(--bdk);font-weight:700;margin-right:4px">?</button></div></div>`;

      <a href="#" onclick="openGuide();return false" style="color:var(--brand);font-weight:600;text-decoration:none;margin-left:6px">How Today works</a></div></div>`;

  if(nothing){
    const step = (n, t, d, href, cta) => `<div class="panel" style="flex:1"><div class="panel-body">
        <div style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--brand)">STEP ${n}</div>
        <div style="font-family:var(--fd);font-size:15px;font-weight:700;color:var(--i1);margin:6px 0 4px">${t}</div>

        ${step(2, 'Score the accounts', 'Fit, intent and timing give each account a tier and a reason. Send the best to micro-segments.', '11-scoring.html', 'Go to Scoring →')}
        ${step(3, 'Plan the next step', 'Accounts are grouped by their reason to buy now, and each gets an action and a first message. Exceptions come to For Review.', '12-nba.html', 'Go to Micro-segments & NBA →')}
      </div></div>`;
    maybeGuide(); return;
  }

  // 2 · Blockers: a notification just above the tiles; the detail opens in the side panel.
  const notice = bl.length
    ? `<a href="#" onclick="openBlockers();return false" style="display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:14px;background:var(--neg-lt);border:1px solid #F0C9C9;border-radius:var(--rmd);text-decoration:none">
        <span style="width:9px;height:9px;border-radius:50%;background:var(--neg);flex-shrink:0"></span>
        <span style="flex:1;font-size:12.5px;color:var(--i1)"><b style="color:var(--neg)">${pl(bl.length,'blocker')}</b> stopping work: ${bl[0].title}${bl.length>1?` · and ${bl.length-1} more`:''}</span>
        <span style="font-size:12px;font-weight:700;color:var(--neg);white-space:nowrap">View and fix →</span></a>`
    : `<a href="#" onclick="openBlockers();return false" style="display:flex;align-items:center;gap:8px;padding:8px 14px;margin-bottom:14px;background:var(--pos-lt);border-radius:var(--rmd);text-decoration:none;font-size:12px;color:var(--pos);font-weight:600"><span style="width:8px;height:8px;border-radius:50%;background:var(--pos)"></span>No blockers. Your work is running.</a>`;

  // 3 · Tiles, each drills down to the items behind it.
  const stat = (lbl, val, sub, href, tone) => `<a class="stat stat-link" href="${href}" title="Open the items behind ${esc(lbl.toLowerCase())}">
    <div class="stat-lbl">${lbl}</div><div class="stat-val" style="${tone?`color:${tone}`:''}">${val}</div><div class="stat-sub">${sub}</div></a>`;
  const marked = scope.filter(x=>x.d.outcome && x.d.outcome!=='Sent'), positive = marked.filter(x=>['Replied','Meeting booked'].includes(x.d.outcome)).length;
  const outRate = marked.length ? Math.round(positive/marked.length*100) : null;
  const tiles = worker ? `<div class="stats" style="margin-bottom:18px;grid-template-columns:repeat(6,1fr)">
      ${stat('In For Review', queue.length, `${exceptions.length} exception${exceptions.length===1?'':'s'} · ${spots.length} spot-check${spots.length===1?'':'s'}`, '14-review.html', queue.length?'var(--ter-dk)':'')}
      ${mgr ? stat('Approvals', approvals.length, 'accepted by a rep, needs you', '14-review.html?view=approvals', approvals.length?'var(--brand)':'')
            : stat('With the sales manager', waitingMgr.length, 'sensitive content you accepted', nbaLink(latest,'waiting'))}
      ${stat('Awaiting outcome', ready.length, 'mark what happened', '#outcomes')}
      ${stat('Outcome rate', outRate===null?'—':outRate+'%', marked.length ? `${positive} replied or booked a meeting, of ${marked.length} with a result` : 'No results marked yet', '13-analytics.html?tab=loop', outRate===null?'':'var(--pos)')}
      ${stat('G2 acceptance', g.g2===null?'—':g.g2+'%', g.g2Word, '13-analytics.html?tab=gates', g.g2Tone)}
      ${stat('G1 effort saved', g.g1===null?'—':g.g1+'%', g.g1Word, '13-analytics.html?tab=gates', g.g1Tone)}

      ${stat('Recommendations', m.items, `${m.autoN} proceeded · ${m.excN} exceptions`, '13-analytics.html')}

      ${stat('G2 acceptance', g.g2===null?'—':g.g2+'%', g.g2Word, '13-analytics.html?tab=gates', g.g2Tone)}
      ${stat('G1 effort saved', g.g1===null?'—':g.g1+'%', g.g1Word, '13-analytics.html?tab=gates', g.g1Tone)}
    </div>`;

  // Waiting in For Review: earliest due first, with when each is due.
  const dueTone = t => { const b = dueBucket(t); return b==='overdue'||b==='today' ? 'var(--neg)' : b==='tomorrow' ? 'var(--warn)' : 'var(--i3)'; };

      `<span style="font-size:11px;font-weight:600;color:${dueTone(x.due)};white-space:nowrap">${esc(late ? 'Was due ' + dueDay(x.due) : dueLabel(x.due))}</span>${late?'<span class="tag tag-red">Overdue</span>':''}<span class="tag ${x.d.spot==='pending'?'tag-blue':'tag-amber'}">${esc(whyHere(x.d))}</span>`, `14-review.html?item=${encodeURIComponent(x.id)}`);

  const rRows = ready.slice(0,4).map(x=>`<div style="padding:10px 14px;border-bottom:1px solid var(--s75)">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:600;color:var(--i1)">${esc(x.who)} · ${esc(x.account)}</div>
        <div style="font-size:11px;color:var(--i3);margin-top:2px">${esc(x.action)} · ${esc(x.channel)} · released ${ago(x.d.at)}${x.d.outcome?` · marked ${esc(x.d.outcome)}`:''}</div></div>
        <a href="${nbaLink(x.run)}&rec=${encodeURIComponent(x.r.key)}" style="font-size:11.5px;color:var(--brand);font-weight:600;text-decoration:none;white-space:nowrap">Open the message →</a>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${OUTCOMES.map(o=>`<button class="tag ${x.d.outcome===o?'tag-violet':'tag-grey'}" style="cursor:pointer;border:none" onclick="markOutcome('${x.id}','${o}')">${o}</button>`).join('')}</div>

  // Right column: what the system did, spot-checks, gates, recent lists (and set-up for a manager).

  // Trust: how often people agreed with the system so far, overall and where it's strongest.
  function trustRow(){
    const all = trackRecord(), segs = Object.keys(SEG_MEANS).map(s=>[s, trackRecord(s)]).filter(([,r])=>r.n>=2).sort((a,b)=>b[1].pct-a[1].pct);
    return `<a href="13-analytics.html?tab=gates" style="display:block;padding:12px 16px;border-top:1px solid var(--s75);text-decoration:none">

      ${all.n ? `<div style="display:flex;align-items:baseline;gap:8px;margin-top:2px"><span style="font-family:var(--fd);font-size:20px;font-weight:700;color:var(--i1)">${all.pct}%</span><span style="font-size:11.5px;color:var(--i2)">${all.a} of ${all.n} first recommendations accepted</span></div>

        ${segs.length ? `<div style="font-size:11px;color:var(--i3);margin-top:3px">${segs.slice(0,3).map(([s,r])=>`${esc(s)} ${r.a} of ${r.n}`).join(' · ')}</div>` : ''}`
        : `<div style="font-size:11.5px;color:var(--i3);margin-top:3px">No decisions yet. It builds up as people accept or reject items.</div>`}</a>`;
  }
  const spotPanel = (() => {
    const picked = SPOT ? SPOT.picked : 0, total = SPOT && SPOT.reps ? (rep ? (SPOT.reps[myEmail()]||0) : picked) : 0;
    const done = spotDoneWeek, pct = total ? Math.round(done/total*100) : 0, fri = spots[0] ? dueLabel(spots[0].due) : '';
    const rows = spots.slice(0,3).map(x=>line(`${esc(x.who)} · ${esc(x.account)}`, `${esc(x.action)}${mgr?` · ${esc(repName(x.owner))}`:''}`,
      `<span class="tag tag-blue">Rate it</span>`, `14-review.html?item=${encodeURIComponent(x.id)}`)).join('');
    return box("This week's spot-checks", spots.length ? link('14-review.html?kind=spot', 'Rate them →') : '', `
      <div style="padding:14px 16px 12px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-family:var(--fd);font-size:22px;font-weight:700;color:var(--i1)">${done}<span style="color:var(--i3);font-size:15px"> / ${total}</span></span>
          <span style="font-size:12px;color:var(--i2)">rated</span>
          <span style="margin-left:auto" class="tag ${!total?'tag-grey':done>=total?'tag-green':'tag-amber'}">${!total?'None picked yet':done>=total?'All done':`${total-done} to rate · ${esc(fri.replace(/^By /,'by '))}`}</span>
        </div>
        <div class="progress-track" style="height:6px;background:var(--s100);border-radius:99px;margin-top:10px;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--pos);border-radius:99px"></div></div>
      </div>
      ${rows}`);
  })();
  const gatePanel = box('Success gates', link('13-analytics.html?tab=gates', 'Analytics →'), `<div style="padding:12px 14px">
      ${[['G2 · first-pass acceptance', g.g2, g.g2Tone, g.g2Word, m.weighted!==null ? `${m.pooled.a} of ${m.pooled.n} accepted on first pass, weighted across both paths` : 'Decide in For Review to start the count'],
         ['G1 · less review effort', g.g1, g.g1Tone, g.g1Word, m.minutes!==null && g.g1!==null ? `${Math.round(m.minutes*10)/10} min per usable first action against ${m.base} min before` : 'Needs decisions to measure']]
        .map(([t, v, tone, w, d])=>`<a href="13-analytics.html?tab=gates" style="display:block;text-decoration:none;padding:8px 0;border-bottom:1px solid var(--s75)">
          <div style="display:flex;align-items:baseline;gap:10px"><span style="flex:1;font-size:12.5px;font-weight:600;color:var(--i1)">${t}</span>
          <span style="font-family:var(--fd);font-size:18px;font-weight:700;color:${tone}">${v===null?'—':v+'%'}</span></div>
          <div style="font-size:11px;color:${tone};margin-top:2px">${esc(w)}</div><div style="font-size:11px;color:var(--i3);margin-top:2px">${esc(d)}</div></a>`).join('')}
      </div>`);
  const recent = [
    ...lists.map(l=>({ at:l.createdAt, kind:'Prospect list', name:l.name, sub:`${(l.stats&&l.stats.accounts)||(l.accounts||[]).length} accounts`, href:`11-scoring.html?list=${encodeURIComponent(l.id)}` })),
    ...scorings.map(r=>({ at:r.createdAt, kind:'Scored list', name:r.name, sub:`${(r.stats&&r.stats.scored)||0} scored · ${(r.stats&&r.stats.A)||0} tier A`, href:`11-scoring.html?run=${encodeURIComponent(r.id)}` })),
    ...segs.map(s=>({ at:s.createdAt, kind:'Micro-segments', name:s.name, sub:`${(s.stats&&s.stats.segments)||0} micro-segments · ${(s.stats&&s.stats.prospects)||0} recommendations`, href:`12-nba.html?run=${encodeURIComponent(s.id)}` })),
  ].sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,4);
  const KIND_TONE = {'Prospect list':'tag-grey', 'Scored list':'tag-blue', 'Micro-segments':'tag-violet'};
  const recentPanel = box('Recent lists', '', recent.map(x=>line(esc(x.name), `${x.sub} · ${x.at?fmtDate(x.at):''}`, `<span class="tag ${KIND_TONE[x.kind]}">${x.kind}</span>`, x.href)).join('') || empty('No lists yet.'));

  const left = worker ? [
      box('Waiting in For Review', queue.length ? link(`14-review.html?item=${encodeURIComponent(queue[0].id)}`, `Start reviewing (${queue.length}) →`) : '', queue.length ? qRows + (queue.length>5 ? `<div style="padding:8px 14px">${link('14-review.html', `+ ${queue.length-5} more, earliest due first`)}</div>` : '') : empty('Nothing is waiting for your review.')),
      mgr ? box('Approvals', approvals.length ? link('14-review.html?view=approvals', 'Review them →') : '', aRows || empty('No sensitive items waiting for your approval.')) : '',
      box('Awaiting your outcome update', ready.length ? `<span style="font-size:11px;color:var(--i3)">${ready.length} · oldest first</span>` : '', (rRows || empty('Nothing released is waiting for an outcome.')) +
        '', 'outcomes'),
    ].join('') : recentPanel;
  const right = worker ? didPanel + spotPanel + gatePanel + (mgr ? setupCard(lists, scorings, segs) : '') + recentPanel : gatePanel;

  document.getElementById('mainArea').innerHTML = head + `<div class="canvas" style="padding:20px 28px 48px">${hello}${notice}${tiles}
    <div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start">
      <div>${left}</div><div>${right}</div>
    </div></div>`;
  maybeGuide();
}
// First visit: open the guide in the side panel once.
function maybeGuide(){ let seen = false; try{ seen = localStorage.getItem(GUIDE_KEY)==='closed'; }catch(e){} if(!seen) openGuide(); }

// Mark what happened with a released action, without leaving Today.
function markOutcome(id, o){
  const x = allItems().find(i=>i.id===id); if(!x) return;
  withRun(x.run, ()=>outcome(x.r.key, o));
  render();
}
const PAGE_ID = '00-today.html';
setTimeout(()=>{
  const _setRole = setRole; setRole = function(r){ _setRole(r); render(); reviewBadge(); };
  render(); reviewBadge();
}, 0);

/* ═══════════════ ROLE ENGINE — shared across every screen ═══════════════ */
const ALL_ROLES = ['Admin','Sales manager','Sales rep','Viewer','Platform admin'];
const ROLE_PERSON = {
  'Admin':'Rajiv Nair', 'Sales manager':'Pavan Kumar', 'Sales rep':'Sofia Ahlgren',
  'Viewer':'Elena Vogel', 'Platform admin':'Shantanu Rao'
};
const ROLE_NAV_ALLOWED = {
  'Admin': ['00-today.html','14-review.html','09-setup.html','07-content.html','08-users.html','10-prospecting.html','11-scoring.html','12-nba.html','15-content-studio.html','13-analytics.html'],
  'Sales manager': ['00-today.html','14-review.html','10-prospecting.html','11-scoring.html','12-nba.html','15-content-studio.html','07-content.html','13-analytics.html','09-setup.html','08-users.html'],
  'Sales rep': ['00-today.html','14-review.html','10-prospecting.html','11-scoring.html','12-nba.html','15-content-studio.html','07-content.html','13-analytics.html'],
  'Viewer': ['13-analytics.html'],
  'Platform admin': [],
};
function getThisPageId(){
  if(typeof PAGE_ID !== 'undefined') return PAGE_ID;
  try { return location.pathname.split('/').pop(); } catch(e){ return ''; }
}
function getRole(){
  try { return localStorage.getItem('demandai_role') || 'Sales manager'; }
  catch(e){ return 'Sales manager'; }
}
function setRole(role){
  try { localStorage.setItem('demandai_role', role); } catch(e){}
  const ov = document.getElementById('roleModalOverlay');
  if(ov) ov.style.display = 'none';
  applyRoleToNav();
}
function applyRoleToNav(){
  const role = getRole();
  const allowed = ROLE_NAV_ALLOWED[role] || [];
  document.querySelectorAll('.nav-item').forEach(a=>{
    const href = (a.getAttribute('href')||'').split('?')[0];
    a.style.display = allowed.includes(href) ? '' : 'none';
  });
  const unEl = document.querySelector('.nav-un');
  const urEl = document.querySelector('.nav-ur');
  const avEl = document.querySelector('.nav-av');
  if(unEl) unEl.textContent = ROLE_PERSON[role];
  if(urEl) urEl.textContent = role;
  if(avEl) avEl.textContent = ROLE_PERSON[role].split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  const thisPage = getThisPageId();
  const pageIsKnown = Object.values(ROLE_NAV_ALLOWED).some(list => list.includes(thisPage));
  if(!pageIsKnown){ return; } // can't verify this page's id reliably here — don't block access on a guess
  if(!allowed.includes(thisPage)){
    const main = document.querySelector('.main') || document.getElementById('mainArea');
    const PAGE_NAMES = {'00-today.html':'Today','09-setup.html':'Setup','07-content.html':'Content library','08-users.html':'Users and roles','10-prospecting.html':'Prospecting','11-scoring.html':'Account Scoring','12-nba.html':'Next Best Action','13-analytics.html':'Analytics','14-review.html':'Review','15-content-studio.html':'Content studio'};
    const firstAllowedHref = allowed[0] || '00-today.html';
    if(main) main.innerHTML = `
      <div class="topbar"><div class="topbar-l"><span class="tb-title">No access</span></div></div>
      <div class="canvas" style="display:flex;align-items:center;justify-content:center;min-height:70vh">
        <div style="text-align:center;max-width:360px">
          <div style="font-size:28px;margin-bottom:10px">🔒</div>
          <div style="font-family:var(--fd);font-size:15px;font-weight:700;color:var(--i1);margin-bottom:6px">Not available for this role</div>
          <div style="font-size:12px;color:var(--i3);line-height:1.6">${role} doesn't have access to this screen. Switch role from the sidebar, or use the menu to go to <a href="${firstAllowedHref}" style="color:var(--brand)">${PAGE_NAMES[firstAllowedHref]||firstAllowedHref}</a>.</div>
        </div>
      </div>`;
  }
}
function renderRoleSwitcher(){
  const foot = document.querySelector('.nav-foot');
  if(!foot || document.getElementById('roleSwitchBtn')) return;
  const btn = document.createElement('div');
  btn.id = 'roleSwitchBtn';
  btn.style.cssText = 'padding:8px 10px 0;cursor:pointer;';
  btn.innerHTML = `<div style="font-size:10px;color:var(--r3);text-decoration:underline;text-align:center">Switch role (demo)</div>`;
  btn.onclick = openRoleModal;
  foot.appendChild(btn);
}
function openRoleModal(){
  let ov = document.getElementById('roleModalOverlay');
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'roleModalOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(20,26,33,.45);z-index:700;display:flex;align-items:center;justify-content:center;';
    ov.onclick = (e)=>{ if(e.target===ov) ov.style.display='none'; };
    document.body.appendChild(ov);
  }
  const current = getRole();
  ov.innerHTML = `<div style="background:var(--surf);border-radius:var(--rlg);box-shadow:var(--sh-lg);width:360px;padding:20px;" onclick="event.stopPropagation()">
    <div style="font-family:var(--fd);font-size:14px;font-weight:700;color:var(--i1);margin-bottom:4px">Preview as a role</div>
    <div style="font-size:11px;color:var(--i3);margin-bottom:14px">Changes what you see, matching what that role actually has access to. If this screen isn't available for the new role, use the sidebar to go to one that is.</div>
    ${ALL_ROLES.map(r=>`<div onclick="setRole('${r}')" style="padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;background:${r===current?'var(--brand-lt)':'transparent'};display:flex;align-items:center;justify-content:space-between">
      <div><div style="font-size:12.5px;font-weight:600;color:var(--i1)">${r}</div><div style="font-size:10.5px;color:var(--i3)">${ROLE_PERSON[r]}</div></div>
      ${r===current?'<span style="color:var(--brand)">✓</span>':''}
    </div>`).join('')}
    <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;margin-top:10px" onclick="document.getElementById('roleModalOverlay').style.display='none'">Close</button>
  </div>`;
  ov.style.display = 'flex';
}
document.addEventListener('DOMContentLoaded', function(){ applyRoleToNav(); renderRoleSwitcher(); });
if(document.readyState !== 'loading'){ applyRoleToNav(); renderRoleSwitcher(); }


</script>
