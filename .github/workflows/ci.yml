name: CI

on:
  pull_request:
  push:
    branches: [main, 'remediation/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the dependency-age check compares with the base branch's lockfile; gitleaks reads every commit

      # gitleaks' own image, pinned by digest (v8.30.1). Every commit is scanned; values are redacted in the output.
      # Known false positives are allowlisted, with reasons, in .gitleaks.toml.
      - name: Secret scan of the whole history (gitleaks)
        run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/repo:ro
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (exactly the lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, repository and answer-key tests
        run: npm test
        env:
          # Optional repository secret: lets the hygiene test check that no tracked file names the Client.
          CLIENT_NAME_PATTERN: ${{ secrets.CLIENT_NAME_PATTERN }}

      - name: Legacy engine tests
        run: npm run test:legacy

      # Built with known dummy secrets, then the output is searched for them (prompt §9 item 8): the same values in
      # both steps. None is real; nothing connects to the database during a build.
      - name: Build (with dummy secrets)
        run: npm run build
        env:
          SESSION_SECRET: ci-dummy-session-secret-0123456789abcdef
          AZURE_OPENAI_API_KEY: ci-dummy-azure-openai-key-0123456789
          NOTIFICATION_APP_PASSWORD: ci-dummy-smtp-app-password
          DATABASE_URL: postgresql://demandai_app:ci-dummy-app-db-password@127.0.0.1:1/demandai
          DATABASE_MIGRATION_URL: postgresql://demandai_owner:ci-dummy-owner-db-password@127.0.0.1:1/demandai
          DATABASE_OPS_URL: postgresql://demandai_ops:ci-dummy-ops-db-password@127.0.0.1:1/demandai

      - name: No secret in the build output (browser bundle, server output, standalone)
        run: npm run check:bundle
        env:
          SESSION_SECRET: ci-dummy-session-secret-0123456789abcdef
          AZURE_OPENAI_API_KEY: ci-dummy-azure-openai-key-0123456789
          NOTIFICATION_APP_PASSWORD: ci-dummy-smtp-app-password
          DATABASE_URL: postgresql://demandai_app:ci-dummy-app-db-password@127.0.0.1:1/demandai
          DATABASE_MIGRATION_URL: postgresql://demandai_owner:ci-dummy-owner-db-password@127.0.0.1:1/demandai
          DATABASE_OPS_URL: postgresql://demandai_ops:ci-dummy-ops-db-password@127.0.0.1:1/demandai

      - name: Deployment files are valid (Kubernetes overlay with kubeconform, Compose stacks for EC2)
        run: deploy/check.sh

      - name: Dependency audit gate (no high or critical in production dependencies)
        run: npm run audit:gate

      - name: Dependency age (no version younger than one day, D-31)
        run: node scripts/check-dependency-age.mjs --base "origin/${{ github.base_ref || 'main' }}"

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Same image and digest as compose.yaml and compose.test.yaml.
        image: postgres:16.15-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: demandai-test-only
          POSTGRES_DB: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:demandai-test-only@127.0.0.1:55433/postgres
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (exactly the lockfile)
        run: npm ci

      - name: PostgreSQL client tools (psql, pg_dump, pg_restore)
        run: psql --version && pg_dump --version && pg_restore --version

      - name: Integration tests (migrations, row-level security, append-only, jobs, readiness, seed, backup and restore)
        run: npm run test:integration

      - name: Build (production bundle for the HTTP tests)
        run: npm run build

      - name: HTTP tests on the standalone server (route inventory, role x route matrix, CSRF, sign-in, pages)
        run: npm run test:http

  # The image that ships, run as the Compose stack (db -> backup -> migrate -> app) from environment variables only:
  # the container smoke test (/api/ready 200, no env file in the image), then the end-to-end, accessibility and
  # performance tests (Playwright, Chromium) on it (plan §9 gates 7 and 11).
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (exactly the lockfile)
        run: npm ci

      - name: Docker build
        run: docker build --build-arg APP_BUILD_VERSION="${GITHUB_SHA::7}" -t demandai-app:e2e .

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromium for Playwright (headless shell) and its system libraries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: System libraries for the cached browser
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Compose stack from environment variables only, and the container smoke test
        run: e2e/compose.sh up
        env:
          DEMANDAI_IMAGE: demandai-app:e2e

      - name: End-to-end, accessibility and performance tests on the Compose stack
        run: E2E_PLATFORM_LINK="$(cat e2e/.state/platform-link)" npx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:3100

      - name: Stack logs
        if: failure()
        run: e2e/compose.sh logs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Remove the stack
        if: always()
        run: e2e/compose.sh down

