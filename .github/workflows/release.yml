name: Release image

# Builds the image that ships and pushes it to GitHub Container Registry when a version tag (v1.2.3) is pushed, or when
# someone starts it by hand. Nothing is deployed: DevOps pins the digest it prints in the deployment
# (docs/devops/REDEPLOY.md). Tag only a commit whose CI is green. For Amazon ECR, copy the image across by digest
# (docs/devops/REDEPLOY.md) or swap the push step.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build (the version is the tag, or the commit for a manual run)
        run: |
          version="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="sha-${GITHUB_SHA::7}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/demandai-app"
          docker build --build-arg APP_BUILD_VERSION="$version" -t "$image:$version" -t "$image:sha-${GITHUB_SHA::7}" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: The image holds no env file and reports its version
        run: |
          if docker run --rm --entrypoint sh "$IMAGE:$VERSION" -c 'ls -A /app | grep -q "^\.env"'; then echo "env file in the image" >&2; exit 1; fi
          docker run --rm --entrypoint node "$IMAGE:$VERSION" -e 'if (process.env.APP_BUILD_VERSION !== process.argv[1]) process.exit(1)' "$VERSION"

      - name: Push, and print the digest to pin
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "Pushed $digest"
          echo "### Release $VERSION: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
