      </tr>`;})).join(''),
    view==='queue' ? 'Nothing needs you right now.' : view==='approvals' ? 'No sensitive items waiting for approval.' : 'Nothing released yet.');
}

/* ═══════════════ THE WORKSPACE: one item, the whole screen, everything needed to decide ═══════════════
   L1 · Why it needs you and the call to make (top). L2 · The action and the exact message that would go out, the
   contact, and the facts that back it (one screen, no scroll at 1440×900). L3 · Show the working, on demand.
   The decision bar stays put. Corrections are captured to teach the system. */
let WS = null, WS_LIST = [];
function openItem(id){
  const it = items().find(x=>x.id===id); if(!it) return;
  closeDrawer(); document.querySelectorAll('.col-menu').forEach(m=>m.remove());
  if(!WS_LIST.includes(id)){ const q = myQueue().filter(x=>!onHold(decOf(x))).map(x=>x.id); WS_LIST = q.includes(id) ? q : [id]; }
  RUN = it.run; openedAt = Date.now(); pickTags = new Set(); pickCode = null;
  WS = { id, key: it.r.key, run: it.run, from: view, teach: '', asked: [] };
  renderWs();
}
function wsItem(){ return WS && items().find(x=>x.id===WS.id); }
function wsMode(d){ return inQueue(d) ? 'decide' : d.status==='Awaiting approval' ? 'approve' : 'view'; }
function wsGo(step){
  const i = WS_LIST.indexOf(WS.id), j = i + step;
  if(j < 0 || j >= WS_LIST.length) return;
  saveTeach(); openItem(WS_LIST[j]);
}
function leaveWs(){ saveTeach(); WS = null; closeDrawer(); render(); }
function saveTeach(){ const t = document.getElementById('wsTeach'); if(WS && t) WS.teach = t.value; }
const hasNext = () => myQueue().some(it=>!onHold(decOf(it)));
function nextItem(){
  const f = filtered(myQueue()).filter(it=>!onHold(decOf(it))), w = f.length ? f : myQueue().filter(it=>!onHold(decOf(it)));
  if(!w.length){ WS = null; showToast('Your queue is clear'); render(); return; }
  WS_LIST = w.map(it=>it.id); openItem(w[0].id);
}
// After any change: stay on the item while it still needs this reviewer in the same way, otherwise go to the next one.
function onDecision(){
  if(!WS){ render(); return; }
  const it = wsItem(); if(!it){ leaveWs(); return; }
  RUN = it.run; const d = dec(it.r.key), decided = WS.decided; WS.decided = false;
  if(decided && WS.mode==='decide' && inQueue(d) && !onHold(d)){ renderWs(); showToast('An alternative came back: it is the next thing to decide'); return; }
  if(!decided && wsMode(d)===WS.mode){ renderWs(); return; }
  const mode = WS.mode, i = WS_LIST.indexOf(WS.id);
  const rest = WS_LIST.filter(id=>{ if(id===WS.id) return false; const x = items().find(y=>y.id===id); if(!x) return false; const dd = decOf(x); return mode==='approve' ? dd.status==='Awaiting approval' : inQueue(dd) && !onHold(dd); });
  const nextId = rest.find(id=>WS_LIST.indexOf(id) > i) || rest[0];
  if(nextId){ WS_LIST = WS_LIST.filter(id=>id===nextId || rest.includes(id)); openItem(nextId); }
  else { WS = null; render(); showToast(mode==='approve' ? 'No more approvals waiting' : 'Done: nothing else in this list needs you right now'); }
}
// Content added in the message box re-draws the workspace, not the side panel.
function wsReopen(key){ if(WS && WS.key===key){ renderWs(); return true; } return false; }

function renderWs(){
  const it = wsItem(); if(!it){ leaveWs(); return; }
  RUN = it.run;
  const r = it.r, key = r.key, d = dec(key), lr = liveRec(r), c = lr.contact, x = draftOf(r), s = stuck(r, d), tone = CAT_TONE[s.cat];
  const mode = wsMode(d), live = mode==='decide' && mine(r) && !pausedInfo(r), canEdit = live || (mode==='approve' && isManager());
  WS.mode = mode; WS.decided = false;
  const i = WS_LIST.indexOf(WS.id), n = WS_LIST.length;
  const seg = segOf(r), segN = seg ? segAccounts(seg) : 0, tr = seg ? trackRecord(seg) : trackRecord();
  const fromLbl = { queue: isManager() ? 'Queue' : 'My queue', approvals: 'Approvals', released: 'Released', log: 'Decision log' }[WS.from] || 'Queue';
  const noReach = s.missing==='A way to reach the contact';

  // 1 · Why it needs you
  const due = (()=>{ const t = dueOf(r, d), b = dueBucket(t); return `<span class="tag ${b==='overdue'||b==='today'?'tag-red':b==='tomorrow'?'tag-amber':'tag-grey'}">${esc(dueLabel(t))}</span>`; })();
  const hero = mode==='view'
    ? `<div class="ws-hero t-pos"><div class="ws-hero-tags">${statusPill(d, r)}</div><div class="ws-hero-line">Nothing to decide: ${esc(statusLabel(d, r)[0].toLowerCase())}${d.by?` by ${esc(d.by)}`:''}.</div></div>`
    : `<div class="ws-hero t-${mode==='approve'?'neg':tone}">
        <div class="ws-hero-tags">${mode==='approve' ? '<span class="tag tag-violet">Approval</span><span class="tag tag-red">Sensitive content</span>' : `<span class="tag ${toneTag(tone)}">${esc(s.label)}</span>`}${s.also.map(a=>`<span class="tag tag-grey">Also: ${esc(a)}</span>`).join('')}${due}${onHold(d)?`<span class="tag tag-grey">On hold: ${esc(d.hold.why)}</span>`:''}</div>
        <div class="ws-hero-line">${esc(s.line)}</div>
        <div class="ws-hero-call">${mode==='approve' ? `Your call: approve it, edit it first, send it back to ${esc(repName(ownerOf(r)).split(' ')[0])}, or reject it.` : `Your call: ${esc(s.call)}`}</div>
        ${s.missing && mode==='decide' ? `<div class="ws-missing"><b>Missing:</b> ${esc(s.missing)}. ${s.missing==='A micro-segment' ? `<select id="assignSeg" ${live?'':'disabled'}><option value="">Pick a micro-segment…</option>${segChoices().map(nm=>`<option ${(d.assignedSeg||r.prominent)===nm?'selected':''}>${esc(nm)}</option>`).join('')}</select> <span class="ws-sub">Suggested: ${esc(r.prominent||'')}, its strongest signal.</span>` : 'If the data is on its way, put it on hold.'}</div>` : ''}
        <div class="ws-impact">${seg ? `<b>${segN}</b> account${segN===1?'':'s'} in <b>${esc(seg)}</b> get this same action.${tr.n?` Reps agreed with the system ${tr.a} of ${tr.n} times there.`:''}` : `Only ${esc(r.account.name)}: it has no micro-segment yet.`}</div>
      </div>`;

  // 2 · Pick the action: recommended, runner-up, or your own. All three are in view.
  const opt = (kind, title, action, why, f, chosen, click) => `<div class="opt ${chosen?'on':''} ${click&&!chosen?'pickable':''}" ${click&&!chosen?`onclick="${click}"`:''}>
      <div class="opt-h"><span>${title}</span>${chosen ? '<span class="opt-ck">✓ Chosen</span>' : click ? '<span class="opt-use">Use this</span>' : ''}</div>
      <div class="opt-a">${esc(action)}</div><div class="opt-w">${esc(why)}</div>
      ${f ? `<div class="opt-m"><span>${esc(f.channel)}</span><span class="tag ${f.conf==='High'?'tag-green':f.conf==='Medium'?'tag-amber':'tag-red'}">${esc(f.conf)} confidence</span>${f.ok?'<span class="tag tag-green">✓ Checks</span>':`<span class="tag tag-red">✗ ${esc(f.flags[0]||'Check')}</span>`}</div>` : ''}</div>`;
  const A = optionFacts(r, r.action), B = r.runnerUp ? optionFacts(r, r.runnerUp.action) : null;
  const can = live || (mode==='approve' && isManager());
  const options = `<div class="ws-sec-h">Pick the action</div><div class="opts">
      ${opt('rec', 'Recommended', r.action, r.reason, A, !d.manual && !d.useRunner, can ? `wsPick('rec')` : '')}
      ${r.runnerUp ? opt('run', 'Runner-up', r.runnerUp.action, r.runnerUp.reason, B, !d.manual && d.useRunner, can ? `wsPick('run')` : '') : '<div class="opt opt-none"><div class="opt-h"><span>Runner-up</span></div><div class="opt-w">No runner-up for this one.</div></div>'}
      <div class="opt opt-own ${d.manual?'on':''} ${can&&!d.manual?'pickable':''}" ${can&&!d.manual&&!WS.own?`onclick="wsOwn()"`:''}>
        <div class="opt-h"><span>✎ Write my own</span>${d.manual ? '<span class="opt-ck">✓ Chosen</span>' : ''}</div>
        ${d.manual ? `<div class="opt-a">${esc(d.manual)}</div><div class="opt-w">Your action. The message below was redrafted for it.</div>`
          : WS.own ? `<input id="manualAct" class="ws-in" placeholder="e.g. Invite them to the site visit in May" onkeydown="if(event.key==='Enter')wsUseOwn()"><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();wsUseOwn()">Use my action</button><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();WS.own=false;renderWs()">Cancel</button></div>`
          : `<div class="opt-w">Neither fits? Write the action you would take. You can also just edit the message below.</div>`}
      </div></div>`;

  // 3 · Who it goes to, and the exact message
  const ro = canEdit ? '' : 'readonly';
  const fieldsHtml = x.channel==='Email'
    ? `<label class="ws-lbl">Subject</label><input id="dSubj" class="ws-in" value="${esc(x.subject)}" ${ro} oninput="wsLiveCheck()">
       <label class="ws-lbl">Message <span id="wsWords">${x.body.split(/\s+/).filter(Boolean).length} words</span></label><textarea id="dBody" class="ws-in ws-body" ${ro} oninput="wsLiveCheck()">${esc(x.body)}</textarea>`
    : x.channel==='LinkedIn'
    ? `<label class="ws-lbl">Connection note, the only message <span id="wsWords">${x.note.length}/200</span></label><textarea id="dNote" class="ws-in" style="min-height:96px" ${ro} oninput="wsLiveCheck()">${esc(x.note)}</textarea>`
    : `<label class="ws-lbl">Task</label><textarea id="dTask" class="ws-in" ${ro}>${esc(x.task||'')}</textarea>`;
  const reach = x.channel==='Email'
    ? (c.email ? `<span class="wp-mail">✉ ${esc(c.email)}</span>${c.emailVerified ? '<span class="tag tag-green">Verified</span>' : '<span class="tag tag-amber">Not verified</span>'}` : '<span class="tag tag-red">No email on file</span>')
    : x.channel==='LinkedIn' ? '<span class="wp-mail">in LinkedIn connection note</span>' : '<span class="wp-mail">A task for the team</span>';
  const person = `<div class="ws-person">
      <div class="co-av wp-av" style="background:${avColor(c.name)}">${initials(c.name)}</div>
      <div class="wp-who"><div class="wp-name">${esc(c.name)}</div><div class="wp-title">${esc(c.jobTitle||'')}</div>
        <div class="wp-chips">${c.persona?`<span class="tag tag-violet">${esc(c.persona)} persona</span>`:''}<span class="tag tag-grey">${esc(r.account.name)}</span></div></div>
      <div class="wp-reach"><div class="wp-row">${reach}</div><div class="ws-sub">${esc(x.channel==='Task' ? 'No message goes out' : x.unreachable ? 'No way to reach them yet' : c.linkedin && x.channel==='Email' ? 'By email · LinkedIn as the fallback' : 'By ' + x.channel)}</div></div>
    </div>`;
  const msgBlock = `<div class="ws-card ws-msg">
      <div class="ws-card-h"><span>What goes out</span><span class="ws-sub">${canEdit ? 'Edit it here; your edit is saved when you approve.' : 'Read only'}</span></div>
      ${person}
      ${typeof ContentLink!=='undefined' && (x.channel==='Email'||x.channel==='LinkedIn') ? ContentLink.messageBar(key, d.content, x.channel, canEdit) : ''}
      ${fieldsHtml}
      <div class="ws-checks" id="wsChecks"></div>
      ${x.channel==='Email' ? `<div class="ws-soon-row">${soon('✉ Send from DemandAI', 'Sends from the rep\'s mailbox. In the pilot you copy the message and send it yourself')}${soon('⏱ Schedule', 'Sends at the best time for this contact')}</div>` : x.channel==='LinkedIn' ? `<div class="ws-soon-row">${soon('🔗 Send the connection request', 'Sends through the rep\'s LinkedIn. In the pilot you copy the note')}</div>` : ''}
    </div>`;
  const facts = `<div class="ws-card ws-facts">${factsCard()}</div>`;

  // 4 · The bottom: ask Copilot, and decide
  if(!WS.chat || WS.chatFor!==WS.id){ WS.chat = []; WS.chatFor = WS.id; WS.sheet = false; }
  const sensitive = isSensitive(draftOf(r));
  const approveLbl = mode==='approve' ? 'Approve' : d.spot==='pending' ? 'Approve' : sensitive && !isManager() ? 'Approve, send to manager' : 'Approve';
  const buttons = mode==='approve' ? (isManager() ? `<button class="btn btn-sec" onclick="openSendBack('${key}')">Send back</button><button class="btn btn-sec" onclick="openReject('${key}')">Reject <kbd>R</kbd></button><button class="btn btn-primary" onclick="wsApprove('${key}')">${approveLbl} <kbd>A</kbd></button>` : '<span class="ws-sub">Waiting for the sales manager.</span>')
    : mode==='view' ? `<button class="btn btn-sec" onclick="leaveWs()">Back to the list</button>`
    : !live ? `<span class="ws-sub">${pausedInfo(r) ? 'Its micro-segment is paused.' : `In ${esc(repName(ownerOf(r)))}'s queue.`}</span>`
    : `${onHold(d) ? `<button class="btn btn-ghost" onclick="takeOffHold('${key}')">Take off hold</button>` : `<button class="btn ${noReach?'btn-primary':'btn-ghost'}" onclick="openHold('${key}')">Put on hold</button>`}
       <button class="btn btn-sec" onclick="openReject('${key}')">Reject <kbd>R</kbd></button>
       ${noReach ? '' : `<button class="btn btn-primary" onclick="wsAccept('${key}')">${approveLbl} <kbd>A</kbd></button>`}`;
  const dockH = `<div class="cp-dock ws-dock">
      <div class="cp-sheet" id="wsSheet" style="display:${WS.sheet?'flex':'none'}"><div class="cp-sheet-h">✦ Copilot <span>about ${esc(c.name)} · ${esc(r.account.name)} · answers only</span><button onclick="wsSheet(false)">⌄ Hide</button></div>
        <div class="cp-sheet-b" id="wsCp"><div id="wsCpStack">${chatHtml()}</div></div>
        <div class="ws-cp-qs" id="wsCpQs">${chipsHtml(r, s)}</div></div>
      <div class="ws-dock-row">
        <form class="cp-bar" onsubmit="cpAsk(document.getElementById('wsQ').value);return false"><span class="cp-spark">✦</span><input id="wsQ" autocomplete="off" placeholder="Ask Copilot about ${esc(r.account.name)}… (press / )" onfocus="wsSheet(true)"><button class="cp-send" type="submit" aria-label="Send">↑</button></form>
        <div class="ws-dec">${buttons}</div>
      </div></div>`;

  document.getElementById('mainArea').innerHTML = `
    <div class="topbar">
      <div class="topbar-l"><nav class="ws-crumb"><a href="#" onclick="leaveWs();return false">For Review</a><span>›</span><a href="#" onclick="leaveWs();return false">${esc(fromLbl)}</a><span>›</span><b>${esc(c.name)} · ${esc(r.account.name)}</b></nav></div>
      <div class="topbar-r">
        <span class="ws-sub">${n>1 ? `${i+1} of ${n} · ← → to move` : ''}</span>
        <button class="btn btn-sec btn-sm" ${i<=0?'disabled':''} onclick="wsGo(-1)" title="Previous (←)">‹</button>
        <button class="btn btn-sec btn-sm" ${i>=n-1?'disabled':''} onclick="wsGo(1)" title="Next (→)">›</button>
        <button class="btn btn-ghost btn-sm" onclick="leaveWs()" title="Back to the list (Esc)">✕ Close</button>
      </div>
    </div>
    <div class="ws">
      <div class="ws-scroll">
        ${hero}
        <div class="ws-grid">
          <div class="ws-col">${mode==='view' ? '' : options}${msgBlock}</div>
          <div class="ws-col">${facts}</div>
        </div>
      </div>
      ${dockH}
    </div>`;
  wsLiveCheck();
  if(WS.sheet){ const b = document.getElementById('wsCp'); if(b) b.scrollTop = b.scrollHeight; }
  if(WS.own){ const m = document.getElementById('manualAct'); if(m) m.focus(); }
}
function wsSheet(on){ WS.sheet = on; const sh = document.getElementById('wsSheet'); if(!sh) return; sh.style.display = on ? 'flex' : 'none';
  if(on){ const b = document.getElementById('wsCp'); if(!WS.chat.length) document.getElementById('wsCpStack').innerHTML = '<div class="cp-p" style="color:var(--i2)">Ask me anything about this account, or pick a question below.</div>'; b.scrollTop = b.scrollHeight; } }
function wsPick(which){
  const it = wsItem(); RUN = it.run; const key = it.r.key, d = dec(key);
  if(which==='rec' && d.manual){ change(key, 'Back to the recommended action', ()=>setDec(key, {manual:null, useRunner:false, draft:null, edited:false})); persist(); refresh(); return; }
  if(which==='run' && d.manual){ change(key, 'Switched to the runner-up', ()=>setDec(key, {manual:null, useRunner:true, draft:null, edited:false})); persist(); refresh(); return; }
  if((which==='run') !== !!d.useRunner) swapAction(key);
}
function wsOwn(){ WS.own = true; renderWs(); }
function wsUseOwn(){ WS.own = false; addManual(wsItem().r.key); }

/* Teach the system: a short card after each decision. Optional, it goes away on its own, and it is
   logged against the item just decided (the workspace has already moved on). */
const WRONG_TAGS = ['Wrong action','Wrong person','Wrong channel','Message off','Bad timing'];
let TEACH = null;
function teachAfter(it, decision, rejected){
  if(!it) return;
  const old = document.getElementById('teachPop'); if(old) old.remove();
  clearTimeout(window._tp);
  const r = it.r, who = withRun(it, ()=>liveRec(r).contact.name), seg = withRun(it, ()=>segOf(r));
  TEACH = { it, tags: new Set(), decision };
  const el = document.createElement('div'); el.id = 'teachPop'; el.className = 'teach-pop';
  el.innerHTML = `<div class="tp-h"><span>✦ Teach the system</span><span class="tp-sub">${esc(decision)} · ${esc(who)}</span><button onclick="teachClose()" title="Skip">✕</button></div>
    <div class="tp-l">${rejected ? 'What was wrong?' : 'What did it get right?'}</div>
    <div class="tp-tags">${(rejected ? WRONG_TAGS : ACCEPT_TAGS).map(t=>`<button class="tp-tag" onclick="this.classList.toggle('on');TEACH.tags.has('${esc(t)}')?TEACH.tags.delete('${esc(t)}'):TEACH.tags.add('${esc(t)}')">${esc(t)}</button>`).join('')}</div>
    <input id="tpNote" placeholder="What should it do next time for accounts like this?" onkeydown="if(event.key==='Enter')teachSave()">
    <div class="tp-soon">${soon('Apply to similar accounts', 'Uses your note on the other accounts' + (seg ? ' in ' + seg : '') + ' like this one')}${soon('Autopilot for these', 'Lets Autopilot decide cases like this once reps agree with the system often enough')}</div>
    <div class="tp-f"><span class="tp-bar"><i></i></span><button class="btn btn-ghost btn-sm" onclick="teachClose()">Skip</button><button class="btn btn-primary btn-sm" onclick="teachSave()">Save</button></div>`;
  document.body.appendChild(el);
  const stop = () => { clearTimeout(window._tp); el.classList.add('held'); };
  el.addEventListener('mouseenter', stop); el.addEventListener('focusin', stop);
  window._tp = setTimeout(teachClose, 12000);
}
function teachSave(){
  if(!TEACH) return; const note = (document.getElementById('tpNote')||{}).value || '', tags = [...TEACH.tags];
  if(note.trim() || tags.length){ const it = TEACH.it; withRun(it, ()=>{ logIt(it.r, 'Taught the system', {note:[tags.join(', '), note.trim()].filter(Boolean).join(' · '), tags}); persist(); }); showToast('Thanks: saved for the learning loop'); }
  teachClose();
}
function teachClose(){ clearTimeout(window._tp); const el = document.getElementById('teachPop'); if(el) el.remove(); TEACH = null; }

/* Send back (approvals): what should change, in a small form. */
function openSendBack(key){
  const ov = overlay('sendOverlay');
  ov.innerHTML = `<div class="ws-modal"><div class="ws-modal-h">Send it back</div><div class="ws-sub" style="margin-bottom:8px">It goes back to ${esc(repName(ownerOf(recOf(key))))}'s queue with your note.</div>
    <textarea id="sbNote" class="ws-in" style="min-height:70px" placeholder="What should change?"></textarea>
    <div class="ws-modal-f"><button class="btn btn-ghost" onclick="hide('sendOverlay')">Cancel</button><button class="btn btn-primary" onclick="doSendBack('${key}')">Send back</button></div></div>`;
  setTimeout(()=>document.getElementById('sbNote').focus(), 30);
}
function doSendBack(key){ if(!(document.getElementById('sbNote').value||'').trim()){ showToast('Say what should change'); return; } const it = wsItem(); hide('sendOverlay'); WS.decided = true; sendBack(key); teachAfter(it, 'Sent back', true); }

/* From the list: approve, reject or write your own without opening the item; or work through one reason at a time. */
function rowApprove(id){ const it = items().find(x=>x.id===id); quickDecide(id); teachAfter(it, 'Approved'); }
function rowReject(id, btn){
  document.querySelectorAll('.col-menu').forEach(m=>m.remove());
  const m = document.createElement('div'); m.className = 'col-menu';
  m.innerHTML = `<div style="padding:4px 10px 6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3)">Reject: why?</div>`
    + REJECT.filter(([c])=>c!=='R12').map(([c,l,w])=>`<button onclick="rowRejectDo('${id}','${c}')" title="${esc(w)}"><span class="ck"></span>${esc(l)}<span class="n" style="font-size:10.5px">${esc(w)}</span></button>`).join('')
    + `<button onclick="document.querySelectorAll('.col-menu').forEach(m=>m.remove());openItem('${id}');openReject(WS.key)"><span class="ck"></span>Other… (opens it)</button>`;
  document.body.appendChild(m);
  const rc = btn.getBoundingClientRect(); m.style.top = Math.min(rc.bottom + 6, window.innerHeight - m.offsetHeight - 10) + 'px'; m.style.left = Math.max(8, rc.right - m.offsetWidth) + 'px';
  setTimeout(()=>document.addEventListener('click', function c(e){ if(!m.contains(e.target)){ m.remove(); document.removeEventListener('click', c); } }), 0);
}
function rowRejectDo(id, code){
  document.querySelectorAll('.col-menu').forEach(m=>m.remove());
  const it = items().find(x=>x.id===id); if(!it) return;
  RUN = it.run; openedAt = ROWS_AT; pickCode = code;
  const ov = document.getElementById('rejectOverlay'); if(ov) ov.remove();
  const tmp = document.createElement('input'); tmp.id = 'rjNote'; tmp.type = 'hidden'; document.body.appendChild(tmp);
  reject(it.r.key); tmp.remove();
  teachAfter(it, 'Rejected: ' + REJECT.find(x=>x[0]===code)[1], true);
}
function rowOwn(id){ openItem(id); WS.own = true; renderWs(); }
function reviewGroup(cat){
  const ids = filtered(myQueue()).filter(it=>!onHold(decOf(it)) && catsOfIt(it)[0]===cat).map(it=>it.id);
  if(!ids.length) return; WS_LIST = ids; view = 'queue'; openItem(ids[0]);
}
let GROUP = true;
const GROUP_WHY = { sensitive:'The message mentions a sensitive topic', claim:'A claim has no approved source', low:'No contact in the primary persona', small:'No micro-segment yet',
  deal:'The deal looks below the size threshold', brand:'A brand rule is broken', reach:'No way to reach the contact', spot:'Went ahead on its own; rate it', alternative:'The one alternative after a rejection',
  sentback:'Sent back by the sales manager', intervention:'Stepped in after it went ahead', other:'' };
function wsCompare(){ saveTeach(); WS.compare = !WS.compare; renderWs(); }
// The brand and claim checks re-run as the reviewer edits the message.
function wsLiveCheck(){
  const it = wsItem(), box = document.getElementById('wsChecks'); if(!it || !box) return;
  RUN = it.run; const x = draftFromFields(it.r), chk = DemandAI.checkDraft(x);
  const w = document.getElementById('wsWords');
  if(w) w.textContent = x.channel==='Email' ? `${x.body.split(/\s+/).filter(Boolean).length} words` : x.channel==='LinkedIn' ? `${x.note.length}/200` : '';
  const ver = chk.claims.filter(c=>c.verified).length;
  box.innerHTML = (chk.flags.length ? chk.flags.map(f=>`<span class="tag ${f.rule==='Sensitive term'?'tag-red':'tag-amber'}">✗ ${esc(f.rule)}: ${esc(f.detail)}</span>`).join('') : '<span class="tag tag-green">✓ Brand rules</span>')
    + (chk.unsupported.length ? chk.unsupported.map(u=>`<span class="tag tag-red" title="${esc(u.text)}">✗ Claim with no source</span>`).join('') : `<span class="tag tag-green">✓ ${ver ? `${ver} claim${ver>1?'s':''} verified` : 'No claims'}</span>`);
}
function wsAccept(key){
  saveTeach(); const it = wsItem(), before = JSON.stringify(it.run.saved.decisions[key]||{});
  if(!it.r.segment && dec(key).spot!=='pending' && !((document.getElementById('assignSeg')||{}).value || dec(key).assignedSeg)){ accept(key); return; }   // accept() asks for the segment
  WS.decided = true; accept(key);
  if(WS && WS.id===it.id && JSON.stringify(it.run.saved.decisions[key]||{})===before){ WS.decided = false; return; }
  teachAfter(it, it.run.saved.decisions[key] && it.run.saved.decisions[key].status==='Awaiting approval' ? 'Approved, sent to the manager' : 'Approved');
}
function logTeach(){ const it = wsItem(); const t = (WS && WS.teach||'').trim(); if(it && t){ RUN = it.run; logIt(it.r, 'Taught the system', {note:t}); persist(); WS.teach = ''; } }

/* Put on hold: data is missing or someone else has to answer first. It stays in the queue, at the end. */
const HOLD_WHY = ['Missing contact details','Missing account data','Waiting for someone to confirm','Other'];
function openHold(key){
  saveTeach();
  const ov = overlay('holdOverlay');
  ov.innerHTML = `<div class="ws-modal"><div class="ws-modal-h">Put on hold</div>
    <div class="ws-sub" style="margin-bottom:10px">It stays in your queue, at the end, until you take it off hold. Nothing is sent.</div>
    ${HOLD_WHY.map((w,i)=>`<label class="ws-radio"><input type="radio" name="holdWhy" value="${esc(w)}" ${i===0?'checked':''}> ${esc(w)}</label>`).join('')}
    <input id="holdNote" class="ws-in" placeholder="What are you waiting for? (optional)" style="margin-top:8px">
    <div class="ws-modal-f"><button class="btn btn-ghost" onclick="hide('holdOverlay')">Cancel</button><button class="btn btn-primary" onclick="doHold('${key}')">Put on hold</button></div></div>`;
}
function doHold(key){
  const why = (document.querySelector('input[name=holdWhy]:checked')||{}).value || 'Other', note = (document.getElementById('holdNote').value||'').trim();
  const r = recOf(key); setDec(key, {hold:{why, note, by:me().who, at:Date.now()}});
  logTeach(); logIt(r, 'Put on hold', {note:[why, note].filter(Boolean).join(' · ')}); persist(); hide('holdOverlay');
  WS.decided = true; showToast('On hold: it waits at the end of your queue'); refresh();
}
function takeOffHold(key){ const r = recOf(key); setDec(key, {hold:null}); logIt(r, 'Taken off hold', {}); persist(); showToast('Back in the queue'); renderWs(); }

/* Reject: the reason decides what comes back. What to do next time is captured for the learning loop. */
function openReject(key){
  saveTeach(); pickCode = null;
  const r = recOf(key), d = dec(key), seg = segOf(r);
  const ov = overlay('rejectOverlay');
  ov.innerHTML = `<div class="ws-modal" style="max-width:620px"><div class="ws-modal-h">Why reject it?</div>
    <div class="ws-sub" style="margin-bottom:10px">The reason decides what happens next.${d.alternativeUsed?' This is already the alternative, so a rejection closes the account for the pilot.':''}</div>
    <div class="ws-rj">${REJECT.map(([code,l,w])=>`<button class="ws-rjb" onclick="pickRj(this,'${code}')"><b>${esc(l)}</b><span>${esc(w)}</span></button>`).join('')}</div>
    <input id="rjNote" class="ws-in" placeholder="Comment (needed for Other)" style="margin-top:10px">
    <div class="ws-modal-f"><button class="btn btn-ghost" onclick="hide('rejectOverlay')">Cancel</button><button class="btn btn-primary" onclick="doReject('${key}')">Reject</button></div></div>`;
}
function pickRj(btn, code){ pickCode = code; document.querySelectorAll('.ws-rjb').forEach(b=>b.classList.toggle('on', b===btn)); }
function doReject(key){
  if(!pickCode){ showToast('Pick a reason'); return; }
  const note = document.getElementById('rjNote').value;
  if(pickCode==='R12' && !note.trim()){ showToast('"Other" needs a comment'); return; }
  hide('rejectOverlay');
  // reject() reads the comment from #rjNote: keep a copy where it looks once the overlay is hidden.
  const it = wsItem(), label = (REJECT.find(x=>x[0]===pickCode)||[])[1];
  WS.decided = true; reject(key); teachAfter(it, 'Rejected: ' + label, true);
}

/* Features that come after the pilot are shown, switched off, so people can see what the product will do. */
const soon = (label, what) => `<button type="button" class="soon" title="After the pilot: ${esc(what)}" onclick="soonInfo(${esc(JSON.stringify(label.replace(/^\S+\s/,'')))},${esc(JSON.stringify(what))})">${esc(label)}<span class="soon-b">After the pilot</span></button>`;
function soonInfo(label, what){ showToast(`${label}: after the pilot. ${what}.`); }

/* Approving: a manager's edit to the message is saved, rated and versioned before release. */
function wsApprove(key){
  const r = recOf(key), before = draftOf(r), after = draftFromFields(r);
  if(JSON.stringify(before)!==JSON.stringify(after)){ const rt = editRating(before, after);
    change(key, `Edited by the sales manager before approving (${rt.rating}: ${rt.why})`, ()=>setDec(key, {draft:after, edited:true, editRating:rt.rating})); }
  const it = wsItem(); managerApprove(key); teachAfter(it, 'Approved');
}

/* ═══ Copilot in the workspace: a chat that grows from the bottom. It opens with the facts behind the
   recommendation as a card; every answer is a card too (people, signals, claims, history), not a wall of text. ═══ */
const CP_Q = {
  sensitive: [['term','What exactly is sensitive?'],['ifaccept','What happens if I approve?']],
  claim: [['claim','Which claim has no source?'],['claims','Which approved claims fit instead?']],
  low: [['people','Who else could we contact there?']],
  small: [['segs','Which micro-segment fits best?']],
  deal: [['deal','How is the deal size worked out?']],
  brand: [['rules','Which rule does it break?']],
  reach: [['people','Who else could we contact there?']],
  spot: [['spotwhy','Why was it picked for a spot-check?']],
  alternative: [['before','What was rejected before?']],
  sentback: [['before','What did the manager say?']],
};
const CP_COMMON = [['signals','Show the signals'],['compare','How does the runner-up differ?'],['similar','How did similar items go?'],['brief','Show the brief and proof'],['history','Show the history']];
function chipsHtml(r, s){
  const asked = new Set((WS.chat||[]).map(m=>m.k).filter(Boolean));
  const qs = (CP_Q[s.cat]||[]).concat(CP_COMMON.filter(([k])=>k!=='compare' || r.runnerUp)).filter(([k])=>!asked.has(k)).slice(0,4);
  return qs.map(([k,l])=>`<button type="button" class="cp-chip" onclick="cpAsk(null,'${k}',${esc(JSON.stringify(l))})">${esc(l)}</button>`).join('')
    + soon('🔎 Search the client\'s knowledge base', 'Answers from the client\'s own documents, CRM notes and past conversations');
}
const cpCard = (title, body, foot) => `<div class="cp-card">${title?`<div class="cp-card-h">${title}</div>`:''}<div class="cp-card-b">${body}</div>${foot?`<div class="cp-card-f">${foot}</div>`:''}</div>`;
const cpKv = (k, v) => `<div class="cp-kv"><span>${k}</span><div>${v}</div></div>`;
function factsCard(){
  const it = wsItem(); RUN = it.run;
  const r = it.r, key = r.key, d = dec(key), seg = segOf(r), { conf } = checksOf(r), tr = seg ? trackRecord(seg) : trackRecord();
  const sig = r.signal || {}, sigs = (r.person && r.person.signals) || [];
  return cpCard('Why the system recommends it',
    cpKv('Why now', `<b>${esc(sig.type||'Signal')}</b>${sig.age!==undefined?` <span class="ws-sub">· ${sig.age} days ago</span>`:''}<div class="ws-sub">${esc(r.reason.replace(/^[^:]+:\s*/,''))}</div>`)
    + cpKv('Checks', `<span class="tags" style="display:inline-flex;flex-wrap:wrap;gap:4px">${fourChecks(r).map(([k,ok])=>`<span class="tag ${ok?'tag-green':'tag-red'}">${ok?'✓':'✗'} ${esc(k)}</span>`).join('')}</span>`)
    + cpKv('Confidence', `<span class="tag ${conf.level==='High'?'tag-green':conf.level==='Medium'?'tag-amber':'tag-red'}">${esc(conf.level)}</span> <span class="ws-sub">${esc(conf.reason.replace(/^\w+:\s*/,''))}</span>`)
    + cpKv('Track record', tr.n ? `Reps agreed <b>${tr.a} of ${tr.n}</b> times${seg?` in ${esc(seg)}`:''}${tr.early?' <span class="ws-sub">· early days</span>':''}` : '<span class="ws-sub">No decisions yet</span>')
    + cpKv('Account', `${esc(r.account.name)} <span class="ws-sub">· ${esc(r.account.vertical||'')} · ${esc(r.status)}</span>`)
    + cpKv('Owner', isManager() && inQueue(d) ? `<select onchange="reassign('${key}',this.value)" class="cp-sel">${['',...Object.keys(REPS)].map(e=>`<option value="${e}" ${ownerOf(r)===e?'selected':''}>${esc(repName(e))}</option>`).join('')}</select>` : esc(repName(ownerOf(r)))),
    sigs.length>1 ? `${sigs.length} signals on this contact · <a href="#" onclick="cpAsk(null,'signals','Show the signals');return false">see them all</a>` : '');
}
function chatHtml(){
  return (WS.chat||[]).map(m=>{
    if(m.who==='me') return `<div class="cp-me">${esc(m.q)}</div>`;
    const body = m.kind==='facts' ? `<div class="cp-intro">Here is what I know about this one. Ask me anything below.</div>${factsCard()}` : m.a;
    return `<div class="cp-ai"><span class="cp-av">✦</span><div class="cp-ai-b">${body}</div></div>`;
  }).join('');
}
function cpAnswer(k){
  const it = wsItem(); RUN = it.run;
  const r = it.r, key = r.key, d = dec(key), lr = liveRec(r), x = draftOf(r), { chk, conf } = checksOf(r), p = t => `<div class="cp-p">${t}</div>`;
  switch(k){
    case 'term': { const t = DemandAIDraftText(x), ss = t.split(/(?<=[.?!])\s+|\n+/).filter(z=>SENSITIVE_RE.test(z));
      return ss.length ? cpCard('Lines that mention a sensitive topic', ss.map(z=>`<div class="ws-quote">${esc(z).replace(SENSITIVE_RE, m=>`<mark>${m}</mark>`)}</div>`).join(''), 'A plant incident, security or regulation needs a person, so it never goes out on its own.')
        : p('The signal behind it touches a sensitive topic, even though the message does not name it.'); }
    case 'ifaccept': return p(isManager() ? 'Approving releases it straight away to the rep, ready to use. Your edits are saved and versioned first.' : 'It goes to the sales manager first. It goes out only once they approve it.');
    case 'claim': return chk.unsupported.length ? cpCard('Claim with no approved source', chk.unsupported.map(u=>`<div class="ws-quote">${esc(u.text)}</div>`).join(''), 'It reads like a product claim and does not match an approved source word for word.') : p('No unsupported claim in the message now.');
    case 'claims': { const seg = segOf(r) || r.prominent, cs = DemandAI.approvedClaims().filter(c=>(c.segments||[]).includes(seg));
      return cs.length ? cpCard(`Approved claims for ${esc(seg)}`, cs.map(c=>`<div class="ws-quote">${esc(c.claim)} <span class="ws-sub">[${esc(c.type)}, ${c.year}]</span></div>`).join(''), 'Paste one into the message word for word, with its citation.') : p('No approved claim for this micro-segment.'); }
    case 'people': { const ppl = ((r.result && r.result.people) || []).map(pp=>pp.contact).filter(cc=>cc.row!==lr.contact.row);
      return ppl.length ? cpCard(`Other contacts at ${esc(r.account.name)}`, `<table class="cp-tbl"><tr><th>Name</th><th>Role</th><th>Reach</th></tr>${ppl.map(cc=>`<tr><td><b>${esc(cc.name)}</b></td><td>${esc(cc.jobTitle||'')}${cc.persona?` <span class="ws-sub">· ${esc(cc.persona)}</span>`:''}</td><td>${cc.email&&cc.emailVerified?'Email':cc.linkedin?'LinkedIn':'<span class="ws-sub">None</span>'}</td></tr>`).join('')}</table>`, 'Reject with “Wrong contact” to get the next one.') : p(`No other contact at ${esc(r.account.name)} in the list.`); }
    case 'segs': { const segs = [...new Set(((r.person && r.person.signals) || []).map(sg=>(DemandAI.CONFIG.signalTypes[sg.type]||{}).segment).filter(Boolean))];
      return cpCard('Micro-segments its signals point to', segs.map(sg=>`<div class="cp-row">${segTag(sg)}<span class="ws-sub">${sg===r.prominent?'strongest signal · suggested':''}</span></div>`).join('') || '—', 'Pick one in the banner above, then accept.'); }
    case 'deal': { const ds = DemandAI.estimateDealSize(r.account); return ds ? cpCard('Deal size', cpKv('Estimate', `about USD ${Math.round(ds.value/1000)}k`) + cpKv('Threshold', `USD ${Math.round(DemandAI.CONFIG.dealSize.threshold/1000)}k, set in Setup`), 'Worked out from the account\'s size and type.') : p('No estimate for this account.'); }
    case 'rules': return chk.flags.length ? cpCard('Brand rules it breaks', chk.flags.map(f=>`<div class="ws-quote"><b>${esc(f.rule)}</b>: ${esc(f.detail)}</div>`).join('')) : p('It passes every brand rule now.');
    case 'spotwhy': return p('Each week a random share of what went ahead on its own goes to each rep to rate. If reps would not have sent these, the checks need tightening.');
    case 'before': return d.sentBackNote ? cpCard('What the sales manager said', `<div class="ws-quote">${esc(d.sentBackNote)}</div>`) : (d.rejections||[]).length ? cpCard('Rejected before', (d.rejections||[]).map(x=>`<div class="ws-quote">${esc(x.label)}${x.note?': '+esc(x.note):''}</div>`).join('')) : p(`The first recommendation was ${esc(d.alternativeOf||'rejected')}.`);
    case 'signals': { const sigs = (r.person && r.person.signals) || [];
      return cpCard(`Signals on ${esc(lr.contact.name)}`, `<div class="cp-tl">${sigs.map(sg=>`<div class="cp-tl-i"><span class="cp-dot"></span><div><b>${esc(sg.type)}</b> <span class="ws-sub">${sg.age!==undefined?sg.age+' days ago':''}${sg.source?' · '+esc(sg.source):''}</span><div class="ws-sub">${esc(sg.detail||'')}</div></div></div>`).join('') || '—'}</div>`,
        r.fallback ? `Grouped on its second signal: fewer than ${DemandAI.CONFIG.minSegmentAccounts} accounts shared the strongest one.` : ''); }
    case 'brief': { const b = DemandAI.briefFor(lr, chosenAction(r), {asOf:asOf(), channel:d.channel});
      return cpCard('The brief and proof', cpKv('Angle', esc(b.angle)) + cpKv('Proof', b.proof ? `${esc(b.proof.title)} <span class="ws-sub">· ${esc(b.proof.type)}, ${b.proof.year}</span>` : '<span class="ws-sub">No approved proof</span>') + cpKv('Objection', esc(b.objection))
        + cpKv('Claims', chk.claims.length ? chk.claims.map(cl=>`<span style="color:${cl.verified?'var(--pos)':'var(--neg)'}">${cl.verified?'✓':'✗'}</span> ${esc(cl.text)}`).join('<br>') : '<span class="ws-sub">None</span>') + cpKv('Confidence', esc(conf.reason))); }
    case 'history': { const hist = RUN.saved.log.filter(l=>l.key===key), vs = versions(r);
      return cpCard('History', `<div class="cp-tl">${hist.map(l=>`<div class="cp-tl-i"><span class="cp-dot"></span><div><b>${esc(l.decision)}</b> <span class="ws-sub">· ${esc(l.who)} · ${fmtDate(l.at)}</span>${l.note?`<div class="ws-sub">${esc(l.note)}</div>`:''}</div></div>`).join('') || '<span class="ws-sub">Nothing yet.</span>'}</div>`, vs.length>1 ? `${vs.length} versions of the message` : ''); }
    default: return `<div class="cp-p">${itemAnswer(key, k)}</div>`;
  }
}
function cpAsk(text, k, label){
  const it = wsItem(); if(!it) return;
  const q = label || String(text||'').trim(); if(!q) return;
  if(!k){ const t = q.toLowerCase();
    k = /sensitiv|security|incident/.test(t) ? 'term' : /approved claim|instead/.test(t) ? 'claims' : /claim|source/.test(t) ? 'claim' : /who else|other contact|contact|person/.test(t) ? 'people'
      : /segment/.test(t) ? 'segs' : /deal|size|worth/.test(t) ? 'deal' : /rule|brand/.test(t) ? 'rules' : /runner|differ|alternative/.test(t) ? 'compare'
      : /similar|track|agree|how did/.test(t) ? 'similar' : /signal|why now|when/.test(t) ? 'signals' : /brief|proof|angle|objection/.test(t) ? 'brief'
      : /history|log|before|version/.test(t) ? 'history' : /account|company|know/.test(t) ? 'account' : /approve|accept|happen/.test(t) ? 'ifaccept' : 'why'; }
  let a; try{ a = cpAnswer(k); }catch(e){ a = '<div class="cp-p">Sorry, I could not work that out.</div>'; }
  WS.chat.push({ who:'me', q }, { who:'ai', k, a }); wsSheet(true); const qi = document.getElementById('wsQ'); if(qi) qi.value = '';
  const st = document.getElementById('wsCpStack'), qs = document.getElementById('wsCpQs'), r = it.r, d = dec(r.key);
  if(st){ st.innerHTML = chatHtml(); const b = document.getElementById('wsCp'); b.scrollTop = b.scrollHeight; }
  if(qs) qs.innerHTML = chipsHtml(r, stuck(r, d));
  const f = document.querySelector('.ws-cp-f input'); if(f) f.value = '';
}

document.addEventListener('keydown', e=>{
  if(!WS) return; const tag = (e.target.tagName||'').toLowerCase();
  if(e.key==='Escape'){ if(document.getElementById('teachPop')){ teachClose(); return; } if(WS.sheet){ wsSheet(false); if(document.activeElement) document.activeElement.blur(); return; } const ov = [...document.querySelectorAll('#holdOverlay,#rejectOverlay,#sendOverlay')].find(o=>o.style.display!=='none'); if(ov){ ov.style.display='none'; return; } if(document.getElementById('detailDrawer').classList.contains('open')){ closeDrawer(); return; } leaveWs(); return; }
  if(['input','textarea','select'].includes(tag)) return;
  if(e.key==='ArrowRight') wsGo(1); if(e.key==='ArrowLeft') wsGo(-1);
  if(e.metaKey || e.ctrlKey || e.altKey || document.querySelector('[id$=Overlay][style*="flex"]')) return;
  const k = e.key.toLowerCase(), bar = document.querySelector('.ws-dec');
  if(k==='/'){ e.preventDefault(); const q = document.getElementById('wsQ'); if(q) q.focus(); }
  else if(k==='a' && bar){ const b = [...bar.querySelectorAll('.btn-primary')].find(x=>/Approve/.test(x.textContent)); if(b){ e.preventDefault(); b.click(); } }
  else if(k==='r' && bar){ const b = [...bar.querySelectorAll('.btn')].find(x=>/^Reject/.test(x.textContent.trim())); if(b){ e.preventDefault(); b.click(); } }
  else if(k==='w' && WS.mode==='decide'){ e.preventDefault(); wsOwn(); }
  else if(k==='h' && bar){ const b = [...bar.querySelectorAll('.btn')].find(x=>/hold/i.test(x.textContent)); if(b){ e.preventDefault(); b.click(); } }
});

function drawLog(){
  const el = document.getElementById('rows'); if(!el) return;
  const mgr = isManager();
  let ls = Object.values(RUNS).flatMap(run=>run.saved.log.map(l=>({...l, runId:run.saved.id}))).sort((a,b)=>b.at-a.at).filter(l=>mgr || l.who===me().who);
  if(LOGF==='flagged') ls = ls.filter(l=>l.flag && !l.checked);
  if(q) ls = ls.filter(l=>(l.who+' '+l.prospect+' '+l.company+' '+l.decision+' '+l.action+' '+l.note).toLowerCase().includes(q));
  const tone = d => /^Accepted|^Approved/.test(d)?'tag-green':/^Rejected/.test(d)?'tag-red':/^Outcome/.test(d)?'tag-violet':/^Went ahead/.test(d)?'tag-blue':'tag-grey';
  const kindLbl = {exception:'Exception', spot:'Spot-check', alternative:'Alternative'};
  el.innerHTML = table([['When','12%'],['Who','12%'],['Prospect','15%'],['Decision','24%'],['Action','19%'],['Note','18%']],
    ls.map(l=>`<tr class="click" onclick="openItem('${l.runId}::${l.key}')">
      <td>${cell(fmtDate(l.at), timeOf(l.at)+(l.secs!=null?` · ${l.secs}s`:''))}</td>
      <td>${cell(l.who, esc(l.role))}</td>
      <td>${cell(l.prospect, esc(l.company))}</td>
      <td class="wrap"><span class="tag ${tone(l.decision)}">${esc(l.decision)}</span>${l.decisive?`<span class="sub">${esc(kindLbl[l.kind]||'')}${l.firstPass?' · first pass':''}${l.position?` · #${l.position} in queue`:''}</span>`:''}
        ${l.flag?`<span class="sub" style="color:var(--warn)">${esc(l.flag)}${l.checked?' · checked':''}</span>${mgr&&!l.checked?`<button class="btn btn-ghost btn-sm" style="margin-top:4px" onclick="event.stopPropagation();markChecked('${l.runId}',${l.at},'${l.key}')">Checked, count it</button>`:''}`:''}</td>
      <td class="wrap"><span class="clamp2" style="font-size:12px;color:var(--i1)">${esc(l.action)}</span><span class="sub">${esc(l.channel)}${l.linkedTo?` · alternative to ${esc(l.linkedTo)}`:''}</span></td>
      <td class="wrap"><span class="clamp2" style="font-size:12px;color:var(--i2)">${[l.tags&&l.tags.length?l.tags.join(', '):'', l.note].filter(Boolean).map(esc).join(' · ')||'<span class="muted">—</span>'}</span></td>
    </tr>`).join(''), 'No decisions yet.');
}
// A flagged decision counts toward G2 only once a manager has checked it.
function markChecked(runId, at, key){
  const run = RUNS[runId]; if(!run) return;
  const l = run.saved.log.find(x=>x.at===at && x.key===key); if(!l) return;
  l.checked = true; RUN = run; logIt(recOf(key), 'Flagged decision checked', {note:l.flag}); persist(); RUN = null; render();
}
function toggleExport(on){
  const m = document.getElementById('exportMenu'); if(!m) return;
  const show = on===undefined ? m.style.display==='none' : on;
  m.style.display = show ? 'block' : 'none';
  if(show) setTimeout(()=>document.addEventListener('click', function c(e){ if(!m.contains(e.target)){ m.style.display='none'; document.removeEventListener('click', c); } }), 0);
}
// Exports across every list: the shared exporters work on one list, so collect their rows list by list.
function exportAll(kind){
  const runs = Object.values(RUNS); let rows = null;
  const keepDl = window.download; window.download = (name, csv) => { const g = DemandAI.parseCSV(csv); rows = rows ? rows.concat(g.slice(1)) : g; };
  const keepToast = window.showToast; window.showToast = ()=>{};
  try{ runs.forEach(run=>{ RUN = run; ({approved:exportApproved, tasks:exportTasks, log:exportLog})[kind](); }); }
  finally{ window.download = keepDl; window.showToast = keepToast; RUN = null; }
  if(!rows || rows.length<2){ showToast(kind==='approved'?'No released messages yet':kind==='tasks'?'No released tasks yet':'No decisions yet'); return; }
  download({approved:'released_messages.csv', tasks:'tasks.csv', log:'decision_log.csv'}[kind], DemandAI.toCSV(rows));
}

function getThisPageId(){
  if(typeof PAGE_ID !== 'undefined') return PAGE_ID;

  try { return localStorage.getItem('demandai_role') || 'Sales manager'; }

function setRole(role){
  try { localStorage.setItem('demandai_role', role); } catch(e){}

function applyRoleToNav(){
  const role = getRole();
  const allowed = ROLE_NAV_ALLOWED[role] || [];
  document.querySelectorAll('.nav-item').forEach(a=>{
    const href = a.getAttribute('href');
    a.style.display = allowed.includes(href) ? '' : 'none';
  });
  const unEl = document.querySelector('.nav-un');
  const urEl = document.querySelector('.nav-ur');
  const avEl = document.querySelector('.nav-av');
  if(unEl) unEl.textContent = ROLE_PERSON[role];
  if(urEl) urEl.textContent = role;
  if(avEl) avEl.textContent = ROLE_PERSON[role].split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
