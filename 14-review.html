<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>For Review — DemandAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#7D52A2;--brand-dk:#5E3A80;--brand-lt:#F0EBF8;--brand-mid:#C9B3E8;
  --sec:#0094DA;--sec-lt:#E6F4FC;--sec-dk:#005E8E;
  --ter:#FF8820;--ter-lt:#FFF0E0;--ter-dk:#B85800;
  --pos:#2E7D5A;--pos-lt:#EAF5F0;
  --warn:#C4751A;--warn-lt:#FDF6E8;
  --neg:#B23F3F;--neg-lt:#FBECEC;
  --rail:#130D1C;--rb:rgba(255,255,255,.07);
  --r1:#fff;--r2:rgba(255,255,255,.76);--r3:rgba(255,255,255,.43);--r4:rgba(255,255,255,.21);
  --rhov:rgba(255,255,255,.05);--ract:rgba(125,82,162,.22);
  --bg:#F5F6F9;--surf:#fff;--border:#E5E9EE;--bdk:#D1D7DE;
  --i1:#141A21;--i2:#4A5664;--i3:#9DA8B5;--i4:#C9D1DA;
  --s50:#F4F6F8;--s75:#ECEFF3;--s100:#E1E6EC;--s200:#C9D1DA;--s300:#9DA8B5;
  --fd:"Sora",system-ui,sans-serif;
  --fb:"Plus Jakarta Sans",-apple-system,sans-serif;
  --fm:"JetBrains Mono",monospace;
  --rsm:8px;--rmd:12px;--rlg:16px;
  --ease:cubic-bezier(.4,0,.2,1);--fast:120ms;--base:200ms;
  --sh:0 2px 8px rgba(20,26,33,.07),0 1px 3px rgba(20,26,33,.05);
  --sh-lg:0 8px 40px rgba(20,26,33,.14),0 2px 8px rgba(20,26,33,.08);
  --nav-w:224px;--chat-w:400px;--hh:54px;--tabs-h:42px;
}
*,*::before,*::after{box-sizing:border-box;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{margin:0;font-family:var(--fb);font-size:14px;background:var(--bg);color:var(--i1);overflow:hidden;height:100vh;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font:inherit;}
:root{color-scheme:light;}
input,textarea,select{background-color:#fff;color:var(--i1);}
textarea[readonly],input[readonly]{background-color:var(--s50);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--s200);border-radius:2px;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(1.3);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideLeft{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}
@keyframes msgIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{width:0}to{width:var(--bw)}}

/* ─── SHELL ─────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;height:100vh;width:100vw;}

/* ─── NAV ─────────────────────────────── */
.nav{background:var(--rail);display:flex;flex-direction:column;height:100vh;overflow:hidden;border-right:1px solid var(--rb);}
.nav-brand{display:flex;align-items:center;gap:9px;padding:13px 13px 11px;border-bottom:1px solid var(--rb);flex-shrink:0;}
.nav-nm{font-family:var(--fd);font-size:14px;font-weight:600;color:var(--r1);letter-spacing:-.01em;}
.nav-org{font-size:10px;color:var(--r3);margin-top:1px;}
.nav-body{flex:1;overflow-y:auto;padding:6px 0;}
.nav-body::-webkit-scrollbar{width:3px;}
.nav-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);}
.nav-sec{padding:8px 14px 3px;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--r4);font-weight:600;}
.nav-item{display:flex;text-decoration:none;align-items:center;gap:9px;height:32px;padding:0 10px;margin:1px 6px;border-radius:7px;color:var(--r3);font-size:12.5px;font-weight:500;cursor:pointer;position:relative;transition:background var(--fast) var(--ease),color var(--fast) var(--ease);}
.nav-item:hover{background:var(--rhov);color:var(--r2);}
.nav-item.active{background:var(--ract);color:var(--r1);}
.nav-item.active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2.5px;background:var(--brand-mid);border-radius:0 2px 2px 0;}
.nav-ic{width:15px;height:15px;flex-shrink:0;opacity:.7;}
.nav-item.active .nav-ic{opacity:1;color:var(--brand-mid);}
.nav-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-div{height:1px;background:var(--rb);margin:6px 10px;}
.nav-foot{padding:10px;border-top:1px solid var(--rb);flex-shrink:0;}
.nav-user{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--rsm);cursor:pointer;transition:background var(--fast) var(--ease);}
.nav-user:hover{background:var(--rhov);}
.nav-av{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.nav-un{font-size:12px;color:var(--r2);font-weight:500;}
.nav-ur{font-size:10px;color:var(--r4);margin-top:1px;}

/* ─── MAIN ─────────────────────────────── */
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0;}

/* Topbar */
.topbar{height:var(--hh);padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0;gap:10px;}
.topbar-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.tb-title{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--i1);}
.tb-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;}
.badge-live{background:var(--pos-lt);color:var(--pos);}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite;}
.badge-neutral{background:var(--s100);color:var(--i3);}
.topbar-r{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--fb);font-size:12.5px;font-weight:600;height:30px;padding:0 12px;border-radius:var(--rsm);border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:all var(--fast) var(--ease);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dk);}
.btn-sec{background:var(--surf);border-color:var(--bdk);color:var(--i1);}
.btn-sec:hover{background:var(--s75);}
.btn-copilot{background:var(--brand-lt);border-color:var(--brand-mid);color:var(--brand-dk);}
.btn-copilot:hover{background:var(--brand-mid);}
.btn-copilot.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.btn-ghost{color:var(--i2);}
.btn-ghost:hover{background:var(--s75);}
.btn-sm{height:27px;font-size:11.5px;padding:0 10px;border-radius:6px;}

/* Tabs */
.ftabs{height:var(--tabs-h);padding:0 20px;display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--border);background:var(--surf);flex-shrink:0;}
.ftab{display:flex;align-items:center;gap:6px;padding:0 16px;font-size:13px;font-weight:500;color:var(--i3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color var(--fast) var(--ease);}
.ftab:hover{color:var(--i2);}
.ftab.active{color:var(--i1);border-bottom-color:var(--brand);}
.ftab-cnt{font-family:var(--fm);font-size:10.5px;color:var(--i4);}
.ftab.active .ftab-cnt{color:var(--brand);}

/* Canvas */
.canvas{flex:1;overflow-y:auto;padding:16px 20px 40px;}
.canvas::-webkit-scrollbar{width:5px;}

/* ─── STATS STRIP ─────────────────────── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;margin-bottom:16px;}
.stat{padding:13px 16px;border-right:1px solid var(--border);}
.stat:last-child{border-right:none;}
.stat-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--i3);font-weight:600;margin-bottom:4px;}
.stat-val{font-family:var(--fd);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:3px;}
.stat-sub{font-size:11px;color:var(--i3);}
.sv1{color:var(--brand);}
.sv2{color:var(--sec);}
.sv3{color:var(--ter-dk);}
.sv4{color:var(--pos);}
.sv5{color:var(--i1);}

/* ─── MAIN LAYOUT: full-width list, detail as fixed right drawer ─── */
.score-layout{display:block;}
/* dim-overview handled inline */

/* Detail drawer — slides in from the right over the content */
.detail-drawer{
  position:fixed;top:0;right:0;bottom:0;
  width:360px;
  background:var(--surf);
  border-left:1px solid var(--border);
  box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;
  z-index:300;
  transform:translateX(100%);
  transition:transform var(--base) var(--ease);
  overflow-y:auto;
}
.detail-drawer.open{transform:translateX(0);}
.detail-drawer::-webkit-scrollbar{width:4px;}
.drawer-hdr{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:var(--surf);
  border-bottom:1px solid var(--border);
}
.drawer-title{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--i1);}
.drawer-sub{font-size:10.5px;color:var(--i3);margin-top:1px;}
.drawer-close{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--i3);cursor:pointer;flex-shrink:0;transition:all var(--fast);}
.drawer-close:hover{background:var(--s75);color:var(--i1);}
.drawer-body{padding:14px 16px 24px;flex:1;}

/* Score list */
.score-list{background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;}
.sl-toolbar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.sl-srch{display:flex;align-items:center;gap:6px;background:var(--s50);border:1px solid var(--border);border-radius:var(--rsm);padding:0 10px;height:29px;min-width:160px;flex:1;max-width:220px;transition:border-color var(--fast);}
.sl-srch:focus-within{border-color:var(--brand-mid);}
.sl-srch input{border:none;background:transparent;font-size:12.5px;color:var(--i1);outline:none;width:100%;}
.sl-srch input::placeholder{color:var(--i3);}
.sl-seg-filter{display:flex;gap:4px;margin-left:auto;}
.seg-pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;cursor:pointer;border:1px solid var(--border);color:var(--i3);background:var(--surf);white-space:nowrap;transition:all var(--fast);}
.seg-pill:hover{border-color:var(--brand-mid);color:var(--brand);}
.seg-pill.active{background:var(--brand);border-color:var(--brand);color:#fff;}

.sl-head{display:grid;grid-template-columns:minmax(160px,2.5fr) 72px 72px 72px 110px 180px;padding:0 14px;height:32px;background:var(--s50);border-bottom:1px solid var(--border);align-items:center;gap:6px;}
.sl-th{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);font-weight:600;white-space:nowrap;}

.sl-row{display:grid;grid-template-columns:minmax(160px,2.5fr) 72px 72px 72px 110px 180px;padding:6px 14px;min-height:60px;border-bottom:1px solid var(--border);align-items:center;gap:6px;cursor:pointer;transition:background var(--fast);}
.sl-row:last-child{border-bottom:none;}
.sl-row:hover{background:var(--s50);}
.sl-row.selected{background:var(--brand-lt);}

.co-cell{display:flex;align-items:center;gap:9px;min-width:0;}
.co-av{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.co-nm{font-size:12.5px;font-weight:600;color:var(--i1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.co-ind{font-size:10.5px;color:var(--i3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Score badges */
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:20px;padding:0 5px;border-radius:4px;font-family:var(--fm);font-size:11px;font-weight:700;}
.sc-h{background:var(--pos-lt);color:var(--pos);}
.sc-m{background:var(--warn-lt);color:var(--warn);}
.sc-l{background:var(--neg-lt);color:var(--neg);}

/* Composite bar */
.comp-bar{display:flex;align-items:center;gap:5px;}
.comp-track{flex:1;height:4px;background:var(--s100);border-radius:2px;overflow:hidden;}
.comp-fill{height:4px;border-radius:2px;animation:barGrow .5s var(--ease) forwards;}
.comp-val{font-family:var(--fm);font-size:11px;color:var(--i2);min-width:20px;text-align:right;flex-shrink:0;}

/* Delta */
.delta{font-family:var(--fm);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:3px;white-space:nowrap;}
.delta-up{background:var(--pos-lt);color:var(--pos);}
.delta-dn{background:var(--neg-lt);color:var(--neg);}
.delta-flat{background:var(--s100);color:var(--i3);}

/* ─── PANEL (used in tabs) ─────────── */
.panel{background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);}
.panel-ttl{font-size:11px;font-weight:600;color:var(--i2);letter-spacing:.04em;text-transform:uppercase;}
.panel-body{padding:12px 14px;}

/* Score breakdown in detail */
.dim-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--s75);}
.dim-row:last-child{border-bottom:none;}
.dim-lbl{font-size:11.5px;color:var(--i2);width:74px;flex-shrink:0;}
.dim-track{flex:1;height:5px;background:var(--s100);border-radius:3px;overflow:hidden;}
.dim-fill{height:5px;border-radius:3px;transition:width .5s var(--ease);}
.dim-val{font-family:var(--fm);font-size:12px;font-weight:700;min-width:26px;text-align:right;flex-shrink:0;}

/* Signal log */
.sig-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--s75);}
.sig-row:last-child{border-bottom:none;}
.sig-ic{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:1px;}
.sig-lbl{font-size:11.5px;color:var(--i1);font-weight:500;line-height:1.4;}
.sig-meta{font-size:10px;color:var(--i3);margin-top:2px;}
.sig-impact{margin-left:auto;font-family:var(--fm);font-size:11px;font-weight:700;flex-shrink:0;}
.sig-up{color:var(--pos);}
.sig-dn{color:var(--neg);}

/* Sparkline */
.spark{display:flex;align-items:flex-end;gap:2px;height:28px;}
.spark-bar{flex:1;border-radius:2px 2px 0 0;min-width:3px;}

/* Lookalikes */
.like-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--s75);cursor:pointer;}
.like-row:last-child{border-bottom:none;}
.like-row:hover .like-nm{color:var(--brand);}
.like-av{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:9.5px;font-weight:700;color:#fff;flex-shrink:0;}
.like-nm{font-size:12px;font-weight:600;color:var(--i1);transition:color var(--fast);}
.like-meta{font-size:10.5px;color:var(--i3);margin-top:1px;}
.like-match{margin-left:auto;font-family:var(--fm);font-size:11px;font-weight:700;color:var(--brand);flex-shrink:0;}

/* Empty detail state */
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;gap:8px;text-align:center;}

/* ─── DIMENSION OVERVIEW (below list on Scores tab) */
/* dim-overview now defined in score-layout block above */
/* dov-num used by the inline dimension strip */
.dov-num{font-family:var(--fd);font-weight:700;letter-spacing:-.03em;line-height:1;}
.dov-dist{display:flex;gap:2px;height:5px;border-radius:3px;overflow:hidden;}
.dov-seg{height:100%;}

/* ─── SEGMENT MAP TAB ─── */
.seg-map-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
.seg-map-ttl{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--i1);}
.seg-grid{display:grid;grid-template-columns:repeat(4,1fr);}
.seg-cell{padding:14px 16px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--fast);}
.seg-cell:hover{background:var(--s50);}
.seg-cell:nth-child(4n){border-right:none;}
.seg-cell:nth-last-child(-n+4){border-bottom:none;}
.seg-nm{font-size:12.5px;font-weight:600;color:var(--i1);margin-bottom:3px;}
.seg-desc{font-size:10.5px;color:var(--i3);margin-bottom:8px;line-height:1.5;}
.seg-count{font-family:var(--fd);font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:2px;}
.seg-sub{font-size:10.5px;color:var(--i3);}
.seg-bar-wrap{height:3px;background:var(--s100);border-radius:2px;margin-top:8px;overflow:hidden;}
.seg-bar-fill{height:3px;border-radius:2px;}

/* ─── HISTORY TAB ─── */
.hist-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--s75);}
.hist-row:last-child{border-bottom:none;}
.hist-dir{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ─── THRESHOLD TAB ─── */
.thresh-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.thresh-dim{display:flex;flex-direction:column;gap:10px;}
.thresh-dim-ttl{font-size:10.5px;font-weight:600;color:var(--i2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.thresh-row{display:flex;align-items:center;gap:10px;}
.thresh-lbl{font-size:11.5px;color:var(--i2);min-width:90px;}
.thresh-slider{flex:1;accent-color:var(--brand);cursor:pointer;height:4px;}
.thresh-val{font-family:var(--fm);font-size:12px;font-weight:600;color:var(--i1);min-width:26px;text-align:right;}
.thresh-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--border);background:var(--s50);}
.thresh-hint{font-size:12px;color:var(--i3);}
.thresh-hint strong{color:var(--warn);font-weight:600;}

/* ─── CHAT PANEL ─────────────────────── */
.chat-panel{position:fixed;top:0;right:0;bottom:0;width:var(--chat-w);background:var(--surf);border-left:1px solid var(--border);box-shadow:var(--sh-lg);display:flex;flex-direction:column;z-index:400;transform:translateX(100%);transition:transform var(--base) var(--ease);}
.chat-panel.open{transform:translateX(0);}
.chat-panel.expanded{position:fixed;inset:0;width:100vw;height:100vh;border-left:none;z-index:450;}
.chat-panel.expanded .hist-section{display:none;}
.chat-panel.expanded .chat-msgs,.chat-panel.expanded .sugg-wrap,.chat-panel.expanded .composer-wrap{padding-left:24px;padding-right:24px;}

.chat-top{height:var(--hh);padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;}
.chat-top-l{display:flex;align-items:center;gap:9px;min-width:0;flex:1;}
.chat-ttl{font-size:13px;font-weight:600;color:var(--i1);}
.chat-scope{font-size:10.5px;color:var(--i3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-top-acts{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.ct-ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--i3);cursor:pointer;transition:all var(--fast);}
.ct-ic:hover{background:var(--s75);color:var(--i1);}
.ct-ic.active{background:var(--brand-lt);color:var(--brand);}

.hist-section{border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden;max-height:220px;transition:max-height var(--base) var(--ease);}
.hist-section.collapsed{max-height:0;border-bottom:none;}
.hist-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;cursor:pointer;user-select:none;}
.hist-lbl{font-size:10.5px;font-weight:600;color:var(--i2);letter-spacing:.03em;}
.hist-chev{color:var(--i3);transition:transform var(--fast);}
.hist-section.collapsed .hist-chev{transform:rotate(-90deg);}
.hist-list{padding:0 10px 8px;overflow-y:auto;max-height:160px;}
.hist-list::-webkit-scrollbar{width:3px;}
.hist-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:background var(--fast);}
.hist-item:hover{background:var(--s50);}
.hist-item.active{background:var(--brand-lt);}
.hist-item-nm{flex:1;font-size:12px;font-weight:500;color:var(--i2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hist-item.active .hist-item-nm{color:var(--brand-dk);}

.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.chat-msgs::-webkit-scrollbar{width:4px;}
.msg{animation:msgIn var(--base) var(--ease);}
.msg-a{display:flex;align-items:flex-start;gap:8px;}
.msg-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.msg-bub{background:var(--s50);border:1px solid var(--border);border-radius:var(--rmd);padding:10px 12px;font-size:12.5px;color:var(--i1);line-height:1.6;max-width:calc(100% - 32px);}
.msg-bub strong{font-weight:600;}
.msg-bub em{font-style:normal;color:var(--i2);background:var(--s100);padding:1px 5px;border-radius:3px;font-size:12px;}
.msg-u{display:flex;justify-content:flex-end;}
.msg-ub{background:var(--brand);color:#fff;border-radius:var(--rmd);padding:10px 12px;font-size:12.5px;line-height:1.6;max-width:86%;}
.msg-time{font-size:9.5px;color:var(--i4);margin-top:3px;padding:0 2px;}

/* Chat action chips */
.chat-acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.ca{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:16px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid;transition:all var(--fast);}
.ca-pri{background:var(--brand);border-color:var(--brand);color:#fff;}
.ca-pri:hover{background:var(--brand-dk);}
.ca-sec{background:var(--surf);border-color:var(--bdk);color:var(--i1);}
.ca-sec:hover{background:var(--s75);}
.ca-ghost{background:transparent;border-color:var(--border);color:var(--i2);}
.ca-ghost:hover{border-color:var(--bdk);color:var(--i1);}

/* Suggestions */
.sugg-wrap{padding:4px 14px 8px;}
.sugg-lbl{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);font-weight:600;margin-bottom:6px;}
.sugg{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--rsm);font-size:12px;color:var(--i2);cursor:pointer;background:var(--surf);margin-bottom:3px;transition:all var(--fast);}
.sugg:hover{border-color:var(--brand-mid);background:var(--brand-lt);color:var(--brand-dk);}
.sugg svg{color:var(--brand);flex-shrink:0;}

/* Typing */
.typing-bub{display:inline-flex;align-items:center;gap:4px;padding:12px 14px;background:var(--s50);border:1px solid var(--border);border-radius:var(--rmd);}
.typing-bub span{width:6px;height:6px;border-radius:50%;background:var(--s300);}
.typing-bub span:nth-child(1){animation:pulse .9s ease-in-out infinite;}
.typing-bub span:nth-child(2){animation:pulse .9s ease-in-out .18s infinite;}
.typing-bub span:nth-child(3){animation:pulse .9s ease-in-out .36s infinite;}

/* Composer */
.composer-wrap{border-top:1px solid var(--border);padding:10px 13px 13px;background:var(--bg);flex-shrink:0;}
.composer{display:flex;align-items:flex-end;gap:7px;background:var(--surf);border:1.5px solid var(--border);border-radius:12px;padding:8px 9px;transition:border-color var(--fast);}
.composer:focus-within{border-color:var(--brand-mid);}
.cta{flex:1;border:none;background:transparent;font-size:13px;color:var(--i1);outline:none;resize:none;min-height:20px;max-height:90px;line-height:1.5;}
.cta::placeholder{color:var(--i3);}
.composer-btns{display:flex;align-items:center;gap:5px;}
.att-btn{width:28px;height:28px;border-radius:7px;color:var(--i3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--fast);}
.att-btn:hover{background:var(--s75);color:var(--i1);}
.send-btn{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background var(--fast),transform var(--fast);}
.send-btn:hover{background:var(--brand-dk);transform:scale(1.04);}
.send-btn.off{background:var(--s200);cursor:default;transform:none;}
.composer-hint{font-size:10px;color:var(--i4);margin-top:5px;text-align:center;}

/* Dropdown */
.dd{position:relative;display:inline-block;}
.ddm{position:absolute;top:calc(100% + 5px);right:0;min-width:200px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);box-shadow:var(--sh-lg);z-index:200;overflow:hidden;display:none;}
.ddm.open{display:block;animation:slideDown 100ms var(--ease);}
.ddi{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:13px;color:var(--i1);cursor:pointer;transition:background var(--fast);}
.ddi:hover{background:var(--s50);}
.ddi svg{color:var(--i3);flex-shrink:0;}
.dd-sep{height:1px;background:var(--border);margin:3px 0;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--i1);color:#fff;font-size:12.5px;font-weight:500;padding:9px 18px;border-radius:999px;z-index:900;pointer-events:none;animation:fadeUp .2s var(--ease);}


/* ─── Data tables and tags (Prospecting, Scoring) ─── */
.dt-wrap{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
.dt-wrap::-webkit-scrollbar{display:none;}
.dt{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12.5px;}
.dt th{padding:11px 16px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3);text-align:left;background:var(--s50);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dt td{padding:13px 16px;color:var(--i2);border-bottom:1px solid var(--s75);vertical-align:middle;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dt tr:last-child td{border-bottom:none;}
.dt tbody tr{transition:background var(--fast);}
.dt tbody tr:hover td{background:#FAFBFC;}
.dt tbody tr.click{cursor:pointer;}
.dt th.num,.dt td.num{text-align:right;}
.stat-link{position:relative;cursor:pointer;display:block;text-decoration:none;transition:background var(--fast) var(--ease);}
.stat-link:hover{background:var(--brand-lt);}
.stat-link::after{content:'›';position:absolute;top:10px;right:14px;font-size:17px;color:var(--i4);transition:color var(--fast) var(--ease),transform var(--fast) var(--ease);}
.stat-link:hover::after{color:var(--brand);transform:translateX(2px);}
.stat-link:hover .stat-lbl{color:var(--brand);}
.col-btn{display:inline-flex;align-items:center;gap:5px;border:none;background:transparent;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;padding:3px 6px;margin:-3px -6px;border-radius:5px;}
.col-btn:hover{background:var(--s100);color:var(--brand);}
.col-btn.on{color:var(--brand);background:var(--brand-lt);}
.col-btn svg{flex-shrink:0;opacity:.75;}
.col-menu{position:fixed;z-index:400;min-width:200px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);box-shadow:var(--sh-lg);padding:6px;}
.col-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:var(--rsm);font-size:12.5px;color:var(--i1);}
.col-menu button:hover{background:var(--s50);}
.col-menu .n{margin-left:auto;font-size:11px;color:var(--i3);}
.col-menu .ck{width:12px;color:var(--brand);font-weight:700;}
.col-filt{appearance:none;-webkit-appearance:none;border:none;background:transparent;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;padding:0;max-width:100%;outline:none;}
.col-filt:hover{color:var(--brand);}
.col-filt.on{color:var(--brand);}
.dt td.num{font-family:var(--fm);font-variant-numeric:tabular-nums;}
.dt td.wrap{white-space:normal;}
.dt .dt-main{color:var(--i1);font-weight:600;overflow:hidden;text-overflow:ellipsis;}
.dt .val{color:var(--i1);overflow:hidden;text-overflow:ellipsis;}
.dt .sub{display:block;font-size:11px;color:var(--i3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;}
.dt .muted{color:var(--i4);}
.dt .person{display:flex;align-items:center;gap:10px;min-width:0;}
.dt .person > div:last-child{min-width:0;}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;}
.dt-empty{padding:28px;text-align:center;font-size:12.5px;color:var(--i3);}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;font-family:var(--fb);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap;background:var(--s75);color:var(--i2);vertical-align:middle;}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.tag-green{background:#E8F5EE;color:#24704F;}
.tag-amber{background:#FDF2E1;color:#A8620F;}
.tag-red{background:#FBEAEA;color:#A83A3A;}
.tag-blue{background:#E4F2FB;color:#00659A;}
.tag-violet{background:#F0EAF8;color:#6A4290;}
.tag-teal{background:#E3F4F2;color:#1B7369;}
.tag-pink{background:#FBE9F1;color:#A1386A;}
.tag-grey{background:#EEF1F4;color:#5B6774;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}

/* ─── Checks pop-up ─── */
@keyframes ckspin{to{transform:rotate(360deg);}}
@keyframes ckpop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.ck{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.ck-wait{border:2px solid var(--s100);}
.ck-run{border:2.5px solid var(--brand-lt);border-top-color:var(--brand);animation:ckspin .7s linear infinite;}
.ck-ok{background:var(--pos);color:#fff;animation:ckpop .2s var(--ease);}
.ck-warn{background:var(--warn);color:#fff;animation:ckpop .2s var(--ease);}
.ck-stop{background:var(--neg);color:#fff;animation:ckpop .2s var(--ease);}
.ck-info{background:var(--s300);color:#fff;animation:ckpop .2s var(--ease);}
.ck-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--s75);transition:opacity var(--base);}
.ck-row.pending{opacity:.45;}

/* ─── Checkboxes: grey when empty, brand colour when ticked ─── */
.dt input[type=checkbox]{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin:0;border-radius:4px;border:1.5px solid var(--s200);background:var(--s75);cursor:pointer;vertical-align:middle;display:inline-grid;place-content:center;transition:background var(--fast),border-color var(--fast);}
.dt input[type=checkbox]:hover{border-color:var(--s300);}
.dt input[type=checkbox]:checked,.dt input[type=checkbox]:indeterminate{background:var(--brand);border-color:var(--brand);}
.dt input[type=checkbox]:checked::after{content:'';width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg);}
.dt input[type=checkbox]:indeterminate::after{content:'';width:8px;height:2px;background:#fff;border-radius:1px;}
.dt input[type=checkbox]:focus-visible{outline:2px solid var(--brand-mid);outline-offset:2px;}

/* ─── Queue rows: lead with why it needs you ─── */
.why{display:flex;flex-direction:column;gap:4px;}
.why-l{font-size:12px;color:var(--i2);line-height:1.45;}
.why-l b{color:var(--i1);font-weight:600;}
tr.held td{opacity:.6;}
.btn-decide{background:var(--brand-lt);border-color:var(--brand-mid);color:var(--brand-dk);}
.btn-decide:hover{background:var(--brand);color:#fff;border-color:var(--brand);}
.btn[disabled]{opacity:.4;cursor:default;}
/* ─── Workspace: one item, the whole screen ─── */
.ws{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);}
.ws-crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--i3);min-width:0;}
.ws-crumb a{color:var(--i3);text-decoration:none;white-space:nowrap;}
.ws-crumb a:hover{color:var(--brand);}
.ws-crumb b{color:var(--i1);font-family:var(--fd);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ws-hero{margin:14px 20px 0;padding:14px 18px;border-radius:var(--rmd);background:var(--surf);border:1px solid var(--border);border-left:5px solid var(--warn);box-shadow:var(--sh);}
.ws-hero.t-neg{border-left-color:var(--neg);background:linear-gradient(90deg,var(--neg-lt),var(--surf) 55%);}
.ws-hero.t-warn{border-left-color:var(--warn);background:linear-gradient(90deg,var(--warn-lt),var(--surf) 55%);}
.ws-hero.t-sec{border-left-color:var(--sec);background:linear-gradient(90deg,var(--sec-lt),var(--surf) 55%);}
.ws-hero.t-brand{border-left-color:var(--brand);background:linear-gradient(90deg,var(--brand-lt),var(--surf) 55%);}
.ws-hero.t-pos{border-left-color:var(--pos);background:linear-gradient(90deg,var(--pos-lt),var(--surf) 55%);}
.ws-hero-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.ws-hero-line{font-family:var(--fd);font-size:17px;font-weight:600;color:var(--i1);line-height:1.4;letter-spacing:-.01em;}
.ws-hero-call{font-size:13.5px;color:var(--i1);margin-top:4px;font-weight:500;}
.ws-missing{margin-top:10px;padding:8px 10px;border-radius:var(--rsm);background:rgba(255,255,255,.7);border:1px dashed var(--warn);font-size:12.5px;color:var(--i1);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ws-missing select{padding:5px 8px;border:1px solid var(--bdk);border-radius:6px;font-size:12.5px;}
.ws-impact{margin-top:10px;font-size:12px;color:var(--i2);}
.ws-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:14px;padding:14px 20px;}
.ws-col{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:4px;}
.ws-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);padding:12px 14px;}
.ws-card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:600;color:var(--i2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;}
.ws-card-h .btn,.ws-card-h .ws-sub,.ws-card-h .tag{text-transform:none;letter-spacing:0;}
.ws-action{font-size:14px;color:var(--i1);line-height:1.45;}
.ws-sub{font-size:11.5px;color:var(--i3);font-weight:400;}
.ws-manual{margin-top:10px;font-size:12px;}
.ws-manual summary{cursor:pointer;color:var(--brand);font-weight:600;}
.ws-manual input{padding:7px 10px;border:1px solid var(--bdk);border-radius:var(--rsm);font-size:12.5px;}
.ws-to{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--s50);border-radius:var(--rsm);margin-bottom:10px;font-size:12.5px;color:var(--i1);}
.ws-lbl{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--i2);margin:10px 0 5px;}
.ws-lbl span{font-weight:400;color:var(--i3);}
.ws-in{width:100%;padding:8px 10px;border:1px solid var(--bdk);border-radius:var(--rsm);font-size:13px;color:var(--i1);font-family:var(--fb);line-height:1.55;resize:vertical;outline:none;}
.ws-in:focus{border-color:var(--brand-mid);box-shadow:0 0 0 3px var(--brand-lt);}
.ws-in[readonly]{background:var(--s50);}
.ws-body{min-height:190px;}
.ws-checks{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.ws-fact{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--s75);font-size:12.5px;color:var(--i1);line-height:1.45;}
.ws-fact:first-of-type{border-top:none;}
.ws-fk{font-size:11.5px;color:var(--i3);}
.ws-cp{display:flex;flex-direction:column;border-color:var(--brand-mid);min-height:260px;}
.ws-cp .ws-card-h{color:var(--brand-dk);}
.ws-cp-body{flex:1;overflow-y:auto;font-size:12.5px;color:var(--i1);line-height:1.5;}
.ws-cp-qs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
.ws-cp-you{margin:10px 0 6px auto;max-width:85%;width:fit-content;padding:6px 10px;background:var(--brand-lt);border-radius:12px 12px 2px 12px;}
.ws-cp-a{display:flex;gap:8px;}
.ws-cp-a > div{flex:1;min-width:0;}
.ws-quote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--brand-mid);background:var(--s50);border-radius:0 6px 6px 0;font-size:12px;}
.ws-quote mark{background:#FBE3B8;padding:0 2px;border-radius:2px;}
.ws-cp-f{display:flex;gap:8px;margin-top:10px;}
.ws-cp-f input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--bdk);border-radius:var(--rsm);font-size:12.5px;outline:none;}
.ws-teach{border-style:dashed;border-color:var(--brand-mid);background:#FCFAFE;}
.ws-locked{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:12px;color:var(--i3);}
.ws-locked label{display:flex;gap:6px;align-items:center;}
.ws-bar{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--surf);border-top:1px solid var(--border);box-shadow:0 -4px 14px rgba(20,26,33,.05);}
.ws-bar input{width:260px;max-width:30vw;padding:7px 10px;border:1px solid var(--bdk);border-radius:var(--rsm);font-size:12.5px;}
.ws-teach-in{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 4px 0 10px;border:1px dashed var(--brand-mid);border-radius:var(--rsm);background:#FCFAFE;height:34px;}
.ws-teach-in input{flex:1;min-width:0;width:auto;max-width:none;border:none;background:transparent;outline:none;padding:0;}
.ws-teach-k{font-size:11.5px;font-weight:700;color:var(--brand-dk);white-space:nowrap;}
.ws-bar .btn{height:34px;padding:0 14px;}
.ws-modal{background:var(--surf);border-radius:var(--rlg);box-shadow:var(--sh-lg);width:100%;max-width:440px;padding:18px 20px;max-height:90vh;overflow-y:auto;}
.ws-modal-h{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--i1);margin-bottom:6px;}
.ws-modal-f{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.ws-radio{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--i1);padding:6px 0;}
.ws-rj{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.ws-rjb{text-align:left;padding:8px 10px;border:1px solid var(--border);border-radius:var(--rsm);background:var(--surf);display:flex;flex-direction:column;gap:2px;}
.ws-rjb b{font-size:12.5px;color:var(--i1);}
.ws-rjb span{font-size:11px;color:var(--i3);}
.ws-rjb:hover{border-color:var(--brand-mid);}
.ws-rjb.on{border-color:var(--brand);background:var(--brand-lt);}
@media (max-width:1100px){ .ws-grid{display:block;overflow-y:auto;} .ws-col{overflow:visible;margin-bottom:12px;} .ws-hero-line{font-size:15.5px;} }

/* ─── Roomier queue ─── */
.tab-why{font-size:12.5px;color:var(--i2);line-height:1.55;margin-bottom:14px;padding:10px 14px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);}
.tab-why b{color:var(--i1);}
#rows .dt td{padding:18px 16px;}
#rows .dt th{padding:12px 16px;}
#rows .dt .dt-main{font-size:13.5px;}
.why-t{display:flex;gap:6px;align-items:center;}
.why-more{font-size:11px;font-weight:700;color:var(--i3);background:var(--s75);border-radius:999px;padding:1px 7px;}
.act{font-size:13px;color:var(--i1);font-weight:500;line-height:1.45;}
/* ─── Shown, but off until after the pilot ─── */
.soon{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px dashed var(--bdk);border-radius:var(--rsm);background:var(--s50);color:var(--i3);font-size:12px;font-weight:600;cursor:help;}
.soon:hover{border-color:var(--brand-mid);color:var(--i2);}
.soon-b{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-dk);background:var(--brand-lt);border-radius:999px;padding:1px 6px;}
.ws-soon-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
/* ─── Copilot chat: grows from the bottom ─── */
.ws-col-chat{overflow:hidden;}
.ws-chat{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--brand-mid);border-radius:var(--rmd);overflow:hidden;}
.ws-chat-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--brand-lt);font-size:12px;font-weight:700;color:var(--brand-dk);letter-spacing:.02em;}
.ws-chat-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;}
.ws-chat-stack{margin-top:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px;}
.ws-chat-foot{border-top:1px solid var(--border);padding:10px 12px 12px;background:var(--surf);}
.ws-chat-foot .ws-cp-qs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.cp-chip{height:27px;padding:0 10px;border-radius:999px;border:1px solid var(--brand-mid);background:var(--surf);color:var(--brand-dk);font-size:11.5px;font-weight:600;}
.cp-chip:hover{background:var(--brand-lt);}
.ws-chat-foot .soon{height:27px;border-radius:999px;font-size:11.5px;}
.ws-chat-foot .ws-cp-f{margin-top:0;}
.ws-chat-foot .ws-cp-f input{border-radius:999px;padding:8px 14px;}
.ws-chat-foot .ws-cp-f .btn{width:34px;height:34px;border-radius:50%;justify-content:center;padding:0;font-size:15px;}
.cp-me{align-self:flex-end;max-width:85%;padding:8px 12px;background:var(--brand);color:#fff;border-radius:14px 14px 4px 14px;font-size:12.5px;}
.cp-ai{display:flex;gap:8px;align-items:flex-start;}
.cp-av{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cp-ai-b{flex:1;min-width:0;font-size:12.5px;color:var(--i1);line-height:1.5;}
.cp-intro,.cp-p{margin-bottom:6px;}
.cp-card{border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;background:var(--surf);box-shadow:var(--sh);}
.cp-card-h{padding:8px 12px;background:var(--s50);border-bottom:1px solid var(--border);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i2);}
.cp-card-b{padding:6px 12px 8px;}
.cp-card-f{padding:7px 12px;border-top:1px solid var(--s75);font-size:11.5px;color:var(--i3);}
.cp-card-f a{color:var(--brand);font-weight:600;text-decoration:none;}
.cp-kv{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--s75);font-size:12.5px;}
.cp-kv:first-child{border-top:none;}
.cp-kv > span{color:var(--i3);font-size:11.5px;}
.cp-sel{padding:3px 6px;border:1px solid var(--bdk);border-radius:6px;font-size:12px;}
.cp-tbl{width:100%;border-collapse:collapse;font-size:12px;}
.cp-tbl th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--i3);padding:4px 6px 4px 0;}
.cp-tbl td{padding:6px 6px 6px 0;border-top:1px solid var(--s75);}
.cp-row{display:flex;gap:8px;align-items:center;padding:4px 0;}
.cp-tl{display:flex;flex-direction:column;}
.cp-tl-i{display:flex;gap:10px;padding:6px 0;position:relative;}
.cp-dot{width:8px;height:8px;border-radius:50%;background:var(--brand-mid);margin-top:5px;flex-shrink:0;box-shadow:0 0 0 3px var(--brand-lt);}
/* ─── Purpose, grouping, row actions ─── */
.purpose{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start;margin-bottom:14px;padding:14px 18px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);}
.pp-t{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--i1);margin-bottom:4px;}
.pp-d{font-size:12.5px;color:var(--i2);line-height:1.55;}
.pp-k{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);margin-bottom:6px;}
.pp-a{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--i2);padding:3px 0;}
.pp-a b{color:var(--i1);min-width:100px;}
.pp-i{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.pp-i.ok{background:var(--pos-lt);color:var(--pos);} .pp-i.no{background:var(--neg-lt);color:var(--neg);} .pp-i.own{background:var(--brand-lt);color:var(--brand-dk);}
.pp-tip{font-size:11px;color:var(--i3);margin-top:6px;}
.grp-tg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--i2);cursor:pointer;white-space:nowrap;}
.grp-tg input{accent-color:var(--brand);}
tr.grp td{background:var(--s50) !important;padding:10px 16px !important;border-bottom:1px solid var(--border);}
.grp-in{display:flex;align-items:center;gap:10px;}
.grp-n{font-size:12px;font-weight:700;color:var(--i1);}
.grp-d{flex:1;font-size:12px;color:var(--i3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dt td:last-child{overflow:visible;}
.row-acts{display:inline-flex;gap:4px;margin-right:6px;opacity:0;transition:opacity var(--fast);}
tr:hover .row-acts,tr:focus-within .row-acts{opacity:1;}
.ra{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surf);font-size:13px;font-weight:700;cursor:pointer;}
.ra.ok{color:var(--pos);} .ra.ok:hover{background:var(--pos);color:#fff;border-color:var(--pos);}
.ra.no{color:var(--neg);} .ra.no:hover{background:var(--neg);color:#fff;border-color:var(--neg);}
.ra.own{color:var(--brand-dk);} .ra.own:hover{background:var(--brand);color:#fff;border-color:var(--brand);}
/* ─── Workspace v3 ─── */
.ws-scroll{flex:1;min-height:0;overflow-y:auto;}
.ws-scroll .ws-grid{flex:none;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);align-items:start;}
.ws-scroll .ws-col{overflow:visible;}
.ws-sec-h{font-size:11px;font-weight:600;color:var(--i2);letter-spacing:.04em;text-transform:uppercase;margin:2px 0 -4px;}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.opt{background:var(--surf);border:1.5px solid var(--border);border-radius:var(--rmd);padding:11px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;}
.opt.pickable{cursor:pointer;} .opt.pickable:hover{border-color:var(--brand-mid);box-shadow:var(--sh);}
.opt.on{border-color:var(--brand);background:var(--brand-lt);}
.opt-h{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);}
.opt.on .opt-h{color:var(--brand-dk);}
.opt-ck{color:var(--brand-dk);letter-spacing:0;text-transform:none;font-size:11.5px;}
.opt-use{color:var(--brand);letter-spacing:0;text-transform:none;font-size:11.5px;}
.opt-a{font-size:13.5px;font-weight:700;color:var(--i1);line-height:1.35;}
.opt-w{font-size:11.5px;color:var(--i2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.opt-m{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:11px;color:var(--i3);}
.opt-m span:first-child{margin-right:2px;}
.opt-own{border-style:dashed;}
.opt-none{background:var(--s50);}
.ws-person{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:var(--rmd);margin-bottom:12px;}
.wp-av{width:40px;height:40px;font-size:13px;border-radius:10px;}
.wp-name{font-family:var(--fd);font-size:14px;font-weight:700;color:var(--i1);}
.wp-title{font-size:12px;color:var(--i2);margin-top:1px;}
.wp-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.wp-reach{text-align:right;}
.wp-row{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;}
.wp-mail{font-size:12.5px;color:var(--i1);}
.ws-facts{padding:0;overflow:hidden;}
.ws-facts .cp-card{border:none;box-shadow:none;}
.ws-dock{background:var(--surf);border-top:1px solid var(--border);padding:10px 20px 12px;box-shadow:0 -4px 14px rgba(20,26,33,.05);}
.ws-dock-row{display:flex;gap:12px;align-items:center;}
.ws-dock .cp-bar{flex:1;max-width:none;margin:0;}
.ws-dec{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.ws-dec .btn{height:40px;padding:0 16px;}
.ws-dec kbd{font-family:var(--fm);font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.25);border:1px solid rgba(0,0,0,.08);margin-left:4px;}
.ws-dec .btn-sec kbd{background:var(--s75);}
.ws-dock .cp-sheet{left:20px;right:20px;max-width:none;}
.ws-dock #wsCpStack{display:flex;flex-direction:column;gap:10px;}
.ws-dock .ws-cp-qs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 10px;border-top:1px solid var(--s75);}
/* ─── Teach the system pop-up ─── */
.teach-pop{position:fixed;right:24px;bottom:96px;width:380px;max-width:calc(100vw - 32px);background:var(--surf);border:1px solid var(--brand-mid);border-radius:14px;box-shadow:var(--sh-lg);z-index:700;animation:fadeUp .2s var(--ease);overflow:hidden;}
.tp-h{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--brand-lt);font-size:12.5px;font-weight:700;color:var(--brand-dk);}
.tp-sub{flex:1;font-weight:400;color:var(--i2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tp-h button{border:none;background:none;cursor:pointer;color:var(--i2);}
.tp-l{font-size:11.5px;font-weight:600;color:var(--i2);padding:10px 12px 6px;}
.tp-tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px;}
.tp-tag{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surf);font-size:11.5px;color:var(--i2);cursor:pointer;}
.tp-tag.on{background:var(--pos-lt);border-color:var(--pos);color:var(--pos);font-weight:600;}
.teach-pop input{display:block;width:calc(100% - 24px);margin:10px 12px 0;padding:8px 10px;border:1px solid var(--bdk);border-radius:var(--rsm);font-size:12.5px;outline:none;}
.tp-soon{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;}
.tp-soon .soon{height:24px;font-size:11px;white-space:nowrap;}
.tp-f{display:flex;align-items:center;gap:6px;padding:10px 12px;}
.tp-bar{flex:1;height:3px;background:var(--s75);border-radius:2px;overflow:hidden;}
.tp-bar i{display:block;height:100%;background:var(--brand-mid);animation:tpbar 12s linear forwards;}
.teach-pop.held .tp-bar i{animation-play-state:paused;}
@keyframes tpbar{from{width:100%}to{width:0}}
@media (max-width:1100px){ .opts{grid-template-columns:1fr;} .ws-scroll .ws-grid{grid-template-columns:1fr;} .ws-dock-row{flex-wrap:wrap;} .purpose{grid-template-columns:1fr;} }
</style>
</head>

<script>
function showToast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function initials(n){return String(n).split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function avColor(id){const c=['#7D52A2','#0094DA','#FF8820','#2E7D5A','#B23F3F'];let h=0;for(const ch of String(id))h+=ch.charCodeAt(0);return c[h%c.length];}
function closeDrawer(){ document.getElementById('detailDrawer').classList.remove('open'); }
function esc(s){return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fallbackDownload(name, text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);}
// On claude.ai the page can't start a download itself: the viewer confirms a save. Opened as a plain file, it downloads directly.
async function download(name, text){
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ dl = null; }
  if(!dl){ fallbackDownload(name, text); return; }
  try{ await dl.save({filename:name, data:text}); showToast(name+' saved'); }
  catch(e){ if(e && e.code==='declined') return; showToast(e && e.code==='rate_limited' ? 'A save is already open' : "This view can't save files"); }
}
function todayIso(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const fmt1 = n => n===undefined||n===null ? '—' : (Math.round(n*10)/10).toLocaleString('en-US',{minimumFractionDigits:n%1?1:0,maximumFractionDigits:1});
const fmtDate = t => new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});

function readFileToGrids(file){
  return new Promise((resolve,reject)=>{
    const isCsv = /\.csv$/i.test(file.name), isXlsx = /\.(xlsx|xls)$/i.test(file.name);
    if(!isCsv && !isXlsx){ reject(new Error('Use a .csv or .xlsx file')); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read the file'));
    reader.onload = ev=>{
      try{
        if(isCsv){ resolve([{sheet:'(CSV)', grid:DemandAI.parseCSV(ev.target.result)}]); return; }
        if(typeof XLSX==='undefined'){ reject(new Error('The Excel reader did not load. Save the sheet as CSV and upload that instead')); return; }
        const wb = XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
        resolve(wb.SheetNames.map(n=>({sheet:n, grid:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})})));
      }catch(e){ reject(e); }
    };
    if(isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
  });
}
function pickSheet(grids){
  const has = g => g.grid.slice(0,10).some(r=>(r||[]).some(c=>String(c).trim().toLowerCase().replace(/\*/g,'').replace(/\s+/g,'_')==='signal_type'));
  return grids.find(g=>/signal template/i.test(g.sheet) && has(g)) || grids.find(has) || grids[0];
}

/* ═══════════════ SHARED PIECES: tables, tags, pop-ups ═══════════════ */
function table(cols, rows, empty){
  return `<div class="dt-wrap"><table class="dt">
    <colgroup>${cols.map(c=>`<col style="width:${c[1]}">`).join('')}</colgroup>
    <thead><tr>${cols.map(c=>`<th class="${c[2]||''}">${c[0]}</th>`).join('')}</tr></thead>
    <tbody>${rows || `<tr><td colspan="${cols.length}" class="dt-empty">${empty}</td></tr>`}</tbody>
  </table></div>`;
}
const cell = (v, sub, cls='val') => `<span class="${cls}" title="${esc(v||'')}">${v?esc(v):'<span class="muted">—</span>'}</span>${sub?`<span class="sub" title="${esc(String(sub).replace(/<[^>]+>/g,''))}">${sub}</span>`:''}`;
const SEG_TONE = {Inquiry:'tag-blue',Modernisation:'tag-violet','Service renewal':'tag-teal',Project:'tag-amber',Leadership:'tag-pink',Engagement:'tag-green'};
function tagChip(t){ const c = DemandAI.CONFIG.signalTypes[t]; return `<span class="tag ${(c&&SEG_TONE[c.segment])||'tag-grey'}">${esc(t)}</span>`; }
function tierPill(t){
  const m = {A:['tag-green','Tier A'],B:['tag-amber','Tier B'],C:['tag-blue','Tier C'],'Watch list':['tag-grey','Watch list'],'Below fit floor':['tag-grey','Below floor'],Excluded:['tag-red','Excluded']}[t];
  return `<span class="tag ${m[0]}">${m[1]}</span>`;
}
function overlay(id){
  let ov = document.getElementById(id);
  if(!ov){ ov=document.createElement('div'); ov.id=id; ov.style.cssText='position:fixed;inset:0;background:rgba(20,26,33,.45);z-index:600;display:flex;align-items:center;justify-content:center;padding:16px'; document.body.appendChild(ov); }
  ov.style.display='flex'; return ov;
}
const hide = id => { const el=document.getElementById(id); if(el) el.style.display='none'; };
function search(fn, ph){ return `<div class="sl-srch"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--i3);flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" placeholder="${ph}" value="${esc(q)}" oninput="q=this.value.toLowerCase();${fn}()"></div>`; }
const pill = (cur,id,label) => `<div class="seg-pill ${cur===id?'active':''}" onclick="filt='${id}';renderResults()">${label}</div>`;

/* ═══════════════ FOR REVIEW: only what needs a person, one item at a time ═══════════════ */
let view = 'queue', q = '', RUNS = {}, MISSING = [], SPOT = null;
const _closeDrawer = closeDrawer;
closeDrawer = function(){ openKey = null; _closeDrawer(); };
function ALL_RUNS(){ return Object.values(RUNS); }
function loadRuns(){
  RUNS = {}; MISSING = [];
  DemandAI.loadSegmentations().forEach(saved=>{
    const c = compute(saved.src, saved.id, saved.createdAt, saved.brandVersion);
    if(c){ sensitiveToApprovals(saved, c.seg.recs); RUNS[saved.id] = { saved, ...c }; } else MISSING.push(saved.name);
  });
}
// Every item across all lists, newest list first, each list in its own order (shuffled within each tier).
function items(){
  return Object.values(RUNS).sort((a,b)=>b.saved.createdAt-a.saved.createdAt)
    .flatMap(run=>run.seg.recs.map(r=>({ id: run.saved.id+'::'+r.key, run, r })));
}
function withRun(it, fn){ const keep = RUN; RUN = it.run; try{ return fn(); } finally { RUN = keep; } }
const decOf = it => withRun(it, ()=>dec(it.r.key));
// The recommended order: whatever is due first comes first.
const dueOfIt = it => withRun(it, ()=>dueOf(it.r, dec(it.r.key)));
const catsOfIt = it => withRun(it, ()=>reasonCats(it.r, dec(it.r.key)));
const myQueue = () => items().filter(it=>withRun(it, ()=>inQueue(dec(it.r.key)) && mine(it.r) && !pausedInfo(it.r))).sort((a,b)=>dueOfIt(a)-dueOfIt(b));
// Filters arriving from Today (?due=today&reason=sensitive&kind=exception).
let FILT = { due:null, reason:null, kind:null, seg:null, rep:null, ch:null }, LOGF = null;
const SOON = ['overdue','today','tomorrow','2days'];
const dueIs = (it, f) => f==='soon' ? SOON.includes(dueBucket(dueOfIt(it))) : dueBucket(dueOfIt(it))===f;
const filtered = its => its.filter(it=>(!FILT.due || dueIs(it, FILT.due)) && (!FILT.reason || catsOfIt(it).includes(FILT.reason))
  && (!FILT.kind || (FILT.kind==='spot' ? decOf(it).spot==='pending' : decOf(it).spot!=='pending'))
  && (!FILT.seg || it.r.segment===FILT.seg) && (!FILT.rep || withRun(it, ()=>ownerOf(it.r))===FILT.rep)
  && (!FILT.ch || withRun(it, ()=>draftOf(it.r).channel)===FILT.ch));
/* Filters live in the column headers (Why it's here, Channel, Due, Owner); a tag in a row filters by its value.
   What's applied shows as chips above the list, with how many rows are left. */
const FILT_KEYS = ['due','reason','kind','seg','rep','ch'];
const DUE_OPTS = [['soon','Next 2 days'],['overdue','Overdue'],['today','Due today'],['tomorrow','Due tomorrow'],['later','Due later']];
const FUNNEL = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></svg>';
// A filterable column header: its name and a funnel; the funnel turns purple when the column is filtered.
const COLOPTS = {};
function colFilter(label, key, opts){
  const cur = key==='why' ? (FILT.kind ? 'k:'+FILT.kind : FILT.reason ? 'r:'+FILT.reason : '') : (FILT[key]||'');
  COLOPTS[key] = { label, opts };
  return `<button class="col-btn ${cur?'on':''}" title="Filter by ${esc(label.toLowerCase())}" onclick="event.stopPropagation();colMenu(this,'${key}')">${esc(label)} ${FUNNEL}</button>`;
}
function colMenu(btn, key){
  document.querySelectorAll('.col-menu').forEach(m=>m.remove());
  const { label, opts } = COLOPTS[key], cur = key==='why' ? (FILT.kind ? 'k:'+FILT.kind : FILT.reason ? 'r:'+FILT.reason : '') : (FILT[key]||'');
  const base = view==='queue' ? myQueue() : items().filter(it=>decOf(it).status==='Awaiting approval' && withRun(it, ()=>mine(it.r) && !pausedInfo(it.r)));
  const count = v => { const keep = FILT; const patch = key==='why' ? { kind: v.startsWith('k:') ? v.slice(2) : null, reason: v.startsWith('r:') ? v.slice(2) : null } : { [key]: v || null };
    FILT = Object.assign({}, FILT, patch); const n = view==='queue' ? filtered(base).length : base.filter(it=>(!FILT.rep || withRun(it, ()=>ownerOf(it.r))===FILT.rep) && (!FILT.ch || withRun(it, ()=>draftOf(it.r).channel)===FILT.ch)).length; FILT = keep; return n; };
  const m = document.createElement('div'); m.className = 'col-menu';
  m.innerHTML = `<div style="padding:4px 10px 6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3)">Filter by ${esc(label.toLowerCase())}</div>`
    + [['', 'All'], ...opts].map(([v,l])=>`<button onclick="colFilt('${key}','${esc(v)}')"><span class="ck">${v===cur?'✓':''}</span>${esc(l)}<span class="n">${count(v)}</span></button>`).join('');
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect(); m.style.top = (r.bottom + 6) + 'px'; m.style.left = Math.max(8, Math.min(r.left - 6, window.innerWidth - m.offsetWidth - 12)) + 'px';
  setTimeout(()=>document.addEventListener('click', function c(e){ if(!m.contains(e.target)){ m.remove(); document.removeEventListener('click', c); } }), 0);
}
function colFilt(key, v){
  document.querySelectorAll('.col-menu').forEach(m=>m.remove());
  if(key==='why') return setFilt({ kind: v.startsWith('k:') ? v.slice(2) : null, reason: v.startsWith('r:') ? v.slice(2) : null });
  setFilt({ [key]: v || null });
}
function filterSummary(total, shown){
  const lbl = { due: v=>(DUE_OPTS.find(o=>o[0]===v)||[,v])[1], reason: v=>REASON_CATS[v], kind: v=>v==='spot'?'Spot-checks':'Exceptions', seg: v=>v, rep: v=>repName(v), ch: v=>v };
  const on = FILT_KEYS.filter(k=>FILT[k] && (view==='queue' || ['rep','ch'].includes(k)));
  return `${on.map(k=>`<span class="seg-pill active" onclick='setFilt(${JSON.stringify({[k]:null})})' title="Remove this filter">${esc(lbl[k](FILT[k]))}${FILT.preset&&k==='due'?' (recommended)':''} ✕</span>`).join('')}
    ${on.length ? '' : `<span style="font-size:11.5px;color:var(--i3);display:inline-flex;align-items:center;gap:5px">${FUNNEL} Filter from the column headers, or click any tag, channel, date or owner in the list</span>`}
    <span style="margin-left:auto;font-size:11.5px;color:var(--i3);white-space:nowrap">Showing <b style="color:var(--i1)">${shown}</b> of ${total}</span>
    ${on.length ? `<a href="#" onclick="setFilt(null);return false" style="font-size:11.5px;color:var(--brand);font-weight:600;text-decoration:none;white-space:nowrap">Clear filters</a>` : ''}`;
}
function setFilt(patch, preset){
  FILT = patch ? Object.assign({}, FILT, patch, {preset: !!preset}) : { due:null, reason:null, kind:null, seg:null, rep:null, ch:null };
  history.replaceState(null, '', location.pathname);
  if(view==='log' || (patch && ['due','reason','kind'].some(k=>k in patch && patch[k]))) view = 'queue';
  render();
}
const pausedCount = () => items().filter(it=>withRun(it, ()=>(inQueue(dec(it.r.key)) || dec(it.r.key).status==='Awaiting approval') && mine(it.r) && pausedInfo(it.r))).length;
function queuePos(key){ const i = myQueue().findIndex(it=>it.run===RUN && it.r.key===key); return i<0 ? null : i+1; }
// One click from the row: accept (or rate a spot-check) as it is, or approve a held message. Rejecting needs a
// reason, so that still opens the item. The time counted is from when the list was shown.
let ROWS_AT = Date.now();
function quickDecide(id){
  const it = items().find(x=>x.id===id); if(!it) return;
  closeDrawer(); document.getElementById('detBody').innerHTML = '';
  RUN = it.run; openedAt = ROWS_AT; pickTags = new Set();
  if(dec(it.r.key).status==='Awaiting approval') managerApprove(it.r.key); else accept(it.r.key);
  const l = it.run.saved.log[0]; if(l && l.key===it.r.key){ l.note = [l.note, 'From the queue row'].filter(Boolean).join(' · '); RUN = it.run; persist(); }
}

function render(){
  WS = null;
  const mgr = isManager(), all = items();
  const queue = myQueue();
  const approvals = all.filter(it=>decOf(it).status==='Awaiting approval' && withRun(it, ()=>mine(it.r) && !pausedInfo(it.r)));
  const rel = all.filter(it=>decOf(it).status==='Released' && withRun(it, ()=>mine(it.r)));
  const logs = Object.values(RUNS).flatMap(run=>run.saved.log.map(l=>({...l, runId:run.saved.id}))).sort((a,b)=>b.at-a.at)
    .filter(l=>mgr || l.who===me().who);
  const auto = all.filter(it=>decOf(it).passed).length;
  const ft = (id,label,n) => `<div class="ftab ${view===id?'active':''}" onclick="view='${id}';q='';LOGF=null;render()">${label} <span class="ftab-cnt">${n}</span></div>`;
  const m = measure(Object.values(RUNS), mgr ? null : myEmail());
  const pc = x => x.pct===null ? '—' : Math.round(x.pct)+'%';
  const tile = (lbl, val, sub, go, tip, tone) => `<a class="stat stat-link" href="#" title="${esc(tip)}" onclick="${go};return false"><div class="stat-lbl">${lbl}</div><div class="stat-val" style="${tone?`color:${tone}`:'color:var(--i1)'}">${val}</div><div class="stat-sub">${sub}</div></a>`;
  const stat = (label, x, sub) => `<div style="flex:1;min-width:120px;padding:10px 14px;border-right:1px solid var(--border)"><div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3)">${label}</div><div style="font-family:var(--fd);font-size:19px;font-weight:700;color:var(--i1);margin-top:2px">${pc(x)}</div><div style="font-size:10.5px;color:var(--i3)">${sub||`${x.a} of ${x.n} accepted`}</div></div>`;
  document.getElementById('mainArea').innerHTML = `
    <div class="topbar">
      <div class="topbar-l"><span class="tb-title">For Review</span><span class="tb-badge badge-neutral">${mgr?'Everyone\'s items':'Your items · '+esc(repName(myEmail()))}</span></div>
      <div class="topbar-r">
        <div style="position:relative">
          <button class="btn btn-sec btn-sm" onclick="event.stopPropagation();toggleExport()">Export <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></button>
          <div id="exportMenu" style="display:none;position:absolute;right:0;top:34px;width:270px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);box-shadow:var(--sh-lg);padding:6px;z-index:250">
            ${[['exportAll(\'approved\')','Released messages','Emails and LinkedIn messages ready to use'],
               ['exportAll(\'tasks\')','Tasks for the team','Calls and follow-ups owned by a person'],
               ['exportAll(\'log\')','Decision log','Who decided what, when and why']].map(([fn,t,d])=>
              `<button onclick="toggleExport(false);${fn}" style="display:block;width:100%;text-align:left;padding:9px 10px;border-radius:var(--rsm)" onmouseover="this.style.background='var(--s50)'" onmouseout="this.style.background=''">
                <span style="display:block;font-size:12.5px;font-weight:600;color:var(--i1)">${t}</span><span style="display:block;font-size:11px;color:var(--i3)">${d}</span></button>`).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="ftabs">${mgr?ft('approvals','Approvals',approvals.length):''}${ft('queue',mgr?'Queue':'My queue',queue.length)}${ft('log','Decision log',logs.length)}</div>
    <div class="canvas">
      ${all.length ? (view==='log' ? `<div class="tab-why"><b>Decision log</b>: who decided what, when and why.</div>` : `<div class="purpose">
          <div class="pp-main"><div class="pp-t">${view==='approvals' ? 'Approvals: sensitive messages wait for you' : 'For Review: what the system could not decide'}</div>
            <div class="pp-d">${view==='approvals'
              ? 'These messages mention a plant incident, security or regulation, so nothing goes out until the sales manager approves it. They come here straight from the system.'
              : `The system sends most outreach on its own (<b>${auto}</b> went ahead without anyone). These ${queue.length} need a person because something is missing or risky. Each row says why.`}</div></div>
          <div class="pp-acts"><div class="pp-k">For each one</div>
            <div class="pp-a"><span class="pp-i ok">✓</span><b>Approve</b><span>it goes out as it is, or as you edited it</span></div>
            <div class="pp-a"><span class="pp-i no">✕</span><b>Reject</b><span>pick a reason; it decides what comes back</span></div>
            <div class="pp-a"><span class="pp-i own">✎</span><b>${view==='approvals'?'Send back':'Write your own'}</b><span>${view==='approvals'?'to the rep, with what to change':'your own action or message'}</span></div>
            <div class="pp-tip">Hover a row to decide from the list, or open one to see everything; it moves to the next when you decide. Keys: A approve · R reject · W write your own · ← →</div></div>
        </div>`) :
        `<div style="font-size:12.5px;color:var(--i2);margin-bottom:12px">Nothing yet. Items arrive here when you build micro-segments. <a href="12-nba.html" style="color:var(--brand);font-weight:600;text-decoration:none">Go to Micro-segments &amp; NBA →</a></div>`}
      ${all.length ? `<div class="stats" style="grid-template-columns:repeat(5,1fr);margin-bottom:14px">

      </div>` : ''}

        <div class="sl-toolbar">${search(view==='log'?'drawLog':'draw', view==='log'?'Search the log…':'Search prospects, companies or actions…')}${view!=='log'?'<div id="filtSum" style="display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap"></div><label class="grp-tg"><input type="checkbox" '+(GROUP?'checked':'')+' onchange="GROUP=this.checked;draw()"> Group by reason</label><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();colsMenu(this)" title="Choose the columns">⚙ Columns</button>':LOGF?`<span class="seg-pill active" onclick="LOGF=null;render()">Flagged, to check ✕</span>`:''}</div>

    </div>`;
  document.getElementById('mainArea').insertAdjacentHTML('beforeend', Copilot.dock({ placeholder: view==='approvals' ? 'Ask Copilot about the approvals…' : 'Ask Copilot about your queue, e.g. group it by the most common reason…',

/* ═══════════════ THE QUEUE: lead with why the system needs you, then the action ═══════════════
   Each row says in plain words where the system is stuck and what it wants to do. "Decide →" opens the item in a
   full-screen workspace with everything needed to decide; other columns are the reviewer's choice. */
const COLS_KEY = 'demandai_review_cols_v1';
const OPT_COLS = [['channel','Channel'],['seg','Micro-segment'],['due','Due'],['owner','Owner'],['list','List']];
function colsOn(){ try{ const s = JSON.parse(localStorage.getItem(COLS_KEY)||'null'); if(s) return s; }catch(e){} return { due:true, owner:true }; }
function setCol(k, on){ const s = colsOn(); s[k] = on; try{ localStorage.setItem(COLS_KEY, JSON.stringify(s)); }catch(e){} draw(); }
function colsMenu(btn){

  const s = colsOn(), m = document.createElement('div'); m.className = 'col-menu';
  m.innerHTML = `<div style="padding:4px 10px 6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3)">Columns</div>

    + OPT_COLS.filter(([k])=>k!=='owner' || isManager()).map(([k,l])=>`<label style="display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12.5px;cursor:pointer"><input type="checkbox" ${s[k]?'checked':''} onchange="setCol('${k}',this.checked)" style="accent-color:var(--brand)">${esc(l)}</label>`).join('');
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect(); m.style.top = (r.bottom + 6) + 'px'; m.style.left = Math.max(8, r.right - m.offsetWidth) + 'px';
  setTimeout(()=>document.addEventListener('click', function c(e){ if(!m.contains(e.target)){ m.remove(); document.removeEventListener('click', c); } }), 0);
}

/* Why it needs you, in plain words: what is stuck, and the call the reviewer has to make. */
const SENSITIVE_RE = /\b(incident|accident|explosion|fatalit\w*|injur\w*|lawsuit|security|cyber|breach\w*|vulnerab\w*|regulat\w*|compliance|emission\w*)\b/i;

  const lr = liveRec(r), c = lr.contact, x = draftOf(r), cats = reasonCats(r, d), { chk } = checksOf(r), cat = cats[0];
  const term = (DemandAIDraftText(x).match(SENSITIVE_RE)||[])[0];
  const L = {
    sensitive: [`The message mentions “${term||'a sensitive topic'}”, a sensitive topic.`, `Should this go to ${firstOf(c)} as it is, or change first?`],
    claim: [`The message makes a claim with no approved source: “${(chk.unsupported[0]||{}).text||'a claim'}”.`, 'Remove or replace the claim, or reject the draft.'],
    low: [`No contact in the primary persona. ${c.name} is ${c.jobTitle||'in another role'}.`, `Is ${firstOf(c)} the right person to approach at ${r.account.name}?`],
    small: [`No micro-segment: fewer than ${DemandAI.CONFIG.minSegmentAccounts} accounts share its signal.`, 'Pick the micro-segment to release it into, then accept.'],
    deal: [(()=>{ const ds = DemandAI.estimateDealSize(r.account); return ds ? `The deal looks small: about USD ${Math.round(ds.value/1000)}k against a ${Math.round(DemandAI.CONFIG.dealSize.threshold/1000)}k threshold.` : 'The deal looks below the size threshold.'; })(), `Is ${r.account.name} worth this outreach anyway?`],
    brand: [`The message breaks a brand rule: ${chk.flags.filter(f=>f.rule!=='Sensitive term').map(f=>f.rule.toLowerCase()+' ('+f.detail+')').join(', ')||'brand rules'}.`, 'Edit the message, or reject it for a new one.'],
    reach: [`No way to reach ${firstOf(c)}: ${(t=>t.charAt(0).toLowerCase()+t.slice(1))(String(x.why||'No verified email or LinkedIn').split(':')[0].replace(/\.$/,''))}.`, 'Find a way to reach them, or put it on hold until the data is fixed.'],
    spot: ['It passed every check and went ahead on its own. It was picked for this week\'s spot-check.', 'Would you have sent this? Rate it.'],
    alternative: [`You rejected “${d.alternativeOf||'the first recommendation'}”. This is the one alternative.`, 'Use this alternative, or reject it to close the account for the pilot.'],
    sentback: [`Sent back by the sales manager: “${d.sentBackNote||''}”.`, 'Change what they asked, then accept again.'],
    intervention: ['You stepped in after it went ahead on its own.', 'Edit it, or reject it.'],
    other: [(d.reasons||exceptionReasons(r))[0] || 'The system could not decide it alone.', 'Accept, change or reject it.'],
  }[cat] || ['The system could not decide it alone.', 'Accept, change or reject it.'];
  const missing = cats.includes('reach') ? 'A way to reach the contact' : cats.includes('small') ? 'A micro-segment' : '';
  return { cat, label: REASON_CATS[cat] || whyHere(d), line: L[0], call: L[1], also: cats.slice(1).map(k=>REASON_CATS[k]).filter(Boolean), missing };
}
const CAT_TONE = { sensitive:'neg', claim:'neg', brand:'warn', low:'warn', small:'warn', deal:'warn', reach:'neg', spot:'sec', alternative:'brand', sentback:'warn', intervention:'brand', other:'warn' };
const toneTag = t => ({neg:'tag-red', warn:'tag-amber', sec:'tag-blue', brand:'tag-violet'})[t] || 'tag-grey';
const onHold = d => !!(d && d.hold);
function segAccounts(seg){ const g = RUN && RUN.seg.segments.find(s=>s.name===seg); return g ? new Set(g.recs.map(x=>x.account.id)).size : 0; }

function draw(){
  const el = document.getElementById('rows'); if(!el) return;
  const mgr = isManager(), on = colsOn();
  const base = view==='queue' ? myQueue() : view==='approvals' ? items().filter(it=>decOf(it).status==='Awaiting approval' && withRun(it, ()=>mine(it.r) && !pausedInfo(it.r))) : null;
  let its = view==='queue' ? filtered(base)
    : view==='approvals' ? base.filter(it=>(!FILT.rep || withRun(it, ()=>ownerOf(it.r))===FILT.rep) && (!FILT.ch || withRun(it, ()=>draftOf(it.r).channel)===FILT.ch))
    : items().filter(it=>decOf(it).status==='Released' && withRun(it, ()=>mine(it.r)));
  if(q) its = its.filter(it=>withRun(it, ()=>(liveRec(it.r).contact.name+' '+it.r.account.name+' '+chosenAction(it.r)).toLowerCase().includes(q)));
  if(view==='queue') its = its.filter(it=>!onHold(decOf(it))).concat(its.filter(it=>onHold(decOf(it))));     // on hold goes last
  WS_LIST = its.map(it=>it.id);
  const src = base || [], cats = {}; src.forEach(it=>catsOfIt(it).forEach(c=>{ cats[c] = 1; }));
  const whyOpts = [['k:exception','Exceptions'],['k:spot','Spot-checks'], ...Object.keys(REASON_CATS).filter(c=>cats[c] && c!=='spot').map(c=>['r:'+c, REASON_CATS[c]])];
  const chOpts = [...new Set(src.map(it=>withRun(it, ()=>draftOf(it.r).channel)))].map(c=>[c,c]);
  const repOpts = Object.keys(REPS).map(e=>[e, repName(e)]);
  const show = { channel:on.channel, seg:on.seg, due:on.due && view!=='released', owner:on.owner && mgr, list:on.list };
  const cols = [['Prospect','18%'], [view==='queue' ? colFilter('Why it needs you','why',whyOpts) : view==='approvals' ? 'Why it needs you' : 'Released','28%'], ['Recommended action','18%']];
  if(show.channel) cols.push([base ? colFilter('Channel','ch',chOpts) : 'Channel','8%']);
  if(show.seg) cols.push(['Micro-segment','11%']);
  if(show.due) cols.push([view==='queue' ? colFilter('Due','due',DUE_OPTS) : 'Due','11%']);
  if(show.owner) cols.push([base ? colFilter('Owner','rep',repOpts) : 'Owner','10%']);
  if(show.list) cols.push(['List','12%']);

    its = its.slice().sort((a,b)=>(cnt[catsOfIt(b)[0]]-cnt[catsOfIt(a)[0]]) || String(catsOfIt(a)[0]).localeCompare(catsOfIt(b)[0]) || (onHold(decOf(a))-onHold(decOf(b))));
    WS_LIST = its.map(it=>it.id);
  }
  let lastCat = null;
  const grpRow = it => { if(!(GROUP && view==='queue')) return ''; const c = catsOfIt(it)[0]; if(c===lastCat) return ''; lastCat = c;
    const n = its.filter(x=>catsOfIt(x)[0]===c).length;
    return `<tr class="grp"><td colspan="${cols.length}"><div class="grp-in"><span class="tag ${toneTag(CAT_TONE[c])}">${esc(REASON_CATS[c]||c)}</span><span class="grp-n">${n} item${n===1?'':'s'}</span><span class="grp-d">${esc(GROUP_WHY[c]||'')}</span>${n>1?`<button class="btn btn-sec btn-sm" onclick="reviewGroup('${c}')">Review these ${n} →</button>`:''}</div></td></tr>`; };
  el.innerHTML = table(cols, its.map(it=>grpRow(it) + withRun(it, ()=>{
      const r = it.r, d = dec(r.key), lr = liveRec(r), x = draftOf(r), s = stuck(r, d), tone = CAT_TONE[s.cat];

        : `<div class="why"><div class="why-t"><span class="tag ${view==='approvals'?'tag-red':toneTag(tone)}" ${view==='queue'?`style="cursor:pointer" title="Show only these" onclick='event.stopPropagation();setFilt(${JSON.stringify(d.spot==='pending'?{kind:'spot',reason:null}:{reason:s.cat,kind:null})})'`:''}>${esc(view==='approvals'?'Sensitive content':s.label)}</span>${s.also.length?`<span class="why-more" title="${esc(s.also.join(', '))}">+${s.also.length}</span>`:''}${onHold(d)?'<span class="tag tag-grey">On hold</span>':''}</div>
            <span class="why-l clamp2" title="${esc(s.line)}">${esc(s.line)}</span></div>`;

        <td><div class="person"><div class="co-av" style="background:${avColor(lr.contact.name)}">${initials(lr.contact.name)}</div><div>${cell(lr.contact.name, esc(r.account.name), 'dt-main')}</div></div></td>
        <td class="wrap">${why}</td>

        ${show.channel ? `<td><span style="cursor:pointer" title="Show only ${esc(x.channel)}" onclick='event.stopPropagation();setFilt(${JSON.stringify({ch:x.channel})})'>${cell(x.channel)}</span></td>` : ''}
