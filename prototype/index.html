<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demand AI prototype</title>
<link rel="icon" href="brand/emplay_mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="rail" aria-label="Menu">
    <div class="brand"><img src="brand/emplay_white.png" alt="Emplay"><span class="prod">Demand AI</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">Prototype on seeded data. Every company and person is invented. Nothing is sent.</div>
  </aside>
  <section class="chat" aria-label="Chat">
    <div class="chat-h"><img src="brand/emplay_mark.png" alt=""><h2>Ask Demand AI</h2><span class="sp"></span><button class="btn sm ghost" onclick="document.getElementById('app').classList.add('chat-off')" title="Hide the chat">Hide</button></div>
    <div class="thread" id="thread"></div>
    <div class="chips" id="chips"></div>
    <form class="composer" onsubmit="CHAT.send();return false"><label class="sr" for="q">Ask</label><input id="q" placeholder="Ask, e.g. What should I work on today?" autocomplete="off"><button class="btn pri" type="submit">Ask</button></form>
  </section>
  <main class="main">
    <div class="top" id="top"></div>
    <div id="banner"></div>
    <div class="work" id="work"></div>
  </main>
</div>
<div class="modal" id="modal" hidden onclick="if(event.target===this)UI.closeModal()"></div>
<button class="btn sm" id="chatOn" style="position:fixed;left:250px;bottom:16px;display:none" onclick="document.getElementById('app').classList.remove('chat-off')">Show the chat</button>
<script src="seed/seed.js"></script>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/views2.js"></script>
<script src="js/chat.js"></script>
<script>
  new MutationObserver(() => { document.getElementById('chatOn').style.display = document.getElementById('app').classList.contains('chat-off') ? 'inline-flex' : 'none'; }).observe(document.getElementById('app'), { attributes: true });
  UI.render(); CHAT.greet();
</script>
</body>
</html>
