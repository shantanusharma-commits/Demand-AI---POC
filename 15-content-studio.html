<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Content studio — DemandAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#7D52A2;--brand-dk:#5E3A80;--brand-lt:#F0EBF8;--brand-mid:#C9B3E8;
  --sec:#0094DA;--sec-lt:#E6F4FC;--sec-dk:#005E8E;
  --ter:#FF8820;--ter-lt:#FFF0E0;--ter-dk:#B85800;
  --pos:#2E7D5A;--pos-lt:#EAF5F0;
  --warn:#C4751A;--warn-lt:#FDF6E8;
  --neg:#B23F3F;--neg-lt:#FBECEC;
  --rail:#130D1C;--rb:rgba(255,255,255,.07);
  --r1:#fff;--r2:rgba(255,255,255,.76);--r3:rgba(255,255,255,.43);--r4:rgba(255,255,255,.21);
  --rhov:rgba(255,255,255,.05);--ract:rgba(125,82,162,.22);
  --bg:#F5F6F9;--surf:#fff;--border:#E5E9EE;--bdk:#D1D7DE;
  --i1:#141A21;--i2:#4A5664;--i3:#9DA8B5;--i4:#C9D1DA;
  --s50:#F4F6F8;--s75:#ECEFF3;--s100:#E1E6EC;--s200:#C9D1DA;--s300:#9DA8B5;
  --fd:"Sora",system-ui,sans-serif;
  --fb:"Plus Jakarta Sans",-apple-system,sans-serif;
  --fm:"JetBrains Mono",monospace;
  --rsm:8px;--rmd:12px;--rlg:16px;
  --ease:cubic-bezier(.4,0,.2,1);--fast:120ms;--base:200ms;
  --sh:0 2px 8px rgba(20,26,33,.07),0 1px 3px rgba(20,26,33,.05);
  --sh-lg:0 8px 40px rgba(20,26,33,.14),0 2px 8px rgba(20,26,33,.08);
  --nav-w:224px;--chat-w:400px;--hh:54px;--tabs-h:42px;
}
*,*::before,*::after{box-sizing:border-box;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{margin:0;font-family:var(--fb);font-size:14px;background:var(--bg);color:var(--i1);overflow:hidden;height:100vh;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font:inherit;}
:root{color-scheme:light;}
input,textarea,select{background-color:#fff;color:var(--i1);}
textarea[readonly],input[readonly]{background-color:var(--s50);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--s200);border-radius:2px;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(1.3);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideLeft{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}
@keyframes msgIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{width:0}to{width:var(--bw)}}

/* ─── SHELL ─────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;height:100vh;width:100vw;}

/* ─── NAV ─────────────────────────────── */
.nav{background:var(--rail);display:flex;flex-direction:column;height:100vh;overflow:hidden;border-right:1px solid var(--rb);}
.nav-brand{display:flex;align-items:center;gap:9px;padding:13px 13px 11px;border-bottom:1px solid var(--rb);flex-shrink:0;}
.nav-nm{font-family:var(--fd);font-size:14px;font-weight:600;color:var(--r1);letter-spacing:-.01em;}
.nav-org{font-size:10px;color:var(--r3);margin-top:1px;}
.nav-body{flex:1;overflow-y:auto;padding:6px 0;}
.nav-body::-webkit-scrollbar{width:3px;}
.nav-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);}
.nav-sec{padding:8px 14px 3px;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--r4);font-weight:600;}
.nav-item{display:flex;text-decoration:none;align-items:center;gap:9px;height:32px;padding:0 10px;margin:1px 6px;border-radius:7px;color:var(--r3);font-size:12.5px;font-weight:500;cursor:pointer;position:relative;transition:background var(--fast) var(--ease),color var(--fast) var(--ease);}
.nav-item:hover{background:var(--rhov);color:var(--r2);}
.nav-item.active{background:var(--ract);color:var(--r1);}
.nav-item.active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2.5px;background:var(--brand-mid);border-radius:0 2px 2px 0;}
.nav-ic{width:15px;height:15px;flex-shrink:0;opacity:.7;}
.nav-item.active .nav-ic{opacity:1;color:var(--brand-mid);}
.nav-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-div{height:1px;background:var(--rb);margin:6px 10px;}
.nav-foot{padding:10px;border-top:1px solid var(--rb);flex-shrink:0;}
.nav-user{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--rsm);cursor:pointer;transition:background var(--fast) var(--ease);}
.nav-user:hover{background:var(--rhov);}
.nav-av{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.nav-un{font-size:12px;color:var(--r2);font-weight:500;}
.nav-ur{font-size:10px;color:var(--r4);margin-top:1px;}

/* ─── MAIN ─────────────────────────────── */
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0;}

/* Topbar */
.topbar{height:var(--hh);padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0;gap:10px;}
.topbar-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.tb-title{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--i1);}
.tb-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;}
.badge-live{background:var(--pos-lt);color:var(--pos);}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite;}
.badge-neutral{background:var(--s100);color:var(--i3);}
.topbar-r{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--fb);font-size:12.5px;font-weight:600;height:30px;padding:0 12px;border-radius:var(--rsm);border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:all var(--fast) var(--ease);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dk);}
.btn-sec{background:var(--surf);border-color:var(--bdk);color:var(--i1);}
.btn-sec:hover{background:var(--s75);}
.btn-copilot{background:var(--brand-lt);border-color:var(--brand-mid);color:var(--brand-dk);}
.btn-copilot:hover{background:var(--brand-mid);}
.btn-copilot.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.btn-ghost{color:var(--i2);}
.btn-ghost:hover{background:var(--s75);}
.btn-sm{height:27px;font-size:11.5px;padding:0 10px;border-radius:6px;}

/* Tabs */
.ftabs{height:var(--tabs-h);padding:0 20px;display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--border);background:var(--surf);flex-shrink:0;}
.ftab{display:flex;align-items:center;gap:6px;padding:0 16px;font-size:13px;font-weight:500;color:var(--i3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color var(--fast) var(--ease);}
.ftab:hover{color:var(--i2);}
.ftab.active{color:var(--i1);border-bottom-color:var(--brand);}
.ftab-cnt{font-family:var(--fm);font-size:10.5px;color:var(--i4);}
.ftab.active .ftab-cnt{color:var(--brand);}

/* Canvas */
.canvas{flex:1;overflow-y:auto;padding:16px 20px 40px;}
.canvas::-webkit-scrollbar{width:5px;}

/* ─── STATS STRIP ─────────────────────── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;margin-bottom:16px;}
.stat{padding:13px 16px;border-right:1px solid var(--border);}
.stat:last-child{border-right:none;}
.stat-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--i3);font-weight:600;margin-bottom:4px;}
.stat-val{font-family:var(--fd);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:3px;}
.stat-sub{font-size:11px;color:var(--i3);}
.sv1{color:var(--brand);}
.sv2{color:var(--sec);}
.sv3{color:var(--ter-dk);}
.sv4{color:var(--pos);}
.sv5{color:var(--i1);}
.stat-link:hover{background:var(--s50);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--i1);color:#fff;font-size:12.5px;font-weight:500;padding:9px 18px;border-radius:999px;z-index:900;pointer-events:none;animation:fadeUp .2s var(--ease);}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;font-family:var(--fb);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap;background:var(--s75);color:var(--i2);vertical-align:middle;}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.tag-green{background:#E8F5EE;color:#24704F;}
.tag-amber{background:#FDF2E1;color:#A8620F;}
.tag-red{background:#FBEAEA;color:#A83A3A;}
.tag-blue{background:#E4F2FB;color:#00659A;}
.tag-violet{background:#F0EAF8;color:#6A4290;}
.tag-teal{background:#E3F4F2;color:#1B7369;}
.tag-pink{background:#FBE9F1;color:#A1386A;}
.tag-grey{background:#EEF1F4;color:#5B6774;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}

/* ─── CONTENT STUDIO ─────────────────────── */
.tb-crumb{font-size:12.5px;color:var(--i3);display:flex;align-items:center;gap:6px;min-width:0;}
.tb-crumb a{color:var(--i3);cursor:pointer;text-decoration:none;}
.tb-crumb a:hover{color:var(--brand);}
.tb-crumb b{color:var(--i1);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sub{font-size:12px;color:var(--i3);line-height:1.55;}
.panel{background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.fchip{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--bdk);background:var(--surf);font-size:12px;font-weight:500;color:var(--i2);}
.fchip.on{background:var(--brand-lt);border-color:var(--brand-mid);color:var(--brand-dk);font-weight:600;}
.fchip .n{font-family:var(--fm);font-size:10.5px;color:var(--i3);margin-left:4px;}
.search{height:30px;border:1px solid var(--bdk);border-radius:var(--rsm);padding:0 10px;font-size:12.5px;width:220px;}
.ltbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.ltbl th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--s50);white-space:nowrap;}
.ltbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.ltbl tr.row{cursor:pointer;}
.ltbl tr.row:hover td{background:var(--s50);}
.ltbl tr:last-child td{border-bottom:none;}
.t-title{font-weight:600;color:var(--i1);}
.t-sub{font-size:11px;color:var(--i3);margin-top:2px;}
.empty{padding:40px 20px;text-align:center;color:var(--i3);font-size:12.5px;}
.camp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.camp{background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);padding:14px 16px;cursor:pointer;transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease);}
.camp:hover{border-color:var(--brand-mid);box-shadow:var(--sh);}
.camp-nm{font-family:var(--fd);font-size:14px;font-weight:600;margin-bottom:4px;}
.camp-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.camp-new{border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--brand);font-weight:600;min-height:120px;}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
.chead h2{font-family:var(--fd);font-size:17px;margin:0 0 4px;}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--i2);margin-top:6px;}
.kv b{font-weight:600;color:var(--i1);}

/* Modal (Flowbite modal pattern) */
.mov{position:fixed;inset:0;background:rgba(20,26,33,.42);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:500;overflow-y:auto;}
.mdl{background:var(--surf);border-radius:var(--rlg);box-shadow:var(--sh-lg);width:100%;max-width:620px;animation:fadeUp .18s var(--ease);}
.mdl-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.mdl-h h3{margin:0;font-family:var(--fd);font-size:15px;}
.mdl-b{padding:16px 20px;display:flex;flex-direction:column;gap:14px;max-height:66vh;overflow-y:auto;}
.mdl-f{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--border);}
.lbl{font-size:11.5px;font-weight:600;color:var(--i2);margin-bottom:6px;display:block;}
.inp,.sel,.ta{width:100%;border:1px solid var(--bdk);border-radius:var(--rsm);padding:7px 10px;font-size:13px;}
.ta{min-height:64px;resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.types{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.type{border:1px solid var(--bdk);border-radius:var(--rsm);padding:10px 8px;text-align:center;font-size:12px;font-weight:600;color:var(--i2);background:var(--surf);}
.type .ic{font-size:18px;display:block;margin-bottom:4px;}
.type.on{border-color:var(--brand);background:var(--brand-lt);color:var(--brand-dk);}
.seg{display:inline-flex;border:1px solid var(--bdk);border-radius:var(--rsm);overflow:hidden;}
.seg button{height:30px;padding:0 12px;font-size:12px;font-weight:500;color:var(--i2);border-right:1px solid var(--bdk);}
.seg button:last-child{border-right:none;}
.seg button.on{background:var(--brand);color:#fff;}
.brandbox{background:var(--brand-lt);border:1px solid var(--brand-mid);border-radius:var(--rsm);padding:10px 12px;font-size:12px;color:var(--brand-dk);line-height:1.55;}
.srcs{display:flex;flex-direction:column;gap:6px;}
.src{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--i2);padding:7px 9px;border:1px solid var(--border);border-radius:var(--rsm);}
.src input{margin-top:2px;}
.src b{color:var(--i1);font-weight:600;}

/* Split view: chat left, document right */
.studio{display:grid;grid-template-columns:clamp(300px,27vw,380px) minmax(0,1fr);height:100%;min-height:0;}
.chat{display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surf);min-height:0;}
.chat-h{padding:12px 14px;border-bottom:1px solid var(--border);}
.chat-h .t{font-family:var(--fd);font-size:13px;font-weight:600;}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:92%;font-size:12.5px;line-height:1.55;padding:9px 12px;border-radius:12px;animation:msgIn .15s var(--ease);white-space:pre-wrap;}
.msg.ai{background:var(--s75);color:var(--i1);border-top-left-radius:4px;align-self:flex-start;}
.msg.me{background:var(--brand);color:#fff;border-top-right-radius:4px;align-self:flex-end;}
.msg .who{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-bottom:3px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;}
.chip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--brand-mid);background:var(--brand-lt);color:var(--brand-dk);font-size:11.5px;font-weight:600;}
.chip:hover{background:var(--brand-mid);}
.target{margin:0 14px 8px;font-size:11.5px;background:var(--ter-lt);color:var(--ter-dk);border-radius:var(--rsm);padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.target button{font-weight:700;color:var(--ter-dk);}
.composer{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--border);}
.composer textarea{flex:1;border:1px solid var(--bdk);border-radius:var(--rsm);padding:8px 10px;font-size:12.5px;resize:none;height:40px;}
.docside{display:flex;flex-direction:column;min-height:0;background:var(--bg);}
.doc-tools{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding:8px 16px;background:var(--surf);border-bottom:1px solid var(--border);}
.doc-tools .sp{flex:1;}
.doc-tools .lab{font-size:11px;color:var(--i3);font-weight:600;}
.tbtn{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--i2);font-size:13px;}
.tbtn:hover{background:var(--s75);color:var(--i1);}
.tsep{width:1px;height:18px;background:var(--border);}
.doc-scroll{flex:1;overflow-y:auto;padding:24px 20px 60px;}
.paper{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:var(--rmd);box-shadow:var(--sh);padding:40px 56px 48px;}
.paper-meta{max-width:760px;margin:0 auto 10px;display:flex;gap:6px;flex-wrap:nowrap;align-items:center;white-space:nowrap;overflow:hidden;}
#doc{outline:none;font-size:15px;line-height:1.7;color:#1d242c;font-family:var(--fb);}
#doc h1{font-family:var(--fd);font-size:26px;line-height:1.25;margin:0 0 16px;letter-spacing:-.02em;}
#doc h2{font-family:var(--fd);font-size:18px;margin:26px 0 8px;}
#doc p{margin:0 0 12px;}
#doc ul,#doc ol{margin:0 0 12px;padding-left:22px;}
#doc blockquote{margin:0 0 12px;padding:8px 14px;border-left:3px solid var(--brand-mid);color:var(--i2);background:var(--s50);}
#doc [data-b]{position:relative;border-radius:4px;transition:background var(--fast) var(--ease);}
#doc [data-b]:hover{background:#FAF8FD;}
#doc [data-b].sel{background:#FFF6EC;box-shadow:-10px 0 0 #FFF6EC,10px 0 0 #FFF6EC;}
#doc [data-b].flash{animation:flash 1.1s var(--ease);}
@keyframes flash{0%{background:#EAF5F0}100%{background:transparent}}
.gutter{position:absolute;display:none;gap:4px;z-index:5;}
.gutter button{height:24px;padding:0 8px;border-radius:6px;background:var(--surf);border:1px solid var(--bdk);font-size:11px;font-weight:600;color:var(--i2);box-shadow:var(--sh);}
.gutter button:hover{border-color:var(--brand);color:var(--brand);}
.checks{max-width:760px;margin:12px auto 0;}
.chk-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;}
.chk-detail{margin-top:8px;font-size:12px;color:var(--i2);line-height:1.6;}
.chk-detail div{padding:3px 0;}
.okc{color:var(--pos);font-weight:600;}
.badc{color:var(--neg);font-weight:600;}
.savebar{display:flex;align-items:center;gap:8px;}
.dd{position:relative;display:inline-block;}
.ddm{position:absolute;top:calc(100% + 5px);right:0;min-width:200px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);box-shadow:var(--sh-lg);z-index:200;overflow:hidden;display:none;}
.ddm.open{display:block;}
.ddm button{display:block;width:100%;text-align:left;padding:9px 14px;font-size:12.5px;color:var(--i1);}
.ddm button:hover{background:var(--s50);}
.ddm .h{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);font-weight:600;padding:8px 14px 4px;}
.skill{font-family:var(--fm);font-size:10.5px;background:var(--s75);color:var(--i2);padding:2px 6px;border-radius:4px;}

@media print{
  body{overflow:visible;height:auto;background:#fff;}
  .nav,.chat,.doc-tools,.topbar,.paper-meta,.checks,.gutter,#roleSwitchBtn{display:none !important;}
  .shell,.studio{display:block;height:auto;}
  .main,.docside,.doc-scroll{height:auto;overflow:visible;background:#fff;padding:0;}
  .paper{border:none;box-shadow:none;padding:0;max-width:none;}

// On claude.ai the page can't start a download itself: the viewer confirms a save. Opened as a plain file, it downloads directly.
async function download(name, text){
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ dl = null; }
  if(!dl){ fallbackDownload(name, text); return; }

  catch(e){ if(e && e.code==='declined') return; showToast(e && e.code==='rate_limited' ? 'A save is already open' : "This view can't save files"); }
}

const GEN = {

const CONTRACT = [[/\bI'm\b/g, 'I am'], [/\bit's\b/g, 'it is'], [/\bIt's\b/g, 'It is'], [/\byou're\b/g, 'you are'], [/\bYou're\b/g, 'You are'],
  [/\bdon't\b/g, 'do not'], [/\bcan't\b/g, 'cannot'], [/\bwon't\b/g, 'will not'], [/\bwe'll\b/g, 'we will'], [/\bwe'd\b/g, 'we would'],
  [/\byou'd\b/g, 'you would'], [/\bWhat's\b/g, 'What is'], [/\bthat's\b/g, 'that is'], [/\bthere's\b/g, 'there is'], [/\bwe're\b/g, 'we are'],
  [/\baren't\b/g, 'are not'], [/\bisn't\b/g, 'is not'], [/\bThey're\b/g, 'They are'], [/\bthey're\b/g, 'they are']];
function toneize(text, tone, role) {
  if (Array.isArray(text)) return text.map(t => toneize(t, tone, role));
  let t = String(text);
  if (tone === 'Formal') { for (const [a, b] of CONTRACT) t = t.replace(a, b); t = t.replace(/^Hi \{/, 'Dear {').replace(/^Hi\b/, 'Dear'); }
  if (tone === 'Warm') {
    if (role === 'intro' || role === 'summary') t += ' We hope it helps.';
    if (role === 'cta' || role === 'ecta' || role === 'pcta') t += ' We would be glad to help.';
  }
  return t;
}
function ctxOf(it) {
  const pack = E.brandPack();
  const fw = (pack.framework && pack.framework[it.seg]) || E.PLAYBOOK[it.seg] || E.PLAYBOOK.Engagement;
  return { it, fw, claims: E.approvedClaims().filter(c => (it.sources || []).includes(c.id)), topic: it.topic || it.title,
    persona: PERSONA[it.seg] || 'teams', voice: E.VOICE_PRESETS[it.tone] || E.VOICE_PRESETS.Direct, signoff: (pack.voice && pack.voice.signoff) || 'Client Team' };
}
function genBlock(c, role, v) {
  const text = toneize(GEN[role](c, v), c.it.tone, role);
  const tag = role === 'title' ? 'h1' : LIST_ROLES[role] || 'p';
  return { tag, role, v, text };
}
// The plan for a whole document: the sections for this type and length, with headings.
function generate(it) {
  const c = ctxOf(it), out = [];
  for (const role of LAYOUT[it.type][it.length]) {
    if (PROOF_ROLES.includes(role) && !c.claims.length) continue;     // no approved source, no proof section
    if (HEAD[role] && it.type !== 'email' && it.type !== 'post') out.push({ tag: 'h2', role: 'h:' + role, v: 0, text: HEAD[role][0] });
    out.push(genBlock(c, role, 0));
  }
  return out;
}
function blockInner(b) {
  if (b.tag === 'ul' || b.tag === 'ol') return b.text.map(i => `<li>${esc(i)}</li>`).join('');
  return esc(b.text).replace(/\n/g, '<br>');
}
const blockHtml = b => `<${b.tag} data-b="${uid()}" data-role="${b.role}" data-v="${b.v || 0}">${blockInner(b)}</${b.tag}>`;
const docHtml = blocks => blocks.map(blockHtml).join('');

/* ─── Seed: two campaigns and a few pieces, so the library isn't empty on first open ─── */
// The approved sources a piece actually cites, read back through the claim check.
const citedIn = it => E.checkContent(textOfHtml(it.html)).claims.filter(c => c.verified).map(c => c.source.split(' · ')[0]);
function newItem(o) {
  const it = Object.assign({ id: uid(), type: 'blog', title: '', topic: '', campaign: '', seg: 'Modernisation', tone: brandTone(), length: 'Medium',
    sources: [], notes: '', status: 'Draft', brandV: E.brandPack().v, created: Date.now(), updated: Date.now(), by: me(), chat: [], versions: [] }, o);
  if (!it.title) it.title = it.topic;
  it.html = docHtml(generate(it));
  if (!it.chat.length) { const used = citedIn(it);
    it.chat = [{ who: 'ai', text: `Drafted with the ${TYPES[it.type].skill} instructions and Brand v${it.brandV}: ${it.tone} voice, ${it.length.toLowerCase()} length. ` +
      (used.length ? `Cites ${used.join(', ')} word for word.` : 'It makes no product claims.') + '\n\nClick any paragraph to change just that one, or tell me what to change in the whole piece.' }]; }

}

  const items = [
    newItem({ type: 'blog', title: 'Plan the migration before end of support sets the date', topic: 'control system migration', campaign: 'c1', seg: 'Modernisation', sources: ['CS-01', 'OP-02'], status: 'Ready', created: d(10), updated: d(3), by: 'Pavan Kumar' }),
    newItem({ type: 'email', title: 'Migration planning: first-touch email', topic: 'planning your control system migration', campaign: 'c1', seg: 'Modernisation', sources: ['CS-01'], length: 'Medium', created: d(4), updated: d(2), by: 'Sofia Ahlgren' }),
    newItem({ type: 'whitepaper', title: 'Modernising legacy control systems: a planning guide', topic: 'legacy control system modernisation', campaign: 'c1', seg: 'Modernisation', sources: ['CS-01', 'OP-02', 'BR-03'], length: 'Long', created: d(9), updated: d(1), by: 'Pavan Kumar' }),
    newItem({ type: 'post', title: 'Renewal season: check the cover still fits', topic: 'service contract renewal', campaign: 'c2', seg: 'Service renewal', sources: ['BR-03'], length: 'Long', status: 'Ready', created: d(5), updated: d(5), by: 'Sofia Ahlgren' }),

/* ─── Checks: the same brand and claim checks the outreach drafts get ─── */
function textOfHtml(html) { const d = document.createElement('div'); d.innerHTML = html; return blocksText(d); }
function blocksText(root) {
  return Array.from(root.children).map(el => (el.tagName === 'UL' || el.tagName === 'OL') ? Array.from(el.children).map(li => li.textContent).join('\n') : el.innerText || el.textContent).join('\n');

function checksOf(it) { return E.checkContent(textOfHtml(it.html)); }

const statusTag = s => s === 'Ready' ? '<span class="tag tag-green">Ready to use</span>' : '<span class="tag tag-grey">Draft</span>';
const typeTag = t => `<span class="tag tag-violet">${TYPES[t].label}</span>`;
const campOf = id => S.campaigns.find(c => c.id === id);

/* ─── Views ─── */
let VIEW = { tab: 'library', camp: null, item: null };

function libraryView() {

  const ready = withChk.filter(x => x.it.status === 'Ready').length, fix = withChk.filter(x => issuesOf(x.chk)).length;

  const stats = `<div class="stats" style="grid-template-columns:repeat(4,1fr)">

    ${tile('Ready to use', ready, 'Checks pass, marked ready', 'sv4', LF.status === 'Ready', "setLF({status:'Ready',fix:false})")}
    ${tile('Need a fix', fix, 'A brand or claim check failed', 'sv3', LF.fix, "setLF({fix:true,status:''})")}

      `<p data-b="${uid()}" data-role="free" data-v="0" data-edited="1">${esc(`${cap(topic)} is worth its own conversation. ${tone} usually where plans differ most from site to site, so start with how your site handles it today and what you would want to change.`)}</p>`;
    const anchor = doc.querySelector('[data-role="h:cta"],[data-role="ecta"],[data-role="pcta"],[data-role="h:sask"]');
    const nodes = Array.from(frag.children); nodes.forEach(n => doc.insertBefore(n, anchor)); afterChange(nodes[nodes.length - 1]);
    return `Added a section on ${topic}${anchor ? ' before the close' : ''}. It makes no product claims; edit it or ask me to add proof from an approved source.`;
  }
  if (/proof|case study|example|evidence|source|cite/.test(low) || (m = q.match(/\b(?:mention|include|talk about)\b\s+(?:the\s+)?(.+)/i))) {
    const c = claimFor(q);
    if (c) { const at = addClaim(c, el && el.tagName === 'P' ? el : null); afterChange(at); return `Added an approved claim, word for word with its citation: ${c.id} · ${c.title} [${c.type}, ${c.year}].`; }
    if (m) {
      const what = noDot(m[1]); const p = el && el.tagName === 'P' ? el : doc.querySelector('[data-role="cta"],[data-role="ecta"],[data-role="pcta"],[data-role="sask"]') || doc.lastElementChild;
      p.textContent = p.textContent.trim() + ` Is ${lc(what)} part of your plans?`; p.dataset.edited = '1'; afterChange(p);
      return `There's no approved source on ${what}, so I added it as a question rather than a claim.`;
    }
    UNDO.pop(); return "There's no approved source for this audience to cite. Add one in the Content library and I'll use it word for word.";
  }
  if (/formal|professional/.test(low)) return applyTone('Formal', el);
  if (/warm|friendl/.test(low)) return applyTone('Warm', el);
  if (/direct|crisp|punch/.test(low)) return applyTone('Direct', el);
  if (/short|concise|cut|trim|tighten/.test(low)) {
    const els = el ? [el] : Array.from(doc.querySelectorAll('#doc > p, #doc > ul, #doc > ol')); let n = 0;
    els.forEach(x => { if (shorten(x)) n++; });
    if (!n) { UNDO.pop(); return el ? "That part is already as short as it can go without losing its point." : 'Everything is already short. Try a shorter length from the toolbar.'; }
    afterChange(el); return el ? 'Shortened it. Cited claims are kept as they are.' : `Shortened ${n} part${n > 1 ? 's' : ''}. Cited claims are kept as they are.`;
  }
  if (/long|detail|expand|elaborate|more/.test(low)) {
    if (el) { if (lengthen(el)) { afterChange(el); return 'Added a line. No new claims.'; } UNDO.pop(); return "I've added all I can without making claims. Ask me to add proof from an approved source."; }
    const missing = LAYOUT[it.type].Long.filter(r => !doc.querySelector(`[data-role="${r}"]`) && !(PROOF_ROLES.includes(r) && !ctxOf(it).claims.length));
    if (!missing.length) { UNDO.pop(); return 'It already has every section for this type. Ask me to add a section on a specific topic.'; }
    const r = missing[0], c = ctxOf(it), frag = document.createElement('div');
    frag.innerHTML = (HEAD[r] && it.type !== 'email' && it.type !== 'post' ? blockHtml({ tag: 'h2', role: 'h:' + r, v: 0, text: HEAD[r][0] }) : '') + blockHtml(genBlock(c, r, 0));
    const anchor = doc.querySelector('[data-role="h:cta"],[data-role="ecta"],[data-role="pcta"],[data-role="h:sask"],[data-role="closing"]');
    const nodes = Array.from(frag.children); nodes.forEach(n => doc.insertBefore(n, anchor)); afterChange(nodes[nodes.length - 1]);
    return `Added “${HEAD[r] ? HEAD[r][0] : r}”.`;
  }
  if (/regenerate|rewrite|again|another|different/.test(low)) {
    if (el) { UNDO.pop(); regenTarget(); return 'Here is another version.'; }
    doc.innerHTML = docHtml(generate(it)); afterChange(); return 'Rewrote the whole piece from the brief. Your earlier version is one Undo away.';
  }
  if (/remove|delete|drop/.test(low) && el) { el.remove(); TARGET = null; afterChange(); return 'Removed it.'; }
  UNDO.pop();
  return `I can change ${scope}: make it shorter or longer, change the tone (direct, formal, warm), rewrite it, change the title, add a section on a topic, or add proof from an approved source. I won't add claims that aren't in the approved sources.`;
}
function applyTone(tone, el) {
  const it = cur(), doc = document.getElementById('doc');
  if (el) { const old = it.tone; it.tone = tone; retoneEl(el, tone); it.tone = old; afterChange(el); return `Made that part ${tone.toLowerCase()}. The piece's tone is still ${old}.`; }
  it.tone = tone; Array.from(doc.children).forEach(x => retoneEl(x, tone)); afterChange();
  const s = document.querySelector('.doc-tools select'); if (s) s.value = tone;
  return `Switched the piece to a ${tone.toLowerCase()} tone. Paragraphs you edited yourself keep your wording${tone === 'Formal' ? ', with contractions written out' : ''}.`;
}
function setTone(t) { snapshot(); say('me', `Tone: ${t}`); say('ai', applyTone(t)); }
function setLength(l) {
  const it = cur();
  if (Array.from(document.querySelectorAll('#doc > [data-edited]')).length && !confirm(`Rewrite the piece at ${l} length? Your own edits are replaced; Undo brings them back.`)) { document.querySelectorAll('.doc-tools select')[1].value = it.length; return; }
  snapshot(); it.length = l; document.getElementById('doc').innerHTML = docHtml(generate(it)); afterChange();
  say('me', `Length: ${l}`); say('ai', `Rewrote it at ${l.toLowerCase()} length: ${LAYOUT[it.type][l].length} parts.`);
}
function setCampaign(id) { const it = cur(); persistDoc(); const d = DIRTY; it.campaign = id; saveStore(); showToast(id ? `Attached to ${campOf(id).name}` : 'Removed from the campaign'); render(); setDirty(d); }

/* ─── Save, ready, download ─── */
function saveDoc(silent) {
  const it = cur(); persistDoc(); const h = document.querySelector('#doc h1'); if (h && h.textContent.trim()) it.title = h.textContent.trim();
  it.updated = Date.now(); it.by = me(); it.versions = (it.versions || []).concat([{ at: Date.now(), by: me() }]).slice(-20);
  saveStore(); setDirty(false); document.getElementById('crumbTitle').textContent = it.title; if (!silent) showToast('Saved to the library');
}
function markReady() {
  const it = cur();
  if (it.status === 'Ready') { it.status = 'Draft'; saveDoc(true); render(); showToast('Back to draft'); return; }
  const chk = runChecks();
  if (issuesOf(chk)) { CHK_OPEN = true; runChecks(); document.getElementById('checks').scrollIntoView({ behavior: 'smooth', block: 'center' }); showToast(`Fix ${issuesOf(chk)} check${issuesOf(chk) > 1 ? 's' : ''} first`); return; }
  it.status = 'Ready'; saveDoc(true); render(); showToast('Marked ready to use');
}
function toggleDD(id, e) { e.stopPropagation(); const d = document.getElementById(id); const open = d.classList.contains('open'); document.querySelectorAll('.ddm.open').forEach(x => x.classList.remove('open')); if (!open) d.classList.add('open'); }
document.addEventListener('click', () => document.querySelectorAll('.ddm.open').forEach(x => x.classList.remove('open')));
function toMarkdown(root) {
  return Array.from(root.children).map(el => {
    const t = (el.innerText || el.textContent).trim();
    switch (el.tagName) {
      case 'H1': return '# ' + t; case 'H2': return '## ' + t; case 'BLOCKQUOTE': return '> ' + t;
      case 'UL': return Array.from(el.children).map(li => '- ' + li.textContent.trim()).join('\n');
      case 'OL': return Array.from(el.children).map((li, i) => `${i + 1}. ` + li.textContent.trim()).join('\n');
      default: return t;
    }
  }).join('\n\n') + '\n';
}
function dl(kind) {
  const it = cur(), doc = document.getElementById('doc'); persistDoc();
  const name = (it.title || 'content').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase().slice(0, 60) || 'content';
  const clean = it.html.replace(/ data-[a-z]+="[^"]*"/g, '');
  const page = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(it.title)}</title><style>body{font-family:Calibri,Arial,sans-serif;max-width:720px;margin:40px auto;line-height:1.6;color:#1d242c}h1{font-size:26px}h2{font-size:18px;margin-top:24px}</style></head><body>${clean}</body></html>`;
  if (kind === 'pdf') { window.print(); return; }
  if (kind === 'copy') { const t = blocksText(doc); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => showToast('Copied'), () => showToast("This view can't copy")); return; }
  if (kind === 'md') return download(name + '.md', toMarkdown(doc));
  if (kind === 'html') return download(name + '.html', page);
  return download(name + '.doc', page);
}
window.addEventListener('beforeunload', e => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });
render();

</script>
