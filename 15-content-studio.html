<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Content studio — DemandAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#7D52A2;--brand-dk:#5E3A80;--brand-lt:#F0EBF8;--brand-mid:#C9B3E8;
  --sec:#0094DA;--sec-lt:#E6F4FC;--sec-dk:#005E8E;
  --ter:#FF8820;--ter-lt:#FFF0E0;--ter-dk:#B85800;
  --pos:#2E7D5A;--pos-lt:#EAF5F0;
  --warn:#C4751A;--warn-lt:#FDF6E8;
  --neg:#B23F3F;--neg-lt:#FBECEC;
  --rail:#130D1C;--rb:rgba(255,255,255,.07);
  --r1:#fff;--r2:rgba(255,255,255,.76);--r3:rgba(255,255,255,.43);--r4:rgba(255,255,255,.21);
  --rhov:rgba(255,255,255,.05);--ract:rgba(125,82,162,.22);
  --bg:#F5F6F9;--surf:#fff;--border:#E5E9EE;--bdk:#D1D7DE;
  --i1:#141A21;--i2:#4A5664;--i3:#9DA8B5;--i4:#C9D1DA;
  --s50:#F4F6F8;--s75:#ECEFF3;--s100:#E1E6EC;--s200:#C9D1DA;--s300:#9DA8B5;
  --fd:"Sora",system-ui,sans-serif;
  --fb:"Plus Jakarta Sans",-apple-system,sans-serif;
  --fm:"JetBrains Mono",monospace;
  --rsm:8px;--rmd:12px;--rlg:16px;
  --ease:cubic-bezier(.4,0,.2,1);--fast:120ms;--base:200ms;
  --sh:0 2px 8px rgba(20,26,33,.07),0 1px 3px rgba(20,26,33,.05);
  --sh-lg:0 8px 40px rgba(20,26,33,.14),0 2px 8px rgba(20,26,33,.08);
  --nav-w:224px;--chat-w:400px;--hh:54px;--tabs-h:42px;
}
*,*::before,*::after{box-sizing:border-box;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{margin:0;font-family:var(--fb);font-size:14px;background:var(--bg);color:var(--i1);overflow:hidden;height:100vh;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font:inherit;}
:root{color-scheme:light;}
input,textarea,select{background-color:#fff;color:var(--i1);}
textarea[readonly],input[readonly]{background-color:var(--s50);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--s200);border-radius:2px;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(1.3);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideLeft{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}
@keyframes msgIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{width:0}to{width:var(--bw)}}

/* ─── SHELL ─────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;height:100vh;width:100vw;}

/* ─── NAV ─────────────────────────────── */
.nav{background:var(--rail);display:flex;flex-direction:column;height:100vh;overflow:hidden;border-right:1px solid var(--rb);}
.nav-brand{display:flex;align-items:center;gap:9px;padding:13px 13px 11px;border-bottom:1px solid var(--rb);flex-shrink:0;}
.nav-nm{font-family:var(--fd);font-size:14px;font-weight:600;color:var(--r1);letter-spacing:-.01em;}
.nav-org{font-size:10px;color:var(--r3);margin-top:1px;}
.nav-body{flex:1;overflow-y:auto;padding:6px 0;}
.nav-body::-webkit-scrollbar{width:3px;}
.nav-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);}
.nav-sec{padding:8px 14px 3px;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--r4);font-weight:600;}
.nav-item{display:flex;text-decoration:none;align-items:center;gap:9px;height:32px;padding:0 10px;margin:1px 6px;border-radius:7px;color:var(--r3);font-size:12.5px;font-weight:500;cursor:pointer;position:relative;transition:background var(--fast) var(--ease),color var(--fast) var(--ease);}
.nav-item:hover{background:var(--rhov);color:var(--r2);}
.nav-item.active{background:var(--ract);color:var(--r1);}
.nav-item.active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2.5px;background:var(--brand-mid);border-radius:0 2px 2px 0;}
.nav-ic{width:15px;height:15px;flex-shrink:0;opacity:.7;}
.nav-item.active .nav-ic{opacity:1;color:var(--brand-mid);}
.nav-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-div{height:1px;background:var(--rb);margin:6px 10px;}
.nav-foot{padding:10px;border-top:1px solid var(--rb);flex-shrink:0;}
.nav-user{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--rsm);cursor:pointer;transition:background var(--fast) var(--ease);}
.nav-user:hover{background:var(--rhov);}
.nav-av{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.nav-un{font-size:12px;color:var(--r2);font-weight:500;}
.nav-ur{font-size:10px;color:var(--r4);margin-top:1px;}

/* ─── MAIN ─────────────────────────────── */
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0;}

/* Topbar */
.topbar{height:var(--hh);padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0;gap:10px;}
.topbar-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.tb-title{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--i1);}
.tb-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;}
.badge-live{background:var(--pos-lt);color:var(--pos);}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite;}
.badge-neutral{background:var(--s100);color:var(--i3);}
.topbar-r{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--fb);font-size:12.5px;font-weight:600;height:30px;padding:0 12px;border-radius:var(--rsm);border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:all var(--fast) var(--ease);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dk);}
.btn-sec{background:var(--surf);border-color:var(--bdk);color:var(--i1);}
.btn-sec:hover{background:var(--s75);}
.btn-copilot{background:var(--brand-lt);border-color:var(--brand-mid);color:var(--brand-dk);}
.btn-copilot:hover{background:var(--brand-mid);}
.btn-copilot.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.btn-ghost{color:var(--i2);}
.btn-ghost:hover{background:var(--s75);}
.btn-sm{height:27px;font-size:11.5px;padding:0 10px;border-radius:6px;}

/* Tabs */
.ftabs{height:var(--tabs-h);padding:0 20px;display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--border);background:var(--surf);flex-shrink:0;}
.ftab{display:flex;align-items:center;gap:6px;padding:0 16px;font-size:13px;font-weight:500;color:var(--i3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color var(--fast) var(--ease);}
.ftab:hover{color:var(--i2);}
.ftab.active{color:var(--i1);border-bottom-color:var(--brand);}
.ftab-cnt{font-family:var(--fm);font-size:10.5px;color:var(--i4);}
.ftab.active .ftab-cnt{color:var(--brand);}

/* Canvas */
.canvas{flex:1;overflow-y:auto;padding:16px 20px 40px;}
.canvas::-webkit-scrollbar{width:5px;}

/* ─── STATS STRIP ─────────────────────── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;margin-bottom:16px;}
.stat{padding:13px 16px;border-right:1px solid var(--border);}
.stat:last-child{border-right:none;}
.stat-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--i3);font-weight:600;margin-bottom:4px;}
.stat-val{font-family:var(--fd);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:3px;}
.stat-sub{font-size:11px;color:var(--i3);}
.sv1{color:var(--brand);}
.sv2{color:var(--sec);}
.sv3{color:var(--ter-dk);}
.sv4{color:var(--pos);}
.sv5{color:var(--i1);}
.stat-link:hover{background:var(--s50);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--i1);color:#fff;font-size:12.5px;font-weight:500;padding:9px 18px;border-radius:999px;z-index:900;pointer-events:none;animation:fadeUp .2s var(--ease);}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;font-family:var(--fb);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap;background:var(--s75);color:var(--i2);vertical-align:middle;}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.tag-green{background:#E8F5EE;color:#24704F;}
.tag-amber{background:#FDF2E1;color:#A8620F;}
.tag-red{background:#FBEAEA;color:#A83A3A;}
.tag-blue{background:#E4F2FB;color:#00659A;}
.tag-violet{background:#F0EAF8;color:#6A4290;}
.tag-teal{background:#E3F4F2;color:#1B7369;}
.tag-pink{background:#FBE9F1;color:#A1386A;}
.tag-grey{background:#EEF1F4;color:#5B6774;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}


/* ─── CONTENT STUDIO: a chat, and a canvas that opens beside it ─────────── */
.sub{font-size:12px;color:var(--i3);line-height:1.55;}
.cs{flex:1;min-height:0;display:flex;}
/* Home: one chat box */
.home{flex:1;overflow-y:auto;padding:9vh 20px 40px;}
.home-in{max-width:760px;margin:0 auto;}
.home h1{font-family:var(--fd);font-size:28px;letter-spacing:-.02em;margin:0 0 6px;text-align:center;}
.home .lead{text-align:center;color:var(--i2);font-size:13.5px;margin:0 0 22px;}
.composer-big{background:var(--surf);border:1px solid var(--bdk);border-radius:18px;box-shadow:var(--sh);padding:12px 12px 10px 16px;}
.composer-big:focus-within{border-color:var(--brand-mid);box-shadow:0 0 0 3px var(--brand-lt);}
.composer-big textarea{width:100%;border:none;outline:none;resize:none;font-size:15px;min-height:56px;max-height:200px;background:transparent;}
.cb-row{display:flex;align-items:center;gap:8px;}
.kind{display:inline-flex;border:1px solid var(--bdk);border-radius:999px;overflow:hidden;}
.kind button{height:28px;padding:0 12px;font-size:12px;font-weight:600;color:var(--i2);}
.kind button.on{background:var(--brand-lt);color:var(--brand-dk);}
.send{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px;}
.send:hover{background:var(--brand-dk);}
.send:disabled{background:var(--s200);cursor:default;}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 0;}
.sugg button{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surf);font-size:12px;color:var(--i2);}
.sugg button:hover{border-color:var(--brand-mid);color:var(--brand-dk);}
.brandnote{text-align:center;font-size:11.5px;color:var(--i3);margin-top:12px;}
.lib{margin-top:40px;}
.lib-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.lib-h b{font-family:var(--fd);font-size:13px;}
.lib-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);margin-bottom:6px;cursor:pointer;}
.lib-row:hover{border-color:var(--brand-mid);}
.lib-ic{width:34px;height:34px;border-radius:8px;background:var(--brand-lt);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.lib-t{font-weight:600;font-size:13px;color:var(--i1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lib-s{font-size:11.5px;color:var(--i3);margin-top:2px;}
.tags-inline{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:46%;}
/* Conversation */
.conv{flex:1;display:grid;grid-template-columns:1fr;min-height:0;}
.conv.split{grid-template-columns:minmax(320px,38%) minmax(0,1fr);}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--surf);}
.conv.split .chat{border-right:1px solid var(--border);}
.thread{flex:1;overflow-y:auto;padding:22px 20px 10px;}
.thread-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.m-me{align-self:flex-end;max-width:85%;background:var(--s75);color:var(--i1);padding:10px 14px;border-radius:16px 16px 4px 16px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;animation:msgIn .15s var(--ease);}
.m-ai{display:flex;gap:10px;font-size:13.5px;line-height:1.6;color:var(--i1);white-space:pre-wrap;animation:msgIn .15s var(--ease);}
.m-ai .av{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.m-ai .tx{flex:1;min-width:0;}
.card{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surf);cursor:pointer;margin-left:34px;transition:border-color var(--fast) var(--ease);}
.card:hover,.card.on{border-color:var(--brand-mid);box-shadow:var(--sh);}
.card .ci{width:36px;height:36px;border-radius:8px;background:var(--brand-lt);display:flex;align-items:center;justify-content:center;font-size:17px;}
.card .ct{font-weight:600;font-size:13px;}
.card .cs2{font-size:11.5px;color:var(--i3);margin-top:2px;}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--brand-mid);border-top-color:var(--brand);display:inline-block;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:4px;}
@keyframes spin{to{transform:rotate(360deg)}}
.dots::after{content:'…';animation:pulse 1s infinite;}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:720px;margin:0 auto;padding:0 20px 8px;width:100%;}
.chip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--brand-mid);background:var(--brand-lt);color:var(--brand-dk);font-size:11.5px;font-weight:600;}
.chip:hover{background:var(--brand-mid);}
.target{max-width:720px;margin:0 auto 8px;width:calc(100% - 40px);font-size:11.5px;background:var(--ter-lt);color:var(--ter-dk);border-radius:var(--rsm);padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.target button{font-weight:700;color:var(--ter-dk);}
.composer{max-width:720px;margin:0 auto;width:100%;padding:0 20px 16px;}
.composer .box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--bdk);border-radius:16px;padding:8px 8px 8px 14px;background:var(--surf);}
.composer .box:focus-within{border-color:var(--brand-mid);box-shadow:0 0 0 3px var(--brand-lt);}
.composer textarea{flex:1;border:none;outline:none;resize:none;font-size:13.5px;min-height:24px;max-height:160px;padding:6px 0;background:transparent;}
/* Canvas */
.canvas2{display:flex;flex-direction:column;min-height:0;background:var(--bg);animation:slideLeft .22s var(--ease);}
.cv-h{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surf);border-bottom:1px solid var(--border);}
.cv-t{font-family:var(--fd);font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.cv-h .sp{flex:1;}
.saved{font-size:11px;color:var(--i3);white-space:nowrap;}
.cv-tools{display:flex;align-items:center;gap:4px;padding:6px 16px;background:var(--surf);border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;}
.tbtn{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--i2);font-size:13px;flex-shrink:0;}
.tbtn:hover{background:var(--s75);color:var(--i1);}
.tsep{width:1px;height:18px;background:var(--border);margin:0 4px;flex-shrink:0;}
.cv-tools .lab{font-size:11px;color:var(--i3);font-weight:600;margin-left:6px;}
.cv-tools select{height:26px;border:1px solid var(--bdk);border-radius:6px;font-size:12px;padding:0 4px;}
.cv-scroll{flex:1;overflow-y:auto;padding:22px 20px 50px;}
.paper{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:var(--rmd);box-shadow:var(--sh);padding:40px 52px 44px;position:relative;}
.att{max-width:760px;margin:0 auto 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--i3);}
#doc{outline:none;font-size:15px;line-height:1.7;color:#1d242c;font-family:var(--fb);}
#doc h1{font-family:var(--fd);font-size:26px;line-height:1.25;margin:0 0 16px;letter-spacing:-.02em;padding-bottom:10px;border-bottom:2px solid var(--brand-mid);}
#doc h2{font-family:var(--fd);font-size:18px;margin:26px 0 8px;}
#doc p{margin:0 0 12px;}
#doc ul,#doc ol{margin:0 0 12px;padding-left:22px;}
#doc blockquote{margin:0 0 12px;padding:8px 14px;border-left:3px solid var(--brand-mid);color:var(--i2);background:var(--s50);}
#doc.streaming > :last-child::after{content:'';display:inline-block;width:8px;height:16px;background:var(--brand);margin-left:2px;vertical-align:-2px;animation:pulse 1s infinite;}
#doc [data-b]{border-radius:4px;transition:background var(--fast) var(--ease);}
#doc:not(.streaming) [data-b]:hover{background:#FAF8FD;cursor:text;}
#doc [data-b].sel{background:#FFF6EC;box-shadow:-10px 0 0 #FFF6EC,10px 0 0 #FFF6EC;}
#doc [data-b].flash{animation:flash 1.1s var(--ease);}
@keyframes flash{0%{background:#EAF5F0}100%{background:transparent}}
.gutter{position:absolute;display:none;gap:4px;z-index:5;}
.gutter button{height:24px;padding:0 8px;border-radius:6px;background:var(--surf);border:1px solid var(--bdk);font-size:11px;font-weight:600;color:var(--i2);box-shadow:var(--sh);}
.gutter button:hover{border-color:var(--brand);color:var(--brand);}
.checks{max-width:760px;margin:12px auto 0;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);padding:12px 14px;}
.chk-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;}
.chk-detail{margin-top:8px;font-size:12px;color:var(--i2);line-height:1.6;}
.okc{color:var(--pos);font-weight:600;}
.badc{color:var(--neg);font-weight:600;}
.dd{position:relative;display:inline-block;}
.ddm{position:absolute;top:calc(100% + 5px);right:0;min-width:210px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);box-shadow:var(--sh-lg);z-index:200;overflow:hidden;display:none;}
.ddm.open{display:block;}
.ddm button{display:block;width:100%;text-align:left;padding:9px 14px;font-size:12.5px;color:var(--i1);}
.ddm button:hover{background:var(--s50);}
.ddm .h{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);font-weight:600;padding:8px 14px 4px;}
.skill{font-family:var(--fm);font-size:10.5px;background:var(--s75);color:var(--i2);padding:1px 6px;border-radius:4px;}
@media (max-width:900px){ .conv.split{grid-template-columns:1fr;grid-template-rows:45% 55%;} .conv.split .chat{border-right:none;border-bottom:1px solid var(--border);} .paper{padding:28px 22px;} }
@media print{
  body{overflow:visible;height:auto;background:#fff;}
  .nav,.chat,.cv-h,.cv-tools,.topbar,.att,.checks,.gutter,#roleSwitchBtn{display:none !important;}
  .shell,.conv,.cs{display:block;height:auto;}
  .main,.canvas2,.cv-scroll{height:auto;overflow:visible;background:#fff;padding:0;}
  .paper{border:none;box-shadow:none;padding:0;max-width:none;}
  #doc [data-b]{background:none !important;box-shadow:none !important;}
}

/* Saved content: like the saved lists in Prospecting and Account Scoring */
.canvas2-saved{flex:1;overflow-y:auto;padding:16px 20px 40px;}
.sv-k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);margin-bottom:6px;}
.canvas2-saved .stats{margin-bottom:18px;}
.stat-link{position:relative;cursor:pointer;display:block;text-decoration:none;color:inherit;transition:background var(--fast) var(--ease);}
.stat-link:hover,.stat-link.on{background:var(--brand-lt);}
.stat-link::after{content:'›';position:absolute;top:10px;right:14px;font-size:17px;color:var(--i4);}
.stat-link:hover .stat-lbl,.stat-link.on .stat-lbl{color:var(--brand);}
.seg-pill-a{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;cursor:pointer;background:var(--brand);color:#fff;}
.sv-list{background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;}
.sv-tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px;}
.sv-tbl th{text-align:left;padding:11px 16px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3);background:var(--s50);border-bottom:1px solid var(--border);}
.sv-tbl td{padding:14px 16px;border-bottom:1px solid var(--s75);vertical-align:middle;color:var(--i2);overflow:hidden;text-overflow:ellipsis;}
.sv-tbl td:last-child{overflow:visible;}
.sv-tbl tbody tr{cursor:pointer;} .sv-tbl tbody tr:hover td{background:#FAFBFC;}
.sv-tbl tr:last-child td{border-bottom:none;}
.sv-name{display:flex;align-items:center;gap:10px;min-width:0;}
.sv-ic{width:32px;height:32px;border-radius:8px;background:var(--brand-lt);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.sv-t{font-weight:600;color:var(--i1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sv-s{font-size:11px;color:var(--i3);margin-top:3px;}
.sv-v{color:var(--i1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sv-link{color:var(--i1);cursor:pointer;} .sv-link:hover{color:var(--brand);}
.sv-empty{text-align:center;padding:28px;color:var(--i3);}
</style>

function showToast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function initials(n){return String(n).split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function avColor(id){const c=['#7D52A2','#0094DA','#FF8820','#2E7D5A','#B23F3F'];let h=0;for(const ch of String(id))h+=ch.charCodeAt(0);return c[h%c.length];}

function esc(s){return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fallbackDownload(name, text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);}
// On claude.ai the page can't start a download itself: the viewer confirms a save. Opened as a plain file, it downloads directly.
async function download(name, text){
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ dl = null; }
  if(!dl){ fallbackDownload(name, text); return; }
  try{ await dl.save({filename:name, data:text}); showToast(name+' saved'); }
  catch(e){ if(e && e.code==='declined') return; showToast(e && e.code==='rate_limited' ? 'A save is already open' : "This view can't save files"); }
}

/* ═══════════════ CONTENT STUDIO ═══════════════
   Ask for a blog or a whitepaper in the chat; it is written in a canvas beside the chat, in the client's brand voice.
   Change it by chatting, or click one paragraph to change just that one. Attach it to a micro-segment or an account
   Once it's ready, reps add it to an email or LinkedIn message in Micro-segments & NBA. Download it as Word, PDF or Markdown. Nothing is published. */
const E = DemandAI, C = ContentLink;
const { TYPES, AUDIENCE, LAYOUT, HEAD, GEN, MORE, CONTRACT, uid, cap, lc, noDot, cited } = C;
let S = C.ensure();
const saveStore = () => C.save();
const fmtWhen = t => { if (!t) return '—'; const d = Math.round((Date.now() - t) / 864e5); return d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : d < 7 ? d + ' days ago' : fmtDate(t); };
const convOf = id => S.convs.find(c => c.id === id);
const itemOf = id => S.items.find(i => i.id === id);
let CONV = null, CANVAS = false, KIND = 'blog', BUSY = false;
const cur = () => CONV && CONV.active ? itemOf(CONV.active) : null;
const issuesOf = chk => chk.flags.length + chk.unsupported.length;
const statusTag = s => s === 'Ready' ? '<span class="tag tag-green">Ready to use</span>' : '<span class="tag tag-grey">Draft</span>';
const usageTag = it => { const n = C.usage(it.id); return n ? `<span class="tag tag-blue">In ${n} message${n > 1 ? 's' : ''}</span>` : ''; };

/* ─── Home: one chat box, and the content written so far ─── */
const SUGG = { blog: ['A blog on planning a control system migration for plant managers', 'A short blog for customers with a service renewal coming up', 'A blog on settling control scope early in a new project'],
  whitepaper: ['A whitepaper on legacy control system modernisation for plant managers', 'A detailed whitepaper on lifecycle planning for site maintenance leads', 'A whitepaper on front-end design decisions for project leads'] };
let HOMETAB = 'new', LIBF = null;
function renderHome(tab) {
  if(tab) HOMETAB = tab;
  CONV = null; CANVAS = false; history.replaceState(null, '', location.pathname);
  const items = S.items.slice().sort((a, b) => b.updated - a.updated), pack = E.brandPack();
  const ft = (id, label, n) => `<div class="ftab ${HOMETAB===id?'active':''}" onclick="renderHome('${id}')">${label}${n!==undefined?` <span class="ftab-cnt">${n}</span>`:''}</div>`;
  document.getElementById('mainArea').innerHTML = `
    <div class="topbar"><div class="topbar-l"><span class="tb-title">Content studio</span><span class="sub">Blogs and whitepapers in the client's brand voice</span></div>
      <div class="topbar-r">${HOMETAB==='saved' ? `<button class="btn btn-primary btn-sm" onclick="renderHome('new')">+ New blog or whitepaper</button>` : ''}</div></div>
    <div class="ftabs">${ft('new','Write')}${ft('saved','Saved content', items.length)}</div>
    <div class="cs">${HOMETAB==='saved' ? savedView(items) : `<div class="home"><div class="home-in">
      <h1>What should we write?</h1>
      <p class="lead">Describe it in your own words. It's written in a canvas beside the chat, and you change it by talking to it.</p>
      <div class="composer-big">
        <textarea id="homeIn" placeholder="e.g. A whitepaper on legacy control system modernisation for plant managers" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();startFromHome();}"></textarea>
        <div class="cb-row"><div class="kind">${Object.keys(TYPES).map(t => `<button class="${KIND === t ? 'on' : ''}" onclick="KIND='${t}';renderHome()">${TYPES[t].ic} ${TYPES[t].label}</button>`).join('')}</div>
          <span style="flex:1"></span><button class="send" onclick="startFromHome()" aria-label="Send">↑</button></div>
      </div>
      <div class="sugg">${SUGG[KIND].map(s => `<button onclick="startChat(${esc(JSON.stringify(s))})">${esc(s)}</button>`).join('')}</div>
      <div class="brandnote">Brand v${pack.v} applies automatically: ${esc(pack.voice.preset)} voice, ${pack.negative.length} banned words, only approved sources cited. Maintained in the <a href="07-content.html" style="color:var(--brand)">Content library</a>.</div>
      ${items.length ? `<div class="brandnote" style="margin-top:18px"><a href="#" onclick="renderHome('saved');return false" style="color:var(--brand);font-weight:600">See your ${items.length} saved piece${items.length===1?'':'s'} →</a></div>` : ''}
    </div></div>`}</div>`;
  if(HOMETAB==='new') setTimeout(() => { const i = document.getElementById('homeIn'); if (i) i.focus(); }, 30);
}
/* Saved content, laid out like the saved lists in Prospecting and Account Scoring: what it led to on top
   (each tile filters the table), then one row per piece. */
function savedView(items){
  const rows0 = items.map(it => ({ it, chk: C.checksOf(it), used: C.usage(it.id) }));
  const ready = rows0.filter(x => x.it.status === 'Ready').length, drafts = rows0.length - ready, fix = rows0.filter(x => issuesOf(x.chk)).length, used = rows0.reduce((n, x) => n + x.used, 0);
  const rows = rows0.filter(x => !LIBF || (LIBF === 'ready' ? x.it.status === 'Ready' : LIBF === 'draft' ? x.it.status !== 'Ready' : LIBF === 'fix' ? issuesOf(x.chk) : LIBF === 'used' ? x.used : LIBF === x.it.type));
  const tile = (f, lbl, v, sub, tone) => `<a class="stat stat-link ${LIBF===f?'on':''}" href="#" onclick="LIBF=LIBF==='${f}'?null:'${f}';renderHome('saved');return false"><div class="stat-lbl">${lbl}</div><div class="stat-val" style="color:${tone}">${v}</div><div class="stat-sub">${sub}</div></a>`;
  return `<div class="canvas2-saved">
    <div class="sv-k">What your content led to</div>
    <div class="stats" style="grid-template-columns:repeat(5,1fr)">
      ${tile('', 'Pieces', items.length, `${items.filter(i=>i.type==='blog').length} blogs · ${items.filter(i=>i.type==='whitepaper').length} whitepapers`, 'var(--i1)')}
      ${tile('ready', 'Ready to use', ready, 'checks pass, marked ready', 'var(--pos)')}
      ${tile('draft', 'Drafts', drafts, 'not ready for reps yet', 'var(--i2)')}
      ${tile('fix', 'Checks to fix', fix, 'a brand or claim check failed', fix ? 'var(--neg)' : 'var(--i1)')}
      ${tile('used', 'In messages', used, 'added by reps to email or LinkedIn', 'var(--brand)')}
    </div>
    ${LIBF ? `<div style="display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:12px;color:var(--i2)">Showing <span class="seg-pill-a" onclick="LIBF=null;renderHome('saved')">${esc({ready:'Ready to use',draft:'Drafts',fix:'Checks to fix',used:'In messages',blog:'Blogs',whitepaper:'Whitepapers'}[LIBF]||LIBF)} ✕</span></div>` : ''}
    <div class="sv-list"><table class="sv-tbl"><colgroup><col style="width:28%"><col style="width:10%"><col style="width:16%"><col style="width:11%"><col style="width:9%"><col style="width:11%"><col style="width:15%"></colgroup>
      <thead><tr><th>Content</th><th>Type</th><th>Audience</th><th>Brand checks</th><th>In messages</th><th>Saved</th><th></th></tr></thead>
      <tbody>${rows.length ? rows.map(({ it, chk, used: u }) => { const n = issuesOf(chk); return `<tr onclick="openItem('${it.id}')">
        <td><div class="sv-name"><div class="sv-ic">${TYPES[it.type].ic}</div><div style="min-width:0"><div class="sv-t" title="${esc(it.title)}">${esc(it.title)}</div><div class="sv-s">${statusTag(it.status)}</div></div></div></td>
        <td><span class="sv-link" onclick="event.stopPropagation();LIBF='${it.type}';renderHome('saved')">${TYPES[it.type].label}</span><div class="sv-s">${it.length} · ${it.tone}</div></td>
        <td><div class="sv-v">${esc(AUDIENCE[it.seg] || it.seg)}</div></td>
        <td>${n ? `<span class="tag tag-red">${n} to fix</span>` : '<span class="tag tag-green">All pass</span>'}<div class="sv-s">Brand v${it.brandV}</div></td>
        <td><div class="sv-v">${u}</div><div class="sv-s">message${u===1?'':'s'}</div></td>

const NEW_RE = /\b(write|draft|create|generate|produce|give me|need|want)\b[^.?!]*?\b(a|an|another|new|one more)\s+(\w+\s+){0,3}?(blog|white\s?-?paper|article)\b|^\s*(a|an|another)\s+(short |long |detailed |new )?(blog|white\s?-?paper)\b/i;

}

      (srcs.length ? ` It can cite ${srcs.join(', ')}, the approved sources for this audience.` : ' There is no approved source for this audience, so it will make no product claims.');
    const card = addMsg({ who: 'ai', card: it.id, streaming: true });

// Writes the blocks into the canvas a few characters at a time, the way a reply appears.
function stream(doc, blocks, done) {
  doc.classList.add('streaming'); doc.contentEditable = 'false';
  const total = blocks.reduce((n, b) => n + (Array.isArray(b.text) ? b.text.join('').length : b.text.length), 0);
  const step = Math.max(5, Math.round(total / 260));
  const sc = document.getElementById('cvScroll');
  let bi = 0, li = 0, ci = 0, el = null, target = null;
  const tick = () => {
    if (!document.body.contains(doc)) { doc = document.getElementById('doc'); if (!doc) { finish(); return; } }
    const b = blocks[bi];
    if (!b) { finish(); return; }
    const isList = Array.isArray(b.text);
    if (!el) { el = document.createElement(b.tag); el.dataset.b = uid(); el.dataset.role = b.role; el.dataset.v = b.v || 0; doc.appendChild(el); }
    if (isList && !target) { target = document.createElement('li'); el.appendChild(target); }
    const text = isList ? b.text[li] : b.text, node = isList ? target : el;
    ci = Math.min(text.length, ci + step); node.textContent = text.slice(0, ci);
    if (ci >= text.length) {
      ci = 0;
      if (isList && li < b.text.length - 1) { li++; target = null; }
      else { if (!isList) el.innerHTML = C.blockInner(b); bi++; li = 0; el = null; target = null; }
    }
    if (sc) sc.scrollTop = sc.scrollHeight;

function regenEl(el, toneOnly) {

}

  const stop = new Set(['mention', 'include', 'talk', 'about', 'with', 'that', 'this', 'from', 'proof', 'source', 'example', 'evidence', 'case', 'study', 'some', 'more', 'please']);
  const pool = E.approvedClaims();
  const scored = pool.map(c => ({ c, s: words.filter(w => !stop.has(w) && (c.title + ' ' + c.claim).toLowerCase().includes(w)).length })).filter(x => x.s).sort((a, b) => b.s - a.s);
  if (scored.length) return scored[0].c;
  if (/proof|example|case|evidence|source/i.test(q)) {
    const used = document.getElementById('doc').textContent;
    return pool.find(c => it.sources.includes(c.id) && !used.includes(c.claim)) || pool.find(c => c.segments.includes(it.seg) && !used.includes(c.claim)) || null;
  }
  return null;
}
const CLOSE_SEL = '[data-role="h:cta"]';
function insertBeforeClose(html) {
  const doc = document.getElementById('doc'), frag = document.createElement('div'); frag.innerHTML = html;
  const anchor = doc.querySelector(CLOSE_SEL), nodes = Array.from(frag.children); nodes.forEach(n => doc.insertBefore(n, anchor)); return nodes[nodes.length - 1];
}
function addClaim(c, el) {
  const it = cur(); if (!it.sources.includes(c.id)) it.sources.push(c.id);
  if (el && el.tagName === 'P') { el.textContent = el.textContent.trim() + ' ' + cited(c); el.dataset.edited = '1'; return el; }
  const proof = document.querySelector('#doc [data-role="proof"]');
  if (proof) { if (!proof.textContent.includes(c.claim)) { proof.textContent = proof.textContent.trim() + ' ' + cited(c); proof.dataset.edited = '1'; } return proof; }
  return insertBeforeClose(C.blockHtml({ tag: 'h2', role: 'h:proof', v: 0, text: HEAD.proof[0] }) + `<p data-b="${uid()}" data-role="proof" data-v="0" data-edited="1">${esc(cited(c))}</p>`);
}
const CLAIMY = /(\d+\s?%|\b(reduces?|reduced|improves?|improved|increases?|increased|cuts? (downtime|costs?)|savings|uptime|faster|proven|guarantee\w*)\b)/i;
function handle(q) {
  const it = cur(), doc = document.getElementById('doc'), el = targetEl(), low = q.toLowerCase();
  if (!doc) { CANVAS = true; renderConv(); return handle(q); }
  // A request that would add a product claim is checked against the approved sources first.
  const said = q.match(/\b(?:say|claim|mention|add|write|include)\b\s+(?:that\s+)?(.+)/i);
  if (said && CLAIMY.test(said[1]) && !claimFor(said[1])) return `I can't add “${said[1].trim()}”. It reads like a product claim and there's no approved source for it. If it's true, add the source to the Content library and I'll cite it word for word.`;
  if (/^(regenerate|rewrite|try again|another version|redo)( this| it)?$/i.test(q) && el) { regenTarget(); return 'Done.'; }
  snapshot();
  let m;
  if ((m = q.match(/(?:change|set|make|call) (?:the )?(?:title|headline)(?: to| into)? (.+)/i)) || (m = q.match(/^(?:title|headline):\s*(.+)/i))) {
    let h = doc.querySelector('h1'); if (!h) { h = document.createElement('h1'); h.dataset.role = 'title'; h.dataset.v = 0; doc.prepend(h); }
    h.textContent = m[1].replace(/^["“]|["”]$/g, ''); h.dataset.edited = '1'; afterChange(h); return 'Title changed.';
  }
  if (/\b(title|headline)\b/.test(low) && !el) { const h = doc.querySelector('h1'); if (h && regenEl(h)) { afterChange(h); return `New title: “${h.textContent}”. Ask again for another option.`; } }
  if (/\b(intro|opening|first paragraph|summary)\b/.test(low) && !el) { const p = doc.querySelector('[data-role="intro"],[data-role="summary"]'); if (p && regenEl(p)) { afterChange(p); selectBlock(p); return 'Rewrote the opening. It stays selected, so you can ask for another version or a specific change.'; } }
  if ((m = q.match(/add (?:a )?(?:section|paragraph|part|chapter) (?:on|about) (.+)/i))) {
    const topic = noDot(m[1]), formal = it.tone === 'Formal';
    const last = insertBeforeClose(C.blockHtml({ tag: 'h2', role: 'free', text: cap(topic) }) +
      `<p data-b="${uid()}" data-role="free" data-v="0" data-edited="1">${esc(`${cap(topic)} is worth its own conversation. ${formal ? 'It is' : "It's"} usually where plans differ most from site to site, so start with how your site handles it today and what you would want to change.`)}</p>`);
    afterChange(last); return `Added a section on ${topic} before the close. It makes no product claims; edit it, or ask me to add proof from an approved source.`;
  }
  if (/proof|case study|example|evidence|source|cite/.test(low) || (m = q.match(/\b(?:mention|include|talk about)\b\s+(?:the\s+)?(.+)/i))) {
    const c = claimFor(q);
    if (c) { const at = addClaim(c, el && el.tagName === 'P' ? el : null); afterChange(at); return `Added an approved claim, word for word with its citation: ${c.id} · ${c.title} [${c.type}, ${c.year}].`; }
    if (m) {
      const what = noDot(m[1]), p = el && el.tagName === 'P' ? el : doc.querySelector('[data-role="cta"]') || doc.lastElementChild;
      p.textContent = p.textContent.trim() + ` Is ${lc(what)} part of your plans?`; p.dataset.edited = '1'; afterChange(p);
      return `There's no approved source on ${what}, so I added it as a question rather than a claim.`;
    }
    UNDO.pop(); return "Every approved source for this audience is already cited. Add another one in the Content library and I'll use it word for word.";
  }
  if (/formal|professional/.test(low)) return applyTone('Formal', el);
  if (/warm|friendl/.test(low)) return applyTone('Warm', el);
  if (/\b(direct|crisp|punch)/.test(low)) return applyTone('Direct', el);
  if (/short|concise|\bcut\b|trim|tighten/.test(low)) {
    const els = el ? [el] : Array.from(doc.querySelectorAll('#doc > p, #doc > ul, #doc > ol')); let n = 0;
    els.forEach(x => { if (shorten(x)) n++; });
    if (!n) { UNDO.pop(); return el ? 'That part is already as short as it can go without losing its point.' : 'Everything is already short. Try a shorter length from the canvas toolbar.'; }
    afterChange(el); return el ? 'Shortened it. Cited claims are kept as they are.' : `Shortened ${n} part${n > 1 ? 's' : ''}. Cited claims are kept as they are.`;
  }
  if (/long|detail|expand|elaborate|\bmore\b/.test(low)) {
    if (el) { if (lengthen(el)) { afterChange(el); return 'Added a line. No new claims.'; } UNDO.pop(); return "I've added all I can without making claims. Ask me to add proof from an approved source."; }
    const missing = LAYOUT[it.type].Long.filter(r => !doc.querySelector(`[data-role="${r}"]`) && !(r === 'proof' && !C.ctxOf(it).claims.length));
    if (!missing.length) { UNDO.pop(); return 'It already has every section for this type. Ask me to add a section on a specific topic.'; }
    const r = missing[0], last = insertBeforeClose((HEAD[r] ? C.blockHtml({ tag: 'h2', role: 'h:' + r, v: 0, text: HEAD[r][0] }) : '') + C.blockHtml(C.genBlock(C.ctxOf(it), r, 0)));
    afterChange(last); return `Added “${HEAD[r] ? HEAD[r][0] : r}”.`;
  }
  if (/regenerate|rewrite|again|another|different/.test(low)) {
    if (el) { UNDO.pop(); regenTarget(); return 'Here is another version.'; }
    doc.innerHTML = C.docHtml(C.generate(it)); afterChange(); return 'Rewrote the whole piece from the brief. Your earlier version is one Undo away.';
  }
  if (/remove|delete|drop/.test(low) && el) { el.remove(); TARGET = null; afterChange(); return 'Removed it.'; }
  UNDO.pop();
  return `I can change ${el ? 'that part' : 'the piece'}: make it shorter or longer, change the tone (direct, formal, warm), rewrite it, change the title, add a section on a topic, or add proof from an approved source. To start something new, ask for another blog or whitepaper. I won't add claims that aren't in the approved sources.`;
}
function applyTone(tone, el) {
  const it = cur(), doc = document.getElementById('doc');
  if (el) { const old = it.tone; it.tone = tone; retoneEl(el, tone); it.tone = old; afterChange(el); return `Made that part ${tone.toLowerCase()}. The rest is still ${old.toLowerCase()}.`; }
  it.tone = tone; Array.from(doc.children).forEach(x => retoneEl(x, tone)); afterChange();
  const s = document.querySelector('.cv-tools select'); if (s) s.value = tone;
  return `Switched the piece to a ${tone.toLowerCase()} tone. Paragraphs you edited yourself keep your wording${tone === 'Formal' ? ', with contractions written out' : ''}.`;
}
function setTone(t) { snapshot(); addMsg({ who: 'me', text: `Tone: ${t}` }); addMsg({ who: 'ai', text: applyTone(t) }); }
function setLength(l) {
  const it = cur();
  if (document.querySelectorAll('#doc > [data-edited]').length && !confirm(`Rewrite the piece at ${l} length? Your own edits are replaced; Undo brings them back.`)) { document.querySelectorAll('.cv-tools select')[1].value = it.length; return; }
  snapshot(); it.length = l; document.getElementById('doc').innerHTML = C.docHtml(C.generate(it)); afterChange();
  addMsg({ who: 'me', text: `Length: ${l}` }); addMsg({ who: 'ai', text: `Rewrote it at ${l.toLowerCase()} length: ${LAYOUT[it.type][l].length} parts.` });
}

/* ─── Ready, download ─── */
function markReady() {
  const it = cur(); persistDoc();
  if (it.status === 'Ready') { it.status = 'Draft'; saveStore(); document.getElementById('stTag').innerHTML = statusTag('Draft'); document.getElementById('readyBtn').textContent = 'Mark ready'; showToast('Back to draft'); return; }
  const chk = runChecks();
  if (issuesOf(chk)) { CHK_OPEN = true; runChecks(); document.getElementById('checks').scrollIntoView({ behavior: 'smooth', block: 'center' }); showToast(`Fix ${issuesOf(chk)} check${issuesOf(chk) > 1 ? 's' : ''} first`); return; }
  it.status = 'Ready'; it.updated = Date.now(); saveStore();
  document.getElementById('stTag').innerHTML = statusTag('Ready'); document.getElementById('readyBtn').textContent = 'Back to draft';
  addMsg({ who: 'ai', text: 'Marked ready to use. Reps can now add it to an email or LinkedIn message in Micro-segments & NBA.' });
}
function toggleDD(id, e) { e.stopPropagation(); const d = document.getElementById(id); const open = d.classList.contains('open'); document.querySelectorAll('.ddm.open').forEach(x => x.classList.remove('open')); if (!open) d.classList.add('open'); }
document.addEventListener('click', () => document.querySelectorAll('.ddm.open').forEach(x => x.classList.remove('open')));
function toMarkdown(root) {
  return Array.from(root.children).map(el => {
    const t = (el.innerText || el.textContent).trim();
    switch (el.tagName) {
      case 'H1': return '# ' + t; case 'H2': return '## ' + t; case 'BLOCKQUOTE': return '> ' + t;
      case 'UL': return Array.from(el.children).map(li => '- ' + li.textContent.trim()).join('\n');
      case 'OL': return Array.from(el.children).map((li, i) => `${i + 1}. ` + li.textContent.trim()).join('\n');

  }).join('\n\n') + '\n';
}
function dl(kind) {

  if (kind === 'copy') { const t = blocksText(doc); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => showToast('Copied'), () => showToast("This view can't copy")); return; }
  if (kind === 'md') return C.saveFile(C.fileName(it, 'md'), toMarkdown(doc), showToast);

}
window.addEventListener('beforeunload', () => { persistDoc(); saveStore(); });

  if (id && itemOf(id)) openItem(id); else renderHome();
