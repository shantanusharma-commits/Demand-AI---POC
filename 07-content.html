<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Content library — DemandAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#7D52A2;--brand-dk:#5E3A80;--brand-lt:#F0EBF8;--brand-mid:#C9B3E8;
  --sec:#0094DA;--sec-lt:#E6F4FC;--sec-dk:#005E8E;
  --ter:#FF8820;--ter-lt:#FFF0E0;--ter-dk:#B85800;
  --pos:#2E7D5A;--pos-lt:#EAF5F0;
  --warn:#C4751A;--warn-lt:#FDF6E8;
  --neg:#B23F3F;--neg-lt:#FBECEC;
  --rail:#130D1C;--rb:rgba(255,255,255,.07);
  --r1:#fff;--r2:rgba(255,255,255,.76);--r3:rgba(255,255,255,.43);--r4:rgba(255,255,255,.21);
  --rhov:rgba(255,255,255,.05);--ract:rgba(125,82,162,.22);
  --bg:#F5F6F9;--surf:#fff;--border:#E5E9EE;--bdk:#D1D7DE;
  --i1:#141A21;--i2:#4A5664;--i3:#9DA8B5;--i4:#C9D1DA;
  --s50:#F4F6F8;--s75:#ECEFF3;--s100:#E1E6EC;--s200:#C9D1DA;--s300:#9DA8B5;
  --fd:"Sora",system-ui,sans-serif;
  --fb:"Plus Jakarta Sans",-apple-system,sans-serif;
  --fm:"JetBrains Mono",monospace;
  --rsm:8px;--rmd:12px;--rlg:16px;
  --ease:cubic-bezier(.4,0,.2,1);--fast:120ms;--base:200ms;
  --sh:0 2px 8px rgba(20,26,33,.07),0 1px 3px rgba(20,26,33,.05);
  --sh-lg:0 8px 40px rgba(20,26,33,.14),0 2px 8px rgba(20,26,33,.08);
  --nav-w:224px;--chat-w:400px;--hh:54px;--tabs-h:42px;
}
*,*::before,*::after{box-sizing:border-box;}
html{font-size:16px;-webkit-font-smoothing:antialiased;}
body{margin:0;font-family:var(--fb);font-size:14px;background:var(--bg);color:var(--i1);overflow:hidden;height:100vh;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font:inherit;}
:root{color-scheme:light;}
input,textarea,select{background-color:#fff;color:var(--i1);}
textarea[readonly],input[readonly]{background-color:var(--s50);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--s200);border-radius:2px;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(1.3);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideLeft{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}
@keyframes msgIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@keyframes barGrow{from{width:0}to{width:var(--bw)}}

/* ─── SHELL ─────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;height:100vh;width:100vw;}

/* ─── NAV ─────────────────────────────── */
.nav{background:var(--rail);display:flex;flex-direction:column;height:100vh;overflow:hidden;border-right:1px solid var(--rb);}
.nav-brand{display:flex;align-items:center;gap:9px;padding:13px 13px 11px;border-bottom:1px solid var(--rb);flex-shrink:0;}
.nav-nm{font-family:var(--fd);font-size:14px;font-weight:600;color:var(--r1);letter-spacing:-.01em;}
.nav-org{font-size:10px;color:var(--r3);margin-top:1px;}
.nav-body{flex:1;overflow-y:auto;padding:6px 0;}
.nav-body::-webkit-scrollbar{width:3px;}
.nav-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);}
.nav-sec{padding:8px 14px 3px;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--r4);font-weight:600;}
.nav-item{display:flex;text-decoration:none;align-items:center;gap:9px;height:32px;padding:0 10px;margin:1px 6px;border-radius:7px;color:var(--r3);font-size:12.5px;font-weight:500;cursor:pointer;position:relative;transition:background var(--fast) var(--ease),color var(--fast) var(--ease);}
.nav-item:hover{background:var(--rhov);color:var(--r2);}
.nav-item.active{background:var(--ract);color:var(--r1);}
.nav-item.active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:2.5px;background:var(--brand-mid);border-radius:0 2px 2px 0;}
.nav-ic{width:15px;height:15px;flex-shrink:0;opacity:.7;}
.nav-item.active .nav-ic{opacity:1;color:var(--brand-mid);}
.nav-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-div{height:1px;background:var(--rb);margin:6px 10px;}
.nav-foot{padding:10px;border-top:1px solid var(--rb);flex-shrink:0;}
.nav-user{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--rsm);cursor:pointer;transition:background var(--fast) var(--ease);}
.nav-user:hover{background:var(--rhov);}
.nav-av{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.nav-un{font-size:12px;color:var(--r2);font-weight:500;}
.nav-ur{font-size:10px;color:var(--r4);margin-top:1px;}

/* ─── MAIN ─────────────────────────────── */
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0;}

/* Topbar */
.topbar{height:var(--hh);padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:var(--surf);border-bottom:1px solid var(--border);flex-shrink:0;gap:10px;}
.topbar-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.tb-title{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--i1);}
.tb-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;}
.badge-live{background:var(--pos-lt);color:var(--pos);}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite;}
.badge-neutral{background:var(--s100);color:var(--i3);}
.topbar-r{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--fb);font-size:12.5px;font-weight:600;height:30px;padding:0 12px;border-radius:var(--rsm);border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:all var(--fast) var(--ease);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dk);}
.btn-sec{background:var(--surf);border-color:var(--bdk);color:var(--i1);}
.btn-sec:hover{background:var(--s75);}
.btn-copilot{background:var(--brand-lt);border-color:var(--brand-mid);color:var(--brand-dk);}
.btn-copilot:hover{background:var(--brand-mid);}
.btn-copilot.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.btn-ghost{color:var(--i2);}
.btn-ghost:hover{background:var(--s75);}
.btn-sm{height:27px;font-size:11.5px;padding:0 10px;border-radius:6px;}

/* Tabs */
.ftabs{height:var(--tabs-h);padding:0 20px;display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--border);background:var(--surf);flex-shrink:0;}
.ftab{display:flex;align-items:center;gap:6px;padding:0 16px;font-size:13px;font-weight:500;color:var(--i3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color var(--fast) var(--ease);}
.ftab:hover{color:var(--i2);}
.ftab.active{color:var(--i1);border-bottom-color:var(--brand);}
.ftab-cnt{font-family:var(--fm);font-size:10.5px;color:var(--i4);}
.ftab.active .ftab-cnt{color:var(--brand);}

/* Canvas */
.canvas{flex:1;overflow-y:auto;padding:16px 20px 40px;}
.canvas::-webkit-scrollbar{width:5px;}

/* ─── STATS STRIP ─────────────────────── */
.stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;margin-bottom:16px;}
.stat{padding:13px 16px;border-right:1px solid var(--border);}
.stat:last-child{border-right:none;}
.stat-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--i3);font-weight:600;margin-bottom:4px;}
.stat-val{font-family:var(--fd);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:3px;}
.stat-sub{font-size:11px;color:var(--i3);}
.sv1{color:var(--brand);}
.sv2{color:var(--sec);}
.sv3{color:var(--ter-dk);}
.sv4{color:var(--pos);}
.sv5{color:var(--i1);}

/* ─── MAIN LAYOUT: full-width list, detail as fixed right drawer ─── */
.score-layout{display:block;}
/* dim-overview handled inline */

/* Detail drawer — slides in from the right over the content */
.detail-drawer{
  position:fixed;top:0;right:0;bottom:0;
  width:360px;
  background:var(--surf);
  border-left:1px solid var(--border);
  box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;
  z-index:300;
  transform:translateX(100%);
  transition:transform var(--base) var(--ease);
  overflow-y:auto;
}
.detail-drawer.open{transform:translateX(0);}
.detail-drawer::-webkit-scrollbar{width:4px;}
.drawer-hdr{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:var(--surf);
  border-bottom:1px solid var(--border);
}
.drawer-title{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--i1);}
.drawer-sub{font-size:10.5px;color:var(--i3);margin-top:1px;}
.drawer-close{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--i3);cursor:pointer;flex-shrink:0;transition:all var(--fast);}
.drawer-close:hover{background:var(--s75);color:var(--i1);}
.drawer-body{padding:14px 16px 24px;flex:1;}

/* Score list */
.score-list{background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;}
.sl-toolbar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.sl-srch{display:flex;align-items:center;gap:6px;background:var(--s50);border:1px solid var(--border);border-radius:var(--rsm);padding:0 10px;height:29px;min-width:160px;flex:1;max-width:220px;transition:border-color var(--fast);}
.sl-srch:focus-within{border-color:var(--brand-mid);}
.sl-srch input{border:none;background:transparent;font-size:12.5px;color:var(--i1);outline:none;width:100%;}
.sl-srch input::placeholder{color:var(--i3);}
.sl-seg-filter{display:flex;gap:4px;margin-left:auto;}
.seg-pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;cursor:pointer;border:1px solid var(--border);color:var(--i3);background:var(--surf);white-space:nowrap;transition:all var(--fast);}
.seg-pill:hover{border-color:var(--brand-mid);color:var(--brand);}
.seg-pill.active{background:var(--brand);border-color:var(--brand);color:#fff;}

.sl-head{display:grid;grid-template-columns:minmax(160px,2.5fr) 72px 72px 72px 110px 180px;padding:0 14px;height:32px;background:var(--s50);border-bottom:1px solid var(--border);align-items:center;gap:6px;}
.sl-th{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);font-weight:600;white-space:nowrap;}

.sl-row{display:grid;grid-template-columns:minmax(160px,2.5fr) 72px 72px 72px 110px 180px;padding:6px 14px;min-height:60px;border-bottom:1px solid var(--border);align-items:center;gap:6px;cursor:pointer;transition:background var(--fast);}
.sl-row:last-child{border-bottom:none;}
.sl-row:hover{background:var(--s50);}
.sl-row.selected{background:var(--brand-lt);}

.co-cell{display:flex;align-items:center;gap:9px;min-width:0;}
.co-av{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.co-nm{font-size:12.5px;font-weight:600;color:var(--i1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.co-ind{font-size:10.5px;color:var(--i3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Score badges */
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:20px;padding:0 5px;border-radius:4px;font-family:var(--fm);font-size:11px;font-weight:700;}
.sc-h{background:var(--pos-lt);color:var(--pos);}
.sc-m{background:var(--warn-lt);color:var(--warn);}
.sc-l{background:var(--neg-lt);color:var(--neg);}

/* Composite bar */
.comp-bar{display:flex;align-items:center;gap:5px;}
.comp-track{flex:1;height:4px;background:var(--s100);border-radius:2px;overflow:hidden;}
.comp-fill{height:4px;border-radius:2px;animation:barGrow .5s var(--ease) forwards;}
.comp-val{font-family:var(--fm);font-size:11px;color:var(--i2);min-width:20px;text-align:right;flex-shrink:0;}

/* Delta */
.delta{font-family:var(--fm);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:3px;white-space:nowrap;}
.delta-up{background:var(--pos-lt);color:var(--pos);}
.delta-dn{background:var(--neg-lt);color:var(--neg);}
.delta-flat{background:var(--s100);color:var(--i3);}

/* ─── PANEL (used in tabs) ─────────── */
.panel{background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow:hidden;}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);}
.panel-ttl{font-size:11px;font-weight:600;color:var(--i2);letter-spacing:.04em;text-transform:uppercase;}
.panel-body{padding:12px 14px;}

/* Score breakdown in detail */
.dim-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--s75);}
.dim-row:last-child{border-bottom:none;}
.dim-lbl{font-size:11.5px;color:var(--i2);width:74px;flex-shrink:0;}
.dim-track{flex:1;height:5px;background:var(--s100);border-radius:3px;overflow:hidden;}
.dim-fill{height:5px;border-radius:3px;transition:width .5s var(--ease);}
.dim-val{font-family:var(--fm);font-size:12px;font-weight:700;min-width:26px;text-align:right;flex-shrink:0;}

/* Signal log */
.sig-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--s75);}
.sig-row:last-child{border-bottom:none;}
.sig-ic{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:1px;}
.sig-lbl{font-size:11.5px;color:var(--i1);font-weight:500;line-height:1.4;}
.sig-meta{font-size:10px;color:var(--i3);margin-top:2px;}
.sig-impact{margin-left:auto;font-family:var(--fm);font-size:11px;font-weight:700;flex-shrink:0;}
.sig-up{color:var(--pos);}
.sig-dn{color:var(--neg);}

/* Sparkline */
.spark{display:flex;align-items:flex-end;gap:2px;height:28px;}
.spark-bar{flex:1;border-radius:2px 2px 0 0;min-width:3px;}

/* Lookalikes */
.like-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--s75);cursor:pointer;}
.like-row:last-child{border-bottom:none;}
.like-row:hover .like-nm{color:var(--brand);}
.like-av{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:9.5px;font-weight:700;color:#fff;flex-shrink:0;}
.like-nm{font-size:12px;font-weight:600;color:var(--i1);transition:color var(--fast);}
.like-meta{font-size:10.5px;color:var(--i3);margin-top:1px;}
.like-match{margin-left:auto;font-family:var(--fm);font-size:11px;font-weight:700;color:var(--brand);flex-shrink:0;}

/* Empty detail state */
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;gap:8px;text-align:center;}

/* ─── DIMENSION OVERVIEW (below list on Scores tab) */
/* dim-overview now defined in score-layout block above */
/* dov-num used by the inline dimension strip */
.dov-num{font-family:var(--fd);font-weight:700;letter-spacing:-.03em;line-height:1;}
.dov-dist{display:flex;gap:2px;height:5px;border-radius:3px;overflow:hidden;}
.dov-seg{height:100%;}

/* ─── SEGMENT MAP TAB ─── */
.seg-map-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
.seg-map-ttl{font-family:var(--fd);font-size:13px;font-weight:600;color:var(--i1);}
.seg-grid{display:grid;grid-template-columns:repeat(4,1fr);}
.seg-cell{padding:14px 16px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--fast);}
.seg-cell:hover{background:var(--s50);}
.seg-cell:nth-child(4n){border-right:none;}
.seg-cell:nth-last-child(-n+4){border-bottom:none;}
.seg-nm{font-size:12.5px;font-weight:600;color:var(--i1);margin-bottom:3px;}
.seg-desc{font-size:10.5px;color:var(--i3);margin-bottom:8px;line-height:1.5;}
.seg-count{font-family:var(--fd);font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-bottom:2px;}
.seg-sub{font-size:10.5px;color:var(--i3);}
.seg-bar-wrap{height:3px;background:var(--s100);border-radius:2px;margin-top:8px;overflow:hidden;}
.seg-bar-fill{height:3px;border-radius:2px;}

/* ─── HISTORY TAB ─── */
.hist-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--s75);}
.hist-row:last-child{border-bottom:none;}
.hist-dir{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ─── THRESHOLD TAB ─── */
.thresh-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.thresh-dim{display:flex;flex-direction:column;gap:10px;}
.thresh-dim-ttl{font-size:10.5px;font-weight:600;color:var(--i2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.thresh-row{display:flex;align-items:center;gap:10px;}
.thresh-lbl{font-size:11.5px;color:var(--i2);min-width:90px;}
.thresh-slider{flex:1;accent-color:var(--brand);cursor:pointer;height:4px;}
.thresh-val{font-family:var(--fm);font-size:12px;font-weight:600;color:var(--i1);min-width:26px;text-align:right;}
.thresh-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--border);background:var(--s50);}
.thresh-hint{font-size:12px;color:var(--i3);}
.thresh-hint strong{color:var(--warn);font-weight:600;}

/* ─── CHAT PANEL ─────────────────────── */
.chat-panel{position:fixed;top:0;right:0;bottom:0;width:var(--chat-w);background:var(--surf);border-left:1px solid var(--border);box-shadow:var(--sh-lg);display:flex;flex-direction:column;z-index:400;transform:translateX(100%);transition:transform var(--base) var(--ease);}
.chat-panel.open{transform:translateX(0);}
.chat-panel.expanded{position:fixed;inset:0;width:100vw;height:100vh;border-left:none;z-index:450;}
.chat-panel.expanded .hist-section{display:none;}
.chat-panel.expanded .chat-msgs,.chat-panel.expanded .sugg-wrap,.chat-panel.expanded .composer-wrap{padding-left:24px;padding-right:24px;}

.chat-top{height:var(--hh);padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;}
.chat-top-l{display:flex;align-items:center;gap:9px;min-width:0;flex:1;}
.chat-ttl{font-size:13px;font-weight:600;color:var(--i1);}
.chat-scope{font-size:10.5px;color:var(--i3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-top-acts{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.ct-ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--i3);cursor:pointer;transition:all var(--fast);}
.ct-ic:hover{background:var(--s75);color:var(--i1);}
.ct-ic.active{background:var(--brand-lt);color:var(--brand);}

.hist-section{border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden;max-height:220px;transition:max-height var(--base) var(--ease);}
.hist-section.collapsed{max-height:0;border-bottom:none;}
.hist-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;cursor:pointer;user-select:none;}
.hist-lbl{font-size:10.5px;font-weight:600;color:var(--i2);letter-spacing:.03em;}
.hist-chev{color:var(--i3);transition:transform var(--fast);}
.hist-section.collapsed .hist-chev{transform:rotate(-90deg);}
.hist-list{padding:0 10px 8px;overflow-y:auto;max-height:160px;}
.hist-list::-webkit-scrollbar{width:3px;}
.hist-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:background var(--fast);}
.hist-item:hover{background:var(--s50);}
.hist-item.active{background:var(--brand-lt);}
.hist-item-nm{flex:1;font-size:12px;font-weight:500;color:var(--i2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hist-item.active .hist-item-nm{color:var(--brand-dk);}

.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.chat-msgs::-webkit-scrollbar{width:4px;}
.msg{animation:msgIn var(--base) var(--ease);}
.msg-a{display:flex;align-items:flex-start;gap:8px;}
.msg-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.msg-bub{background:var(--s50);border:1px solid var(--border);border-radius:var(--rmd);padding:10px 12px;font-size:12.5px;color:var(--i1);line-height:1.6;max-width:calc(100% - 32px);}
.msg-bub strong{font-weight:600;}
.msg-bub em{font-style:normal;color:var(--i2);background:var(--s100);padding:1px 5px;border-radius:3px;font-size:12px;}
.msg-u{display:flex;justify-content:flex-end;}
.msg-ub{background:var(--brand);color:#fff;border-radius:var(--rmd);padding:10px 12px;font-size:12.5px;line-height:1.6;max-width:86%;}
.msg-time{font-size:9.5px;color:var(--i4);margin-top:3px;padding:0 2px;}

/* Chat action chips */
.chat-acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.ca{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:16px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid;transition:all var(--fast);}
.ca-pri{background:var(--brand);border-color:var(--brand);color:#fff;}
.ca-pri:hover{background:var(--brand-dk);}
.ca-sec{background:var(--surf);border-color:var(--bdk);color:var(--i1);}
.ca-sec:hover{background:var(--s75);}
.ca-ghost{background:transparent;border-color:var(--border);color:var(--i2);}
.ca-ghost:hover{border-color:var(--bdk);color:var(--i1);}

/* Suggestions */
.sugg-wrap{padding:4px 14px 8px;}
.sugg-lbl{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);font-weight:600;margin-bottom:6px;}
.sugg{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--rsm);font-size:12px;color:var(--i2);cursor:pointer;background:var(--surf);margin-bottom:3px;transition:all var(--fast);}
.sugg:hover{border-color:var(--brand-mid);background:var(--brand-lt);color:var(--brand-dk);}
.sugg svg{color:var(--brand);flex-shrink:0;}

/* Typing */
.typing-bub{display:inline-flex;align-items:center;gap:4px;padding:12px 14px;background:var(--s50);border:1px solid var(--border);border-radius:var(--rmd);}
.typing-bub span{width:6px;height:6px;border-radius:50%;background:var(--s300);}
.typing-bub span:nth-child(1){animation:pulse .9s ease-in-out infinite;}
.typing-bub span:nth-child(2){animation:pulse .9s ease-in-out .18s infinite;}
.typing-bub span:nth-child(3){animation:pulse .9s ease-in-out .36s infinite;}

/* Composer */
.composer-wrap{border-top:1px solid var(--border);padding:10px 13px 13px;background:var(--bg);flex-shrink:0;}
.composer{display:flex;align-items:flex-end;gap:7px;background:var(--surf);border:1.5px solid var(--border);border-radius:12px;padding:8px 9px;transition:border-color var(--fast);}
.composer:focus-within{border-color:var(--brand-mid);}
.cta{flex:1;border:none;background:transparent;font-size:13px;color:var(--i1);outline:none;resize:none;min-height:20px;max-height:90px;line-height:1.5;}
.cta::placeholder{color:var(--i3);}
.composer-btns{display:flex;align-items:center;gap:5px;}
.att-btn{width:28px;height:28px;border-radius:7px;color:var(--i3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--fast);}
.att-btn:hover{background:var(--s75);color:var(--i1);}
.send-btn{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background var(--fast),transform var(--fast);}
.send-btn:hover{background:var(--brand-dk);transform:scale(1.04);}
.send-btn.off{background:var(--s200);cursor:default;transform:none;}
.composer-hint{font-size:10px;color:var(--i4);margin-top:5px;text-align:center;}

/* Dropdown */
.dd{position:relative;display:inline-block;}
.ddm{position:absolute;top:calc(100% + 5px);right:0;min-width:200px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);box-shadow:var(--sh-lg);z-index:200;overflow:hidden;display:none;}
.ddm.open{display:block;animation:slideDown 100ms var(--ease);}
.ddi{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:13px;color:var(--i1);cursor:pointer;transition:background var(--fast);}
.ddi:hover{background:var(--s50);}
.ddi svg{color:var(--i3);flex-shrink:0;}
.dd-sep{height:1px;background:var(--border);margin:3px 0;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--i1);color:#fff;font-size:12.5px;font-weight:500;padding:9px 18px;border-radius:999px;z-index:900;pointer-events:none;animation:fadeUp .2s var(--ease);}


/* ─── Data tables and tags (Prospecting, Scoring) ─── */
.dt-wrap{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
.dt-wrap::-webkit-scrollbar{display:none;}
.dt{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12.5px;}
.dt th{padding:11px 16px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3);text-align:left;background:var(--s50);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dt td{padding:13px 16px;color:var(--i2);border-bottom:1px solid var(--s75);vertical-align:middle;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dt tr:last-child td{border-bottom:none;}
.dt tbody tr{transition:background var(--fast);}
.dt tbody tr:hover td{background:#FAFBFC;}
.dt tbody tr.click{cursor:pointer;}
.dt th.num,.dt td.num{text-align:right;}
.dt td.num{font-family:var(--fm);font-variant-numeric:tabular-nums;}
.dt td.wrap{white-space:normal;}
.dt .dt-main{color:var(--i1);font-weight:600;overflow:hidden;text-overflow:ellipsis;}
.dt .val{color:var(--i1);overflow:hidden;text-overflow:ellipsis;}
.dt .sub{display:block;font-size:11px;color:var(--i3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;}
.dt .muted{color:var(--i4);}
.dt .person{display:flex;align-items:center;gap:10px;min-width:0;}
.dt .person > div:last-child{min-width:0;}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;}
.dt-empty{padding:28px;text-align:center;font-size:12.5px;color:var(--i3);}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;font-family:var(--fb);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;white-space:nowrap;background:var(--s75);color:var(--i2);vertical-align:middle;}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.tag-green{background:#E8F5EE;color:#24704F;}
.tag-amber{background:#FDF2E1;color:#A8620F;}
.tag-red{background:#FBEAEA;color:#A83A3A;}
.tag-blue{background:#E4F2FB;color:#00659A;}
.tag-violet{background:#F0EAF8;color:#6A4290;}
.tag-teal{background:#E3F4F2;color:#1B7369;}
.tag-pink{background:#FBE9F1;color:#A1386A;}
.tag-grey{background:#EEF1F4;color:#5B6774;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}

/* ─── Checks pop-up ─── */
@keyframes ckspin{to{transform:rotate(360deg);}}
@keyframes ckpop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.ck{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.ck-wait{border:2px solid var(--s100);}
.ck-run{border:2.5px solid var(--brand-lt);border-top-color:var(--brand);animation:ckspin .7s linear infinite;}
.ck-ok{background:var(--pos);color:#fff;animation:ckpop .2s var(--ease);}
.ck-warn{background:var(--warn);color:#fff;animation:ckpop .2s var(--ease);}
.ck-stop{background:var(--neg);color:#fff;animation:ckpop .2s var(--ease);}
.ck-info{background:var(--s300);color:#fff;animation:ckpop .2s var(--ease);}
.ck-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--s75);transition:opacity var(--base);}
.ck-row.pending{opacity:.45;}

/* ─── Checkboxes: grey when empty, brand colour when ticked ─── */
.dt input[type=checkbox]{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin:0;border-radius:4px;border:1.5px solid var(--s200);background:var(--s75);cursor:pointer;vertical-align:middle;display:inline-grid;place-content:center;transition:background var(--fast),border-color var(--fast);}
.dt input[type=checkbox]:hover{border-color:var(--s300);}
.dt input[type=checkbox]:checked,.dt input[type=checkbox]:indeterminate{background:var(--brand);border-color:var(--brand);}
.dt input[type=checkbox]:checked::after{content:'';width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg);}
.dt input[type=checkbox]:indeterminate::after{content:'';width:8px;height:2px;background:#fff;border-radius:1px;}
.dt input[type=checkbox]:focus-visible{outline:2px solid var(--brand-mid);outline-offset:2px;}
.stat-link{position:relative;cursor:pointer;display:block;text-decoration:none;color:inherit;transition:background var(--fast) var(--ease);}
.stat-link:hover,.stat-link.on{background:var(--brand-lt);}
.stat-link::after{content:'›';position:absolute;top:10px;right:14px;font-size:17px;color:var(--i4);}
.stat-link:hover .stat-lbl,.stat-link.on .stat-lbl{color:var(--brand);}

/* ─── Content library: package bar, guideline sample, voices, framework actions, greyed claims ─── */
.chg-dot{width:6px;height:6px;border-radius:50%;background:var(--ter);display:inline-block;margin-left:4px;}
.pk{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--ter-lt);border-radius:var(--rmd);margin-bottom:16px;font-size:12.5px;color:var(--i1);line-height:1.5;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(20,26,33,.06);}
.pk-idle{background:var(--s50);color:var(--i2);box-shadow:none;position:static;}
.pk-i{width:28px;height:28px;border-radius:8px;background:var(--surf);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;color:var(--brand-dk);}
.pk-s{font-size:11.5px;color:var(--i3);}
.rc{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.rc-h{display:flex;justify-content:space-between;padding:8px 12px;background:var(--s50);font-size:12px;font-weight:700;color:var(--i1);}
.rc-h span{color:var(--i3);font-weight:500;}
.rc-l{padding:7px 12px;border-top:1px solid var(--s75);font-size:12.5px;color:var(--i1);}
.gp{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;}
.gp-i{display:flex;gap:10px;font-size:12px;color:var(--i2);line-height:1.45;}
.gp-i b{color:var(--i1);font-size:12.5px;}
.gp-n{width:22px;height:22px;border-radius:6px;background:var(--brand-lt);color:var(--brand-dk);font-weight:700;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.su-tip{margin-top:12px;font-size:12px;color:var(--i2);padding:9px 12px;border-radius:8px;background:var(--s50);line-height:1.5;}
.tn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.tn-c{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.tn-c.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-lt);}
.tn-h{display:flex;justify-content:space-between;padding:8px 12px;background:var(--s50);font-size:12.5px;font-weight:700;color:var(--i1);}
.tn-h span{font-size:10.5px;color:var(--brand-dk);background:var(--brand-lt);padding:1px 7px;border-radius:999px;}
.tn-b{padding:12px;font-size:12.5px;color:var(--i1);line-height:1.6;}
.later{border:1px dashed var(--bdk);border-radius:var(--rmd);padding:12px 16px;margin-bottom:14px;background:var(--s50);opacity:.85;}
.later-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--i2);margin-bottom:6px;}
.later-h span{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-dk);background:var(--brand-lt);border-radius:999px;padding:2px 7px;}
.later-i{font-size:12px;color:var(--i3);line-height:1.5;padding:3px 0;}
.later-i b{color:var(--i2);}
.fas{display:flex;flex-direction:column;gap:6px;}
.fa{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surf);}
.fa > span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;}
.fa b{font-size:12px;color:var(--i1);font-weight:600;}
.fa em{font-style:normal;font-size:11px;color:var(--i3);line-height:1.35;}
.fa button{color:var(--i3);font-size:14px;line-height:1;}
.fa-i{width:24px;height:24px;border-radius:6px;background:var(--brand-lt);color:var(--brand-dk);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.fa-add{padding:5px 8px;border:1px dashed var(--brand-mid);border-radius:8px;font-size:12px;color:var(--brand-dk);background:var(--surf);}
.fal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;}
.fal-i{display:flex;gap:10px;font-size:12px;color:var(--i3);line-height:1.45;}
.fal-i b{color:var(--i1);font-size:12.5px;}
.gr-ban{padding:10px 14px;border-radius:var(--rmd);background:#FFF7E8;border:1px solid #F3D9A4;color:#7A4B00;font-size:12.5px;margin-bottom:12px;line-height:1.5;}
.greyed{opacity:.55;filter:grayscale(.6);pointer-events:none;user-select:none;}
.cl-tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.cl-tools input,.cl-tools select{padding:7px 10px;border:1px solid var(--bdk);border-radius:8px;font-size:12px;background:var(--surf);width:100%;}
.cl-tools select{width:auto;}
.cl-grid{display:grid;grid-template-columns:1fr 280px;gap:12px;align-items:start;}
table.cl-t{width:100%;border-collapse:collapse;font-size:12px;}
.cl-t th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3);background:var(--s50);padding:9px 10px;}
.cl-t td{padding:10px;border-top:1px solid var(--s75);vertical-align:top;color:var(--i1);}
.cl-t tr.sel td{background:var(--brand-lt);}
.cl-c{color:var(--i1);line-height:1.45;}
.cl-s{font-size:11px;color:var(--i3);margin-top:3px;}
.cl-kv{display:flex;flex-direction:column;gap:2px;padding:7px 0;border-top:1px solid var(--s75);font-size:12px;}
.cl-kv span{font-size:10.5px;color:var(--i3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.cl-kv b{font-weight:500;color:var(--i1);}

/* ─── Content library v2: fits the screen ─── */
.cl-canvas{padding:16px 24px 40px;}
.cl-canvas > .panel, .cl-canvas .panel{max-width:none;}
.subnav{display:inline-flex;background:var(--s75);border-radius:999px;padding:3px;margin-bottom:14px;}
.subnav button{border:none;background:none;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--i2);cursor:pointer;font-family:var(--fb);}
.subnav button.on{background:var(--surf);color:var(--i1);box-shadow:0 1px 3px rgba(20,26,33,.12);}
.smp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
.smp-c{border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--surf);}
.smp-doc{height:150px;overflow:hidden;padding:12px 14px;background:linear-gradient(180deg,#fff 60%,var(--s50));border-bottom:1px solid var(--s75);font-size:9.5px;line-height:1.45;color:var(--i2);position:relative;}
.smp-doc h3{font-size:12px;margin:0 0 6px;color:var(--i1);border-bottom:2px solid var(--brand);padding-bottom:4px;}
.smp-doc h4{font-size:10.5px;margin:6px 0 3px;color:var(--i1);text-decoration:underline;}
.smp-doc p,.smp-doc ul{margin:0 0 4px;} .smp-doc ul{padding-left:14px;}
.smp-b{padding:10px 14px 12px;font-size:12px;color:var(--i2);line-height:1.45;display:flex;flex-direction:column;gap:4px;flex:1;}
.smp-b b{font-size:13px;color:var(--i1);}
.smp-a{display:flex;gap:6px;justify-content:flex-end;margin-top:auto;padding-top:6px;}
.md{font-size:13px;color:var(--i1);line-height:1.6;}
.md h3{font-family:var(--fd);font-size:17px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--brand);}
.md h4{font-size:13.5px;margin:14px 0 4px;text-decoration:underline;}
.md p{margin:0 0 6px;} .md ul{margin:0 0 8px;padding-left:18px;}
.fw-stats{grid-template-columns:repeat(4,1fr);margin-bottom:12px;}
.fw-t{margin:-14px -16px -14px;}
.fw-r{display:grid;grid-template-columns:minmax(140px,1fr) minmax(200px,1.4fr) minmax(260px,2fr) 110px 70px;gap:14px;padding:14px 16px;border-top:1px solid var(--s75);align-items:start;font-size:12.5px;color:var(--i1);}
.fw-r:first-child{border-top:none;}
.fw-hd{background:var(--s50);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);padding:10px 16px;}
.fw-o{font-weight:700;}
.fw-n{display:block;margin-bottom:4px;}
.fw-s{margin:0;padding-left:18px;line-height:1.55;color:var(--i2);}
.fw-c{display:flex;flex-direction:column;gap:6px;}
.fw-e{text-align:right;}
.cta{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px solid var(--border);border-radius:9px;background:var(--surf);}
.cta-b{display:flex;flex-direction:column;gap:2px;min-width:0;}
.cta-b b{font-size:12.5px;color:var(--i1);font-weight:600;}
.cta-b > span{font-size:11px;color:var(--i3);line-height:1.35;}
.cta-t{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.tool{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 5px;border-radius:999px;background:var(--s50);border:1px solid var(--s75);font-size:11px;color:var(--i2);white-space:nowrap;}
img.lg{display:block;object-fit:contain;}
.cta-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cta-o{display:flex;gap:8px;align-items:flex-start;cursor:pointer;}
.af .cta-o input,.cta-o input{width:16px !important;height:16px;flex:0 0 16px;margin-top:10px;accent-color:var(--brand);padding:0;}
.cta-o .cta{flex:1;}
.cta-o .tool{font-size:0;gap:0;padding:3px;border-radius:6px;}   /* in the picker: logos only, names on hover */
.cta-o input:checked + .cta{border-color:var(--brand);background:#FCFAFE;}
.af textarea{width:100%;padding:8px 10px;border:1px solid var(--bdk);border-radius:8px;font-size:12.5px;font-family:var(--fb);line-height:1.5;resize:vertical;}
.af{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;flex:1;}
.af > span{font-size:11px;font-weight:600;color:var(--i2);}
.af input,.af select{width:100%;padding:8px 10px;border:1px solid var(--bdk);border-radius:8px;font-size:12.5px;font-family:var(--fb);background:var(--surf);}
.af-row{display:flex;gap:10px;}
.cl-intro{font-size:12.5px;color:var(--i2);margin-bottom:12px;line-height:1.5;}
.cl-tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.cl-q{flex:1;min-width:220px;max-width:380px;}
.cl-q input{width:100%;}
.cl-tools input,.cl-tools select{padding:7px 10px;border:1px solid var(--bdk);border-radius:8px;font-size:12.5px;background:var(--surf);font-family:var(--fb);}
.cnt{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font-size:10.5px;align-items:center;justify-content:center;margin-left:4px;}
.cl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:14px;align-items:start;}
.cl-t tr{cursor:pointer;}
.cl-t td:nth-child(3),.cl-t td:nth-child(4){white-space:nowrap;} .cl-t tbody tr:hover td{background:var(--s50);}
.cl-warn{font-size:11px;color:var(--neg);font-weight:600;margin-top:2px;}
.cl-u{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--i1);padding:4px 0;border-top:1px dashed var(--s75);}
.cl-u:first-of-type{margin-top:4px;}
.cl-u span{color:var(--i3);white-space:nowrap;}
.cl-alert{margin-top:10px;padding:8px 10px;border-radius:8px;background:#FDECEC;color:#9B2C2C;font-size:12px;line-height:1.45;}
.cl-act{display:flex;gap:10px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--s75);font-size:12px;color:var(--i2);flex-wrap:wrap;}
.cl-act select,.cl-act input{padding:6px 8px;border:1px solid var(--bdk);border-radius:7px;font-size:12px;font-family:var(--fb);}
.cl-pane{position:sticky;top:0;}
.rv-c{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--s75);}
.rv-c button{align-self:flex-start;}
.vr{border-top:1px solid var(--s75);}
.vr-h{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:12.5px;}
.vr-v{width:40px;color:var(--i1);}
.vr-n{flex:1;color:var(--i2);display:flex;flex-direction:column;gap:5px;}
.vr-tags{display:flex;flex-wrap:wrap;gap:4px;}
.vr-m{color:var(--i3);white-space:nowrap;}
.vr-x{color:var(--brand-dk);font-weight:600;white-space:nowrap;}
.vr-b{margin:0 0 10px 52px;padding:8px 12px;border-left:2px solid var(--brand-mid);font-size:12px;color:var(--i1);line-height:1.7;background:var(--s50);border-radius:0 8px 8px 0;}
@media (max-width:1200px){ .cl-grid{grid-template-columns:1fr;} .cl-pane{position:static;} .fw-r{grid-template-columns:1fr 1.3fr 1.8fr 100px 60px;} }
@media (max-width:1000px){ .fw-r{grid-template-columns:1fr;} .fw-hd{display:none;} .cta-pick{grid-template-columns:1fr;} .fw-stats{grid-template-columns:1fr 1fr;} }
.cta-off{opacity:.5;filter:grayscale(1);pointer-events:none;user-select:none;}
.soon-pill{display:inline-block;margin-left:6px;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-dk);background:var(--brand-lt);border-radius:999px;padding:1px 7px;vertical-align:middle;}
.flow{display:flex;align-items:stretch;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.flow-s{flex:1;min-width:160px;display:flex;gap:9px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surf);font-size:11.5px;color:var(--i3);line-height:1.4;}
.flow-s b{display:block;font-size:12.5px;color:var(--i1);margin-bottom:2px;}
.flow-s.off{border-style:dashed;background:var(--s50);opacity:.75;}
.flow-n{width:22px;height:22px;border-radius:6px;background:var(--brand-lt);color:var(--brand-dk);font-weight:700;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.flow-a{align-self:center;color:var(--i4);}
.ct-stats{grid-template-columns:repeat(4,1fr);margin-bottom:12px;}
.ct-t{margin:-14px -16px -14px;}
.ct-r{display:grid;grid-template-columns:minmax(240px,2.4fr) 130px 150px minmax(120px,1fr) 100px 150px;gap:12px;padding:12px 16px;border-top:1px solid var(--s75);align-items:center;font-size:12.5px;color:var(--i1);}
.ct-r:first-child{border-top:none;}
.ct-hd{background:var(--s50);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);padding:10px 16px;}
.ct-n{display:flex;gap:10px;align-items:flex-start;}
.ct-n b{display:block;font-size:13px;line-height:1.35;}
.ct-n span{font-size:11px;color:var(--i3);}
.ct-ic{width:28px;height:28px;border-radius:7px;background:var(--brand-lt);color:var(--brand-dk);font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ct-so{display:flex;gap:5px;flex-wrap:wrap;}
.ct-so span{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px dashed var(--bdk);color:var(--i3);}
.ct-cl{display:inline-block;font-family:var(--fm);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--brand-lt);color:var(--brand-dk);text-decoration:none;font-weight:600;margin:1px 0;}
.ct-act{display:flex;gap:6px;justify-content:flex-end;}
@media (max-width:1200px){ .ct-r{grid-template-columns:2fr 110px 120px 1fr 80px 140px;} .flow-a{display:none;} }
@media (max-width:1000px){ .ct-r{grid-template-columns:1fr;} .ct-hd{display:none;} .ct-stats{grid-template-columns:1fr 1fr;} }
</style>
</head>

function readFileToGrids(file){
  return new Promise((resolve,reject)=>{
    const isCsv = /\.csv$/i.test(file.name), isXlsx = /\.(xlsx|xls)$/i.test(file.name);
    if(!isCsv && !isXlsx){ reject(new Error('Use a .csv or .xlsx file')); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read the file'));
    reader.onload = ev=>{
      try{
        if(isCsv){ resolve([{sheet:'(CSV)', grid:DemandAI.parseCSV(ev.target.result)}]); return; }
        if(typeof XLSX==='undefined'){ reject(new Error('The Excel reader did not load. Save the sheet as CSV and upload that instead')); return; }
        const wb = XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
        resolve(wb.SheetNames.map(n=>({sheet:n, grid:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})})));
      }catch(e){ reject(e); }
    };
    if(isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
  });
}

// What differs between the live pack and the draft, section by section, in words.
function diffSummary(){
  const live = DemandAI.brandPack(), pend = DemandAI.brandPending(); if(!pend) return [];
  const d = pend.draft, out = [];
  const list = (sec, a, b, what) => { const A = new Set((a||[]).map(x=>String(x).toLowerCase())), B = new Set((b||[]).map(x=>String(x).toLowerCase()));
    const add = (b||[]).filter(x=>!A.has(String(x).toLowerCase())), rem = (a||[]).filter(x=>!B.has(String(x).toLowerCase())), l = [];
    if(add.length) l.push(`Added ${what}: ${add.join(', ')}`); if(rem.length) l.push(`Removed ${what}: ${rem.join(', ')}`); return l; };
  const g = []; if(JSON.stringify(live.guideline||null)!==JSON.stringify(d.guideline||null)) g.push(d.guideline ? `New document: ${d.guideline.name}` : 'Document removed');
  if((live.voice||{}).notes!==(d.voice||{}).notes) g.push('Key rules edited');
  if(g.length) out.push({ section:'Brand guidelines', lines:g });
  const v = [], lv = live.voice||{}, dv = d.voice||{};
  if(lv.preset!==dv.preset) v.push(`Voice: ${lv.preset} → ${dv.preset}`);
  if(lv.signoff!==dv.signoff) v.push(`Sign-off: “${lv.signoff}” → “${dv.signoff}”`);
  if(lv.maxWords!==dv.maxWords) v.push(`Email length: ${lv.maxWords} → ${dv.maxWords} words`);
  if(lv.maxSentenceWords!==dv.maxSentenceWords) v.push(`Sentence length: ${lv.maxSentenceWords} → ${dv.maxSentenceWords} words`);
  if(!!lv.noExclamation!==!!dv.noExclamation) v.push(dv.noExclamation ? 'No exclamation marks' : 'Exclamation marks allowed');
  v.push(...list('voice', lv.bannedOpeners, dv.bannedOpeners, 'openers to avoid'));
  if(v.length) out.push({ section:'Voice and tone', lines:v });
  const n = [...list('neg', live.negative, d.negative, 'keywords'), ...list('comp', live.competitors, d.competitors, 'competitors')];
  if(n.length) out.push({ section:'Negative keywords', lines:n });
  const lc = live.claims||[], dc = d.claims||[], c = [];
  dc.filter(x=>!lc.some(y=>y.id===x.id)).forEach(x=>c.push(`Added ${x.id}: ${x.title}`));
  lc.filter(x=>!dc.some(y=>y.id===x.id)).forEach(x=>c.push(`Removed ${x.id}`));
  dc.forEach(x=>{ const y = lc.find(z=>z.id===x.id); if(y && y.status!==x.status) c.push(`${x.id}: ${y.status} → ${x.status}`); });
  if(c.length) out.push({ section:'Approved claims', lines:c });
  const lf = live.frameworks||DemandAI.FRAMEWORKS, df = d.frameworks||lf, f = [];
  df.filter(x=>!lf.some(y=>y.objective===x.objective)).forEach(x=>f.push(`Added “${x.objective}”`));
  lf.filter(x=>!df.some(y=>y.objective===x.objective)).forEach(x=>f.push(`Removed “${x.objective}”`));
  df.forEach(x=>{ const y = lf.find(z=>z.objective===x.objective); if(!y || JSON.stringify(y)===JSON.stringify(x)) return;
    const ya = y.actions || (DemandAI.FRAMEWORKS.find(z=>z.objective===y.objective)||{}).actions || [], xa = x.actions || [], what = [];
    xa.filter(k=>!ya.includes(k)).forEach(k=>what.push(`added ${(FA[k]||{}).label||k}`)); ya.filter(k=>!xa.includes(k)).forEach(k=>what.push(`removed ${(FA[k]||{}).label||k}`));
    if(y.name!==x.name) what.push(`framework “${x.name}”`); if(JSON.stringify(y.steps)!==JSON.stringify(x.steps)) what.push('structure edited'); if(y.use!==x.use) what.push(`used ${x.use.toLowerCase()}`);
    f.push(`“${x.objective}”: ${what.join(', ') || 'edited'}`); });
  if(f.length) out.push({ section:'Messaging frameworks', lines:f });
  return out;
}

function mdHtml(t){
  const inline = x => esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let out = '', ul = false;
  String(t).split('\n').forEach(l=>{
    const b = l.match(/^\s*[-*]\s+(.*)/);
    if(b){ if(!ul){ out += '<ul>'; ul = true; } out += `<li>${inline(b[1])}</li>`; return; }
    if(ul){ out += '</ul>'; ul = false; }

async function onGuideline(file){
  if(!file) return;
  const keep = file.size <= 1.5*1024*1024;
  const data = keep ? await new Promise(res=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = ()=>res(null); r.readAsDataURL(file); }) : null;
  draft().guideline = { name:file.name, size:file.size, at:Date.now(), by:me().who, data };
  SUGGEST = null;
  if(/\.(txt|md)$/i.test(file.name)){ const text = await file.text(); SUGGEST = { name:file.name, items: readRules(text) }; }
  commit(`${file.name} added to the draft${SUGGEST?`; ${SUGGEST.items.length} rule${SUGGEST.items.length===1?'':'s'} found`:''}`);
}
// Reads plain statements of the rules from a text guideline. Anything else stays in the document for people to read.
function readRules(text){
  const out = [], split = v => v.split(/[,;|]| or | and /).map(x=>x.replace(/["“”'‘’.]/g,'').replace(/^(?:the )?(?:words?|phrases?|terms?)\s+/i,'').trim()).filter(x=>x && x.length<40);
  const clean = v => v.replace(/["“”'‘’]/g,'').replace(/[.\s]+$/,'').trim();
  text.split(/\r?\n/).forEach(line=>{
    const l = line.replace(/^[\s*\-•#\d.)]+/,'').trim();
    let m;
    if((m = l.match(/^competitors?\s*(?:are|include)?\s*[:\-]?\s*(.+)$/i)) || (m = l.match(/^(?:do not|don't|never)\s+(?:mention|name|reference)\s+(?:competitors?\s*(?:such as|like|:)?\s*)?(.+)$/i))) split(m[1]).forEach(v=>out.push({kind:'Competitor', value:v}));
    else if((m = l.match(/^(?:avoid|never (?:say|use|write)|do not (?:say|use|write)|don't (?:say|use|write)|banned(?: words| phrases)?|negative keywords?)\s*[:\-]?\s*(.+)$/i))) split(m[1]).forEach(v=>out.push({kind:'Negative keyword', value:v}));
    else if((m = l.match(/^(?:always\s+)?sign[\s-]?off(?:\s+(?:as|with))?\s*[:\-]?\s*(.+)$/i))) out.push({kind:'Sign-off', value:clean(m[1])});
    else if((m = l.match(/(?:emails?|messages?|drafts?).*?(?:under|below|at most|no more than|max(?:imum)?(?: of)?)\s+(\d+)\s+words/i))) out.push({kind:'Email length', value:m[1]});
    else if((m = l.match(/sentences?.*?(?:under|below|at most|no more than|max(?:imum)?(?: of)?|no longer than)\s+(\d+)\s+words/i))) out.push({kind:'Sentence length', value:m[1]});
    else if((m = l.match(/^(?:tone|voice)\b\s*(?:should be|is|:|-)?\s*(.+)$/i)) || (m = l.match(/^(?:be|write|sound)\s+(formal|warm|friendly|direct|concise)\b(.*)$/i))){ const p = /formal/i.test(m[1]) ? 'Formal' : /warm|friendly/i.test(m[1]) ? 'Warm' : /direct|concise/i.test(m[1]) ? 'Direct' : null; if(p) out.push({kind:'Voice', value:p}); }
    else if((m = l.match(/^(?:never open with|don't open with|do not open with|avoid opening with)\s*[:\-]?\s*(.+)$/i))) split(m[1]).forEach(v=>out.push({kind:'Banned opener', value:v}));
    else if(/no exclamation|exclamation marks?.*(?:never|avoid|not)|(?:never|avoid|don't|do not) use exclamation/i.test(l)) out.push({kind:'Rule', value:'No exclamation marks'});
  });
  const seen = new Set(); return out.filter(x=>{ const k = x.kind+'|'+x.value.toLowerCase(); return !seen.has(k) && seen.add(k); });
}
function addSuggestion(i){
  const x = SUGGEST.items[i], d = draft();
  if(x.kind==='Negative keyword' && !d.negative.some(w=>w.toLowerCase()===x.value.toLowerCase())) d.negative.push(x.value.toLowerCase());
  if(x.kind==='Competitor' && !d.competitors.includes(x.value)) d.competitors.push(x.value);
  if(x.kind==='Sign-off') d.voice.signoff = x.value;
  if(x.kind==='Voice') d.voice.preset = x.value;
  if(x.kind==='Banned opener') (d.voice.bannedOpeners = d.voice.bannedOpeners || []).push(x.value);
  if(x.kind==='Rule') d.voice.noExclamation = true;
  if(x.kind==='Email length') d.voice.maxWords = +x.value;
  if(x.kind==='Sentence length') d.voice.maxSentenceWords = +x.value;
  x.added = true; commit('Added. Save to make it a new version');
}

function addClaim(){
  const v = id => (document.getElementById(id).value||'').trim();

  // Where the claim can be used is read from its words, not picked by hand; a claim that names no topic can be used anywhere.
  const segs = claimFits(claim+' '+title);

function saveFw(i){
  const v = id => (document.getElementById(id).value||'').trim(), steps = v('fwSteps').split('\n').map(x=>x.trim()).filter(Boolean);
  if(!v('fwObj') || !v('fwName') || !steps.length){ document.getElementById('fwErr').textContent = 'Add the objective, the framework and its structure'; return; }
  const actions = i>=0 ? (fws()[i].actions||[]) : [];     // calls to action are set after the pilot
  const f = { objective:v('fwObj'), name:v('fwName'), steps, use:v('fwUse'), actions };
  if(i>=0) fws()[i] = f; else fws().push(f);

function setFw(i, k, val){ const f = fws()[i]; if(!f) return; f[k] = k==='steps' ? val.split('\n').map(x=>x.trim()).filter(Boolean) : val.trim(); commit('Changed. Save to make it a new version'); }
function removeFw(i){ fws().splice(i,1); commit('Removed from the draft'); }
function addFw(){
  const v = id => (document.getElementById(id).value||'').trim(), steps = v('fwSteps').split('\n').map(x=>x.trim()).filter(Boolean);
  if(!v('fwObj') || !v('fwName') || !steps.length){ showToast('Add the objective, the framework and its structure'); return; }

}

        <div style="text-align:center;max-width:360px">
          <div style="font-size:28px;margin-bottom:10px">🔒</div>
          <div style="font-family:var(--fd);font-size:15px;font-weight:700;color:var(--i1);margin-bottom:6px">Not available for this role</div>
          <div style="font-size:12px;color:var(--i3);line-height:1.6">${role} doesn't have access to this screen. Switch role from the sidebar, or use the menu to go to <a href="${firstAllowedHref}" style="color:var(--brand)">${PAGE_NAMES[firstAllowedHref]||firstAllowedHref}</a>.</div>
        </div>
      </div>`;
  }
}
function renderRoleSwitcher(){
  const foot = document.querySelector('.nav-foot');
  if(!foot || document.getElementById('roleSwitchBtn')) return;
  const btn = document.createElement('div');
  btn.id = 'roleSwitchBtn';
  btn.style.cssText = 'padding:8px 10px 0;cursor:pointer;';
  btn.innerHTML = `<div style="font-size:10px;color:var(--r3);text-decoration:underline;text-align:center">Switch role (demo)</div>`;
  btn.onclick = openRoleModal;
  foot.appendChild(btn);
}
function openRoleModal(){
  let ov = document.getElementById('roleModalOverlay');
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'roleModalOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(20,26,33,.45);z-index:700;display:flex;align-items:center;justify-content:center;';
    ov.onclick = (e)=>{ if(e.target===ov) ov.style.display='none'; };
    document.body.appendChild(ov);
  }
  const current = getRole();
  ov.innerHTML = `<div style="background:var(--surf);border-radius:var(--rlg);box-shadow:var(--sh-lg);width:360px;padding:20px;" onclick="event.stopPropagation()">
    <div style="font-family:var(--fd);font-size:14px;font-weight:700;color:var(--i1);margin-bottom:4px">Preview as a role</div>
    <div style="font-size:11px;color:var(--i3);margin-bottom:14px">Changes what you see, matching what that role actually has access to. If this screen isn't available for the new role, use the sidebar to go to one that is.</div>
    ${ALL_ROLES.map(r=>`<div onclick="setRole('${r}')" style="padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;background:${r===current?'var(--brand-lt)':'transparent'};display:flex;align-items:center;justify-content:space-between">
      <div><div style="font-size:12.5px;font-weight:600;color:var(--i1)">${r}</div><div style="font-size:10.5px;color:var(--i3)">${ROLE_PERSON[r]}</div></div>
      ${r===current?'<span style="color:var(--brand)">✓</span>':''}
    </div>`).join('')}
    <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;margin-top:10px" onclick="document.getElementById('roleModalOverlay').style.display='none'">Close</button>
  </div>`;
  ov.style.display = 'flex';
}
document.addEventListener('DOMContentLoaded', function(){ applyRoleToNav(); renderRoleSwitcher(); });
if(document.readyState !== 'loading'){ applyRoleToNav(); renderRoleSwitcher(); }


</script>
</body>
</html>
