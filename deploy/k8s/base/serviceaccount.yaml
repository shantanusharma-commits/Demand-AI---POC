# The app's identity in the cluster. With Amazon Bedrock (AI_PROVIDER=bedrock, D-35) it gets an IAM role through EKS
# Pod Identity (an association made outside these manifests) or IRSA (the annotation, set in the overlay); the app
# refuses static AWS keys. No Kubernetes API access is needed, so the token is not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demandai-app
automountServiceAccountToken: false
