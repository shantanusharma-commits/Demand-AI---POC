# Secrets from AWS Secrets Manager through the External Secrets Operator (a cluster add-on DevOps installs, with a
# ClusterSecretStore named aws-secrets-manager that reads through an IAM role). Three secrets, so each workload holds
# only what it needs: the app never sees the owner or ops database credentials.
# Each Secrets Manager secret is a JSON object whose keys are the variable names below (docs/devops/DEPLOY-EKS.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demandai-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: demandai-app
    creationPolicy: Owner
  data:
    # postgresql://demandai_app:<password>@<rds endpoint>:5432/demandai
    - secretKey: DATABASE_URL
      remoteRef: { key: demandai/pilot/app, property: DATABASE_URL }
    - secretKey: SESSION_SECRET
      remoteRef: { key: demandai/pilot/app, property: SESSION_SECRET }
    # The Azure OpenAI or API Management endpoint and key (D-40, D-44). Leave them empty while AI_PROVIDER=none.
    - secretKey: AZURE_OPENAI_ENDPOINT
      remoteRef: { key: demandai/pilot/app, property: AZURE_OPENAI_ENDPOINT }
    - secretKey: AZURE_OPENAI_API_KEY
      remoteRef: { key: demandai/pilot/app, property: AZURE_OPENAI_API_KEY }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demandai-migrate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: demandai-migrate
    creationPolicy: Owner
  data:
    # postgresql://demandai_owner:<password>@<rds endpoint>:5432/demandai (migrations and create-admin only)
    - secretKey: DATABASE_MIGRATION_URL
      remoteRef: { key: demandai/pilot/migrate, property: DATABASE_MIGRATION_URL }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demandai-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: demandai-ops
    creationPolicy: Owner
  data:
    # postgresql://demandai_ops:<password>@<rds endpoint>:5432/demandai (the purge and export commands only)
    - secretKey: DATABASE_OPS_URL
      remoteRef: { key: demandai/pilot/ops, property: DATABASE_OPS_URL }
