# Only the load balancer reaches the app (docs/SECURITY.md S5: a client that reaches it directly could name any
# address in X-Forwarded-For). The ALB sends from the VPC's subnets: the overlay sets the VPC CIDR. Enforced only when
# the cluster's network policy support is on (VPC CNI network policies, or Calico).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demandai-app-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demandai-app
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { protocol: TCP, port: 3000 }
