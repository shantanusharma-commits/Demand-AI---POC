    dz.addEventListener('drop', e=>{e.preventDefault(); dz.style.borderColor='var(--bdk)'; if(e.dataTransfer.files[0]) onSegFile(e.dataTransfer.files[0]);});
  }
}
async function onSegFile(file){
  if(!file) return;
  try{
    const g = pickSheet(await readFileToGrids(file));
    const asOf = (document.getElementById('segAsOf')||{}).value || todayIso();
    const r = DemandAI.processScoredProspects(g.grid, {file:file.name, sheet:g.sheet, asOf});
    if(r.issues.some(i=>i.severity==='stop')){ showToast(r.issues.find(i=>i.severity==='stop').issue); return; }
    if(!r.stats.prospects){ showToast(`${file.name}: no rows with a usable signal. Check it against the template`); return; }
    UPLOAD = { csv:true, name:file.name.replace(/\.[^.]+$/,''), listName:file.name.replace(/\.[^.]+$/,''), fileName:file.name, sheet:g.sheet, grid:g.grid, asOf, keys:null };
    renderStart('new');
    showToast(`${r.stats.rowsRead} rows read · ${r.stats.prospects} prospects at ${r.stats.accounts} accounts${r.stats.rejected?` · ${r.stats.rejected} not used`:''}`);
  }catch(e){ showToast(e.message || 'Could not read that file'); }
}

/* ═══════════════ BUILD: re-score with the engine, then segment ═══════════════ */
function sourceFor(id){
  if(id==='sample') return { sample:true, name:'Sample prospects', listName:'Sample prospects', fileName:DemandAISample.SIGNAL_FILE, sheet:'Signal template', grid:DemandAISample.SIGNALS, asOf:DemandAISample.SAMPLE_AS_OF, sandbox:true, keys:null };
  if(id==='handoff') return handoff();
  if(id==='upload') return UPLOAD;
  const r = DemandAI.getScoring(id);
  return r && { name:r.name, listId:r.listId, listName:r.listName, fileName:r.fileName, sheet:r.sheet, grid:r.grid, asOf:r.asOf, sandbox:r.sandbox, keys:null };
}
// 5.9 Engage-once: accounts approved, sent or rejected as "already engaged" in any other segmented list of this pilot.
function engagedMap(exceptId){
  const m = new Map();
  DemandAI.loadSegmentations().filter(r=>r.id!==exceptId).forEach(run=>{
    Object.entries(run.decisions||{}).forEach(([k,d])=>{
      if(['Approved','Sent'].includes(d.status) || d.code==='R4'){ const n = (run.accountNames||{})[k.split('|')[0]]; if(n && !m.has(n.toLowerCase())) m.set(n.toLowerCase(), `${run.name}, ${fmtDate(d.at||run.createdAt)}`); }
    });
  });
  return m;
}
function compute(src, runId){
  let list, scored, sig, fileIssues = 0;
  if(src.csv){
    const r = DemandAI.processScoredProspects(src.grid, {file:src.fileName, sheet:src.sheet, asOf:src.asOf});
    scored = r.results; fileIssues = r.stats.rejected;
    sig = { signals: scored.flatMap(x=>x.people.flatMap(p=>p.signals)), issues: r.issues };
  }
  else if(src.sample){ const r = DemandAI.processLeads(DemandAISample.LEADS, {file:DemandAISample.LEAD_FILE, sheet:'Lead template'}); list = {accounts:r.accounts, contacts:r.contacts}; }
  else { const L = DemandAI.getList(src.listId); if(!L) return null; list = JSON.parse(JSON.stringify({accounts:L.accounts, contacts:L.contacts})); }
  if(!src.csv){
    sig = DemandAI.processSignals(src.grid, list, {file:src.fileName, sheet:src.sheet, asOf:src.asOf});
    scored = DemandAI.scoreList(list, sig);
  }
  // An uploaded file is the list itself: every prospect in it. A scored list: tier A and B, unless chosen in Scoring.
  const keys = src.csv ? scored.flatMap(r=>r.people.map(p=>r.account.id+'|'+p.contact.row)) : src.keys || scored.flatMap(r=>(r.people||[]).filter(p=>p.signals.length && (p.tier==='A'||p.tier==='B')).map(p=>r.account.id+'|'+p.contact.row));
  const seg = DemandAI.buildSegments(scored, {keys, engaged: engagedMap(runId)});
  // Order is shuffled within a priority tier, so position doesn't decide the outcome (seeded by the run, so it's stable).
  let h = 0; for(const ch of String(runId||src.name)) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const rnd = k => { let x = h; for(const ch of k) x = (x*31 + ch.charCodeAt(0)) >>> 0; return x; };
  const ti = {A:0,B:1,C:2};
  seg.recs.sort((a,b)=>(a.segment?0:1)-(b.segment?0:1) || (ti[a.person.tier]??3)-(ti[b.person.tier]??3) || rnd(a.key)-rnd(b.key));
  return { sig, scored, keys, seg, fileIssues };
}
function buildFrom(id){
  const src = sourceFor(id);
  if(!src){ showToast("That scored list isn't saved any more"); renderStart('new'); return; }
  const runId = 'seg-'+Date.now().toString(36);
  const c = compute(src, runId);
  if(!c){ showToast("The prospect list behind it isn't saved any more"); return; }
  if(!c.seg.recs.length && !c.seg.engagedOnce.length){ showToast('No prospects with a live signal to segment'); return; }
  const accountNames = {}; c.scored.forEach(r=>{ accountNames[r.account.id] = r.account.name; });
  const saved = { id:runId, name:`${src.listName||src.name} · segmented ${todayIso()}`, createdAt:Date.now(),
    src:{...src, keys:c.keys}, accountNames, decisions:{}, log:[], stats:{ segments:c.seg.segments.length, prospects:c.seg.recs.length } };
  RUN = { saved, ...c };
  view='grid'; filt='all'; segFilt=null; vertFilt=null; q='';
  runChecks();
}
function openRun(id){
  const saved = DemandAI.getSegmentation(id); if(!saved) return;
  const c = compute(saved.src, saved.id);
  if(!c){ showToast("The prospect list behind it isn't saved any more"); return; }
  RUN = { saved, ...c }; view='grid'; filt='all'; segFilt=null; vertFilt=null; q='';
  renderResults();
}
function persist(){ if(RUN && !DemandAI.saveSegmentation(RUN.saved)) showToast("This browser blocks storage, so decisions can't be kept"); }

/* ═══════════════ PER-ITEM STATE: action, draft, checks ═══════════════ */
const asOf = () => RUN.saved.src.asOf;
function dec(key){ return RUN.saved.decisions[key] || {status:'Waiting'}; }
function setDec(key, patch){ RUN.saved.decisions[key] = Object.assign(dec(key), patch); }
function recOf(key){ return RUN.seg.recs.find(r=>r.key===key); }
// The prospect after any "wrong contact" alternative
function liveRec(r){
  const d = dec(r.key); if(!d.contactRow) return r;
  const p = r.result.people.find(x=>x.contact.row===d.contactRow); if(!p) return r;
  return Object.assign({}, r, { contact:p.contact, person:p });
}
function chosenAction(r){ const d = dec(r.key); return d.manual ? d.manual : d.useRunner && r.runnerUp ? r.runnerUp.action : r.action; }
function generated(r){ const d = dec(r.key); return DemandAI.draftFor(liveRec(r), chosenAction(r), {asOf:asOf(), channel:d.channel, variant:d.variant}); }
function draftOf(r){ const d = dec(r.key); return d.draft || generated(r); }
function checksOf(r){ const x = draftOf(r), chk = DemandAI.checkDraft(x); return { chk, conf: DemandAI.confidenceFor(liveRec(r), x, chk, chosenAction(r)) }; }
// Items that need a person before they proceed (6.1/6.2)
function exceptionOf(r){
  const { chk, conf } = checksOf(r), x = draftOf(r);
  if(!r.segment) return r.exception;
  if(chk.unsupported.length) return 'Unsupported claim';
  if(chk.flags.some(f=>f.rule==='Sensitive term')) return 'Needs compliance approval';
  if(chk.flags.length) return 'Brand or rule check';
  if(r.exception) return r.exception;
  if(conf.level==='Low') return 'Low confidence';
  return '';
}
function versions(r){ const d = dec(r.key); return d.versions || [{v:1, at:RUN.saved.createdAt, by:'System', why:'Generated from the action', draft:generated(r)}]; }
// 5.19 Every version kept: record the draft before and after each change.
function change(key, why, mutate){
  const r = recOf(key), d = dec(key);
  const vs = versions(r);
  mutate();
  const now = draftOf(r);
  if(JSON.stringify(now)!==JSON.stringify(vs[vs.length-1].draft)) vs.push({v:vs.length+1, at:Date.now(), by:me().who, why, draft:now});
  setDec(key, {versions:vs});
}
function logIt(r, decision, extra={}){
  const m = me(), x = draftOf(r), d = dec(r.key);
  const secs = openedAt ? Math.round((Date.now()-openedAt)/1000) : null;
  const pos = visibleRecs().findIndex(y=>y.key===r.key) + 1;
  RUN.saved.log.unshift({ at:Date.now(), who:m.who, role:m.role, key:r.key, prospect:liveRec(r).contact.name, company:r.account.name,
    segment:r.segment||'No micro-segment', decision, code:extra.code||'', tags:extra.tags||[], action:extra.action||chosenAction(r), channel:extra.channel||x.channel,
    note:extra.note||'', version:extra.version||(d.versions||[1]).length, secs, position:pos||null,
    flag: extra.decisive && secs!==null && secs<5 ? 'Fast decision: checked before it counts' : '' });
}

/* ═══════════════ CHECKS POP-UP ═══════════════ */
const SEG_STEPS = [
  ['read',     'Read the scored prospects',        'Tier A and B, or the ones chosen in Scoring'],
  ['engage',   'Engage-once rule',                 'Accounts already recommended in this pilot are set aside'],
  ['group',    'Group by the strongest signal',    `At least ${DemandAI.CONFIG.minSegmentAccounts} different accounts each; an account is in one only`],
  ['fallback', 'Fall back to the next signal',     'When too few accounts share the strongest signal'],
  ['except',   'Exception check',                  'Accounts that fit no segment go to a person'],
  ['action',   'Next best action and runner-up',   'From the segment\'s approved library, with a reason'],
  ['channel',  'Channel within hard limits',       'Verified email, LinkedIn URL, consent; inquiries and renewals to a person'],
  ['proof',    'Approved proof for each case',     'Unexpired collateral; none found: a task for the owner'],
  ['draft',    'First engagement drafted',         'Email, LinkedIn note or call script, with the brief'],
  ['brand',    'Brand and rule checks',            'Banned claims, competitors, pricing, sensitive terms, length'],
  ['claims',   'Every claim supported',            'Each claim matches its cited source'],
  ['confidence','Confidence',                      'Grounding, open flags and signal strength'],
];
function stepResult(k){
  const s = RUN.seg, recs = s.recs, byAcc = [...new Map(recs.map(r=>[r.account.id,r])).values()];
  const pl = (n,w) => `${n} ${w}${n===1?'':'s'}`;
  switch(k){
    case 'read': return {sev:'', label:`${pl(recs.length,'prospect')} · ${pl(s.accountsConsidered,'account')}`};
    case 'engage': return s.engagedOnce.length ? {sev:'info', label:`${pl(s.engagedOnce.length,'account')} set aside`} : {sev:'', label:'None engaged before'};
    case 'group': return s.segments.length ? {sev:'', label:`${pl(s.segments.length,'micro-segment')} formed`} : {sev:'warn', label:'None formed'};
    case 'fallback': { const n = byAcc.filter(r=>r.fallback).length; return n ? {sev:'info', label:`${pl(n,'account')} on the next signal`} : {sev:'', label:'Not needed'}; }
    case 'except': { const n = new Set(s.exceptions.map(r=>r.account.id)).size; return n ? {sev:'warn', label:`${pl(n,'account')} to a person`} : {sev:'', label:'All segments proceed'}; }
    case 'action': { const n = byAcc.filter(r=>r.runnerUp&&r.runnerUp.fromStrongest).length; return {sev:'', label:`${pl(recs.length,'action')}${n?` · ${n} from strongest`:''}`}; }
    case 'channel': { const c = {}; recs.forEach(r=>{ const ch = draftOf(r).channel; c[ch]=(c[ch]||0)+1; }); return {sev:'', label:Object.entries(c).map(([k,v])=>`${v} ${k}`).join(' · ')}; }
    case 'proof': { const n = recs.filter(r=>draftOf(r).noProof).length; return n ? {sev:'warn', label:`${n} without proof: tasks`} : {sev:'', label:'Found for every draft'}; }
    case 'draft': return {sev:'', label:`${recs.filter(r=>draftOf(r).channel!=='Task').length} drafts · ${recs.filter(r=>draftOf(r).channel==='Task').length} tasks`};
    case 'brand': { const n = recs.filter(r=>checksOf(r).chk.flags.length).length; return n ? {sev:'warn', label:`${n} flagged`} : {sev:'', label:'All pass'}; }
    case 'claims': { const n = recs.filter(r=>checksOf(r).chk.unsupported.length).length; return n ? {sev:'warn', label:`${n} unsupported`} : {sev:'', label:'All verified'}; }
    case 'confidence': { const c = {}; recs.forEach(r=>{ const l = checksOf(r).conf.level; c[l]=(c[l]||0)+1; }); return {sev:c.Low?'info':'', label:['High','Medium','Low'].filter(l=>c[l]).map(l=>`${c[l]} ${l.toLowerCase()}`).join(' · ')}; }
  }
}
function runChecks(){
  const ov = overlay('checksOverlay'); ov.onclick = null;
  ov.innerHTML = `<div style="background:var(--surf);border-radius:var(--rlg);box-shadow:var(--sh-lg);width:560px;max-width:100%;max-height:90vh;display:flex;flex-direction:column">
    <div style="padding:20px 22px 12px">
      <div style="font-family:var(--fd);font-size:15px;font-weight:700;color:var(--i1)">Building micro-segments</div>
      <div style="font-size:12px;color:var(--i3);margin-top:3px">${esc(RUN.saved.src.listName||RUN.saved.src.name)} · signals from ${esc(RUN.saved.src.fileName)} · as of ${esc(RUN.saved.src.asOf)} · fixed rules</div>
      <div style="height:4px;background:var(--s75);border-radius:2px;margin-top:12px;overflow:hidden"><div id="ckBar" style="height:100%;width:0;background:var(--brand);transition:width .3s var(--ease)"></div></div>
    </div>
    <div style="padding:0 22px;overflow-y:auto">
      ${SEG_STEPS.map(([k,name,what],i)=>`<div class="ck-row pending" id="ck-${i}">
        <div class="ck ck-wait" id="ckc-${i}"></div>
        <div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:600;color:var(--i1)">${name}</div><div style="font-size:11px;color:var(--i3)">${what}</div></div>
        <div id="ckr-${i}" style="text-align:right;flex-shrink:0;max-width:46%"></div>
      </div>`).join('')}
    </div>
    <div id="ckFoot" style="padding:14px 22px 18px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);margin-top:4px"><span style="flex:1;font-size:12px;color:var(--i3)">Running checks…</span></div>
  </div>`;
  let i = 0;
  const tick = () => {
    if(i>0){
      const res = stepResult(SEG_STEPS[i-1][0]), c = document.getElementById('ckc-'+(i-1));
      c.className = 'ck ' + (res.sev==='warn'?'ck-warn':res.sev==='info'?'ck-info':'ck-ok');
      c.textContent = res.sev ? '!' : '✓';
      const tone = res.sev==='warn'?'tag-amber':res.sev==='info'?'tag-grey':'tag-green';
      document.getElementById('ckr-'+(i-1)).innerHTML = `<span class="tag ${tone}">${res.label}</span>`;
    }
    document.getElementById('ckBar').style.width = (i/SEG_STEPS.length*100)+'%';
    if(i<SEG_STEPS.length){
      const row = document.getElementById('ck-'+i); row.classList.remove('pending');
      document.getElementById('ckc-'+i).className = 'ck ck-run';
      row.scrollIntoView({block:'nearest'});
      i++; setTimeout(tick, 320);
    } else {
      persist();
      const s = RUN.seg, ex = s.recs.filter(r=>exceptionOf(r)).length;
      document.getElementById('ckFoot').innerHTML = `
        <span style="flex:1;font-size:12px;color:var(--i2)"><b>${s.segments.length}</b> micro-segment${s.segments.length===1?'':'s'} · <b>${s.recs.length}</b> to review · <b>${ex}</b> need a closer look</span>
        <button class="btn btn-ghost btn-sm" onclick="hide('checksOverlay');renderStart('new')">Back</button>
        <button class="btn btn-primary btn-sm" onclick="hide('checksOverlay');renderResults()">View the micro-segments →</button>`;
    }
  };
  tick();
}

/* ═══════════════ DECISIONS (6.4–6.8): one item at a time, no bulk ═══════════════ */
const REJECT = [
  ['R1','Wrong fit','The account is set aside for the pilot'],
  ['R2','Signal not adequate','The signal is set aside; re-score the account in Scoring'],
  ['R3','Wrong company or site','The signal is detached; the entity match is corrected'],
  ['R4','Already engaged','Engage-once applies from now on'],
  ['R5','Not the right time','The account moves to the watch list'],
  ['R6','Wrong action','The runner-up is offered once, with its reason'],
  ['R7','Wrong persona or contact','The next contact in persona order is proposed'],
  ['R8','Wrong channel','The same action on the next allowed channel'],
  ['R9','Factual issue','The draft is regenerated with the issue named'],
  ['R10','Tone or brand','The draft is regenerated with the note'],
  ['R11','Length or format','The draft is regenerated, shorter'],
  ['R12','Other','A comment is required; nothing changes automatically'],
];
const ACCEPT_TAGS = ['Accurate reasoning','Right timing','Right action','Ready to use','Saved research time'];
let pickTags = new Set(), pickCode = null;
function approve(key){
  const r = recOf(key), d = dec(key); if(!r || d.status!=='Waiting') return;
  const note = (document.getElementById('acNote')||{}).value || '';
  const ex = exceptionOf(r);
  setDec(key, {status:'Approved', by:me().who, at:Date.now(), tags:[...pickTags], comment:note});
  logIt(r, d.manual ? 'Approved a manual action' : d.useRunner ? 'Approved the runner-up' : d.edited ? 'Approved with edits' : 'Approved',
    {tags:[...pickTags], note:[ex?`Exception reviewed: ${ex}`:'', note].filter(Boolean).join(' · '), decisive:true});
  persist(); showToast(`Approved and logged: ${chosenAction(r)} for ${liveRec(r).contact.name}`); refresh();
}
function undo(key){ const r = recOf(key); setDec(key, {status:'Waiting', by:null, at:null}); logIt(r, 'Decision undone'); persist(); refresh(); }
function reject(key){
  const r = recOf(key), d = dec(key);
  if(!pickCode){ showToast('Pick a reason code'); return; }
  const note = (document.getElementById('rjNote')||{}).value.trim();
  if(pickCode==='R12' && !note){ showToast('R12 needs a comment'); return; }
  const [code, label] = REJECT.find(x=>x[0]===pickCode);
  const second = d.alternativeUsed;
  const before = { action:chosenAction(r), channel:draftOf(r).channel, version:(d.versions||[1]).length };
  let outcome = '', next = {};
  const alt = !second && {
    R6: () => r.runnerUp && !d.useRunner && !d.manual ? (change(key,'R6 wrong action: runner-up offered',()=>setDec(key,{useRunner:true,draft:null,edited:false})), 'Runner-up offered once, with its reason') : '',
    R7: () => { const tried = new Set([r.contact.row, d.contactRow].filter(Boolean)); const pr = {Primary:0}; const nx = r.result.people.filter(p=>!tried.has(p.contact.row) && !p.contact.optOut).sort((a,b)=>(pr[a.contact.persona]??1)-(pr[b.contact.persona]??1))[0];
                return nx ? (change(key,'R7 wrong contact: next contact',()=>setDec(key,{contactRow:nx.contact.row,draft:null,edited:false,channel:null})), `Next contact proposed: ${nx.contact.name}`) : ''; },
    R8: () => { const x = draftOf(r); if(x.channel==='Task') return ''; const al = DemandAI.allowedChannels(liveRec(r).contact); const nx = al[al.indexOf(x.channel)+1];
                return nx ? (change(key,'R8 wrong channel: next allowed channel',()=>setDec(key,{channel:nx,draft:null,edited:false})), `Same action on ${nx}`) : ''; },
    R9: () => (change(key,'R9 factual issue: regenerated',()=>setDec(key,{variant:'alt',draft:null,edited:false})), 'Draft regenerated, same action'),
    R10: () => (change(key,'R10 tone or brand: regenerated',()=>setDec(key,{variant:'tone',draft:null,edited:false})), 'Draft regenerated, same action'),
    R11: () => (change(key,'R11 length or format: regenerated shorter',()=>setDec(key,{variant:'short',draft:null,edited:false})), 'Draft regenerated shorter, same action'),
  }[code];
  if(alt) outcome = alt();
  if(outcome) next = {status:'Waiting', alternativeUsed:true};
  else if(code==='R1'||code==='R2'||code==='R3') { next = {status:'Set aside'}; outcome = REJECT.find(x=>x[0]===code)[2]; }
  else if(code==='R4') { next = {status:'Closed'}; outcome = 'Engage-once applies from now on'; }
  else if(code==='R5') { next = {status:'Watch list'}; outcome = 'Moved to the watch list'; }
  else { next = {status:'Closed'}; outcome = second ? 'Second rejection: closed' : code==='R12' ? 'Nothing changes automatically' : 'No alternative available: closed'; }
  setDec(key, Object.assign(next, {code, by:me().who, at:Date.now(), rejections:(d.rejections||[]).concat([{code, note, at:Date.now()}])}));
  logIt(r, `Rejected · ${code} ${label}`, Object.assign({code, note:[outcome, note].filter(Boolean).join(' · '), decisive:true}, before));
  persist(); showToast(`${code} ${label}: ${outcome}`); refresh();
}
function swapAction(key){
  const r = recOf(key); if(!r || !r.runnerUp) return;
  const d = dec(key), to = d.useRunner ? 'recommended' : 'runner-up';
  change(key, `Swapped to the ${to}`, ()=>setDec(key, {useRunner:!d.useRunner, manual:null, draft:null, edited:false}));
  logIt(r, `Swapped to the ${to}`); persist(); refresh();
}
function addManual(key){
  const v = (document.getElementById('manualAct')||{}).value.trim();
  if(!v){ showToast('Write the action first'); return; }
  const r = recOf(key);
  change(key, 'Manual action added', ()=>setDec(key, {manual:v, draft:null, edited:false}));
  logIt(r, 'Added a manual action', {note:v}); persist(); refresh();
}
function saveDraft(key, rating){
  const r = recOf(key), x = Object.assign({}, draftOf(r)), v = id => (document.getElementById(id)||{}).value;
  if(x.channel==='Email'){ x.subject = v('dSubj'); x.body = v('dBody'); x.words = x.body.split(/\s+/).filter(Boolean).length; }
  else if(x.channel==='LinkedIn'){ x.note = v('dNote'); x.message = v('dMsg'); }
  else if(x.script){ x.script = Object.assign({}, x.script, {opener:v('sOpen'), questions:v('sQs').split('\n').filter(Boolean), objection:v('sObj'), response:v('sResp'), ask:v('sAsk')}); if(x.task!==undefined && document.getElementById('dTask')) x.task = v('dTask'); }
  else x.task = v('dTask');
  change(key, `Edited (${rating})`, ()=>setDec(key, {draft:x, edited:true, editRating:rating}));
  const chk = DemandAI.checkDraft(x);
  logIt(r, `Draft edited · ${rating}`, {note: chk.flags.length||chk.unsupported.length ? `${chk.flags.length} flag${chk.flags.length===1?'':'s'}, ${chk.unsupported.length} unsupported claim${chk.unsupported.length===1?'':'s'}` : 'Checks pass'});
  persist(); showToast(chk.unsupported.length ? 'Saved: an unsupported claim makes this an exception' : chk.flags.length ? 'Saved with flags' : 'Saved: checks pass'); refresh();
}
function markSent(key){ const r = recOf(key); setDec(key, {status:'Sent', sentAt:Date.now()}); logIt(r, 'Marked as sent'); persist(); refresh(); }
function outcome(key, o){ const r = recOf(key); setDec(key, {outcome:o}); logIt(r, 'Outcome: '+o); persist(); showToast(`Outcome logged: ${o}`); refresh(); }
function refresh(){ renderResults(); if(openKey) openRec(openKey, true); }

/* ═══════════════ RESULTS ═══════════════ */
const STATUS_TONE = {Waiting:'tag-amber', Approved:'tag-green', Sent:'tag-blue', Closed:'tag-red', 'Set aside':'tag-grey', 'Watch list':'tag-grey'};
const statusTag = s => `<span class="tag ${STATUS_TONE[s]||'tag-grey'}">${esc(s==='Waiting'?'To review':s)}</span>`;
function renderResults(){
  const s = RUN.seg, recs = s.recs, st = k => recs.filter(r=>dec(r.key).status===k).length;
  const ft = (id,label,n) => `<div class="ftab ${view===id?'active':''}" onclick="view='${id}';filt='all';${id==='recs'?'':'segFilt=null;vertFilt=null;'}q='';renderResults()">${label} <span class="ftab-cnt">${n}</span></div>`;
  const waiting = st('Waiting'), done = recs.length - waiting;
  const ex = recs.filter(r=>dec(r.key).status==='Waiting' && exceptionOf(r)).length;
  const accs = new Set(s.segments.flatMap(g=>g.accountIds)).size;
  const pl = (n,w) => `${n} ${w}${n===1?'':'s'}`;
  const summary = s.segments.length
    ? `<b>${pl(accs,'account')}</b> share a reason to buy now, in <b>${pl(s.segments.length,'micro-segment')}</b>. ${waiting ? `<b>${pl(waiting,'prospect')}</b> ${waiting===1?'has':'have'} an action waiting for your review${ex?`, ${ex} of them flagged for a closer look`:''}.` : 'Every action has been reviewed: export what you approved.'}`
    : `No micro-segment formed: fewer than ${DemandAI.CONFIG.minSegmentAccounts} accounts share a signal. Each prospect still has an action to review.`;
  document.getElementById('mainArea').innerHTML = `
    <div class="topbar">
      <div class="topbar-l"><span class="tb-title">${esc(RUN.saved.name)}</span>
        <span class="tb-badge badge-neutral">${esc(RUN.saved.src.fileName)} · as of ${esc(RUN.saved.src.asOf)}</span></div>
      <div class="topbar-r">
        <button class="btn btn-sec btn-sm" onclick="renderStart('new')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>Group a different list</button>
        <div style="position:relative">
          <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();toggleExport()">Export <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></button>
          <div id="exportMenu" style="display:none;position:absolute;right:0;top:34px;width:270px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);box-shadow:var(--sh-lg);padding:6px;z-index:250">
            ${[['exportApproved','Approved messages','Emails and LinkedIn messages you approved',st('Approved')+st('Sent')],
               ['exportTasks','Tasks for the team','Inquiries, renewals and cases with no proof',recs.filter(r=>draftOf(r).channel==='Task' && !['Closed','Set aside','Watch list'].includes(dec(r.key).status)).length],
               ['exportLog','Decision log','Who decided what, when and why',RUN.saved.log.length]].map(([fn,t,d,n])=>
              `<button onclick="toggleExport(false);${fn}()" style="display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--rsm)" onmouseover="this.style.background='var(--s50)'" onmouseout="this.style.background=''">
                <span style="flex:1;min-width:0"><span style="display:block;font-size:12.5px;font-weight:600;color:var(--i1)">${t}</span><span style="display:block;font-size:11px;color:var(--i3)">${d}</span></span>
                <span style="font-family:var(--fm);font-size:11px;color:var(--i3)">${n}</span></button>`).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="ftabs">${ft('grid','Micro-segments',s.segments.length)}${ft('recs','Review actions',recs.length)}${ft('log','Decision log',RUN.saved.log.length)}</div>
    <div class="canvas">
      ${stepper(waiting ? 3 : 4)}
      <div style="display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);margin-bottom:16px">
        <div style="flex:1;font-size:13px;color:var(--i2);line-height:1.55">${summary}</div>
        <div style="text-align:right;flex-shrink:0"><div style="font-family:var(--fd);font-size:18px;font-weight:700;color:var(--i1)">${done}<span style="color:var(--i3);font-size:13px"> / ${recs.length}</span></div><div style="font-size:10.5px;color:var(--i3)">reviewed</div></div>
        ${waiting && view!=='recs' ? `<button class="btn btn-primary btn-sm" onclick="view='recs';filt='Waiting';segFilt=null;vertFilt=null;q='';renderResults()">Review actions →</button>` : ''}
      </div>
      ${view==='grid'?gridTab():view==='recs'?recsTab():logTab()}
    </div>`;
  if(view==='recs') drawRecs(); else if(view==='log') drawLog();
}
function toggleExport(on){
  const m = document.getElementById('exportMenu'); if(!m) return;
  const show = on===undefined ? m.style.display==='none' : on;
  m.style.display = show ? 'block' : 'none';
  if(show) setTimeout(()=>document.addEventListener('click', function c(e){ if(!m.contains(e.target)){ m.style.display='none'; document.removeEventListener('click', c); } }), 0);
}

/* 5.2 Segment grid: micro-segments against verticals, with counts and share at tier A. 5.3 Drill-down from a cell. */
function gridTab(){
  const s = RUN.seg, min = DemandAI.CONFIG.minSegmentAccounts;
  const accOf = recs => [...new Map(recs.map(r=>[r.account.id,r])).values()];
  const all = s.recs.map(r=>r.account).concat(s.engagedOnce.map(e=>e.account));
  const verts = [...new Set(all.map(a=>a.vertical))].sort();
  const rows = s.segments.map(g=>({name:g.name, recs:g.recs}));
  const max = Math.max(1, ...rows.flatMap(g=>verts.map(v=>accOf(g.recs.filter(r=>r.account.vertical===v)).length)));
  const go = (seg, v) => `segFilt=${seg?`'${seg}'`:"'__x'"};vertFilt=${v===null?'null':`'${esc(v)}'`};view='recs';filt='all';q='';renderResults()`;
  const th = 'padding:10px 12px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--i3);border-bottom:1px solid var(--border);background:var(--s50)';
  const td = 'padding:12px;border-bottom:1px solid var(--border);vertical-align:middle';
  const tile = (recs, seg, v) => {
    const accs = accOf(recs.filter(r=>v===null||r.account.vertical===v));
    if(!accs.length) return `<td style="${td};text-align:center;color:var(--i4)">·</td>`;
    const a = accs.filter(r=>r.result.tier==='A').length, alpha = v===null ? .14 : .08 + .32*accs.length/max;
    return `<td style="${td};text-align:center"><button onclick="${go(seg,v)}" title="See these prospects" style="display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:120px;padding:8px 6px;border-radius:10px;background:rgba(125,82,162,${alpha.toFixed(2)})">
      <span style="font-family:var(--fd);font-size:18px;font-weight:700;color:var(--brand-dk);line-height:1.1">${accs.length}</span>
      <span style="font-family:var(--fb);font-size:10.5px;color:var(--i2);margin-top:2px">${a} at tier A</span></button></td>`;
  };
  const grid = `<div style="background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-family:var(--fb);table-layout:fixed;min-width:${360+verts.length*110}px">
      <colgroup><col style="width:300px">${verts.map(()=>'<col>').join('')}<col style="width:120px"></colgroup>
      <thead><tr><th style="${th};text-align:left">Micro-segment · next best action</th>${verts.map(v=>`<th style="${th};text-align:center">${esc(v)}</th>`).join('')}<th style="${th};text-align:center">All</th></tr></thead>
      <tbody>${rows.length ? rows.map(g=>{
        const byAcc = accOf(g.recs), fb = byAcc.filter(r=>r.fallback).length;
        return `<tr>
          <td style="${td}"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">${segTag(g.name)}<span style="font-size:11px;color:var(--i3)">${g.recs.length} prospect${g.recs.length===1?'':'s'}</span></div>
            <div style="font-size:12px;color:var(--i2)">${esc(SEG_MEANS[g.name]||'')}</div>
            <div style="font-size:12px;color:var(--i1);font-weight:600;margin-top:4px">→ ${esc(DemandAI.CONFIG.segmentLibrary[g.name][0])}</div>
            ${fb?`<div style="font-size:10.5px;color:var(--i3);margin-top:3px">${fb} of ${byAcc.length} accounts joined on their second signal</div>`:''}</td>
          ${verts.map(v=>tile(g.recs, g.name, v)).join('')}${tile(g.recs, g.name, null)}</tr>`;
      }).join('') : `<tr><td colspan="${verts.length+2}" style="${td};text-align:center;color:var(--i3);font-size:12.5px">No micro-segment formed: fewer than ${min} accounts share a signal.</td></tr>`}</tbody>
    </table></div>`;
  const note = (tag, text, n, click) => `<div ${click?`onclick="${click}" `:''}style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surf);border:1px solid var(--border);border-radius:var(--rmd);margin-top:8px;${click?'cursor:pointer':''}">${tag}<span style="flex:1;font-size:12px;color:var(--i2)">${text}</span><span style="font-size:12px;font-weight:600;color:var(--i1)">${n}</span>${click?'<span style="color:var(--i3)">›</span>':''}</div>`;
  const exAccs = accOf(s.exceptions);
  return `${grid}
    <div style="font-size:11px;color:var(--i3);margin:8px 2px 0">Each number is the accounts in that micro-segment and vertical, and how many are at tier A. Click a number to review those prospects.</div>
    ${exAccs.length ? note('<span class="tag tag-grey">No micro-segment</span>', `${esc(exAccs.map(r=>r.account.name).join(', '))}: fewer than ${min} accounts share any of their signals, so they are reviewed one by one.`, `${s.exceptions.length} prospect${s.exceptions.length===1?'':'s'}`, go(null,null)) : ''}
    ${s.engagedOnce.length ? note('<span class="tag tag-grey">Engaged once</span>', `${esc(s.engagedOnce.map(e=>e.account.name).join(', '))}: already recommended in this pilot, so not recommended again.`, `${s.engagedOnce.length} account${s.engagedOnce.length===1?'':'s'}`) : ''}`;
}

function visibleRecs(){
  let rs = RUN.seg.recs;
  if(segFilt) rs = rs.filter(r=>segFilt==='__x' ? !r.segment : r.segment===segFilt);
  if(vertFilt) rs = rs.filter(r=>r.account.vertical===vertFilt);
  if(filt==='Exception') rs = rs.filter(r=>dec(r.key).status==='Waiting' && exceptionOf(r));
  else if(filt==='Rejected') rs = rs.filter(r=>['Closed','Set aside','Watch list'].includes(dec(r.key).status));
  else if(filt!=='all') rs = rs.filter(r=>dec(r.key).status===filt);
  if(q) rs = rs.filter(r=>(liveRec(r).contact.name+' '+r.account.name+' '+(r.contact.jobTitle||'')+' '+chosenAction(r)).toLowerCase().includes(q));
  return rs;
}
function recsTab(){
  const pills = [['all','All'],['Waiting','To review'],['Exception','Closer look'],['Approved','Approved'],['Sent','Sent'],['Rejected','Rejected']]
    .map(([k,l])=>`<div class="seg-pill ${filt===k?'active':''}" onclick="filt='${k}';renderResults()">${l}</div>`).join('');
  const segs = RUN.seg.segments.map(g=>g.name).concat(RUN.seg.exceptions.length?['__x']:[]);
  const verts = [...new Set(RUN.seg.recs.map(r=>r.account.vertical))].sort();
  const sel = 'padding:6px 9px;border:1px solid var(--bdk);border-radius:var(--rsm);font-size:12px;background:var(--surf);color:var(--i1)';
  return `<div class="score-list">
    <div class="sl-toolbar">${search('drawRecs','Search prospects, companies or actions…')}
      <select onchange="segFilt=this.value||null;drawRecs()" style="${sel}"><option value="">All micro-segments</option>${segs.map(n=>`<option value="${n}" ${segFilt===n?'selected':''}>${n==='__x'?'No micro-segment':esc(n)}</option>`).join('')}</select>
      <select onchange="vertFilt=this.value||null;drawRecs()" style="${sel}"><option value="">All verticals</option>${verts.map(v=>`<option ${vertFilt===v?'selected':''}>${esc(v)}</option>`).join('')}</select>
      <div class="sl-seg-filter">${pills}</div></div>
    <div id="rows"></div></div>
    <div style="font-size:11px;color:var(--i3);margin-top:10px">One decision per prospect, each with the same evidence; the order is shuffled within a tier. Click a prospect to review the action and draft.</div>`;
}
function drawRecs(){
  const el = document.getElementById('rows'); if(!el) return;
  el.innerHTML = table([['Prospect','15%'],['Company','14%'],['Score','7%','num'],['Micro-segment','15%'],['Next best action','22%'],['Channel','10%'],['Confidence','8%'],['Status','9%']],
    visibleRecs().map(r=>{
      const d = dec(r.key), lr = liveRec(r), x = draftOf(r), { conf } = checksOf(r), ex = d.status==='Waiting' && exceptionOf(r);
      const how = d.manual ? 'Manual action' : d.useRunner ? 'Runner-up · '+(r.runnerUp.fromStrongest?'from the strongest signal':'next in the library') : r.reason;
      return `<tr class="click" onclick="openRec('${r.key}')">
        <td><div class="person"><div class="co-av" style="background:${avColor(lr.contact.name)}">${initials(lr.contact.name)}</div><div>${cell(lr.contact.name, esc(lr.contact.jobTitle||''), 'dt-main')}</div></div></td>
        <td>${cell(r.account.name, esc(r.account.vertical+' · '+r.status))}</td>
        <td class="num" style="color:var(--i1);font-weight:600">${fmt1(r.person.final)}<span class="sub">Tier ${esc(r.person.tier)}</span></td>
        <td>${segTag(r.segment)}<span class="sub">${r.segment ? (r.fallback ? 'Joined on 2nd signal' : 'On strongest signal') : 'No micro-segment'}</span></td>
        <td class="wrap"><span class="clamp2" style="font-size:12px;color:var(--i1);font-weight:600" title="${esc(chosenAction(r))}">${esc(chosenAction(r))}</span><span class="sub" title="${esc(how)}">${esc(how)}</span></td>
        <td>${cell(x.channel, x.noProof?'<span style="color:var(--warn)">No proof found</span>':x.channel==='Task'?'To a person':'')}</td>
        <td><span class="tag ${conf.level==='High'?'tag-green':conf.level==='Medium'?'tag-amber':'tag-red'}">${conf.level}</span></td>
        <td>${statusTag(d.status)}${ex?`<span class="sub" style="color:var(--warn)" title="${esc(ex)}">${esc(ex)}</span>`:d.outcome?`<span class="sub">${esc(d.outcome)}</span>`:''}</td>
      </tr>`;}).join(''), 'No prospects match.');
}
function logTab(){
  return `<div class="score-list">
    <div class="sl-toolbar">${search('drawLog','Search the log…')}<button class="btn btn-sec btn-sm" onclick="exportLog()" style="margin-left:auto">Download log (.csv)</button></div>
    <div id="rows"></div></div>
    <div style="font-size:11px;color:var(--i3);margin-top:10px">Who decided what, when and why: every approval, rejection with its reason code, swap, edit, version and outcome, with the time taken and queue position.</div>`;
}
function drawLog(){
  const el = document.getElementById('rows'); if(!el) return;
  let ls = RUN.saved.log;
  if(q) ls = ls.filter(l=>(l.who+' '+l.prospect+' '+l.company+' '+l.decision+' '+l.action+' '+l.note).toLowerCase().includes(q));
  const tone = d => /^Approved/.test(d)?'tag-green':/^Rejected/.test(d)?'tag-red':/^Outcome/.test(d)?'tag-violet':d==='Marked as sent'?'tag-blue':'tag-grey';
  el.innerHTML = table([['When','11%'],['Who','12%'],['Prospect','14%'],['Decision','24%'],['Action','19%'],['Note','20%']],
    ls.map(l=>`<tr class="click" onclick="openRec('${l.key}')">
      <td>${cell(fmtDate(l.at), timeOf(l.at)+(l.secs!==null&&l.secs!==undefined?` · ${l.secs}s`:''))}</td>
      <td>${cell(l.who, esc(l.role))}</td>
      <td>${cell(l.prospect, esc(l.company))}</td>
      <td class="wrap"><span class="tag ${tone(l.decision)}">${esc(l.decision)}</span>${l.flag?`<span class="sub" style="color:var(--warn)">${esc(l.flag)}</span>`:''}</td>
      <td class="wrap"><span class="clamp2" style="font-size:12px;color:var(--i1)">${esc(l.action)}</span><span class="sub">${esc(l.channel)} · v${l.version||1}</span></td>
      <td class="wrap"><span class="clamp2" style="font-size:12px;color:var(--i2)">${[l.tags&&l.tags.length?l.tags.join(', '):'', l.note].filter(Boolean).map(esc).join(' · ')||'<span class="muted">—</span>'}</span></td>
    </tr>`).join(''), 'No decisions yet. Open a prospect under Recommendations to review it.');
}
function exportApproved(){
  const rs = RUN.seg.recs.filter(r=>['Approved','Sent'].includes(dec(r.key).status) && draftOf(r).channel!=='Task');
  if(!rs.length){ showToast('No approved messages yet'); return; }
  const rows = [['prospect','job_title','company','email','linkedin_url','segment','action','channel','subject','message','linkedin_note','approved_by','approved_at','status']];
  rs.forEach(r=>{ const d = dec(r.key), x = draftOf(r), c = liveRec(r).contact;
    rows.push([c.name, c.jobTitle||'', r.account.name, c.email||'', c.linkedin||'', r.segment||'No micro-segment', chosenAction(r), x.channel,
      x.subject||'', x.body||x.message||(x.script?[x.script.opener,...x.script.questions,x.script.ask].join(' | '):''), x.note||'', d.by||'', d.at?new Date(d.at).toISOString():'', d.status]); });
  download('approved_actions.csv', DemandAI.toCSV(rows));
}
// 5.7 Person-owned actions as a task file (routing into CRM, Teams or Slack is for production)
function exportTasks(){
  const rs = RUN.seg.recs.filter(r=>draftOf(r).channel==='Task' && !['Closed','Set aside','Watch list'].includes(dec(r.key).status));
  if(!rs.length){ showToast('No tasks in this list'); return; }
  const rows = [['owner','prospect','company','segment','task','why','call_opener','questions','objection','response','ask','status']];
  rs.forEach(r=>{ const x = draftOf(r), s = x.script || {}, c = liveRec(r).contact;
    rows.push([c.owner||'', c.name, r.account.name, r.segment||'No micro-segment', x.task, x.why, s.opener||'', (s.questions||[]).join(' | '), s.objection||'', s.response||'', s.ask||'', dec(r.key).status]); });
  download('tasks.csv', DemandAI.toCSV(rows));
}
function exportLog(){
  const rows = [['when','who','role','prospect','company','segment','decision','reason_code','tags','action','channel','version','seconds','queue_position','flag','note']];
  RUN.saved.log.forEach(l=>rows.push([new Date(l.at).toISOString(), l.who, l.role, l.prospect, l.company, l.segment, l.decision, l.code||'', (l.tags||[]).join('; '), l.action, l.channel, l.version||1, l.secs??'', l.position??'', l.flag||'', l.note]));
  download('decision_log.csv', DemandAI.toCSV(rows));
}

/* ═══════════════ RECOMMENDATION DRAWER ═══════════════ */
const fld = (id, v, rows, ro) => rows ? `<textarea id="${id}" rows="${rows}" ${ro?'readonly':''} style="width:100%;border:1px solid var(--bdk);border-radius:var(--rsm);padding:8px 10px;font-size:12px;color:var(--i1);line-height:1.6;font-family:var(--fb);resize:vertical;outline:none;${ro?'background:var(--s50)':''}">${esc(v)}</textarea>`
  : `<input id="${id}" value="${esc(v)}" ${ro?'readonly':''} style="width:100%;border:1px solid var(--bdk);border-radius:var(--rsm);padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--i1);outline:none;${ro?'background:var(--s50)':''}">`;
const lbl = (t, extra) => `<div style="display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3);margin:10px 0 5px"><span>${t}</span>${extra?`<span style="letter-spacing:0;text-transform:none;font-weight:500">${extra}</span>`:''}</div>`;
const kv = (k,v) => `<div style="display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--s75);font-size:12px;line-height:1.45"><span style="color:var(--i3);width:84px;flex-shrink:0">${k}</span><span style="color:var(--i1);min-width:0">${v}</span></div>`;
const panel = (title, right, body) => `<div class="panel" style="margin-bottom:12px"><div class="panel-hdr"><span class="panel-ttl">${title}</span>${right||''}</div><div class="panel-body">${body}</div></div>`;
function openRec(key, keepTimer){
  const r = recOf(key); if(!r) return;
  if(!keepTimer || openKey!==key){ openedAt = Date.now(); pickTags = new Set(); pickCode = null; }
  openKey = key;
  const d = dec(key), lr = liveRec(r), x = draftOf(r), { chk, conf } = checksOf(r), locked = d.status!=='Waiting', min = DemandAI.CONFIG.minSegmentAccounts;
  const action = chosenAction(r), brief = DemandAI.briefFor(lr, action, {asOf:asOf(), channel:d.channel}), ex = exceptionOf(r);
  const segAccs = r.segment ? [...new Set(RUN.seg.segments.find(g=>g.name===r.segment).recs.map(y=>y.account.name))] : [];
  document.getElementById('detTitle').textContent = lr.contact.name;
  document.getElementById('detSub').textContent = [lr.contact.jobTitle, r.account.name].filter(Boolean).join(' · ');
  let html = ex && !locked ? `<div style="margin-bottom:12px;padding:9px 12px;background:var(--warn-lt);color:var(--warn);border-radius:var(--rsm);font-size:12px"><b>Needs a closer look:</b> ${esc(ex)}</div>` : '';
  // Segment
  html += panel('1 · Why this group', segTag(r.segment), `
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px"><span style="color:var(--i3);font-size:11.5px;width:84px">Strongest</span>${tagChip(r.prominentSignal.type)}<span style="font-family:var(--fm);font-size:11px;color:var(--i3)">${fmt1(r.prominentSignal.weight)}</span></div>
    ${r.segment ? `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px"><span style="color:var(--i3);font-size:11.5px;width:84px">Grouped on</span>${tagChip(r.groupedOn.type)}<span style="font-family:var(--fm);font-size:11px;color:var(--i3)">${fmt1(r.groupedOn.weight)}</span></div>` : ''}
    <div style="font-size:12.5px;color:var(--i1);line-height:1.55">${r.segment && r.fallback ? `Fewer than ${min} accounts share its strongest signal, so it is grouped on its next signal with ${segAccs.length-1} other account${segAccs.length===2?'':'s'}.`
      : r.segment ? `Grouped on its strongest signal with ${segAccs.length-1} other account${segAccs.length===2?'':'s'}.` : esc(r.exception)+'.'}</div>
    <div style="font-size:11px;color:var(--i3);margin-top:6px">${esc(r.account.vertical)} · ${esc(r.status)} · ${esc(lr.contact.persona||'')} persona${segAccs.length?' · with '+esc(segAccs.filter(n=>n!==r.account.name).join(', ')):''}</div>`);
  // Action
  const card = (title, a, sub, chosen) => `<div style="padding:10px 12px;border:1px solid ${chosen?'var(--brand-mid)':'var(--border)'};background:${chosen?'var(--brand-lt)':'var(--surf)'};border-radius:var(--rsm);margin-bottom:8px">
    <div style="font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:${chosen?'var(--brand-dk)':'var(--i3)'};margin-bottom:4px">${title}${chosen?' · chosen':''}</div>
    <div style="font-size:12.5px;font-weight:600;color:var(--i1)">${esc(a)}</div><div style="font-size:11px;color:var(--i2);margin-top:3px;line-height:1.5">${sub}</div></div>`;
  html += panel('2 · Recommended action', !locked && r.runnerUp && !d.manual ? `<button class="btn btn-sec btn-sm" onclick="swapAction('${key}')">${d.useRunner?'Swap back':'Swap to runner-up'}</button>` : '', `
    ${card('Recommended', r.action, esc(r.reason), !d.useRunner && !d.manual)}
    ${r.runnerUp ? card('Runner-up', r.runnerUp.action, esc(r.runnerUp.reason.replace(/\.?$/,'.')), d.useRunner && !d.manual) : ''}
    ${d.manual ? card('Manual action', d.manual, 'Added by a reviewer; drafted with the segment\'s playbook.', true) : ''}
    ${!locked ? `<div style="display:flex;gap:6px;margin-top:2px"><input id="manualAct" placeholder="Add a manual action…" style="flex:1;min-width:0;padding:7px 10px;border:1px solid var(--bdk);border-radius:var(--rsm);font-size:12px"><button class="btn btn-sec btn-sm" onclick="addManual('${key}')">Add</button></div>` : ''}
    <div style="display:flex;gap:8px;align-items:baseline;font-size:12px;margin-top:10px"><span style="color:var(--i3);width:84px;flex-shrink:0">Channel</span><span><b style="color:var(--i1)">${esc(x.channel)}</b> <span style="color:var(--i3);font-size:11px">${esc(x.why)}</span></span></div>`);
  // Brief
  html += panel('3 · Brief for the message', '', kv('Who', esc(brief.who)) + kv('Why now', esc(brief.whyNow)) + kv('Angle', esc(brief.angle))
    + kv('Proof', brief.proof ? `${esc(brief.proof.title)} <span style="color:var(--i3)">· ${esc(brief.proof.id)} · ${esc(brief.proof.type)}, ${brief.proof.year} · expires ${esc(brief.proof.expiry)}</span>` : `<span style="color:var(--warn)">No approved, unexpired proof${brief.expired.length?` (${esc(brief.expired.map(e=>e.title+' expired '+e.expiry).join('; '))})`:''}</span>`)
    + kv('Objection', esc(brief.objection)) + kv('Ask', esc(brief.ask)) + kv('Limits', esc(brief.constraints)));
  // Draft
  let draft = '';
  const sc = x.script;
  if(x.channel==='Email') draft = lbl('Subject', `${x.subject.split(/\s+/).filter(Boolean).length} words`)+fld('dSubj',x.subject,0,locked)+lbl('Body', `${x.body.split(/\s+/).filter(Boolean).length} words`)+fld('dBody',x.body,9,locked);
  else if(x.channel==='LinkedIn') draft = lbl('Connection note', `${x.note.length}/200`)+fld('dNote',x.note,3,locked)+lbl('First message after they accept')+fld('dMsg',x.message,4,locked);
  else if(x.channel==='Task') draft = lbl('Task')+fld('dTask',x.task,3,locked);
  if(sc) draft += lbl(x.channel==='Task'?'Call script for the owner':'Call script')+lbl('Opener')+fld('sOpen',sc.opener,3,locked)+lbl('Discovery questions')+fld('sQs',sc.questions.join('\n'),3,locked)
    +lbl('Objection')+fld('sObj',sc.objection,0,locked)+lbl('Response')+fld('sResp',sc.response,2,locked)+lbl('The ask')+fld('sAsk',sc.ask,0,locked);
  const vs = versions(r);
  html += panel(x.channel==='Task' ? `4 · Task for a person${x.noProof?' · no proof found':''}` : `4 · Draft · ${esc(x.channel)}`, `<span style="display:flex;gap:6px">${d.edited?`<span class="tag tag-violet">Edited · ${esc(d.editRating||'')}</span>`:''}<span class="tag tag-grey">v${vs.length}</span></span>`, `
    <div style="margin-top:-8px">${draft}</div>
    ${!locked?`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn btn-sec btn-sm" onclick="saveDraft('${key}','minor')">Save as minor edit</button><button class="btn btn-sec btn-sm" onclick="saveDraft('${key}','major')">Save as major edit</button></div>`:''}`);
  // Checks and confidence
  html += panel('5 · Checks', `<span class="tag ${conf.level==='High'?'tag-green':conf.level==='Medium'?'tag-amber':'tag-red'}">${conf.level} confidence</span>`, `
    <div style="font-size:12px;color:var(--i1);margin-bottom:8px">${esc(conf.reason)}</div>
    ${kv('Brand, rules', chk.flags.length ? chk.flags.map(f=>`<span style="color:var(--neg)">${esc(f.rule)}: ${esc(f.detail)}</span>`).join('<br>') : '<span style="color:var(--pos)">Pass</span>')}
    ${kv('Claims', chk.claims.length ? chk.claims.map(c=>`<span style="color:${c.verified?'var(--pos)':'var(--neg)'}">${c.verified?'✓':'✗'}</span> ${esc(c.text)}<span style="color:var(--i3)"> · ${c.verified?esc(c.source):'no approved source'}</span>`).join('<br>') : '<span style="color:var(--i3)">No product claims</span>')}`);
  // Decision
  const by = d.by ? `${esc(d.by)} · ${fmtDate(d.at)} ${timeOf(d.at)}` : '';
  let decide;
  if(d.status==='Waiting') decide = `
    ${d.alternativeUsed?`<div style="font-size:11.5px;color:var(--warn);margin-bottom:8px">This is the alternative after a rejection; a second rejection closes it.</div>`:''}
    <div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3);margin-bottom:6px">Accept · optional tags</div>
    <div class="tags" style="margin-bottom:8px">${ACCEPT_TAGS.map(t=>`<button class="tag ${pickTags.has(t)?'tag-green':'tag-grey'}" style="cursor:pointer" onclick="pickTags.has('${t}')?pickTags.delete('${t}'):pickTags.add('${t}');this.className='tag '+(pickTags.has('${t}')?'tag-green':'tag-grey')">${t}</button>`).join('')}</div>
    <input id="acNote" placeholder="Comment (optional)" style="width:100%;padding:7px 10px;border:1px solid var(--bdk);border-radius:var(--rsm);font-size:12px;margin-bottom:8px">
    <button class="btn btn-primary btn-sm" style="width:100%;justify-content:center" onclick="approve('${key}')">Approve</button>
    <div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3);margin:16px 0 6px">Reject · reason code</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px">${REJECT.map(([c,l,w])=>`<button title="${esc(w)}" class="rj" onclick="pickCode='${c}';document.querySelectorAll('.rj').forEach(b=>b.style.cssText=b.dataset.base);this.style.cssText=this.dataset.base+';border-color:var(--neg);background:var(--neg-lt)';document.getElementById('rjWhat').textContent='${esc(w)}'" data-base="text-align:left;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:11.5px;color:var(--i1)" style="text-align:left;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:11.5px;color:var(--i1)"><b>${c}</b> ${l}</button>`).join('')}</div>
    <div id="rjWhat" style="font-size:11px;color:var(--i3);min-height:15px;margin-bottom:6px"></div>
    <input id="rjNote" placeholder="Comment (required for R12)" style="width:100%;padding:7px 10px;border:1px solid var(--bdk);border-radius:var(--rsm);font-size:12px;margin-bottom:8px">
    <button class="btn btn-sec btn-sm" style="width:100%;justify-content:center" onclick="reject('${key}')">Reject</button>`;
  else if(d.status==='Approved') decide = `<div style="font-size:12px;color:var(--i1);margin-bottom:10px">Approved by ${by}${d.tags&&d.tags.length?`<div style="color:var(--i3);margin-top:3px">${esc(d.tags.join(' · '))}</div>`:''}</div><div style="display:flex;gap:8px"><button class="btn btn-primary btn-sm" onclick="markSent('${key}')">${x.channel==='Task'?'Mark task done':'Mark as sent'}</button><button class="btn btn-ghost btn-sm" onclick="undo('${key}')">Undo approval</button></div>`;
  else if(d.status==='Sent') decide = `<div style="font-size:12px;color:var(--i1);margin-bottom:8px">Approved by ${by} · sent ${fmtDate(d.sentAt)}</div>
      <div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3);margin-bottom:6px">Outcome</div>
      <div class="tags">${['Replied','Meeting booked','No response','Bounced','Not interested'].map(o=>`<button class="tag ${d.outcome===o?'tag-violet':'tag-grey'}" style="cursor:pointer" onclick="outcome('${key}','${o}')">${o}</button>`).join('')}</div>`;
  else decide = `<div style="font-size:12px;color:var(--i1);margin-bottom:10px">${esc(d.code||'')} ${esc((REJECT.find(x=>x[0]===d.code)||[])[1]||'')} · ${by}<div style="color:var(--i2);margin-top:3px">${esc(d.status)}</div></div><button class="btn btn-sec btn-sm" onclick="undo('${key}')">Undo</button>`;
  html += panel('6 · Your decision', statusTag(d.status), decide);
  // Versions and history
  if(vs.length>1) html += panel('Versions', `<span style="font-size:10.5px;color:var(--i3)">${vs.length}</span>`, vs.slice().reverse().map(v=>`<details style="padding:5px 0;border-bottom:1px solid var(--s75);font-size:11.5px"><summary style="cursor:pointer"><b style="color:var(--i1)">v${v.v}</b> <span style="color:var(--i2)">${esc(v.why)}</span> <span style="color:var(--i3)">· ${esc(v.by)} · ${timeOf(v.at)}</span></summary><pre style="white-space:pre-wrap;font-family:var(--fb);font-size:11.5px;color:var(--i2);margin:6px 0 0;background:var(--s50);padding:8px;border-radius:6px">${esc(DemandAIDraftText(v.draft))}</pre></details>`).join(''));
  const hist = RUN.saved.log.filter(l=>l.key===key);
  if(hist.length) html += `<div class="panel"><div class="panel-hdr"><span class="panel-ttl">History</span><span style="font-size:10.5px;color:var(--i3)">${hist.length}</span></div><div class="panel-body" style="padding:0">
    ${hist.map(l=>`<div style="padding:8px 14px;border-bottom:1px solid var(--border);font-size:11.5px"><b style="color:var(--i1)">${esc(l.decision)}</b> <span style="color:var(--i3)">· ${esc(l.who)} · ${fmtDate(l.at)} ${timeOf(l.at)}</span>${l.note?`<div style="color:var(--i2);margin-top:2px">${esc(l.note)}</div>`:''}</div>`).join('')}
  </div></div>`;
  const body = document.getElementById('detBody'), top = keepTimer ? body.scrollTop : 0;
  body.innerHTML = html; body.scrollTop = top;
  const dr = document.getElementById('detailDrawer'); dr.style.width = '500px'; dr.classList.add('open');
}
function DemandAIDraftText(x){
  if(x.channel==='Email') return `Subject: ${x.subject}\n\n${x.body}`;
  if(x.channel==='LinkedIn') return `Note: ${x.note}\n\nMessage: ${x.message}`;
  const s = x.script; return [x.task, s && `Opener: ${s.opener}`, s && `Questions: ${s.questions.join(' / ')}`, s && `Objection: ${s.objection} → ${s.response}`, s && `Ask: ${s.ask}`].filter(Boolean).join('\n');
}
const _closeDrawer = closeDrawer;
closeDrawer = function(){ openKey = null; _closeDrawer(); };

/* ═══════════════ SAVED LISTS ═══════════════ */
function removeRun(id){ DemandAI.deleteSegmentation(id); showToast('Segmented list deleted'); renderStart('saved'); }
function startRename(id){ renamingId = id; renderStart('saved'); const el=document.getElementById('renameInput'); if(el){ el.focus(); el.select(); } }
function finishRename(id){
  const el = document.getElementById('renameInput'); const name = el ? el.value.trim() : '';
  const r = DemandAI.getSegmentation(id);
  if(r && name && name!==r.name){ r.name = name; DemandAI.saveSegmentation(r); showToast('Renamed'); }
  renamingId = null; renderStart('saved');
}

/* ═══════════════ BOOT ═══════════════ */
const PAGE_ID = '12-nba.html';
setTimeout(()=>{
  const p = new URLSearchParams(location.search);
  if(p.get('run') && DemandAI.getSegmentation(p.get('run'))){ openRun(p.get('run')); return; }
  if(p.get('from')==='scoring' && handoff()) srcId = 'handoff';
  renderStart('new');
  // Arriving from Scoring: the start screen shows what was sent, then the checks run over it
  if(p.get('from')==='scoring' && handoff()){ try{ history.replaceState(null, '', location.pathname); }catch(e){} buildFrom('handoff'); }
}, 0);

/* ═══════════════ ROLE ENGINE — shared across every screen ═══════════════ */
const ALL_ROLES = ['Admin','Sales manager','Sales rep','Viewer','Platform admin'];
const ROLE_PERSON = {
  'Admin':'Rajiv Nair', 'Sales manager':'Pavan Kumar', 'Sales rep':'Sofia Ahlgren',
  'Viewer':'Elena Vogel', 'Platform admin':'Shantanu Rao'
};
const ROLE_NAV_ALLOWED = {
  'Admin': ['00-today.html','09-setup.html','07-content.html','08-users.html','10-prospecting.html','11-scoring.html','12-nba.html','13-analytics.html'],
  'Sales manager': ['00-today.html','14-review.html','10-prospecting.html','11-scoring.html','12-nba.html','07-content.html','13-analytics.html','09-setup.html','08-users.html'],
  'Sales rep': ['00-today.html','14-review.html','10-prospecting.html','11-scoring.html','12-nba.html','07-content.html','13-analytics.html'],
  'Viewer': ['13-analytics.html'],
  'Platform admin': [],
};
function getThisPageId(){
  if(typeof PAGE_ID !== 'undefined') return PAGE_ID;
  try { return location.pathname.split('/').pop(); } catch(e){ return ''; }
}
function getRole(){
  try { return localStorage.getItem('demandai_role') || 'Sales manager'; }
  catch(e){ return 'Sales manager'; }
}
function setRole(role){
  try { localStorage.setItem('demandai_role', role); } catch(e){}
  const ov = document.getElementById('roleModalOverlay');
  if(ov) ov.style.display = 'none';
  applyRoleToNav();
}
function applyRoleToNav(){
  const role = getRole();
  const allowed = ROLE_NAV_ALLOWED[role] || [];
  document.querySelectorAll('.nav-item').forEach(a=>{
    const href = a.getAttribute('href');
    a.style.display = allowed.includes(href) ? '' : 'none';
  });
  const unEl = document.querySelector('.nav-un');
  const urEl = document.querySelector('.nav-ur');
  const avEl = document.querySelector('.nav-av');
  if(unEl) unEl.textContent = ROLE_PERSON[role];
  if(urEl) urEl.textContent = role;
  if(avEl) avEl.textContent = ROLE_PERSON[role].split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  const thisPage = getThisPageId();
  const pageIsKnown = Object.values(ROLE_NAV_ALLOWED).some(list => list.includes(thisPage));
  if(!pageIsKnown){ return; } // can't verify this page's id reliably here — don't block access on a guess
  if(!allowed.includes(thisPage)){
    const main = document.querySelector('.main') || document.getElementById('mainArea');
    const PAGE_NAMES = {'00-today.html':'Today','09-setup.html':'Setup','07-content.html':'Content library','08-users.html':'Users and roles','10-prospecting.html':'Prospecting','11-scoring.html':'Account Scoring','12-nba.html':'Next Best Action','13-analytics.html':'Analytics','14-review.html':'Review'};
    const firstAllowedHref = allowed[0] || '00-today.html';
    if(main) main.innerHTML = `
      <div class="topbar"><div class="topbar-l"><span class="tb-title">No access</span></div></div>
      <div class="canvas" style="display:flex;align-items:center;justify-content:center;min-height:70vh">
        <div style="text-align:center;max-width:360px">
          <div style="font-size:28px;margin-bottom:10px">🔒</div>
          <div style="font-family:var(--fd);font-size:15px;font-weight:700;color:var(--i1);margin-bottom:6px">Not available for this role</div>
          <div style="font-size:12px;color:var(--i3);line-height:1.6">${role} doesn't have access to this screen. Switch role from the sidebar, or use the menu to go to <a href="${firstAllowedHref}" style="color:var(--brand)">${PAGE_NAMES[firstAllowedHref]||firstAllowedHref}</a>.</div>
        </div>
      </div>`;
  }
}
function renderRoleSwitcher(){
  const foot = document.querySelector('.nav-foot');
  if(!foot || document.getElementById('roleSwitchBtn')) return;
  const btn = document.createElement('div');
  btn.id = 'roleSwitchBtn';
  btn.style.cssText = 'padding:8px 10px 0;cursor:pointer;';
  btn.innerHTML = `<div style="font-size:10px;color:var(--r3);text-decoration:underline;text-align:center">Switch role (demo)</div>`;
  btn.onclick = openRoleModal;
  foot.appendChild(btn);
}
function openRoleModal(){
  let ov = document.getElementById('roleModalOverlay');
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'roleModalOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(20,26,33,.45);z-index:700;display:flex;align-items:center;justify-content:center;';
    ov.onclick = (e)=>{ if(e.target===ov) ov.style.display='none'; };
    document.body.appendChild(ov);
  }
  const current = getRole();
  ov.innerHTML = `<div style="background:var(--surf);border-radius:var(--rlg);box-shadow:var(--sh-lg);width:360px;padding:20px;" onclick="event.stopPropagation()">
    <div style="font-family:var(--fd);font-size:14px;font-weight:700;color:var(--i1);margin-bottom:4px">Preview as a role</div>
    <div style="font-size:11px;color:var(--i3);margin-bottom:14px">Changes what you see, matching what that role actually has access to. If this screen isn't available for the new role, use the sidebar to go to one that is.</div>
    ${ALL_ROLES.map(r=>`<div onclick="setRole('${r}')" style="padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;background:${r===current?'var(--brand-lt)':'transparent'};display:flex;align-items:center;justify-content:space-between">
      <div><div style="font-size:12.5px;font-weight:600;color:var(--i1)">${r}</div><div style="font-size:10.5px;color:var(--i3)">${ROLE_PERSON[r]}</div></div>
      ${r===current?'<span style="color:var(--brand)">✓</span>':''}
    </div>`).join('')}
    <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;margin-top:10px" onclick="document.getElementById('roleModalOverlay').style.display='none'">Close</button>
  </div>`;
  ov.style.display = 'flex';
}
document.addEventListener('DOMContentLoaded', function(){ applyRoleToNav(); renderRoleSwitcher(); });
if(document.readyState !== 'loading'){ applyRoleToNav(); renderRoleSwitcher(); }


</script>
