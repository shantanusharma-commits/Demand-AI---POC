<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The process · Demand AI admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
.pr-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.pr-ask{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pr-ask .badge{white-space:normal}
.pr-flow{position:relative;padding:4px 0 4px}
.pr-st{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.pr-st:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--border)}
.pr-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--brand-lt);color:var(--brand-dk);border:1px solid var(--brand-mid);position:relative;z-index:1}
.pr-st.check .pr-ic{background:#E8F6EE;color:#1F7A4D;border-color:#9BD3B4}
.pr-st.decide .pr-ic{border-radius:6px;transform:rotate(45deg);width:26px;height:26px;margin:4px;background:#FFF4E5;color:#9A5B00;border-color:#F3C27A}
.pr-st.decide .pr-ic span{transform:rotate(-45deg)}
.pr-st.person .pr-ic{background:#EAF2FD;color:#1D5FB8;border-color:#A9C8F0}
.pr-st.out .pr-ic{background:var(--brand);color:#fff;border-color:var(--brand)}
.pr-b{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.pr-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pr-h b{font-size:13.5px}
.pr-kind{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3)}
.pr-n{margin-left:auto;font-family:var(--fm,"JetBrains Mono",monospace);font-size:11.5px;color:var(--i2);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:1px 8px}
.pr-d{font-size:12.5px;color:var(--i2);margin-top:4px;line-height:1.5}
.pr-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.pr-r .rule{background:var(--bg);border:1px dashed var(--bdk,#C9D1DA);border-radius:6px;padding:2px 8px;color:var(--i1)}
.pr-r a{font-size:12px}
.pr-br{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pr-br div{font-size:12px;border-radius:8px;padding:7px 10px;line-height:1.45}
.pr-br .y{background:#E8F6EE;color:#14532D}
.pr-br .n{background:#FFF4E5;color:#7A4500}
.pr-br b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.pr-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--i2)}
.pr-legend span{display:inline-flex;align-items:center;gap:6px}
.pr-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pr-rule{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}.pr-rule:last-child{border-bottom:none}.pr-rule .k{font-size:12.5px;font-weight:600;color:var(--i1)}.pr-rule .d{font-size:11.5px;color:var(--i2);margin-top:2px;line-height:1.45}.pr-rule .btn{flex-shrink:0}
@media (max-width:1000px){.pr-wrap{grid-template-columns:1fr}.pr-br{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<nav class="nav"></nav>
<main class="main">
  <div class="a-top"><div><span class="t" id="prT">The process</span><span class="d" id="prD"></span></div><div class="a-act"><a class="btn sm" href="chats.html">All flows</a><a class="btn sm" href="rules.html">Rules</a></div></div>
  <div class="a-canvas"><div id="pr"></div></div>
</main>
</div>
<script src="admin-shell.js"></script>
<script>
var FLOWS = [{"k": "find", "n": "Find prospects", "ic": "up", "p": "Turns a request in plain words into a checked list of people the team is allowed to contact.", "ask": ["Find maintenance heads at refineries in Thailand", "Find prospects like my last 10 wins"], "steps": [{"t": "ai", "h": "Read the request", "d": "Pulls out the role, seniority, place, industry and company size. Anything the request leaves out comes from the ICP.", "r": "ICP: refining, petrochemicals and gas · SEA · 500+ staff", "l": "rules.html#icp", "n": "1 request → 1 filter"}, {"t": "ai", "h": "Search the contact providers", "d": "The primary provider first; the fallback only for the people it misses.", "r": "Provider order: primary, then fallback", "l": "integrations.html", "n": "412 people found"}, {"t": "check", "h": "Confirm who each person is", "d": "Cross-checks each person across sources and gives an identity tier, from 1 (confirmed) to 4 (not confirmed).", "r": "CRM contact link ≥ 70 confidence · profile changes newer than 30 days are re-checked", "l": "rules.html#checks", "n": "368 confirmed"}, {"t": "decide", "h": "Identity tier 4?", "yes": "Held for the admin in the review queue; retried 3 cycles first", "no": "Continues", "l": "14-review.html"}, {"t": "check", "h": "Remove who we may not contact", "d": "Existing customers, open opportunities, accounts another rep owns, and the do-not-contact list.", "r": "CRM is read-only · do-not-contact in Settings", "l": "settings.html", "n": "24 people at 17 accounts kept"}, {"t": "out", "h": "A list named after the request", "d": "Opens beside the chat. \"Save as a list\" adds it to Accounts; the next step is scoring."}]}, {"k": "score", "n": "Score", "ic": "pulse", "p": "Ranks every account by how well it fits and how ready it is right now, out of 100.", "ask": ["Score this list", "Why is Quartz Olefins ranked first?"], "steps": [{"t": "ai", "h": "Collect signals", "d": "From 23 sources: hiring, news, website visits, tech stack and the CRM.", "r": "Sources set in Data and signals", "l": "09-setup.html", "n": "30 signals for 17 accounts"}, {"t": "check", "h": "Qualify each signal", "d": "Keeps a signal only if it is observable, predictive and time-bound.", "r": "All three must hold", "l": "rules.html#checks", "n": "21 of 30 kept"}, {"t": "ai", "h": "Weigh by tier", "d": "Tier 1 = 100 points, tier 2 = 60, tier 3 = 30, times the signal's strength.", "r": "Tier weights 100 / 60 / 30", "l": "rules.html#checks"}, {"t": "ai", "h": "Apply decay", "d": "A signal keeps its full weight for a while, then fades to zero.", "r": "Tier 1: full 3 days, zero at 14 · tier 2: 14 → 60 days · tier 3: 30 → 90 days", "l": "rules.html#checks"}, {"t": "ai", "h": "Stack into Timing", "d": "Strongest signal + ½ the second + ¼ the third, as a share of 200 points.", "r": "Timing 0–100", "l": "rules.html#checks"}, {"t": "ai", "h": "Fit", "d": "How closely the account matches the ICP and the last 10 wins.", "r": "Fit 0–100", "l": "rules.html#icp"}, {"t": "ai", "h": "Score = Fit × Timing ÷ 100", "d": "A great fit with no live signal scores zero.", "n": "16 of 17 with a live signal"}, {"t": "decide", "h": "Which tier?", "yes": "A ≥ 40 · B ≥ 20 · C above 0: ranked and suggested", "no": "0: no live signal, stays watched, nothing suggested", "l": "rules.html#checks"}, {"t": "out", "h": "A ranked list", "d": "The process sits behind an ⓘ on every score. Next: segment and route."}]}, {"k": "route", "n": "Segment and route", "ic": "bolt", "p": "Groups the scored accounts by why they are ready, then sends each group to one campaign or to separate next best actions.", "ask": ["Route to NBA and NBC", "Create micro-segments", "What's close to becoming a campaign?"], "steps": [{"t": "ai", "h": "Group by the strongest trigger", "d": "Accounts with the same lead signal form a micro-segment and share one message structure.", "n": "16 accounts → 6 segments"}, {"t": "decide", "h": "Sensitive? (C-level, a customer at risk)", "yes": "Never a campaign: separate actions, the manager signs off", "no": "Continues", "l": "rules.html"}, {"t": "decide", "h": "10 or more accounts in 7 days?", "yes": "One campaign (NBC) for the segment", "no": "Each account gets its own next best action (NBA)", "l": "rules.html#checks"}, {"t": "person", "h": "The manager confirms the campaign", "d": "A rep can send it for confirmation.", "r": "If nobody acts in 48 h, it falls back to separate actions", "l": "rules.html"}, {"t": "out", "h": "Segments, a draft campaign and next actions", "d": "Segments shows both; Campaigns shows the campaign; Approvals shows only the exceptions."}]}, {"k": "nba", "n": "Next best actions", "ic": "bolt", "p": "Prepares one action per account and lets it go out on its own only when it passes every check.", "ask": ["Prepare the next actions", "Send them", "What should I do with Cedar?"], "steps": [{"t": "check", "h": "De-duplicate", "d": "No open opportunity, owner confirmed.", "r": "CRM read-only", "l": "integrations.html"}, {"t": "ai", "h": "Read the history", "d": "CRM history and the warm path (shared connections, past projects)."}, {"t": "ai", "h": "Choose the action and the channel", "d": "Email or LinkedIn, from the segment's message structure; a runner-up is kept."}, {"t": "ai", "h": "Write the draft", "d": "Personalised to the signal and the person."}, {"t": "check", "h": "Brand, claims and banned words", "d": "Every draft runs the brand checks before anyone sees it.", "r": "Brand voice and approved claims", "l": "07-content.html"}, {"t": "decide", "h": "Passes all six checks?", "yes": "Goes ahead on its own in the next send window", "no": "Waits in Approvals with the failed check shown (rep; manager for sensitive or C-level). Reminder after 24 h", "l": "rules.html#checks", "sub": "High confidence · proven message · not sensitive · identity confirmed · not in another sequence · not picked for a spot-check"}, {"t": "ai", "h": "Track delivery", "d": "Prepared → sent → delivered → opened → replied, shown in Segments.", "n": "15 of 33 went ahead on their own this week"}, {"t": "person", "h": "Skip asks why", "d": "One tap from five reasons; the reason feeds the learning loop."}]}, {"k": "campaigns", "n": "Campaigns", "ic": "plane", "p": "Runs one personalised sequence for a segment that crossed the threshold.", "ask": ["Build the campaign", "Add a LinkedIn step to the turnaround campaign", "How are the campaigns doing?"], "steps": [{"t": "ai", "h": "Pick the message structure", "d": "The structure closest to the trigger: proven if it has the outcomes, otherwise provisional.", "r": "Proven: 10 outcomes at ≥ 60% · explore share for trying a different one", "l": "rules.html#checks"}, {"t": "ai", "h": "Plan the steps", "d": "Email and LinkedIn alternating, 3 to 5 days apart, one ask per step, plain-text first touch.", "r": "Message templates", "l": "rules.html#templates"}, {"t": "ai", "h": "Personalise each step for each person"}, {"t": "check", "h": "Before it can start", "d": "Nobody is already in another sequence; send window and daily caps.", "r": "Send window and caps in Settings", "l": "settings.html"}, {"t": "person", "h": "The manager confirms", "d": "Reps send it for confirmation."}, {"t": "ai", "h": "Send and track", "d": "Sends in the window, tracks opens and replies; when someone replies, their remaining steps pause.", "n": "2 running · 3 waiting"}, {"t": "person", "h": "Edit for one person", "d": "Add, remove or rewrite any unsent step for one person; sent steps are locked."}]}, {"k": "replies", "n": "Replies and hand-off", "ic": "mail", "p": "Answers every reply quickly and passes good ones to the proposal team with the full story.", "ask": ["Pull the emails we received today", "Which replies are objections?", "Draft a reply to Dian"], "steps": [{"t": "ai", "h": "Collect replies", "d": "From each rep's mailbox and LinkedIn.", "r": "Rep mailboxes and LinkedIn", "l": "integrations.html", "n": "6 replies today"}, {"t": "ai", "h": "Classify each one", "d": "Positive, objection, meeting booked, out of office, not interested."}, {"t": "ai", "h": "Pause the sequence", "d": "The person's remaining campaign steps stop."}, {"t": "ai", "h": "Draft an answer", "d": "With the brand checks; a positive reply gets times from the calendar."}, {"t": "decide", "h": "Positive?", "yes": "Can go to the proposal team with the full context", "no": "Objection: an answer that doesn't push · out of office: picks up after the return date"}, {"t": "person", "h": "The rep sends", "d": "The manager can reassign the thread."}]}, {"k": "content", "n": "Content", "ic": "pen", "p": "Writes blogs and whitepapers in the brand voice from a request.", "ask": ["Write a blog on planning a control system migration", "Make it shorter", "Add proof"], "steps": [{"t": "ai", "h": "Turn the request into a brief", "d": "Audience, segment and the angle."}, {"t": "ai", "h": "Outline, then write", "d": "In the brand voice.", "r": "Brand voice", "l": "07-content.html"}, {"t": "check", "h": "Claims and banned words", "d": "Every claim is checked against the approved list.", "r": "Approved claims", "l": "07-content.html"}, {"t": "person", "h": "Change it by asking", "d": "Or one paragraph at a time; tone and length can be set directly."}, {"t": "person", "h": "Sign-off for new claims", "d": "Then it is saved to the Content library."}, {"t": "out", "h": "A blog or whitepaper", "d": "Coming soon: PPT / PDF, brochure, infographic, single image, carousel, LinkedIn text post, podcast, video."}]}, {"k": "objectives", "n": "Objectives and catch-up", "ic": "flag", "p": "Turns a goal into a chat that tracks itself and catches you up when you come back.", "ask": ["Let's get our red accounts to a next step this week", "Remind me Friday at 9", "Note: call Mei after the review", "Catch me up"], "steps": [{"t": "ai", "h": "Name the chat for the goal"}, {"t": "ai", "h": "Pick the accounts", "d": "Most urgent first."}, {"t": "ai", "h": "Track progress", "d": "Marks each item done by the AI or by a person."}, {"t": "ai", "h": "Keep reminders and notes with the chat"}, {"t": "decide", "h": "Something needs you?", "yes": "The chat asks for attention in Recent chats and Today", "no": "Stays quiet"}, {"t": "out", "h": "A catch-up when you come back", "d": "What changed since you last looked, above a dotted line."}]}, {"k": "analytics", "n": "Analytics", "ic": "bars", "p": "Answers questions about results from the same numbers as the dashboard, and ends with what to do.", "ask": ["How are we doing this month?", "How is Kenji doing?", "Where are we stuck?"], "steps": [{"t": "ai", "h": "Read the question", "d": "Which number, which period, which rep."}, {"t": "ai", "h": "Pull the numbers", "d": "The same numbers as the dashboard, with their source."}, {"t": "ai", "h": "Compare with the previous period"}, {"t": "ai", "h": "Move the dashboard", "d": "To the same period and rep."}, {"t": "out", "h": "An answer with cards and a next step", "d": "For example: move Kenji's accounts to Aisha, or change the channel."}]}, {"k": "learning", "n": "Learning loop", "ic": "spark", "p": "Uses every outcome and override so the next run starts better.", "ask": ["What did we learn this week?", "What worked last month?"], "steps": [{"t": "ai", "h": "Collect outcomes", "d": "Replies, meetings, skips and their reasons, edits to drafts.", "n": "214 outcomes this month"}, {"t": "decide", "h": "Message structure proven?", "yes": "Promoted after 10 outcomes at ≥ 60%", "no": "Demoted when the trailing 90-day rate drops below 60%", "l": "rules.html#checks"}, {"t": "ai", "h": "Re-weigh signal sources", "d": "By how often each one leads to a reply or a meeting."}, {"t": "person", "h": "The admin approves rule changes", "d": "Each approval is a new rules version, logged in the audit log.", "l": "audit.html"}, {"t": "out", "h": "The next run starts from the new version", "d": "The full run is the monthly learning job."}]}];
(function () {
  var KIND = { ai: ['The AI', 'AI'], check: ['Check', '✓'], decide: ['Decision', '?'], person: ['A person', 'P'], out: ['Result', '→'] };
  function e(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function draw() {
    var k = (location.hash || '#find').slice(1), f = FLOWS.filter(function (x) { return x.k === k; })[0] || FLOWS[0], i = FLOWS.indexOf(f);
    document.title = f.n + ' · the process · Demand AI admin';
    document.getElementById('prT').textContent = f.n;
    document.getElementById('prD').textContent = 'The process behind the chat · step ' + (i + 1) + ' of ' + FLOWS.length;
    var rules = [], seen = {};
    f.steps.forEach(function (s) { var d = s.r || (s.t === 'decide' && s.l ? (s.sub || s.yes) : ''); if (d && !seen[d]) { seen[d] = 1; rules.push({ h: s.h, d: d, l: s.l }); } });
    var steps = f.steps.map(function (s, j) {
      var kd = KIND[s.t];
      return '<div class="pr-st ' + s.t + '"><div class="pr-ic"><span>' + (s.t === 'ai' || s.t === 'person' ? (j + 1) : kd[1]) + '</span></div><div class="pr-b"><div class="pr-h"><span class="pr-kind">' + kd[0] + '</span><b>' + e(s.h) + '</b>' + (s.n ? '<span class="pr-n">' + e(s.n) + '</span>' : '') + '</div>' +
        (s.d ? '<div class="pr-d">' + e(s.d) + '</div>' : '') + (s.sub ? '<div class="pr-d">' + e(s.sub) + '</div>' : '') +
        (s.yes ? '<div class="pr-br"><div class="y"><b>Yes</b>' + e(s.yes) + '</div><div class="n"><b>No</b>' + e(s.no) + '</div></div>' : '') +
        (s.r || s.l ? '<div class="pr-r">' + (s.r ? '<span class="rule">' + e(s.r) + '</span>' : '') + (s.l ? '<a href="' + s.l + '">' + (s.r ? 'Change' : 'Where it is set') + ' →</a>' : '') + '</div>' : '') + '</div></div>';
    }).join('');
    var nx = FLOWS[i + 1], pv = FLOWS[i - 1];
    document.getElementById('pr').innerHTML = '<div class="a-grid" style="display:block"><div class="pr-wrap"><div>' +
      '<div class="card" style="margin-bottom:14px"><div class="card-b"><div style="font-size:14px;color:var(--i1)">' + e(f.p) + '</div><div class="pr-ask">' + f.ask.map(function (a) { return '<span class="badge b-brand nodot">“' + e(a) + '”</span>'; }).join('') + '</div></div></div>' +
      '<div class="card"><div class="card-h"><span class="lbl">How it runs</span><div class="pr-legend"><span><i style="background:var(--brand-mid)"></i>The AI</span><span><i style="background:#9BD3B4"></i>Check</span><span><i style="background:#F3C27A"></i>Decision</span><span><i style="background:#A9C8F0"></i>A person</span></div></div><div class="card-b"><div class="pr-flow">' + steps + '</div></div></div>' +
      '<div style="display:flex;justify-content:space-between;margin-top:12px">' + (pv ? '<a class="btn sm" href="#' + pv.k + '">← ' + e(pv.n) + '</a>' : '<span></span>') + (nx ? '<a class="btn sm" href="#' + nx.k + '">' + e(nx.n) + ' →</a>' : '') + '</div></div>' +
      '<div class="pr-side"><div class="card"><div class="card-h"><span class="lbl">Rules it runs within</span></div><div class="card-b">' + (rules.length ? rules.map(function (s) { return '<div class="pr-rule"><div><div class="k">' + e(s.h) + '</div><div class="d">' + e(s.d) + '</div></div>' + (s.l ? '<a class="btn sm ghost" href="' + s.l + '">Edit</a>' : '') + '</div>'; }).join('') : '<div class="d" style="font-size:12px;color:var(--i3)">No settings of its own.</div>') + '</div></div>' +
      '<div class="card" style="margin-top:12px"><div class="card-h"><span class="lbl">Every run is logged</span></div><div class="card-b" style="font-size:12.5px;color:var(--i2)">Each step above writes to the audit log with the rules version it ran under. <a href="audit.html">Open the audit log</a></div></div></div></div></div>';
    var cv = document.querySelector('.a-canvas'); if (cv) cv.scrollTop = 0;
  }
  window.addEventListener('hashchange', draw); draw();
})();
</script>
</body>
